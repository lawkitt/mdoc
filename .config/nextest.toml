# cargo-nextest settings for `just test` (ADR 0082). No retries, no JUnit.
[profile.default]
retries = 0
# Warn at 60 s, kill at 2 min.
slow-timeout = { period = "60s", terminate-after = 2 }

# The render test has its own hang watchdog (10 min on macOS, 20 on Windows,
# tests/headless_renders.rs). Nextest kills it one period later, so the
# watchdog's panic, with the child's stderr, reports a hang first.
[[profile.default.overrides]]
filter = "binary_id(mdoc::headless_renders)"
platform = 'cfg(target_os = "macos")'
slow-timeout = { period = "60s", terminate-after = 11 }

[[profile.default.overrides]]
filter = "binary_id(mdoc::headless_renders)"
platform = 'cfg(target_os = "windows")'
slow-timeout = { period = "60s", terminate-after = 21 }
