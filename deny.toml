# cargo-deny configuration. Runs in CI on every PR; the matching
# step lives in `.github/workflows/ci.yml`.
#
# Four checks, scoped to what we actually care about:
#   * advisories — RUSTSEC vulnerabilities + unmaintained warnings
#   * licenses   — allow-list of GPL-3-compatible permissive licenses
#   * bans       — wildcards warned; duplicate versions warned
#   * sources    — crates.io only, plus the github orgs we depend on

[advisories]
# Severity for vulnerability advisories is "deny" by default. Below
# are explicit upstream-unmaintained advisories we cannot fix
# without bumping a parent dep that doesn't have a fix yet.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained (team ceased development; no safe upgrade). Transitive via gpui-base -> syntect (GPUI Kit's built-in highlighter). Upstream gpui-kit; revisit at each gpui-kit bump." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained. Transitive via gpui-component, gpui (Zed-git), and image/rav1e. Can't fix without upstream bumps; revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (no safe upgrade). Transitive via fontdb, whose parents are all upstream: usvg (gpui + gpui-component), mermaid-rs-renderer (Zed), and ratex-render/-svg. Clears when upstreams move to skrifa; revisit at each gpui/ratex pull." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained (no safe upgrade; maintainer points at harfrust). Transitive via usvg <- gpui and gpui-component. Clears when upstream usvg/Zed migrate shapers; revisit at each gpui pull." },
    # zip 8.x: all three affect only `ZipArchive::extract` / `ZipStreamReader::extract`
    # writing an archive to disk. mdoc and anydoc are on zip 9; zip 8 comes only
    # from docxide-pdf, which reads entries into memory through `ZipArchive::by_name`.
    # docxide-pdf 0.20.1 (latest, 2026-10-30) still requires zip ^8. We wait for
    # a release on zip 9 and take it with the next planned docxide-pdf upgrade
    # (docs/design/dependabot-grill-2026-10-31.md); then all zip-8 entries go.
    #
    # GitHub also reports these zip-8 advisories, which RustSec has not imported
    # yet. cargo-deny matches only primary ids, not GHSA aliases, so they cannot
    # be ignored in advance: when `just deny` names one, add its RUSTSEC id here
    # with the reason below. GitHub's alerts for them are dismissed as unused code.
    #   GHSA-m665-v7pm-7grj: ZipArchive vs ZipStreamReader header differential;
    #     nothing uses ZipStreamReader, and every reader trusts the central directory.
    #   GHSA-hjqx-j4rw-g7xv, GHSA-q7v9-x93c-xqv3: symlink handling in extract();
    #     zip 8 never extracts to disk.
    #   GHSA-9hj8-73fh-9963: Shrink decoder; the `legacy-zip` feature is off.
    #   GHSA-8hxf-qr8p-62x4: AES HMAC skipped on early EOF; nothing decrypts with
    #     a password, and mdoc rejects encrypted packages before docxide-pdf.
    { id = "RUSTSEC-2026-0367", reason = "zip extract() keeps SUID/SGID bits. We never extract to disk; blocked on docxide-pdf requiring zip ^8." },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() writes symlinks outside the destination. We never extract to disk; blocked on docxide-pdf requiring zip ^8." },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() applies permissions through symlinks. We never extract to disk; blocked on docxide-pdf requiring zip ^8." },
    # zstd 0.13 / zstd-safe 7 (added 2026-10-27): fixed only in zstd 0.14.3 and
    # zstd-safe 8.2, but zip 8 requires zstd ^0.13 and docxide-pdf requires zip ^8.
    # zip 8 builds zstd without features (no `legacy`, no `seekable`) and calls only
    # `zstd::Decoder::with_buffer` (read) and `Encoder::new`, never `with_context`.
    # Clears with the zip 9 move above. zstd-sys's RUSTSEC-2026-0410 is fixed in 2.1.2.
    { id = "RUSTSEC-2026-0391", reason = "zstd with_context leaks an abandoned stream into the next. zip 8 never passes a context; blocked on docxide-pdf requiring zip ^8." },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe Seekable::decompress overruns a Vec. The seekable feature is off; blocked on docxide-pdf requiring zip ^8." },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe legacy-frame stream error exposes memory via the write::Decoder. Legacy is off and zip 8 reads through read::Decoder; blocked on docxide-pdf requiring zip ^8." },
    # zbus 5 subcrates, merged into zbus 6 (no safe upgrade). Linux only, via
    # gpui-pre-linux -> accesskit_unix / atspi; clears when upstream moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6). Transitive via gpui-pre-linux -> accesskit_unix/atspi; revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6). Transitive via gpui-pre-linux -> accesskit_unix/atspi; revisit at each gpui pull." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6). Transitive via zvariant <- gpui-pre-linux; revisit at each gpui pull." },
]

[licenses]
# Every license below is GPL-3-or-later compatible (mdoc's own
# license — see ./LICENSE). Updates require a real check that the
# new license is GPL-3-compatible AND acceptable for redistribution.
allow = [
    "0BSD",
    # Boost 1.0: permissive, GPL-3-compatible (FSF-listed). Via arboard ->
    # clipboard-win/error-code (the rich-copy clipboard writer).
    "BSL-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Per-crate exceptions for license expressions that are valid for
# the specific dep but not worth blessing globally.
[[licenses.exceptions]]
# libbz2-rs-sys carries the bzip2 library's own BSD-style license.
# Pulled in transitively via `bzip2` (gpui dep tree); scoped here
# rather than added project-wide.
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
# libfuzzer-sys is "MIT OR Apache-2.0" AND NCSA. NCSA is OSI-
# approved BSD-derived; scoped to this one crate (fuzzer harness,
# transitive via gpui) rather than blanket-allowing NCSA.
crate = "libfuzzer-sys"
allow = ["NCSA"]

# `unescaper` ships with the deprecated `GPL-3.0/MIT` SPDX
# expression in its Cargo.toml. The slash form means "user picks
# either"; the modern equivalent is `GPL-3.0-or-later OR MIT`.
# Clarify so the check sees MIT (which we allow above) rather than
# the unparseable expression.
[[licenses.clarify]]
crate = "unescaper"
expression = "MIT"
license-files = []

[bans]
# Duplicate versions are noisy on a Zed-git-based stack (windows-
# sys major-version churn, etc.). "warn" so CI surfaces the count
# without failing.
multiple-versions = "warn"
# `git = "..."` deps without a version constraint read as wildcards
# to cargo-deny. The four wildcard hits are exactly the four git
# deps documented in Cargo.toml (gpui, gpui_platform, gpui-component,
# gpui-component-assets) — the no-rev-on-gpui choice is load-bearing
# per the Cargo.toml dep comment. "warn" surfaces drift without
# blocking the build.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No per-URL allow-list — Zed pulls in transitive git deps from
# multiple sibling repos under `zed-industries` (font-kit, reqwest,
# scap, wgpu, xim-rs, zed itself), and pinning the list per-URL
# would break on every Zed bump. Org-level allow is the right
# granularity.
allow-git = [
    "https://github.com/lawkitt/anydoc.git",
    "https://github.com/lawkitt/pdf-inspector.git",
]

[sources.allow-org]
github = ["zed-industries", "longbridge"]
