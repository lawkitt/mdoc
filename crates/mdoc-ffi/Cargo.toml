[package]
name = "mdoc-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI bindings of the GUI-free core for the mobile apps (ADR 0085)."
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/lawkitt/mdoc"

[lib]
# staticlib: linked into the iOS app through MdocCore.xcframework
# (scripts/build-ios-core.sh); lib: Rust tests and examples.
crate-type = ["lib", "staticlib"]

[features]
# The Swift binding generator (src/bin/uniffi-bindgen.rs); off in the app.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
mdoc-detect = { path = "../mdoc-detect" }
mdoc-history = { path = "../mdoc-history" }
mdoc-import = { path = "../mdoc-import" }
mdoc-markdown = { path = "../mdoc-markdown" }
mdoc-pii = { path = "../mdoc-pii" }
mdoc-store = { path = "../mdoc-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[lints]
workspace = true
