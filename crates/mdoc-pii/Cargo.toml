[package]
name = "mdoc-pii"
version = "0.1.0"
edition = "2024"
description = "Document-local pseudonymization review: candidates, identities and replacement provenance that follow editor history."
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/lawkitt/mdoc"

# The review model is GUI-free: it follows editor history through plain
# mdoc-history transactions. Detection models and UI stay in the application.
[dependencies]
aho-corasick = "=1.1.5"
regex = "1"
# CommonMark/GFM structure checks for manual selections with escapes or
# emphasis characters.
markdown = "1"
# NFC for the text detection reads: decomposed letters compose.
unicode-normalization = "=0.1.26"
# Grapheme clusters for `view::occurrences`, as the platforms' string search
# matches whole characters.
unicode-segmentation = "1"
mdoc-history = { path = "../mdoc-history" }
# A review saved with its document (`saved`): what the Vault keeps.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Reads the identity maps of captured AI replies; saved reviews round-trip
# through it, as the Vault's JSON records do.
serde_json = "1"

[lints]
workspace = true
