# mdoc's rule pack, part 2 of 3: English. Sections and fields are described
# in shared.toml.


# No English nicknames yet.
variants = []

# Capitalized occupational surnames remain PERSON even without another mention.
# Most are already outside the role vocabulary; listing them also protects
# future additions. Initial + role is protected in code; plurals need listing.
role_surnames = [
    "master", "masters", "steward", "stewards", "judge", "marshal", "sheriff",
    "bishop", "chancellor", "clerk", "mayor", "dean", "sergeant", "banker",
    "cook", "porter", "baker", "taylor", "mason", "carter", "fowler",
    "leader", "chair", "chairman",
]

# Complete job titles come off a name's edges (#385). Do not trim their
# individual heads: "Ivo Leader" and "Edda Chair" may be full names.
[[span]]
category = "PERSON"
trim = [
    "team leader", "chief investigator", "bureau safety manager",
    "accident investigation advisor", "program manager",
    "vice president of infrastructure", "chief executive officer",
    "head of delegation", "magistrate judge", "notary public",
    "division administrator", "international agreements specialist",
    "chapter 7 trustee", "chapter 11 trustee", "first defendant", "second claimant",
    "lead agent", "dealer covered person", "sponsor staff", "operating principal",
    "bankrupt party", "attorneys for plaintiffs",
]

# The same role phrases around an organization's actual name (#385).
[[span]]
category = "ORG"
role_trim = true
trim = [
    "trustee",
    "team leader", "chief investigator", "bureau safety manager",
    "accident investigation advisor", "program manager",
    "vice president of infrastructure", "chief executive officer",
    "head of delegation", "magistrate judge", "notary public",
    "division administrator", "international agreements specialist",
    "chapter 7 trustee", "chapter 11 trustee", "first defendant", "second claimant",
    "lead agent", "dealer covered person", "sponsor staff", "operating principal",
    "bankrupt party", "attorneys for plaintiffs",
]

# Titles and post-nominals stay outside a person's span: "Ms Bennett" is
# proposed as "Bennett", "Ysolde Qhenn, KC" as "Ysolde Qhenn" (guide rule 1,
# #382). A title's period goes with it. Run after job phrases (#385), so
# "Chief Investigator Ms Edda Brannock" also loses "Ms". Lowercase list
# letters at a line start or list break are no initials (#546). A Lord
# Justice's "LJ" ("LJJ" for several) is a judge's post-nominal, not part
# of the name: "per Ivo Ostrand LJ" is "Ivo Ostrand" (#499). "J" alone
# stays, since it may be an initial.
[[span]]
category = "PERSON"
trim = [
    "mr", "mrs", "ms", "miss", "mx", "dr", "prof", "professor", "sir", "dame",
    "lord", "lady", "madam", "madame", "mme", "mlle", "herr", "frau", "monsieur",
    "kc", "qc", "esq", "phd", "lj", "ljj",
]
list_letter = true

# A judge's or an officer's title before a full name comes off it too:
# the model's "Judge K Ashdale" is "K Ashdale", "Justice Mary Ashdale" is
# "Mary Ashdale" (guide rule 1, #387). Only before an initial and a
# surname or a given name and a surname (the `rest` it leaves): these
# words are also surnames and given names (`role_surnames` above), so
# "Judge" alone, "Mary Judge", "Mr Judge" and "Judge Reinhold" stay as
# they are. "Hon" only with its period: "Hon Wai Keung" is a surname
# first. Not `trim` words: those also mark a titled surname.
[[span]]
category = "PERSON"
trim_start = [
    '(?:(?:Judge|Justice|Magistrate|Master|Recorder|Registrar|Dear|Officer|Detective|Constable|Sergeant|Inspector|Sheriff|Senator|Councillor|Commissioner)\.?|Hon\.)[ \t]+(?P<rest>(?:[A-HJ-Z]\.?|[A-Z][a-z]+)[ \t]+(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*)\z',
]

# Two initials before a surname belong to the name: the model's "Quill" in
# "J. R. Quill" grows to the whole of it (guide rule 1, #391). Not after
# it: "Smith J" is a judge's title. Only spaces between, never a line.
[[span]]
category = "PERSON"
extend = [
    '\b[A-Z]\.[ \t]?[A-Z]\.[ \t]+(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*',
]

# A surname's lowercase particle belongs to the name: the model's "Berg" in
# "signed by van der Berg" grows to "van der Berg", "Vries" in "Ms de Vries"
# to "de Vries", and "Berg" in "J. R. van der Berg" to the whole of it
# (guide rule 1, #403). Two particles may chain ("de la Cruz"), and a glued
# "d'" or "al-" is the word's own ("d'Estaing", "al-Hadid"). Only spaces
# sit between, never a line. Written lowercase a particle is no sentence's
# first word, so it joins anywhere. "van", "den", "ten", "bin" and "al" are
# also words ("the van Smith drove", "ten Smith employees", "The van Smith
# rented"), and so is "von" in German ("Das Schreiben von Schmidt"; #403
# review): they join only after a title or an initial on the same line,
# the `lead` that stays outside ("Ms ten Brink", "K. van Berg"), or before
# a second particle ("the van der Berg file"); a capitalised word is no
# lead, as a German noun is one. Two initials before the particle go with
# the span ("J. R. van der Berg").
[[span]]
category = "PERSON"
extend = [
    '\b(?:(?:de|da|di|du|del|della|der|la|le|dos|das|ter|ibn)(?:[ \t]+(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al))?|(?:van|von|den|ten|bin|al)[ \t]+(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al))[ \t]+(?:[A-Z][\x27’])?[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}](?:-[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}])*',
    '(?P<lead>(?:\b(?:Mr|Mrs|Ms|Mx|Miss|Dr|Prof|Professor|Sir|Dame|Lord|Lady|Judge|Justice)\.?|\b[B-HJ-Z]\.?|\b[AI]\.)[ \t]+)(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al)(?:[ \t]+(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al))?[ \t]+(?:[A-Z][\x27’])?[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}](?:-[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}])*',
    '\b[A-Z]\.[ \t]?[A-Z]\.[ \t]+(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al)(?:[ \t]+(?:de|da|di|du|del|della|der|la|le|von|dos|das|ter|ibn|van|den|ten|bin|al))?[ \t]+(?:[A-Z][\x27’])?[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}](?:-[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}])*',
    '\b(?:d[\x27’]|(?:al|el)-)(?:[A-Z][\x27’])?[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}](?:-[\p{Latin}&&\p{Lu}]\p{Latin}*[\p{Latin}&&\p{Ll}])*',
]

# One initial, with its period or without, right before a surname belongs
# to the name: the model's "Ashdale" in "Judge K Ashdale" grows to "K
# Ashdale" (guide rule 1, #387). The `lead` marks the letter as an
# initial and stays outside the span: a title ("Judge", "Ms"), "by", "v",
# "vs", "per", "cc", "attn" or "signed", "and" after a word ("Ashdale and
# L Brown", never "Schedule A and B Jones"), or a judge's post-nominal and
# comma ("Smith J, K Brown"). Without one the letter is no initial: at a
# line start a list letter ("B. Smith"), at a sentence start an article
# ("A Smith said"), after a heading word, a comma, a colon, "to" or "(" a
# section or answer letter ("Part B Smith", "In Annex A, B Smith",
# "Answer: A Smith", "Amendments to A Jones Trust"). "I" is a pronoun,
# never in the letter class.
[[span]]
category = "PERSON"
extend = [
    '(?P<lead>(?:\b(?:Judge|Justice|Magistrate|Master|Recorder|Registrar|Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Professor|Sir|Dame|Lord|Lady|Hon|Dear|Officer|Detective|Constable|Sergeant|Inspector|Sheriff|Senator|Councillor|Commissioner)\.?|\b(?:by|v|vs|per|cc|attn|signed)|\p{L}{2,}\.?[ \t]+and|\b(?:J|JJ|LJ|LJJ),)[ \t]+)[A-HJ-Z]\.?[ \t]+(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*',
]

# An all-caps given name before an initial and an all-caps surname belongs
# to the name where a signature or a caption writes it: the model's "P.
# WELK" in "DORIAN P. WELK, Magistrate" grows to the whole of it (guide
# rule 1, #387). Only after a `lead` that marks a signature or caption
# position, outside the span: a line start (list, quote or table marks
# and "/s/ " allowed), "and" after a word, "by", "v", "vs", "per", "cc",
# "attn", "signed" or a comma. Three letters at least, so "BY", "TO" and
# "CC" never join; never the initial "V", which is a case caption's
# "versus" ("SMITH V. WELK", "ACME LLC V. WELK"); and never over a
# company or another category's span (in code). A role or title there is
# a `never` word ("JUDGE P. WELK", "MRS P. WELK"), and a heading, a part
# of a case or a caption's party word is an `unless_over` word ("EXHIBIT
# A. WELK", "COUNT I. WELK", "PETITIONER J. DOE"). A signature's verbs,
# all-caps connectors and "HON" come off the start of a span this entry
# grew, case-sensitive ("SIGNED P. WELK" is "P. WELK"); a model's own
# "HON WAI KEUNG" stays whole. Not `trim` words: those mark a titled
# surname.
[[span]]
category = "PERSON"
extend = [
    '(?P<lead>(?m:^)[ \t>*_#|-]*(?:/s/[ \t]*)?|(?:\b(?:by|v|vs|per|cc|attn|signed)|\p{L}{2,}\.?[ \t]+and|,)[ \t]+)[A-Z]{3,}[ \t]+[A-UW-Z]\.[ \t]+(?:[A-Z][\x27’])?[A-Z]{2,}(?:-[A-Z]{2,})*\b',
]
trim_start = [
    '(?:AND|FOR|FROM|ATTN|SIGNED|DATED|ATTEST|ATTESTED|WITNESSED|APPROVED|BEFORE|HON\.?|HONORABLE|HONOURABLE)[ \t]+',
]
unless_over = [
    "exhibit", "schedule", "annex", "appendix", "attachment", "part", "section",
    "article", "clause", "count", "item", "tab", "table", "figure", "form",
    "petitioner", "respondent", "appellant", "appellee", "movant", "intervenor",
    "relator", "commonwealth", "state", "people", "united", "states",
]

# A surname-first name is one span, comma included: the model's "Penrow"
# in "Penrow, J. L. 1971." grows to "Penrow, J. L.", and its "Draycott"
# and "D.P." in "Draycott,D.P." join (guide rule 1, Examples, #414).
# Initials after a comma name the surname's person anywhere, the comma
# with or without a space: one to three, each with its period. The
# `tail` after them, outside the span, ends the name: a line's end, a
# comma, a semicolon, a colon, a bracket, a four-digit year, "and", "&"
# or "et al". A capitalised word there is the next person's name, the
# initials his ("Smith, J. R. Brown"), and "and" is never crossed
# ("Morvilius, M. and R. Fridell" stay two people, #489). Only spaces sit
# between, never a line. A match with a tail grows only a span that
# starts with it or a name whose surname is a span (in code), so the
# model's "J.R." alone in "Thereafter, J.R., a minor" or "Respectfully,
# A. B." never takes the word before the comma. A judge's or a lawyer's
# post-nominal is no initials (#730), nor is a place's abbreviation:
# never "C.J." or "C. J." (a chief justice), nor glued "P.J.", "J.A.",
# "A.J.", "L.J.", "S.J.", "D.J.", "J.S.C.", "M.R.", "Q.C.", "K.C.",
# "M.P.", "M.D.", "J.D.", "P.A.", "P.C." or "L.L.P." ("Denning, L.J.";
# spaced "Alexander, L. J." is an author's initials), never "D.C.",
# "N.Y.", "U.S." or "U.K." either way ("Washington, D.C."), nor glued
# "N.J.", "N.C.", "S.C.", "B.C.", "N.T.", "N.H.", "N.M.", "N.D.",
# "S.D.", "R.I.", "W.V.", "N.S.", "N.B.", "W.A." or "P.E.I." ("Trenton,
# N.J. 08608"). One "J." is Justice Brown in "Brown, J., concurring",
# and joins only before a year ("Smith, J. 2020.", "Brown, J. (2020)").
[[span]]
category = "PERSON"
extend = [
    '\b(?:(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*|[A-Z]{2,}(?:-[A-Z]{2,})*),[ \t]?(?:(?:(?:[E-IOTVX-Z]\.[A-Z]|A\.[A-IK-Z]|B\.[ABD-Z]|C\.[A-IK-Z]|D\.[ABD-IK-Z]|J\.[BCE-RT-Z]|K\.[ABD-Z]|L\.[A-IKM-Z]|M\.[A-CE-OQS-Z]|N\.[AE-GIKLN-RU-XZ]|P\.[BDF-IK-Z]|Q\.[ABD-Z]|R\.[A-HJ-Z]|S\.[ABE-IK-Z]|U\.[A-JL-RT-Z]|W\.[B-UW-Z]|[ABE-MO-TV-Z]\.[ \t][A-Z]|C\.[ \t][A-IK-Z]|D\.[ \t][ABD-Z]|N\.[ \t][A-XZ]|U\.[ \t][A-JL-RT-Z])\.[ \t]?[A-Z]|J\.S\.(?:[ \t][A-Z]|[ABD-Z])|L\.L\.(?:[ \t][A-Z]|[A-OQ-Z])|P\.E\.(?:[ \t][A-Z]|[A-HJ-Z]))\.|(?:[E-IOTVX-Z]\.[A-Z]|A\.[A-IK-Z]|B\.[ABD-Z]|C\.[A-IK-Z]|D\.[ABD-IK-Z]|J\.[BCE-Z]|K\.[ABD-Z]|L\.[A-IK-Z]|M\.[A-CE-OQS-Z]|N\.[AE-GIKLN-RU-XZ]|P\.[BD-IK-Z]|Q\.[ABD-Z]|R\.[A-HJ-Z]|S\.[ABE-IK-Z]|U\.[A-JL-RT-Z]|W\.[B-UW-Z]|[ABE-MO-TV-Z]\.[ \t][A-Z]|C\.[ \t][A-IK-Z]|D\.[ \t][ABD-Z]|N\.[ \t][A-XZ]|U\.[ \t][A-JL-RT-Z])\.|[A-IK-Z]\.)(?P<tail>[*_]*(?:\r?(?m:$)|[ \t]*(?:[,;:|)\]]|\(?\d{4}\b|and\b|&|et[ \t]+al\b)))',
    '\b(?:(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*|[A-Z]{2,}(?:-[A-Z]{2,})*),[ \t]?J\.(?P<tail>[ \t]*\(?\d{4}\b)',
]

# A given name after a surname and a comma joins the surname too, where a
# name stands alone: the `lead`, outside the span, is a line's start
# (list, quote and table marks allowed), a label's colon, a semicolon or
# a table cell's border, a list's number after it ("; 2. "). A given
# name looks like a surname, a place or a role: "Witnesses: Harlow,
# Brennan", "| Harlow, Partner |", "By: Pellwright, President" and
# "Hamilton, Ontario" are not one person. So with a middle initial or a
# second given name ("Employee: VALECROFT, Jorin P.", guide rule 1,
# Examples, #414) the `tail`, outside the span, is a line's end, a
# semicolon, a bracket, or a four-digit year after a comma or a period;
# a given name alone joins only before a reference's year ("Herder,
# Mike. 1999.", "Herder, Mike (1999)"), never one after a comma ("Smith,
# Jones, 1999" are two authors). Mid-prose "I met Smith, John said" and
# a list of surnames ("Smith, Jones and Brown") never join. Only spaces
# sit between, never a line. A role (`never`) after the comma is none,
# nor is a city's country, province or state ("Halifax, Nova Scotia",
# "Albany, New York", "Paris, France. 1999."); "Georgia", "Virginia" and
# "Carolina" are given names, and "North Carolina" stops at "north".
[[span]]
category = "PERSON"
extend = [
    '(?P<lead>(?:(?m:^)[ \t>*_#|-]*|[;|][ \t]*|:[*_]*[ \t]+)(?:\d{1,3}[.)][ \t]+)?)(?:(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*|[A-Z]{2,}(?:-[A-Z]{2,})*),[ \t]?[A-Z][a-z]+(?:-[A-Z][a-z]+)?[ \t]+(?:[A-Z]\.|[A-Z][a-z]+(?:-[A-Z][a-z]+)?)(?P<tail>[*_]*(?:\r?(?m:$)|[ \t]*(?:[;|)]|[.,][ \t]*(?:\r?(?m:$)|\(?\d{4}\b)|\(?\d{4}\b)))',
    '(?P<lead>(?:(?m:^)[ \t>*_#|-]*|[;|][ \t]*|:[*_]*[ \t]+)(?:\d{1,3}[.)][ \t]+)?)(?:(?:[A-Z][\x27’])?[A-Z][A-Za-z]*[a-z](?:-[A-Z][A-Za-z]*[a-z])*|[A-Z]{2,}(?:-[A-Z]{2,})*),[ \t]?[A-Z][a-z]+(?:-[A-Z][a-z]+)?(?P<tail>\.[ \t]+\(?\d{4}\b|[ \t]+\(\d{4}\b)',
]
unless_over = [
    "england", "scotland", "wales", "ireland", "britain", "british", "france",
    "germany", "italy", "spain", "portugal", "belgium", "netherlands",
    "holland", "switzerland", "austria", "poland", "russia", "ukraine",
    "canada", "mexico", "australia", "china", "japan", "india", "israel",
    "greece", "sweden", "norway", "denmark", "finland", "korea", "nova",
    "scotia", "ontario", "quebec", "manitoba", "alberta", "saskatchewan",
    "columbia", "brunswick", "hong", "kong", "sri", "lanka", "costa", "rica",
    "puerto", "rico", "saudi", "arabia", "northern", "united", "kingdom",
    "alabama", "alaska", "arizona", "arkansas", "california", "colorado",
    "connecticut", "delaware", "florida", "hawaii", "idaho", "illinois",
    "indiana", "iowa", "kansas", "kentucky", "louisiana", "maine", "maryland",
    "massachusetts", "michigan", "minnesota", "mississippi", "missouri",
    "montana", "nebraska", "nevada", "ohio", "oklahoma", "oregon",
    "pennsylvania", "tennessee", "texas", "utah", "vermont", "wisconsin",
    "wyoming", "new", "north", "south", "west", "rhode",
]

# "& Anor" and "& Ors" (and another, and others) in a case name come off
# a party's edge: "Pellow Holdings Ltd & Anor" is "Pellow Holdings Ltd"
# (guide rule 2, issue #499). The "&" goes with the end's punctuation below.
# Lowercase list letters at a line start or list break come off too (#546).
[[span]]
category = "ORG"
trim = ["anor", "ors"]
list_letter = true

# An organization ends with its legal form, not the sentence's period or
# comma: "Northbridge Legal Ltd." at a sentence end is "Northbridge Legal
# Ltd" (#374), nor with an "&" a trim left behind.
[[span]]
category = "ORG"
strip_end = ".,;:&"

# A tax number's label stays outside its span: the model's "EIN 98-7654321"
# is "98-7654321" (guide rule 6, issue #480).
[[span]]
category = "TAX"
trim = ["ein", "tin", "itin", "utr"]

# A bank account's label stays outside its span too: the model's "IBAN
# GB47 KELD …" is "GB47 KELD …" (guide rule 6, issue #486). "acct" is no
# trim word, since it may end a value; the labelled values below take it.
[[span]]
category = "BANK"
trim = [
    "iban", "a/c", "account", "account no", "account number", "bank account",
]

# Field labels beside values in one model span (#739): "Tax ID 9900123450,
# Tel. +1 212 555 0142" keeps the phone. An amount's, an invoice's or a
# ZIP code's word is none.
[[label]]
category = "TAX"
words = ["tax id", "taxpayer id", "tax number", "vat", "vat number"]

# Bank details' labels besides the trimmed ones above.
[[label]]
category = "BANK"
words = ["acct", "bic", "swift", "routing number", "aba", "sort code"]

# An identity document's labels.
[[label]]
category = "IDENTITY"
words = ["passport", "passport number", "ssn", "national id", "id card"]

# A phone's labels.
[[label]]
category = "PHONE"
words = ["tel", "telephone", "phone", "fax", "mobile", "cell"]

# A declaration or an affidavit is a person's: the model's organization
# "Ostrand Decl." is the person "Ostrand" when a person's span names them
# ("Mr Ivo Ostrand"; guide rule 1, issue #499).
[[span]]
category = "ORG"
person_before = ["decl", "declaration", "aff", "affidavit", "dep", "deposition"]

# A person's span of one name and an airline noun is an airline (guide
# rule 2, #548): written lowercase the noun is a common one after the
# company's name and stays outside ("⟦ORG|Pellam⟧ airlines", "⟦ORG|Pellam⟧
# air fares"); capitalized it is the name's own word ("⟦ORG|Pellam
# Airlines⟧"). Not after a title, nor after two words ("Ada Pellam airlines
# tickets" are a person's). "Bank", "Medicine" and "Health" stay out:
# they are surnames ("Melissa Bank") and nouns after a person's name
# ("Ada Pellam bank details").
# A team right after "team known as (the)", its name ending there, is a
# company's too: "the team known as the ⟦ORG|Brindle Harriers⟧".
[[span]]
category = "PERSON"
org_before = ["airline", "airlines", "air fare", "air fares", "airfare", "airfares"]
org_after = ["team known as the", "team known as"]

# A document label before "of" or a pinpoint page is no person's name
# (#499). Require the dot and citation context: an untitled person called
# Decl or Aff in prose must stay marked (guide rule 1).
[[reference]]
pattern = '\b(?:Decl|Dep|Aff)\.(?P<tail>[\p{Zs}\t]+(?:of\b|at[\p{Zs}\t]+\d+(?:[-–]\d+)?(?:[\p{Zs}\t]*$|[\p{Zs}\t]*[),;.\]]))|[\p{Zs}\t]*¶)'

# A declaration's or exhibit's label before a person's name is outside
# it, as is a numbered exhibit leading into the declarant (#499).
[[span]]
category = "PERSON"
trim_start = [
    '(?:Decl|Dep|Aff)\.[\p{Zs}\t]+of[\p{Zs}\t]+',
    'Ex\.[\p{Zs}\t]+\d+[\p{Zs}\t]+to[\p{Zs}\t]+',
]

# A short two-part name after a courtesy title is PERSON, whatever the
# model made of it: "Mr Li Na", "Ms Ko Un" (guide rule 1, #404). Two
# short capitalised words, of two to four letters each, and no third one
# after them ("Mr Smith Said:", "Ms Jones Counsel" are none); the title
# stays outside. Only a gap: where a name span overlaps the match it is
# not proposed (`gaps_only`, #404 review). A judge's, a speaker's or an
# officer's title after the courtesy one is no name ("Mr Deputy Mayor"),
# nor is a suffix ("Mr Bo Esq", "Mr Bo Jr", "Ms Li QC") or a heading's
# word ("Ms Li Re: the lease"): all are skipped.
# "Dr" is left out, as it is also a street's "Drive".
[[span]]
category = "PERSON"
pattern = '(?P<lead>{lead})(?:{name})(?P<tail>{tail})'
parts.lead = '\b(?:Mr|Mrs|Ms|Mx|Miss)\.?[\p{Zs}\t]+'
parts.name = '[\p{Latin}&&\p{Lu}][\p{Latin}&&\p{Ll}]{1,3}[\p{Zs}\t]+[\p{Latin}&&\p{Lu}][\p{Latin}&&\p{Ll}]{1,3}'
parts.tail = '[\p{Zs}\t]*(?:[^\p{L}\p{N}\p{Zs}\t]|(?m:$))|[\p{Zs}\t]+[\p{Ll}\p{N}]'
skip = '\b(?:Justice|Speaker|President|Chairman|Chairwoman|Chair|Deputy|Recorder|Registrar|Commissioner|Secretary|Attorney|General|Lord|Lady|Sir|Dame|Judge|Senator|Governor|Mayor|Chief|Vice|Acting|Dear|Re|The|And|Of|(?i:esq|jr|jnr|sr|snr|junior|senior|kc|qc|bart|phd))\b'
gaps_only = true

# A glued particle makes a capitalised word a name's ("al-Hadid"), but
# "al-Qaeda" is an organization, never a person (#403 review).
[[never]]
match = "pattern"
patterns = ['(?i)^[\s\p{P}]*al-qaeda[\s\p{P}]*$']
anywhere_in = ["PERSON"]

# A model span that starts inside a caption's short "Ex p" ("Ex ⟦p Ossian
# Draycott⟧") loses the "p": a lower-case "p" before a capitalised word
# never starts a name (#500).
[[span]]
category = "PERSON"
trim_start = ['p\.?[\p{Zs}\t]+(?P<rest>\p{Lu})']

# Titles: never a name on their own ("Ms", "Dr."), also plural ("Drs").
# French and German titles turn up in English documents too.
[[never]]
match = "plural"
words = [
    "mr", "mrs", "ms", "miss", "mx", "dr", "prof", "professor", "sir", "dame",
    "lord", "lady", "madam", "madame", "mme", "mlle", "herr", "frau", "monsieur",
]

# Family words: "her husband" names no one.
[[never]]
match = "plural"
words = ["husband", "wife", "spouse", "partner", "father", "mother", "daughter"]

# Roles in a matter or a contract: "the Employer", "Her Adviser", "Parties"
# (issues #302, #385). A title or a full name keeps a role-like surname.
[[never]]
match = "plural"
words = [
    "adviser", "advisor", "solicitor", "barrister", "counsel", "lawyer",
    "attorney", "client", "employer", "employee", "claimant", "respondent",
    "applicant", "defendant", "plaintiff", "appellant", "party", "parties",
    "buyer", "seller", "landlord", "tenant", "lessor", "lessee", "licensor",
    "licensee", "contractor", "customer", "supplier", "company", "director",
    "witness", "judge", "owner", "repairer", "assignee", "assignor",
    "provider", "debtor", "trustee", "creditor", "appellee", "affiliate",
    "agent", "subscriber", "dealer", "sponsor", "recipient", "franchisee",
    "participant", "user", "discloser",
]
unless_named = true
person_role = true

# "Anor" and "Ors" (another, others) in a case name ("X Ltd & Anor") name
# no one (issue #499).
[[never]]
match = "whole"
words = ["anor", "ors"]

# The words for people themselves ("People").
[[never]]
match = "plural"
words = ["people", "person", "individual"]

# Determiners around a role name no one either ("The Employer"). Matched
# whole only.
[[never]]
match = "whole"
words = ["the", "an", "her", "his", "their", "its", "our", "my", "your", "this", "that", "said"]

# Job roles: never a name alone ("Surveyor"). Only a complete role phrase
# goes ("Costs Officer", "Administrative Team"); another word keeps a
# person's or company's name ("John Clerk", "Brannock Leader"; #385).
[[never]]
match = "plural"
words = [
    "reviewer", "surveyor", "representative", "secretary",
    "expert", "registrar", "assessor", "adjudicator", "mediator",
    "arbitrator", "clerk", "leader", "investigator", "specialist", "marshal",
    "supervisor", "chair", "chairman", "president", "sergeant", "sheriff",
    "undersheriff", "master", "recorder", "administrator", "notary",
    "esquire", "treasurer", "ceo", "cxo", "hod", "magistrate",
]
unless_named = true
person_role = true

# A private body's department is no organization (GUIDE #506 item 9).
# A legal form keeps the company; these words may still be person surnames.
[[never]]
match = "plural"
words = [
    "team", "officer", "committee", "inspector", "desk",
]
unless_named = true
person_role = true
last_word_of = ["ORG"]

# The same roles' -ies plurals.
[[never]]
match = "whole"
words = ["secretaries", "deputies", "chairmen"]
unless_named = true
person_role = true

# Words that make a job title of a role: "Technical Reviewer", "Managing
# Director" name no one (guide rule 8). Alone they may name someone or
# a company ("VICE"); only a multiword phrase uses them as modifiers.
[[never]]
match = "whole"
words = [
    "technical", "managing", "senior", "junior", "chief", "deputy",
    "assistant", "executive", "independent", "administrative",
    "first", "second", "third", "fourth", "fifth", "sixth", "seventh",
    "eighth", "ninth", "tenth", "bankrupt", "lead", "covered", "operating",
    "circuit", "district", "bureau", "accident", "investigation", "vice",
    "other", "originating", "host", "agreement", "agreements",
    "division", "public", "fire", "costs",
    "acting", "head", "general", "generals", "principal", "principals",
]
unless_named = true
phrase_only = true

# An explanatory note can explicitly define capacities rather than people.
# Require the defining clause as well as role vocabulary; "Principal"
# alone, or beside an actual name, remains a possible name.
[[reference]]
pattern = '(?i)\bthe[\p{Zs}\t]+terms?[\p{Zs}\t]+(?:principal|attorney|witness)(?:[\p{Zs}\t]*(?:,|and|or)[\p{Zs}\t]+(?:principal|attorney|witness))*[\p{Zs}\t]+describ(?:e|es)[\p{Zs}\t]+(?:a[\p{Zs}\t]+)?capacit(?:y|ies)\b'

# Complete role-only phrases whose numbers, prepositions or optional
# plural suffix escape word lists (#385). Both ends are anchored: a name
# beside a role must survive. A person's preceding title keeps a surname
# that happens to be one of these phrases.
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:international[\p{Zs}\t]+agreements[\p{Zs}\t]+specialists?|chapter[\p{Zs}\t]+\d{1,2}[\p{Zs}\t]+trustees?|(?:plaintiff|defendant|claimant|circuit[\p{Zs}\t]+judge)\(s\)|head[\p{Zs}\t]+of[\p{Zs}\t]+delegation|attorneys?[\p{Zs}\t]+for[\p{Zs}\t]+plaintiffs?|vice[\p{Zs}\t]+president[\p{Zs}\t]+of[\p{Zs}\t]+infrastructure|king[\p{Zs}\t]+of[\p{Zs}\t]+sweden)[\s\p{P}]*$',
]
anywhere_in = ["PERSON"]
unless_titled = true

# The same complete phrases misclassified as organizations (#385).
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:international[\p{Zs}\t]+agreements[\p{Zs}\t]+specialists?|chapter[\p{Zs}\t]+\d{1,2}[\p{Zs}\t]+trustees?|(?:plaintiff|defendant|claimant|circuit[\p{Zs}\t]+judge)\(s\)|head[\p{Zs}\t]+of[\p{Zs}\t]+delegation|attorneys?[\p{Zs}\t]+for[\p{Zs}\t]+plaintiffs?|vice[\p{Zs}\t]+president[\p{Zs}\t]+of[\p{Zs}\t]+infrastructure|king[\p{Zs}\t]+of[\p{Zs}\t]+sweden)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# These complete headings/roles contain modifiers alone; they do not
# make other modifier combinations ("General Accident") generic.
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:(?:[a-z]\.[\p{Zs}\t]+)?general[\p{Zs}\t]+terms|operating[\p{Zs}\t]+principals?)[\s\p{P}]*$',
]
anywhere_in = ["PERSON"]
unless_titled = true

# The same complete headings/roles misclassified as organizations.
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:(?:[a-z]\.[\p{Zs}\t]+)?general[\p{Zs}\t]+terms|operating[\p{Zs}\t]+principals?)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# Category words: "Email", "Address", "Bank" in a table header name no one
# (issue #379). Matched whole, with their plurals listed, so the surname
# "Banks" stays.
[[never]]
match = "whole"
words = [
    "email", "emails", "e-mail", "phone", "phones", "telephone", "address",
    "addresses", "organisation", "organisations", "organization",
    "organizations", "bank", "account", "accounts", "passport", "name",
    "names",
]

# Generic nouns of a contract or a complaint that a document defines as a
# term for a party or its business ("(the “Distributor”)", "(the
# “Franchised Business”)", "(“Townhouse”)"): once the document defines one,
# every mention of it, alone or with the other generic words of the term
# ("RESELLER AGREEMENT"), is a defined term and no organization (guide rule
# 2, issue #390). Only where the document defines it: elsewhere a company
# may share the word, and a term with any coined or real word ("Kew
# Project", "Quillon", "Fox") defines none. Plurals are matched; the -ies
# plurals are listed.
[[defined]]
match = "plural"
words = [
    "distributor", "sponsor", "reseller", "club", "concessionaire",
    "franchisee", "franchisor", "firm", "affiliate", "subsidiary", "agent", "member",
    "subscriber", "vendor", "purchaser", "operator", "guarantor", "borrower",
    "lender", "mortgagor", "mortgagee", "trustee", "beneficiary",
    "consultant", "developer", "corporation", "group", "fund", "estate",
    "authority", "territory", "townhouse", "network", "site", "property",
    "premises", "business", "agency", "shareholder", "stockholder", "class",
    "proceeding", "action", "loan", "mortgage", "asset", "transfer",
    "application", "jurisdiction", "trade", "judgment",
]

# The -ies and -es plurals of the same words.
[[defined]]
match = "whole"
words = [
    "subsidiaries", "beneficiaries", "entities", "entity", "businesses",
    "authorities", "territories", "properties", "companies", "agencies",
]

# Words that qualify a defined term ("Franchised Business", "Selling
# Jurisdictions", "Named Account", "Declaratory Judgment Action", "other
# Party", "Uncontested Material Fact").
[[defined]]
match = "plural"
words = [
    "franchised", "proprietary", "subscription", "selling", "named",
    "declaratory", "other", "such", "uncontested", "undisputed", "material",
    "summary", "supplemental", "amended", "def", "pl",
]

# Documents of a contract or a case: a defined term of them is no
# organization ("Agency Agreement", "Subscription Agreements"), and an
# abbreviation defined after a long form of generic words with one of these
# among them names no one: "Def.'s Statement of Uncontested Material Fact
# (“DSUMF”)" (guide rule 2, issue #390). A long form with any other word, or
# a legal form, keeps its abbreviation.
[[defined]]
match = "plural"
document = true
words = [
    "agreement", "contract", "statement", "motion", "memorandum", "response",
    "reply", "brief", "declaration", "affidavit", "complaint", "petition",
    "opposition", "order", "report", "notice", "exhibit", "schedule", "annex",
    "fact", "answer", "request", "stipulation", "opinion",
]

# Common words that name no one alone, though a person may be called so
# (issue #500, guide rules 1 and 8): pronouns ("He appeals", "It contends"
# as an organization), the "In" of "In re" and a sentence's "In", and a
# running header's "Others". After a title ("Mr He", "Ms In") or where a
# person span in the document has the word beside a name ("He Jiankui",
# "Sarah In"), it is that person's name.
[[never]]
match = "whole"
words = ["he", "she", "it", "they", "we", "you", "him", "them", "others", "another", "in", "re"]
unless_named = true

# The same for capitalised common words of headings and running headers:
# "Approved Judgment", "Program Announcement", "General Terms", "Federal
# government", "Law School" as an organization, and "End Products" after a
# nationality (#492). "Mr. General", "Jane Federal" and "Paul Program" stay;
# so does an organization with any other word ("General Motors", "Harvard
# Law School").
[[never]]
match = "plural"
words = [
    "approved", "judgment", "judgement", "announcement", "term",
    "federal", "law", "school", "end", "product",
]
unless_named = true

# Words of templates, manuals and headings, in title case or capitals:
# a fire plan's "Fire" and "Location", an accident handbook's "Serious
# Accident Investigation", "Index", "Manual" and "Briefing", a contract's
# "OPERATING MANUAL", "Class A fires" (issue #500, guide rule 8; "Team",
# "Safety" and "Plan" are listed elsewhere). Some are role modifiers too
# ("Accident Investigation Advisor"). A title keeps a person ("Mr
# Manual"), and so does a person span with the word beside a name ("Edda
# Fire"); a company keeps any other word ("Acme Fire Safety Ltd", "General
# Accident", "Index Ventures").
[[never]]
match = "plural"
words = [
    "investigation", "accident", "fire", "location", "index", "agreement",
    "manual", "briefing", "operating", "serious", "class",
]
unless_named = true

# The other plurals of "index".
[[never]]
match = "whole"
words = ["indexes", "indices"]
unless_named = true

# Group and plural nouns for people: "Investors", "Issuers currently
# provide", "Importers", "the Role of Intermediaries", "Adults", "Dashers",
# the "Founding Fathers", "Female employees" (issue #500, guide rules 1 and
# 8). Listed one by one, agent nouns in -er and -or too, so plural
# surnames stay ("the Smiths", "Jones", "Williams", "Adams", "Roberts",
# "Rogers"). A title or a person span with the word beside a name keeps
# it ("Ms Adult", "Ivo Founding").
[[never]]
match = "plural"
words = [
    "investor", "issuer", "importer", "exporter", "intermediary", "adult",
    "dasher", "founding", "female", "male",
]
unless_named = true

# The same nouns' -ies plurals.
[[never]]
match = "whole"
words = ["intermediaries"]
unless_named = true

# Professions in -ian and -ist: "Librarians", "Hospitalists",
# "Physicians", "Biologists" (issue #500). Listed one by one: a family's
# plural surname with the same ending stays ("the Lindquists", "the
# Hagopians", "The Kardashians"), and so do given names in the plural
# ("the Adrians"). A title or a person span with the word beside a name
# keeps one ("Ms Chemist", "Rhea Dentist").
[[never]]
match = "plural"
words = [
    "librarian", "physician", "technician", "clinician", "hospitalist",
    "biologist", "scientist", "pharmacist", "dentist", "therapist",
    "economist", "statistician", "electrician", "pediatrician",
    "paediatrician", "obstetrician", "dietitian", "dietician", "optician",
    "mathematician", "musician", "historian", "politician", "veterinarian",
    "chemist", "physicist", "psychologist", "psychiatrist", "journalist",
    "geologist", "ecologist", "toxicologist", "epidemiologist", "radiologist",
    "anesthesiologist", "anaesthetist", "cardiologist", "oncologist",
    "neurologist", "dermatologist", "pathologist", "botanist", "entomologist",
    "nutritionist", "hygienist", "analyst", "artist",
]
unless_named = true

# Head words of programmes, plans, standards, projects and trials, and of
# software, sites and portals: common words that name no one alone, and an
# organization span ending in one is the programme or the product, not a
# company ("Bright Paths Program", "National Reading Access Standard",
# "Timber Trade Online", "Application Manager"; guide rules 2 and 8, issues
# #501 and #488). A company keeps them before its legal form ("Acme Program
# Ltd") or with another word after them ("Plan International"); a person
# after a title ("Mr Standard").
[[never]]
match = "plural"
words = [
    "program", "programme", "initiative", "standard", "plan", "assurance",
    "project", "trial", "online", "portal", "platform", "website",
    "app",
]
unless_named = true
last_word_of = ["ORG"]

# A person span of three words or more that ends in a programme's head
# word is the programme, no one: the model's "CAFTA-DR Environmental
# Cooperation Program", "Bright Paths Reading Initiative" (guide rule 8,
# issue #500); it would make every "Program" a name. Not the heads that
# end people's names too ("Mary Ann Standard", "Maria Jose Portal", "Joan
# Maria Plans"). Two words stay a person's name ("Paul Program"), and so
# do initials ("J. R. Project"), a span after a title ("Mr Ivo Dane
# Project") and one whose last word the document names ("Ms Project").
[[never]]
match = "pattern"
patterns = [
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:\p{Uppercase}[\p{Alphabetic}\x27’-]+[\p{Zs}\t]+){2,}(?i:programs?|programmes?|initiatives?|projects?|trials?|platforms?)[\s\p{P}]*$',
]
anywhere_in = ["PERSON"]
unless_titled = true
unless_last_named = true

# A manager is both a job's head and software's ("Application Manager").
[[never]]
match = "plural"
words = ["manager"]
unless_named = true
person_role = true
last_word_of = ["ORG"]

# The same for "system", whose plural ends many a company's name ("Acme
# Systems"): "the Case Management System" is software (issue #488).
[[never]]
match = "whole"
words = ["system"]
unless_named = true
last_word_of = ["ORG"]

# A head word in lower case after a name is a common noun, whatever it
# names: "VR services", "Pumping Plant project", "the Grants system" are no
# company (issues #501 and #488). "Northvale Ledger Services" in title case
# may be one, and keeps its name.
[[never]]
match = "pattern"
patterns = [
    '[\p{Alphabetic}\p{N}.][\p{Zs}\t]+(?:services?|programs?|programmes?|projects?|plans?|initiatives?|standards?|trials?|systems?|portals?|platforms?|websites?|apps?|software|databases?)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# Head words of medical conditions: "Acute Lung Injury", "Acute Kidney
# Strain" and "Respiratory Distress Syndrome" are no organizations, nor
# anyone (issue #501).
[[never]]
match = "plural"
words = [
    "syndrome", "disease", "disorder", "injury", "infection", "deficiency",
    "insufficiency", "strain",
]
unless_named = true
last_word_of = ["ORG"]

# Generic words of a business's parts, functions and documents: a span of
# these alone names no company ("Crew", "Operations", "Assignment",
# "Facilities", "Federal Employment", "Human Resources", "F.O.B.
# Destination"; guide rules 2 and 8, issue #501). Any other word keeps a
# company ("Copper Dusk Facilities Ltd", "Crew Clothing"); a title keeps a
# person ("Ms Crew").
[[never]]
match = "plural"
words = [
    "crew", "service", "operation", "assignment", "facility", "employment", "destination",
    "origin", "maintenance", "management", "personnel", "staff", "staffing",
    "payroll", "procurement", "purchasing", "accounting", "finance",
    "compliance", "security", "safety", "training", "admission", "enrollment",
    "enrolment", "recruitment", "human", "resource", "support", "benefit",
    "billing", "collection", "dispatch", "headquarters", "acute", "chronic",
]
unless_named = true

# The same words' -ies plurals ("Facilities", "Securities" alone).
[[never]]
match = "whole"
words = ["facilities", "securities"]
unless_named = true

# Common English abbreviations of tax, trade, finance, education and records
# name no one ("VAT", "EFT", "F.O.B.", "OEM", "SICAV", "OBO", "NOBO", "LEA",
# "IEP", "FAPE", "RNG", "MMS" as a person, "FOBTs"; guide rule 8, issues
# #481 and #501). Any other word keeps a company ("Acme Fund SICAV"); a
# title or a full name keeps a person.
[[never]]
match = "plural"
words = [
    "vat", "eft", "ach", "f.o.b", "fob", "c.i.f", "cif", "oem", "sicav", "oeic",
    "obo", "nobo", "iep", "fape", "rti", "k-12", "sop", "amld", "fobt", "rng",
    "mms", "nimas", "kyc", "aml",
]
unless_named = true

# The abbreviations that are also names or words ("Lea", "Sea", "Fir",
# "Hel") count only in capitals, as an organization: "the LEA's IEP", "the
# SEA" (issue #481). "Lea signed" stays a person.
[[never]]
match = "pattern"
patterns = [
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:LEA|SEA|FIR|HEL)s?(?:[\x27’]s)?[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# Public job, grant, court and probation systems and app platforms by their
# names: "USAJOBS", "CM/ECF", "PACER", "myHMCTS", "OASys", "AppStore",
# "GooglePlay" (guide rule 2, issue #488). Their sites' domains are no
# organizations by the ORG shape ("Grants.gov").
[[never]]
match = "whole"
words = [
    "usajobs", "cm/ecf", "ecf", "pacer", "myhmcts", "oasys", "e-verify",
    "appstore", "googleplay", "playstore",
]
unless_named = true

# App platforms in two words: "App Store", "Google Play", "Play Store" are
# no organization (issue #488); "Apple" or "Google" alone stays.
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:(?:(?:apple|amazon)[\p{Zs}\t]+)?app[\p{Zs}\t]?store|google[\p{Zs}\t]?play(?:[\p{Zs}\t]?store)?|play[\p{Zs}\t]?store|microsoft[\p{Zs}\t]+store|galaxy[\p{Zs}\t]+store|app[\p{Zs}\t]?gallery)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# A legal form with no name before it is no company: "a New Jersey limited
# liability company", "a Delaware corporation", "an English private limited
# company" (guide rule 2, issue #501): the form in lower case, after a US
# state or a jurisdiction. "Acme Corporation", "Northvale Ledger limited
# liability company" and "Quillon Freight LLC, a Wyoming limited liability
# company" keep their names.
[[never]]
match = "pattern"
patterns = [
    '''^[\s\p{P}]*(?:(?:[Aa]n?|[Tt]he)[\p{Zs}\t]+)?(?i:(?:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new[\p{Zs}\t]+hampshire|new[\p{Zs}\t]+jersey|new[\p{Zs}\t]+mexico|new[\p{Zs}\t]+york|north[\p{Zs}\t]+carolina|north[\p{Zs}\t]+dakota|ohio|oklahoma|oregon|pennsylvania|rhode[\p{Zs}\t]+island|south[\p{Zs}\t]+carolina|south[\p{Zs}\t]+dakota|tennessee|texas|utah|vermont|virginia|washington|west[\p{Zs}\t]+virginia|wisconsin|wyoming|district[\p{Zs}\t]+of[\p{Zs}\t]+columbia|puerto[\p{Zs}\t]+rico|u\.[\p{Zs}\t]?s\.|us|u\.[\p{Zs}\t]?k\.|uk|english|welsh|scottish|irish|british|canadian|ontario|jersey|guernsey|cayman[\p{Zs}\t]+islands|british[\p{Zs}\t]+virgin[\p{Zs}\t]+islands|bvi|luxembourg|dutch|german|french|swiss|cypriot|maltese)[\p{Zs}\t]+)(?:(?:domestic|foreign|nonprofit|non-profit|not-for-profit|professional|public[\p{Zs}\t]+benefit|private|public|close|business|statutory|general|limited)[\p{Zs}\t]+)*(?:limited[\p{Zs}\t]+liability[\p{Zs}\t]+(?:company|partnership|limited[\p{Zs}\t]+partnership)|limited[\p{Zs}\t]+(?:company|partnership)|corporation|partnership|trust|company[\p{Zs}\t]+limited[\p{Zs}\t]+by[\p{Zs}\t]+(?:shares|guarantee))[\s\p{P}]*$''',
]
anywhere_in = ["ORG"]

# A treatise by its author and a legal subject is the title of a work, no
# company: "5 Collier on Bankruptcy", "4 Brindle on Insolvency", "Vell and
# Ostrand on Contracts" (guide rule 8 and its Examples, issue #501). Other
# subjects keep a name ("Meals on Wheels").
[[never]]
match = "pattern"
patterns = [
    '''^[\s\p{P}]*(?:\d{1,3}[\p{Zs}\t]+)?\p{Uppercase}[\p{Alphabetic}\x27’-]+(?:,?[\p{Zs}\t]+(?:(?:and|&)[\p{Zs}\t]+)?\p{Uppercase}[\p{Alphabetic}\x27’-]+){0,3}[\p{Zs}\t]+on[\p{Zs}\t]+(?:the[\p{Zs}\t]+)?(?:Law[\p{Zs}\t]+of[\p{Zs}\t]+)?(?:Bankruptcy|Insolvency|Contracts?|Torts?|Trusts?|Evidence|Damages|Wills|Insurance|Agency|Partnership|Restitution|Equity|Mortgages?|Easements|Defamation|Libel(?:[\p{Zs}\t]+and[\p{Zs}\t]+Slander)?|Negligence|Arbitration|Costs|Copyright|Patents?|Trade[\p{Zs}\t]+Marks|Trademarks|Company[\p{Zs}\t]+Law|Corporations|Securities(?:[\p{Zs}\t]+Regulation)?|Banking|Taxation|Sale[\p{Zs}\t]+of[\p{Zs}\t]+Goods|Landlord[\p{Zs}\t]+and[\p{Zs}\t]+Tenant|Real[\p{Zs}\t]+Property|Property|Conflict[\p{Zs}\t]+of[\p{Zs}\t]+Laws|Pleading|Practice|Injunctions|Judgments|Statutes|Interpretation|Jurisdiction|Criminal[\p{Zs}\t]+Law|Sentencing)[\s\p{P}]*$''',
]
anywhere_in = ["ORG"]

# Religions and believers: "his Christian faith", "from Islam to …"
# (issue #500). "Christian Bale" and "Nazrul Islam" stay.
[[never]]
match = "plural"
words = [
    "christian", "christianity", "muslim", "moslem", "islam", "islamic", "jew",
    "jewish", "judaism", "catholic", "catholicism", "protestant", "hindu",
    "hinduism", "buddhist", "buddhism", "sikh", "sikhism", "mormon", "baptist",
    "methodist", "lutheran", "anglican", "evangelical", "atheist", "agnostic",
]
unless_named = true

# Deities are never marked (guide rule 8, #506 item 8): "God", "Allah",
# "Christ", "the Almighty" (issue #500). A person called so keeps the name
# after a title ("Mr Christ") or where a person span has it beside a name
# ("Carol Christ", then "Christ"). "Jesus" alone is a given name too ("Her
# son, Jesus, testified"), so only its phrases below count.
[[never]]
match = "whole"
words = [
    "god", "gods", "goddess", "goddesses", "christ", "allah", "yahweh",
    "jehovah", "almighty", "buddha",
]
unless_named = true

# The same in two words: "the Holy Spirit", "the Holy Ghost".
[[never]]
match = "pattern"
patterns = ['(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?holy[\p{Zs}\t]+(?:spirit|ghost)[\s\p{P}]*$']
anywhere_in = ["PERSON"]
unless_titled = true

# Jesus by the phrases that name the deity, a span inside one included:
# "Jesus Christ", "Lord Jesus" (whose "Lord" a title's trim would leave
# out), "Jesus of Nazareth" (guide rule 8, #506 item 8). "Jesus Martinez"
# and "Her son, Jesus" stay.
[[reference]]
pattern = '(?i)\b(?:(?:lord[\p{Zs}\t]+)?jesus[\p{Zs}\t]+christ|lord[\p{Zs}\t]+jesus|jesus[\p{Zs}\t]+of[\p{Zs}\t]+nazareth)\b'

# A federal pay grade and a price index are no one and no company: "GS-14",
# "GS-13/14", "GS 9", "the Consumer Price Index" (issue #500, guide rule 8).
[[never]]
match = "pattern"
patterns = [
    '^[\s\p{P}]*GS[\p{Zs}\t-]?\d{1,2}(?:[\p{Zs}\t]*[/–-][\p{Zs}\t]*(?:GS[\p{Zs}\t-]?)?\d{1,2})?[\s\p{P}]*$',
    '(?i)\b(?:consumer|producer|retail)[\p{Zs}\t]+prices?[\p{Zs}\t]+index(?:es)?\b',
]
anywhere_in = ["PERSON", "ORG"]

# Nationalities, demonyms and citizenship, alone or before a common noun:
# "Americans", "Maltese lawyer", "American licensed drivers", "United
# States Citizens", "Citizenry" (issue #492). "Dawn French" and "Mr
# English" stay; so does a company with any other word ("British Airways").
[[never]]
match = "plural"
words = [
    "american", "british", "briton", "brit", "english", "welsh", "scottish",
    "scot", "irish", "european", "african", "asian", "australian", "canadian",
    "mexican", "chinese", "japanese", "korean", "vietnamese", "thai",
    "filipino", "indonesian", "malaysian", "indian", "pakistani",
    "bangladeshi", "afghan", "iranian", "iraqi", "syrian", "lebanese",
    "israeli", "palestinian", "jordanian", "saudi", "egyptian", "moroccan",
    "algerian", "tunisian", "libyan", "nigerian", "ghanaian", "kenyan",
    "ethiopian", "somali", "sudanese", "turkish", "greek", "cypriot",
    "maltese", "italian", "spanish", "portuguese", "french", "german", "dutch",
    "belgian", "swiss", "austrian", "polish", "czech", "slovak", "hungarian",
    "romanian", "bulgarian", "serbian", "croatian", "bosnian", "albanian",
    "ukrainian", "russian", "belarusian", "armenian", "azerbaijani", "kazakh",
    "uzbek", "swedish", "norwegian", "danish", "finnish", "icelandic",
    "estonian", "latvian", "lithuanian", "brazilian", "argentine",
    "argentinian", "chilean", "colombian", "peruvian", "venezuelan", "cuban",
    "haitian", "jamaican", "hispanic", "latino", "latina", "citizen",
    "citizenry", "national", "resident", "united", "state",
]
unless_named = true

# Courts and public bodies are never marked (the fixture guide's rule 8):
# an organization or person span with one of these words anywhere is
# dropped ("County Court", "Ministry of Justice", "Employment Tribunal",
# "Ofcom", "HMRC" as a person, "EEOC"; issue #378) unless it has a legal
# form ("Garden Court Ltd" is a company). Only short names no company
# shares are listed; the others count alone (below). Also a constabulary.
[[never]]
match = "plural"
words = [
    "court", "tribunal", "ministry", "registry", "ombudsman", "government",
    "parliament", "police", "ofcom", "ofgem", "ofwat", "hmrc", "acas",
    "congress", "legislature", "senate", "judiciary", "probation",
    "administration", "hmcts", "uksc", "ewca", "ewhc", "ukut", "ukftt",
    "ukeat", "scotus", "ohrp", "eeoc", "nlrb", "osha", "uspto", "ptab", "cfpb",
    "uscis", "nhtsa", "constabulary",
]
anywhere_in = ["ORG", "PERSON"]

# The same bodies' -ies plurals ("Ministries of Justice").
[[never]]
match = "whole"
words = ["ministries", "registries", "agencies", "constabularies"]
anywhere_in = ["ORG", "PERSON"]

# Laws are never marked either: an Act, an amendment, a regulation, a
# statute, a constitution or an ordinance by its title, as an organization
# or a person ("Gaming Act 1968", "the First Amendment", "Fair Practices
# Ordinance"; guide rule 8, issue #378). Laws' and treaties' short names
# count alone (below).
[[never]]
match = "plural"
words = [
    "act", "amendment", "regulation", "statute", "constitution", "ordinance",
]
anywhere_in = ["ORG", "PERSON"]

# Words that make a public body or a place of a person span, though a
# company may have them ("Northbridge Department Store", "Acme Talent
# Agency", "Commission Junction"): "Ashmoor County Probation Department"
# is no one (#378).
[[never]]
match = "plural"
words = [
    "agency", "bureau", "county", "district", "council", "commission",
]
anywhere_in = ["PERSON"]

# Department words also end private departments, not company names (#506).
[[never]]
match = "plural"
words = ["department", "office", "board", "division"]
anywhere_in = ["PERSON"]
last_word_of = ["ORG"]

# Public bodies, laws and courts by their phrases, as an organization or a
# person (issue #378). A legal form keeps a company; words in quotes are a
# name.
[[never]]
match = "pattern"
patterns = [
    # Departments, offices, agencies, bureaus, commissions and boards of a
    # state or the Crown: "Department of Justice", "Dep't of Labor",
    # "Probation Department", "Office of the Attorney General", "Home
    # Office", "Clerk's Office", "Agency for …", "National Security Agency",
    # "Bureau of Prisons", "Federal Election Commission", "Securities and
    # Exchange Commission", "National Labor Relations Board", "Board of
    # Education".
    '(?i)\bdep(?:artments?|ts?\.?|[\x27’]t)[\p{Zs}\t]+(?:of|for)\b',
    # A ministry continuation needs its institutional connector, never
    # just a lowercase personal name below a bare office header.
    '(?i)\bministr(?:y|ies)[\p{Zs}\t]+(?:of|for)\b',
    '(?i)\b(?:police|sheriff[\x27’]?s|probation|fire|health|home|state|county|city|treasury|justice|corrections?|correctional|revenue|transportation|labou?r|education|defen[cs]e|homeland[\p{Zs}\t]+security|game[\p{Zs}\t]+and[\p{Zs}\t]+fish)[\p{Zs}\t]+departments?\b',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:(?:u\.[\p{Zs}\t]?s\.|united[\p{Zs}\t]+states|state|county|city|federal)[\p{Zs}\t]+)?offices?[\p{Zs}\t]+(?:of|for)\b',
    '(?i)\b(?:home|foreign|cabinet|war|colonial|patent|passport|(?:attorney|sheriff|comptroller|commissioner|prosecutor|defender|coroner|clerk|registrar|governor|mayor|attorney[\p{Zs}\t]+general|inspector[\p{Zs}\t]+general)[\x27’]s?)[\p{Zs}\t]+office\b',
    '(?i)\bagenc(?:y|ies)[\p{Zs}\t]+(?:of|for)\b',
    '(?i)\b(?:federal|national|state|environment(?:al)?|intelligence|defen[cs]e|regulatory|government(?:al)?|enforcement|revenue|central|border|nuclear|space)(?:[\p{Zs}\t]+\p{Alphabetic}+){0,2}[\p{Zs}\t]+agenc(?:y|ies)\b',
    '(?i)\bbureaus?[\p{Zs}\t]+of\b',
    '(?i)\b(?:federal|national|census|government|state|county|city|consumer[\p{Zs}\t]+financial[\p{Zs}\t]+protection)[\p{Zs}\t]+bureau\b',
    '(?i)\b(?:federal|national|state|securities|trade|election|electoral|communications|equal|law|charity|public|utilit(?:y|ies)|civil[\p{Zs}\t]+service|european|international|gaming|gambling|planning|zoning|county|city|human[\p{Zs}\t]+rights|civil[\p{Zs}\t]+rights|energy|regulatory|commodity|maritime|nuclear|parole|insurance|labou?r|competition|ethics|transportation|liquor|lottery|boundary|forestry|judicial|sentencing|information)(?:[\p{Zs}\t]+\p{Alphabetic}+){0,3}[\p{Zs}\t]+commissions?\b|^[\s\p{P}]*(?:the[\p{Zs}\t]+)?commissions?[\p{Zs}\t]+(?:on|of|for)\b',
    '(?i)\bboards?[\p{Zs}\t]+of[\p{Zs}\t]+(?:education|elections?|supervisors|selectmen|aldermen|county[\p{Zs}\t]+commissioners|immigration[\p{Zs}\t]+appeals|tax[\p{Zs}\t]+appeals|veterans|governors[\p{Zs}\t]+of[\p{Zs}\t]+the[\p{Zs}\t]+federal|parole|pardons|health|regents|registration|medicine|medical|nursing|pharmacy|equalization|zoning|review)\b',
    '(?i)\b(?:national|federal|state|county|city|municipal|parole|zoning|planning|school|merit[\p{Zs}\t]+systems[\p{Zs}\t]+protection|surface[\p{Zs}\t]+transportation|patent[\p{Zs}\t]+trial[\p{Zs}\t]+and[\p{Zs}\t]+appeal|immigration|federal[\p{Zs}\t]+reserve)(?:[\p{Zs}\t]+\p{Alphabetic}+){0,3}[\p{Zs}\t]+boards?\b',
    # Services, councils and the Treasury of a state: "Internal Revenue
    # Service", "Crown Prosecution Service", "City Council", "HM Treasury",
    # "HM Land Registry", "His Majesty's Revenue and Customs".
    '(?i)\b(?:internal[\p{Zs}\t]+revenue|postal|secret|marshals?|forest|national[\p{Zs}\t]+park|prison|probation|immigration|customs|border|crown[\p{Zs}\t]+prosecution|civil|foreign|national[\p{Zs}\t]+health|public[\p{Zs}\t]+health|child[\p{Zs}\t]+protective|social|health[\p{Zs}\t]+and[\p{Zs}\t]+human|citizenship[\p{Zs}\t]+and[\p{Zs}\t]+immigration|fish[\p{Zs}\t]+and[\p{Zs}\t]+wildlife|courts[\p{Zs}\t]+and[\p{Zs}\t]+tribunals)[\p{Zs}\t]+services?\b',
    '(?i)\binternal[\p{Zs}\t]+revenue\b|\brevenue[\p{Zs}\t]+(?:and|&)[\p{Zs}\t]+customs\b',
    '(?i)\b(?:city|county|borough|district|parish|town|metropolitan|municipal|privy|security)[\p{Zs}\t]+council\b',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+|hm[\p{Zs}\t]+|h\.m\.[\p{Zs}\t]+|u\.[\p{Zs}\t]?s\.[\p{Zs}\t]+|united[\p{Zs}\t]+states[\p{Zs}\t]+)?treasury(?:[\p{Zs}\t]+department)?[\s\p{P}]*$',
    '(?i)^[\s\p{P}]*(?:hm|h\.m\.|(?:her|his)[\p{Zs}\t]+majesty[\x27’]s)[\p{Zs}\t]+(?:treasury|revenue|courts|prison|land|government|customs|inspectorate|coastguard|passport|procurator|chief|attorney|crown|stationery|forces)\b',
    # Prosecutors and ministers alone: "Attorney General", "U.S. Attorney",
    # "District Attorney", "Secretary of Defense", "Minister of Defence"
    # ("Attorney General Quill" is
    # a person with a title).
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:(?:u\.[\p{Zs}\t]?s\.|united[\p{Zs}\t]+states|district|state[\x27’]?s?|county|city|prosecuting)[\p{Zs}\t]+attorneys?|attorneys?[\p{Zs}\t-]+generals?|(?:secretary|minister)[\p{Zs}\t]+of[\p{Zs}\t]+(?:state|defen[cs]e|justice|finance|health|education)(?:[\p{Zs}\t]+of[\p{Zs}\t]+(?:the[\p{Zs}\t]+)?[\p{Alphabetic}\p{Zs}\t]+)?)(?:[\x27’]s?)?[\s\p{P}]*$',
    # Courts by their circuits, districts and divisions: "1st Cir.", "Ninth
    # Circuit", "Northern District of …", "Chancery Division".
    '(?i)(?:^|[\s\p{P}])(?:\d+(?:st|nd|rd|th)|first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|d\.[\p{Zs}\t]?c\.|federal)[\p{Zs}\t]+cir(?:cuit\b|\.|[\s\p{P}]|$)',
    '(?i)\b(?:northern|southern|eastern|western|middle|central)[\p{Zs}\t]+district\b|\bdistricts?[\p{Zs}\t]+(?:of|attorney)\b',
    '(?i)\b(?:chancery|family|appellate|civil|criminal|king[\x27’]s[\p{Zs}\t]+bench|queen[\x27’]s[\p{Zs}\t]+bench)[\p{Zs}\t]+division\b|^[\s\p{P}]*(?:the[\p{Zs}\t]+)?divisions?[\p{Zs}\t]+of\b',
    # Short names that companies share count alone only: "the IRS", "SEC",
    # "ET", "EAT", "NASA", "BLM" (but "CMA CGM", "SEC Newgate").
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:U\.?S\.?[\p{Zs}\t]+)?(?:DOJ|IRS|FBI|DHS|HHS|FTC|FCC|FDA|EPA|DWP|FCA|CMA|SFO|DEA|ATF|FAA|NTSB|USDA|NIH|CDC|SEC|ICO|CPS|EAT|ET|NASA|BLM|STB|CEQ|USGS|AGFD|DPP|ChD|PBGC|ARRC)(?:[\x27’]s?)?[\s\p{P}]*$',
    # Codes and rules of law: "Bankruptcy Code", "Code of Federal
    # Regulations", "18 U.S.C.", "Civil Procedure Rules", "Federal Rules of
    # Evidence".
    '(?i)\b(?:bankruptcy|revenue|penal|civil|criminal|commercial|tax|labou?r|vehicle|insurance|professions|family|probate|evidence|procedure|government|administrative|federal|state|u\.[\p{Zs}\t]?s\.|united[\p{Zs}\t]+states|municipal|building|education|corporations|judicial|elections?|health[\p{Zs}\t]+and[\p{Zs}\t]+safety)[\p{Zs}\t]+code\b',
    # Recognized statutory subjects support a cut title across a wrap;
    # a following document heading "Act ..." alone is insufficient.
    '(?i)\b(?:freight[\p{Zs}\t]+safety|biometric[\p{Zs}\t]+(?:information[\p{Zs}\t]+)?privacy|data[\p{Zs}\t]+protection)[\p{Zs}\t]+act\b',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?code[\p{Zs}\t]+of\b',
    '(?i)(?:^|[\s\p{P}\p{N}])(?:u\.[\p{Zs}\t]?s\.[\p{Zs}\t]?c|c\.[\p{Zs}\t]?f\.[\p{Zs}\t]?r|u\.[\p{Zs}\t]?c\.[\p{Zs}\t]?c|ilcs)(?:[\s\p{P}]|$)',
    '(?i)\brules[\p{Zs}\t]+of[\p{Zs}\t]+(?:civil|criminal|evidence|appellate|professional|court|procedure)\b|\b(?:civil|criminal)[\p{Zs}\t]+procedure[\p{Zs}\t]+rules\b',
]
anywhere_in = ["ORG", "PERSON"]

# More public bodies, laws and treaties by their phrases, as an
# organization or a person (probe round 2 of issue #378). A legal form
# keeps a company ("Customs Brokers Inc", "Treaty Oak Capital LLC").
[[never]]
match = "pattern"
patterns = [
    # Customs alone, and the agency: "Customs", "U.S. Customs", "Customs
    # and Border Protection".
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:u\.[\p{Zs}\t]?s\.[\p{Zs}\t]+|united[\p{Zs}\t]+states[\p{Zs}\t]+|hm[\p{Zs}\t]+)?customs(?:[\p{Zs}\t]+(?:service|office|authorit(?:y|ies)))?[\x27’]?s?[\s\p{P}]*$',
    '(?i)\bcustoms[\p{Zs}\t]+(?:and|&)[\p{Zs}\t]+border[\p{Zs}\t]+protection\b',
    # Jails, and a grand jury that ends the span or is followed by its
    # jurisdiction: "Elko County Jail", "the Grand Jury", "the Ashmoor
    # County Grand Jury", "Grand Jury of Ashmoor County" ("Grand Jury
    # Games" stays). The Electoral College and the College of Policing.
    '(?i)\b(?:county|city|municipal|parish|state|federal)[\p{Zs}\t]+(?:jail|detention[\p{Zs}\t]+(?:center|centre|facility)|penitentiary)\b',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:\p{Alphabetic}+[\p{Zs}\t]+){0,2}grand[\p{Zs}\t]+jur(?:y|ies)(?:[\x27’]s?)?(?:[\p{Zs}\t]+(?:of|for|in[\p{Zs}\t]+and[\p{Zs}\t]+for)[\p{Zs}\t]+\S.*)?[\s\p{P}]*$',
    '(?i)\belectoral[\p{Zs}\t]+colleges?\b|\bcollege[\p{Zs}\t]+of[\p{Zs}\t]+policing\b',
    # Agencies' and intergovernmental bodies' short names as written, the
    # whole span or before their organ, adjectives allowed ("NATO", "the
    # IMF", "ICAO Council", "NATO Parliamentary Assembly", "IMF Executive
    # Board"; "Nato Venn" and "NATO Logistics" stay), and laws' and
    # treaties' short names as written, alone ("FLSA", "the FDCPA",
    # "CAFTA-DR").
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:USFWS|NMFS|ICAO|IMF|NATO|SIECA|CCAD)(?:[\x27’]s?)?(?:[\p{Zs}\t]+(?:\p{Uppercase}\p{Alphabetic}+[\p{Zs}\t]+){0,2}(?:Council|Assembly|Secretariat|Board|Committee|Commission|Command|Headquarters|Summit|Staff))?[\s\p{P}]*$',
    # Further named organs (#378); these end the name, so private names
    # such as "NATO Logistics" keep their spans.
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:NATO[\p{Zs}\t]+Land[\p{Zs}\t]+Group[\p{Zs}\t]+\d+|CAFTA-DR[\p{Zs}\t]+Secretariat)[\s\p{P}]*$',
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:FLSA|FDCPA|TCPA|DTPA|PHRA|NYDCL|ERISA|HIPAA|FMLA|ECHR|CAFTA-DR|CAFTA|NAFTA|USMCA)(?:[\x27’]s?)?[\s\p{P}]*$',
    # A court's division in a caption ("TEXARKANA DIVISION") and a state's
    # divisions ("Utah Division of Wildlife Resources").
    '\b\p{Uppercase}{2,}[\p{Zs}\t]+DIVISIONS?\b',
    '(?i)\bdivisions?[\p{Zs}\t]+of[\p{Zs}\t]+(?:wildlife|natural|motor|corporations|water|forestry|parks|fish|child|family|human|consumer|enforcement|insurance|securities|banking|labou?r|workers|unemployment|elections|revenue|taxation|state|public)\b',
    # A board or the Central Office alone: "the Board", "issued out of the
    # Central Office"; the Home Department ("Secretary of State for the
    # Home Department"); the Director of Public Prosecutions.
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:boards?|central[\p{Zs}\t]+office)[\x27’]?s?[\s\p{P}]*$',
    '(?i)\bhome[\p{Zs}\t]+department\b|\bdirector[\p{Zs}\t]+of[\p{Zs}\t]+public[\p{Zs}\t]+prosecutions\b',
    # Treaties, conventions and agreements by title: "Dunmere Trade
    # Agreement", "Agreement on Trade", "Lugano Convention", "Convention on
    # Human Rights", "Treaty of Rome", "Brussels I", the "Environment
    # Chapter" of a trade agreement ("Treaty Oak Capital" and "Ashmoor
    # Convention Center" stay).
    '(?i)\b(?:treat(?:y|ies)|conventions?|agreements?)(?:[\p{Zs}\t]+(?:on|of|for|between|against|establishing|relating)\b|[\s\p{P}]*$)',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:brussels|rome|lugano)[\p{Zs}\t]+(?:i{1,3}a?|iv|bis|recast)(?:[\p{Zs}\t]+(?:bis|recast|regulation|convention)s?)*[\s\p{P}]*$',
    '(?i)\b(?:environment(?:al)?|labou?r|investment|trade|dispute[\p{Zs}\t]+settlement|intellectual[\p{Zs}\t]+property)[\p{Zs}\t]+chapters?\b',
    # Rules of procedure and their citations: "Federal Rules of Bankruptcy
    # Procedure", "Tex. R. App. P.", "Fed. R. Civ. P.".
    '(?i)\brules[\p{Zs}\t]+of(?:[\p{Zs}\t]+\p{Alphabetic}+){1,3}[\p{Zs}\t]+(?:procedure|evidence|practice)\b',
    '(?i)(?:^|[\s\p{P}])r\.[\p{Zs}\t]?(?:app|civ|crim|evid|bankr)\.(?:[\p{Zs}\t]?p\.)?',
    # Laws whose head is "Law": "New York Executive Law", "Criminal
    # Procedure Law", "Debtor and Creditor Law" ("Quill Tax Law" may be a
    # firm, and stays).
    '(?i)\b(?:executive|criminal[\p{Zs}\t]+procedure|civil[\p{Zs}\t]+practice|penal|general[\p{Zs}\t]+obligations|general[\p{Zs}\t]+business|business[\p{Zs}\t]+corporation|debtor[\p{Zs}\t]+and[\p{Zs}\t]+creditor|real[\p{Zs}\t]+property|social[\p{Zs}\t]+services|public[\p{Zs}\t]+health|vehicle[\p{Zs}\t]+and[\p{Zs}\t]+traffic|environmental[\p{Zs}\t]+conservation|correction|judiciary|administrative[\p{Zs}\t]+procedure)[\p{Zs}\t]+law\b',
    # A bill by its number: "SB 8", "H.B. 1234".
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?[SHA]\.?[\p{Zs}\t]?B\.?[\p{Zs}\t]*\d{1,5}[\s\p{P}]*$',
    # Remaining public institutions in #378, in full only: a private
    # "Basel Committee Consulting" or "Research Laboratory Partners" stays.
    # Bank of England also names a private lender: correction requires
    # local public context rather than an unconditional never pattern.
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:federal[\p{Zs}\t]+deposit[\p{Zs}\t]+insurance[\p{Zs}\t]+corporation|national[\p{Zs}\t]+archives|basel[\p{Zs}\t]+committee|international[\p{Zs}\t]+monetary[\p{Zs}\t]+fund|corps[\p{Zs}\t]+of[\p{Zs}\t]+engineers|agricultural[\p{Zs}\t]+research[\p{Zs}\t]+service|soil[\p{Zs}\t]+conservation[\p{Zs}\t]+service|security[\p{Zs}\t]+authority|armaments[\p{Zs}\t]+cooperation[\p{Zs}\t]+division)(?:[\x27’]s?)?[\s\p{P}]*$',
    # Congressional committees, with the observed OCR "SUMCOMMITTEE";
    # field offices and research facilities with an institutional head. Only
    # the observed OCR spellings of Station and Research are accepted.
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:health|oversight)[\p{Zs}\t]+su[bm]committees?[\s\p{P}]*$',
    # "The Field Office" is a private trading name. Require the public
    # parent in the span; neither an article nor a place establishes one.
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:[\p{Alphabetic}\x27’.-]+[\p{Zs}\t]+){0,4}(?:(?-i:FBI|ICE|USCIS)|Social[\p{Zs}\t]+Security|Department|Agency|Bureau|Service)(?:[\x27’]s)?[\p{Zs}\t]+(?:[\p{Alphabetic}\x27’.-]+[\p{Zs}\t]+){0,4}field[\p{Zs}\t]+office[\s\p{P}]*$',
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*[\p{Zs}\t]+){1,3}(?i:(?:state[\p{Zs}\t]+)?experiment[\p{Zs}\t]+(?:statione?|ststion)|regional[\p{Zs}\t]+(?:research|reseerch)[\p{Zs}\t]+laboratory)[\s\p{P}]*$',
    # Agency regional offices and law enforcement units; an Office span
    # cut out of the latter is checked with the words before it.
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:(?:EPA|USFWS|FWS|BLM|USGS)(?:[\x27’]s)?[\p{Zs}\t]+)?(?i:regional[\p{Zs}\t]+office|law[\p{Zs}\t]+enforcement[\p{Zs}\t]+office)[\s\p{P}]*$',
    # A county's appraisal district, also abbreviated in the probe.
    '(?i)\b(?:county|cnty\.?)[\p{Zs}\t]+appraisal[\p{Zs}\t]+dist(?:rict\b|\.?(?:\s|$))',
    # The public units cut from their parents in #378: a county dispatch
    # or medical examiner and the pesticide registration division.
    '(?i)\b(?:county|city|municipal)[\p{Zs}\t]+(?:dispatch|medical[\p{Zs}\t]+examiner)(?:[\x27’]s)?(?:[\p{Zs}\t]+office)?[\s\p{P}]*$',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?fungicide-herbicide[\p{Zs}\t]+branch[\p{Zs}\t]+registration[\p{Zs}\t]+division[\s\p{P}]*$',
    # Statutory bodies under the reach decision (#484 item 4, #378): a
    # federal national laboratory, NHS trusts, port authorities and law
    # societies. Universities and colleges are exempt through `private`.
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*[\p{Zs}\t]+){1,4}(?:National[\p{Zs}\t]+Laboratory|Port[\p{Zs}\t]+Authority)[\s\p{P}]*$',
    # Up to four name words per side of one conjunction; each separator
    # may wrap once, never across a paragraph or an unbounded prose tail.
    '''(?x) ^[\p{Zs}\t\p{P}]* (?:[Tt]he[\p{Zs}\t]+)?
        (?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)){0,4}
        (?:(?:and|&)(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)
            (?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)){1,4})?
        NHS(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)
        (?:Foundation(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*))?Trust
        (?:(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)Hospital)?[\p{Zs}\t\p{P}]*$ ''',
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?Law[\p{Zs}\t]+Society[\p{Zs}\t]+of[\p{Zs}\t]+(?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*[\p{Zs}\t]*){1,4}[\s\p{P}]*$',
]
anywhere_in = ["ORG", "PERSON"]

# An ambiguous Field Office stays even when labelled PERSON: the generic
# `office` word above is not public ownership. Require a public parent in
# this same span before allowing any public-body veto.
[[private]]
patterns = ['(?i)^[\s\p{P}]*(?:[\p{Alphabetic}\x27’.-]+[\p{Zs}\t]+){0,6}field[\p{Zs}\t]+office[\s\p{P}]*$']
unless = ['(?i)\b(?:(?-i:FBI|ICE|USCIS)|social[\p{Zs}\t]+security|department|agency|bureau|service)\b']

# Universities and colleges are never public bodies, whoever owns them:
# a span that names one itself, after capitalized words only ("Ashmoor
# State University", "University of Ashmoor", "Ashmoor County Community
# College"; #484). "Ministry of Colleges and Universities" names none, and
# the Electoral College and the College of Policing are public bodies.
[[private]]
patterns = [
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:\p{Uppercase}[\p{Alphabetic}.\x27’&-]*[\p{Zs}\t]+){0,5}(?:University|College|UNIVERSITY|COLLEGE)\b',
]
unless = ['(?i)\belectoral[\p{Zs}\t]+college|\bcollege[\p{Zs}\t]+of[\p{Zs}\t]+policing\b']

# The same prosecutors and ministers within an organization's name
# ("Attorney General's Office", "Office of the Secretary of State").
[[never]]
match = "pattern"
patterns = [
    '(?i)\battorneys?[\p{Zs}\t-]+generals?\b|\bsecretary[\p{Zs}\t]+of[\p{Zs}\t]+state\b',
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:u\.[\p{Zs}\t]?s\.|united[\p{Zs}\t]+states|district|state[\x27’]?s?|county|city|prosecuting)[\p{Zs}\t]+attorneys?\b',
]
anywhere_in = ["ORG"]

# A bar number's label belongs to the number: the model's organization
# "Ohio State Bar" in "Ohio State Bar No. 0099911" grows to the whole of
# it, and the never pattern below takes it (#484, item 3; #483).
[[span]]
category = "ORG"
extend = [
    '\b(?:\p{Uppercase}[\p{Alphabetic}.]*[\p{Zs}\t]+){0,3}(?:Bar|BAR)[\p{Zs}\t]*(?:No\.?|NO\.?|Number|NUMBER|#)[\p{Zs}\t:#.]*\d+',
]

# An attorney's bar number with its label is no organization: the model's
# "Texas State Bar No. 12345" goes, and its number is IDENTITY by its label
# (the maintainer's decision on #484, item 3; #483).
[[never]]
match = "pattern"
patterns = ['(?i)\bbar[\p{Zs}\t]*(?:no\.?|number|#)[\p{Zs}\t:#.]*\d']
anywhere_in = ["ORG", "PERSON"]

# A country, state or city is a place, not an organization: alone, several
# together, or as both sides of a caption ("Pakistan", "Illinois", "United
# States", the "U.S." of "18 U.S.C.", "Boston", "Georgia v. Alabama"), and
# so are "State", "States" and "Federal" alone (guide rules 2 and 3, issue
# #478). Any other word keeps the name ("Bank of America", "State Street",
# "New York Life", "Georgia-Pacific", "The Republic of Tea"). So does a
# place after "State of", "Town of" and the like ("State of Ashmoria",
# "People of the State of …", "District of Columbia") and a county by its
# name ("Ashmoor County"). A person keeps these names ("Georgia Quill").
# Cities are the largest only: "Phoenix" or "Mobile" alone names a company
# as often.
[[never]]
match = "pattern"
patterns = [
    '''(?ix) ^[\s\p{P}]* (?: (?:
        the | of | and | v | vs | people | state | states | federal
        | commonwealth | nation | republic | kingdom | united[\p{Zs}\t]+states
        | united[\p{Zs}\t]+kingdom | united[\p{Zs}\t]+nations | america | usa
        | u\.[\p{Zs}\t]?s\.?(?:[\p{Zs}\t]?a\.?)? | us | uk | u\.[\p{Zs}\t]?k\.? | eu
        | european[\p{Zs}\t]+union | europe | great[\p{Zs}\t]+britain | britain
        | england | wales | scotland | northern[\p{Zs}\t]+ireland | ireland
        | d\.[\p{Zs}\t]?c\.?
        | alabama | alaska | arizona | arkansas | california | colorado
        | connecticut | delaware | florida | georgia | hawaii | idaho | illinois
        | indiana | iowa | kansas | kentucky | louisiana | maine | maryland
        | massachusetts | michigan | minnesota | mississippi | missouri | montana
        | nebraska | nevada | new[\p{Zs}\t]+hampshire | new[\p{Zs}\t]+jersey
        | new[\p{Zs}\t]+mexico | new[\p{Zs}\t]+york | north[\p{Zs}\t]+carolina
        | north[\p{Zs}\t]+dakota | ohio | oklahoma | oregon | pennsylvania
        | rhode[\p{Zs}\t]+island | south[\p{Zs}\t]+carolina | south[\p{Zs}\t]+dakota
        | tennessee | texas | utah | vermont | virginia | washington
        | west[\p{Zs}\t]+virginia | wisconsin | wyoming
        | district[\p{Zs}\t]+of[\p{Zs}\t]+columbia | puerto[\p{Zs}\t]+rico | guam
        | american[\p{Zs}\t]+samoa | virgin[\p{Zs}\t]+islands
        | northern[\p{Zs}\t]+mariana[\p{Zs}\t]+islands
        | afghanistan | albania | algeria | andorra | angola
        | antigua(?:[\p{Zs}\t]+and[\p{Zs}\t]+barbuda)? | argentina | armenia
        | australia | austria | azerbaijan | bahamas | bahrain | bangladesh
        | barbados | belarus | belgium | belize | benin | bermuda | bhutan
        | bolivia | bosnia(?:[\p{Zs}\t]+and[\p{Zs}\t]+herzegovina)? | botswana
        | brazil | brunei | bulgaria | burkina[\p{Zs}\t]+faso | burma | burundi
        | cabo[\p{Zs}\t]+verde | cape[\p{Zs}\t]+verde | cambodia | cameroon | canada
        | cayman[\p{Zs}\t]+islands | central[\p{Zs}\t]+african[\p{Zs}\t]+republic
        | chad | chile | china | colombia | comoros | congo | costa[\p{Zs}\t]+rica
        | côte[\p{Zs}\t]+d[\x27’]ivoire | ivory[\p{Zs}\t]+coast | croatia | cuba
        | cyprus | czechia | czech[\p{Zs}\t]+republic | denmark | djibouti
        | dominica | dominican[\p{Zs}\t]+republic | east[\p{Zs}\t]+timor
        | timor-leste | ecuador | egypt | el[\p{Zs}\t]+salvador
        | equatorial[\p{Zs}\t]+guinea | eritrea | estonia | eswatini | ethiopia
        | fiji | finland | france | gabon | gambia | germany | ghana | gibraltar
        | greece | greenland | grenada | guatemala | guinea | guinea-bissau
        | guyana | haiti | holland | honduras | hong[\p{Zs}\t]+kong | hungary
        | iceland | india | indonesia | iran | iraq | isle[\p{Zs}\t]+of[\p{Zs}\t]+man
        | israel | italy | jamaica | japan | jordan | kazakhstan | kenya
        | kiribati | korea | south[\p{Zs}\t]+korea | north[\p{Zs}\t]+korea | kosovo
        | kuwait | kyrgyzstan | laos | latvia | lebanon | lesotho | liberia
        | libya | liechtenstein | lithuania | luxembourg | macau | macao
        | macedonia | north[\p{Zs}\t]+macedonia | madagascar | malawi | malaysia
        | maldives | mali | malta | marshall[\p{Zs}\t]+islands | mauritania
        | mauritius | mexico | micronesia | moldova | monaco | mongolia
        | montenegro | morocco | mozambique | myanmar | namibia | nauru | nepal
        | netherlands | new[\p{Zs}\t]+zealand | nicaragua | niger | nigeria
        | norway | oman | pakistan | palau | palestine | panama
        | papua[\p{Zs}\t]+new[\p{Zs}\t]+guinea | paraguay | peru | philippines
        | poland | portugal | qatar | romania | russia | russian[\p{Zs}\t]+federation
        | rwanda | saint[\p{Zs}\t]+kitts(?:[\p{Zs}\t]+and[\p{Zs}\t]+nevis)?
        | saint[\p{Zs}\t]+lucia | saint[\p{Zs}\t]+vincent | samoa
        | san[\p{Zs}\t]+marino | são[\p{Zs}\t]+tomé | sao[\p{Zs}\t]+tome
        | saudi[\p{Zs}\t]+arabia | senegal | serbia | seychelles
        | sierra[\p{Zs}\t]+leone | singapore | slovakia | slovenia
        | solomon[\p{Zs}\t]+islands | somalia | south[\p{Zs}\t]+africa
        | south[\p{Zs}\t]+sudan | spain | sri[\p{Zs}\t]+lanka | sudan | suriname
        | sweden | switzerland | syria | taiwan | tajikistan | tanzania | thailand
        | togo | tonga | trinidad | tobago | tunisia | turkey | türkiye
        | turkmenistan | tuvalu | uganda | ukraine
        | united[\p{Zs}\t]+arab[\p{Zs}\t]+emirates | uae | uruguay | uzbekistan
        | vanuatu | vatican | venezuela | vietnam | yemen | zambia | zimbabwe
        | new[\p{Zs}\t]+york[\p{Zs}\t]+city | los[\p{Zs}\t]+angeles | chicago
        | houston | philadelphia | san[\p{Zs}\t]+antonio | san[\p{Zs}\t]+diego
        | dallas | san[\p{Zs}\t]+jose | austin | jacksonville
        | san[\p{Zs}\t]+francisco | indianapolis | seattle | denver | boston
        | detroit | nashville | memphis | baltimore | milwaukee | albuquerque
        | tucson | fresno | sacramento | atlanta | miami | oakland | minneapolis
        | cleveland | new[\p{Zs}\t]+orleans | pittsburgh | st\.?[\p{Zs}\t]+louis
        | cincinnati | tampa | honolulu | las[\p{Zs}\t]+vegas
        | salt[\p{Zs}\t]+lake[\p{Zs}\t]+city | kansas[\p{Zs}\t]+city | newark
        | omaha | raleigh | charlotte | london | manchester | birmingham | leeds
        | liverpool | bristol | sheffield | newcastle | nottingham | leicester
        | cardiff | edinburgh | glasgow | belfast | southampton | coventry | paris
        | berlin | moscow | tokyo | beijing | toronto | sydney | dublin | brussels
        | geneva
    ) (?:[\s\p{P}]+|$) )+ $''',
    '^[\s\p{P}]*(?i:the[\p{Zs}\t]+)?(?i:people[\p{Zs}\t]+of[\p{Zs}\t]+(?:the[\p{Zs}\t]+)?)?(?i:state|states|commonwealth|city|town|village|borough|county|township|parish|district)[\p{Zs}\t]+(?i:of)[\p{Zs}\t]+(?i:the[\p{Zs}\t]+)?\p{Uppercase}[^\s\p{P}]*(?:[\p{Zs}\t]+\p{Uppercase}[^\s\p{P}]*){0,2}[\s\p{P}]*$',
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*[\p{Zs}\t]+){1,3}(?i:county|parish|township|borough)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# A place's name after "City of", "Town of" and the like belongs to it, so
# the place goes whole: the model's "Brindle" in "Town of Brindle", as an
# organization (issue #478).
[[span]]
category = "ORG"
extend = [
    '\b(?:City|Town|Village|Borough|County|Township|Parish|State|Commonwealth)[\p{Zs}\t]+of[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*)?',
]

# The same for a person: "Town of Plymouth" names no one (issue #478).
[[span]]
category = "PERSON"
extend = [
    '\b(?:City|Town|Village|Borough|County|Township|Parish|State|Commonwealth)[\p{Zs}\t]+of[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*)?',
]

# A place after "State of", "Town of" and the like is no person
# (issue #478).
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:the[\p{Zs}\t]+)?(?:city|town|village|borough|county|township|parish|state|commonwealth)[\p{Zs}\t]+of[\p{Zs}\t]',
]
anywhere_in = ["PERSON"]

# The second word of a two-word place is no one: the model's "York" in "New
# York" grows to the place, which goes ("San Francisco", "St. Louis",
# "North Carolina"; guide rule 1, issue #500). "John York" stays a person.
[[span]]
category = "PERSON"
extend = [
    '\b(?:New[\p{Zs}\t]+(?:York(?:[\p{Zs}\t]+City)?|Jersey|Hampshire|Mexico|Orleans|Zealand)|San[\p{Zs}\t]+(?:Francisco|Diego|Jose|José|Antonio|Marino)|Los[\p{Zs}\t]+Angeles|Las[\p{Zs}\t]+Vegas|St\.?[\p{Zs}\t]+Louis|Saint[\p{Zs}\t]+Louis|Hong[\p{Zs}\t]+Kong|Rhode[\p{Zs}\t]+Island|(?:North|South)[\p{Zs}\t]+(?:Carolina|Dakota)|West[\p{Zs}\t]+Virginia|Salt[\p{Zs}\t]+Lake[\p{Zs}\t]+City|Kansas[\p{Zs}\t]+City|Sri[\p{Zs}\t]+Lanka|Costa[\p{Zs}\t]+Rica|Puerto[\p{Zs}\t]+Rico|El[\p{Zs}\t]+Salvador|Saudi[\p{Zs}\t]+Arabia|Sierra[\p{Zs}\t]+Leone)\b',
]

# The same places whole are no person either, unless a title makes the
# place a surname ("Ms St. Louis").
[[never]]
match = "pattern"
patterns = [
    '^[\s\p{P}]*(?:[Tt]he[\p{Zs}\t]+)?(?:New[\p{Zs}\t]+(?:York(?:[\p{Zs}\t]+City)?|Jersey|Hampshire|Mexico|Orleans|Zealand)|San[\p{Zs}\t]+(?:Francisco|Diego|Jose|José|Antonio|Marino)|Los[\p{Zs}\t]+Angeles|Las[\p{Zs}\t]+Vegas|St\.?[\p{Zs}\t]+Louis|Saint[\p{Zs}\t]+Louis|Hong[\p{Zs}\t]+Kong|Rhode[\p{Zs}\t]+Island|(?:North|South)[\p{Zs}\t]+(?:Carolina|Dakota)|West[\p{Zs}\t]+Virginia|Salt[\p{Zs}\t]+Lake[\p{Zs}\t]+City|Kansas[\p{Zs}\t]+City|Sri[\p{Zs}\t]+Lanka|Costa[\p{Zs}\t]+Rica|Puerto[\p{Zs}\t]+Rico|El[\p{Zs}\t]+Salvador|Saudi[\p{Zs}\t]+Arabia|Sierra[\p{Zs}\t]+Leone)[\s\p{P}]*$',
]
anywhere_in = ["PERSON"]
unless_titled = true

# A caption's opening words stay outside a party's span: "In re Quill", "In
# the Matter of Quill", "Ex parte Quill" and its short "Ex p Quill" are
# "Quill" (guide rule 1, issue #500).
[[span]]
category = "PERSON"
trim = ["in re", "in the matter of", "ex parte", "ex p"]

# The same for an organization ("In re Quillon Freight LLC").
[[span]]
category = "ORG"
trim = ["in re", "in the matter of", "ex parte", "ex p"]

# English legal forms mark a manual selection as an organization
# ("Acme Ltd.").
[[shape]]
category = "ORG"
guess_words = ["LLC", "LLP", "Ltd", "Inc", "Corp", "Co", "PLC"]

# "U.S." and "U.K." alone are a country, never a company or a person: "527
# U.S. 706", "U.S. District Court" (guide rules 1, 2 and 8, issue #499).
# "U.S. Bank" keeps its name.
[[shape]]
category = "ORG"
forbid = ['^\s*U\.\s?[SK]\.(?:\s?A\.)?\s*$']

# The same as a person.
[[shape]]
category = "PERSON"
forbid = ['^\s*U\.\s?[SK]\.(?:\s?A\.)?\s*$']

# Fictitious parties are placeholders, never marked (guide rule 8, the
# maintainer's decision on #484, item 1): "John Doe", "Jane Does 1-25",
# "Richard Roe", "DOE SUPERVISORS I-X", "DOE MEDICAL STAFF I-X", "ROE
# ENTITIES", "DOES I through X", and a bare range after them ("I-X",
# "1-25"). Role words are listed, so "Doe Run Company" stays a company.
# Alone, a placeholder is in capitals or plural ("DOE", "ROE", "the
# Does"): "Mr Doe", "J. Doe" and "Samuel Doe" stay people.
[[shape]]
category = "PERSON"
forbid = [
    '^[\s\p{P}]*(?:DOES?|ROES?|Does|Roes)[\s\p{P}]*$',
    '^[\s\p{P}]*(?i:john|jane|richard|mary)[\p{Zs}\t]+(?i:does?|roes?)(?:[\p{Zs}\t]+(?i:defendants|entities|corporations|companies|businesses|individuals|persons|officers|supervisors|employees|agents|deputies|medical|staff|nurses|doctors|physicians|partnerships|insurers|contractors|guards|correctional|members|parties)){0,3}(?:[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))?[\s\p{P}]*$',
    '^[\s\p{P}]*(?i:does?|roes?)(?:(?:[\p{Zs}\t]+(?i:defendants|entities|corporations|companies|businesses|individuals|persons|officers|supervisors|employees|agents|deputies|medical|staff|nurses|doctors|physicians|partnerships|insurers|contractors|guards|correctional|members|parties)){1,3}(?:[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))?|[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))[\s\p{P}]*$',
    '^[\s\p{P}]*(?:[IVXLC]{1,6}|\d{1,3})[\p{Zs}\t]*(?:[-–]|(?i:through|thru))[\p{Zs}\t]*(?:[IVXLC]{1,6}|\d{1,3})[\s\p{P}]*$',
]

# The same placeholders as an organization.
[[shape]]
category = "ORG"
forbid = [
    '^[\s\p{P}]*(?:DOES?|ROES?|Does|Roes)[\s\p{P}]*$',
    '^[\s\p{P}]*(?i:john|jane|richard|mary)[\p{Zs}\t]+(?i:does?|roes?)(?:[\p{Zs}\t]+(?i:defendants|entities|corporations|companies|businesses|individuals|persons|officers|supervisors|employees|agents|deputies|medical|staff|nurses|doctors|physicians|partnerships|insurers|contractors|guards|correctional|members|parties)){0,3}(?:[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))?[\s\p{P}]*$',
    '^[\s\p{P}]*(?i:does?|roes?)(?:(?:[\p{Zs}\t]+(?i:defendants|entities|corporations|companies|businesses|individuals|persons|officers|supervisors|employees|agents|deputies|medical|staff|nurses|doctors|physicians|partnerships|insurers|contractors|guards|correctional|members|parties)){1,3}(?:[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))?|[\p{Zs}\t]+(?:\d{1,3}(?:[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*\d{1,3})?|[IVXLCl\d]{1,6}[\p{Zs}\t]*(?:[-–]|(?i:through|thru|to))[\p{Zs}\t]*[IVXLC\d]{1,6}))[\s\p{P}]*$',
    '^[\s\p{P}]*(?:[IVXLC]{1,6}|\d{1,3})[\p{Zs}\t]*(?:[-–]|(?i:through|thru))[\p{Zs}\t]*(?:[IVXLC]{1,6}|\d{1,3})[\s\p{P}]*$',
]

# A tax year is a period, no tax number: "2014/15", "2029-30" (guide rule
# 4, issue #480).
[[shape]]
category = "TAX"
forbid = ['^\s*(?:19|20)\d{2}\s*[/–-]\s*(?:\d{2}|(?:19|20)\d{2})\s*$']

# So is a year alone, or years joined by a word: "for the years 2013
# through 2016", "In March 2023", "2029 and 2030" (guide rule 4, #480). No
# tax number has four digits.
[[shape]]
category = "TAX"
forbid = ['^\s*(?:19|20)\d{2}(?:\s*(?:,|&|and|through|thru|to|[–-])\s*(?:19|20)\d{2})*\s*$']

# A court's docket number is no tax, bank or identity value, whatever the
# model guessed, but a case number (guide rule 5, #480): a Texas appeal's
# "01-24-00779-CV", a federal "1:21-cv-00616-RP", a New York "02 CV 3651",
# a bankruptcy case's "15-49008-wsd" with its judge's initials, "No." or a
# running header's entry ("15-49008-wsd Doc 19-1") left out. Whatever its
# label ("NUMBER", "Docket:", "Cause Number", "Civil Action", "Index #",
# "Adv. No.") or none, the model's span stays hidden as CASE; a cited
# case's docket goes with its citation, and a running header's with the
# header (the references below, #506 item 3). An EIN's "98-7654321" has
# seven digits after its dash, an account's "12-34567-890" no letters, and
# both stay.
[[shape]]
category = "TAX"
case = [
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{2}-\d{5}-C[VR])\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d:\d{2}-[a-z]{2,3}-\d{3,6}(?:-[A-Za-z]{1,4})*)\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}[\p{Zs}\t-](?:CV|Civ\.|CIV|cv)[\p{Zs}\t-]\d{3,6})\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{5}-[a-z]{2,4})(?:[\p{Zs}\t]+Doc\.?[\p{Zs}\t]+\d+(?:-\d+)?)?\s*$',
]

# The same as bank details.
[[shape]]
category = "BANK"
case = [
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{2}-\d{5}-C[VR])\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d:\d{2}-[a-z]{2,3}-\d{3,6}(?:-[A-Za-z]{1,4})*)\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}[\p{Zs}\t-](?:CV|Civ\.|CIV|cv)[\p{Zs}\t-]\d{3,6})\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{5}-[a-z]{2,4})(?:[\p{Zs}\t]+Doc\.?[\p{Zs}\t]+\d+(?:-\d+)?)?\s*$',
]

# The same as an identity document's number.
[[shape]]
category = "IDENTITY"
case = [
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{2}-\d{5}-C[VR])\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d:\d{2}-[a-z]{2,3}-\d{3,6}(?:-[A-Za-z]{1,4})*)\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}[\p{Zs}\t-](?:CV|Civ\.|CIV|cv)[\p{Zs}\t-]\d{3,6})\s*$',
    '^\s*(?:No\.\s*)?(?P<case>\d{2}-\d{5}-[a-z]{2,4})(?:[\p{Zs}\t]+Doc\.?[\p{Zs}\t]+\d+(?:-\d+)?)?\s*$',
]

# An English name of an organization is in title case or carries a legal
# form; words in sentence case are a document kind, a heading or a team
# ("Distribution register", "Lasting power of attorney", "Accounts team").
[[shape]]
category = "ORG"
forbid = ['^\s*[A-Z][a-z]+(?:\s+[a-z]+)+\s*$']

# Dates with an English month name: "12 March 2026" (a Russian "г." after
# the year still counts) and "March 12, 2026"; and a day, a month or its
# short form and a two- or four-digit year, as a sanctions list gives a
# date of birth ("3 Jun 61", "3 Sept. 1961"; #363), its parts joined by
# hyphens too ("03-Jun-61", "03-Jun-1961").
[[shape]]
category = "DATE"
guess = [
    '(?i)\s*[«"]?(?:\d{1,2}|(?:\\?_)+)[»"]?\s+(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+(?:\d{4}|(?:\\?_)+)(?:\s*(?:г\.?|года))?\s*',
    '(?i)\s*(?:january|february|march|april|may|june|july|august|september|october|november|december)\s+\d{1,2},?\s+\d{4}\s*',
    '(?i)\s*\d{1,2}\s+(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\.?\s+(?:\d{2}|\d{4})\s*',
    '(?i)\s*\d{1,2}-(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)-(?:\d{2}|\d{4})\s*',
]

# Claim and case numbers after their label (ADR 0092): "Claim No.
# 6001842/2026", "**Case number:** 2026/314", "Case No. 1:26-cv-01234-JAB",
# "Claim No CL-2026-000123". The value is the whole identifier. Statute,
# article and clause numbers have no such label and stay unmarked. A value
# needs four digits: the review proposes a wording everywhere it appears,
# and "Claim No. 12" would mark "article 12" too. A date is not one.
[[context]]
category = "CASE"
labels = [
    "claim no", "claim number", "case no", "case number", "proceedings no",
    "proceedings number", "proceedings are numbered",
]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# "case" alone is also a common word ("in case 30 days pass", "in case
# 2026-03-12 is a holiday"): after it only a number with a separator, or of
# five digits or more, is a case number ("case 202-555-0169"), never after
# "in", "just" and the like, and never a date.
[[context]]
category = "CASE"
labels = ["case"]
between = '[\p{Zs}\t:№#]{1,4}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)+|\d{5,}'
min_digits = 4
unless_after = ["in", "just", "any", "each", "every", "worst", "best", "upper", "lower", "test", "use"]
unless_guessed = ["DATE"]

# US caption labels for the document's own case number (guide rule 5, issue
# #364), in any letter case: "CIVIL ACTION NO.: 4:31-cv-2999", "§ CIVIL
# ACTION NO. 5:31-cv-999" (a Texas caption's column of "§", which may also
# stand between the label and the number), "Civil Action No. 31-2999 (ZZ)"
# (the judge's initials in brackets stay outside), "Civil Docket No.
# 1:31-cv-00999", "C.A. No. 2031-0999", "Trial Court No. Q2031999", "Cause
# No. 2031-12345", "cause number 09-31-00999-CV". A related proceeding of
# the same parties is CASE too: "Adv. Pro. No. 31-01992" (#506 item 3). Four
# digits, as above; a precedent's docket number goes with its citation
# (#506 item 3, `correct`). "good cause" and the like are no label, and
# "C.A." inside "U.S.C.A." is none either (code). A period stays inside
# the value only before a digit: "31-2999.The" (OCR) is "31-2999". The
# number may stand on the label's next line ("CIVIL ACTION NO.:", then
# "§ 4:31-cv-2999"), never after a blank one.
[[context]]
category = "CASE"
labels = [
    "civil action no", "civil action number", "civ. action no", "civ. a. no",
    "civ. no", "c.a. no", "civil docket no", "civil docket number",
    "trial court no", "trial court number", "cause no", "cause number",
    "adv. pro. no", "adv. proc. no", "adversary proceeding no",
    "adversary proceeding number", "adversary no",
]
between = '[\p{Zs}\t:*_№#.§]{1,8}|[\p{Zs}\t:*_№#.§]{0,8}\r?\n[\p{Zs}\t*_§]{0,8}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:][\p{Alphabetic}\p{N}]+|\.\d[\p{Alphabetic}\p{N}]*)*'
min_digits = 4
unless_guessed = ["DATE"]
unless_after = ["good", "probable", "reasonable", "sufficient", "just", "without"]

# "Docket No." (issue #364): "Docket No.: 1:31-cv-04731-QL", "Docket No.
# A-1234-30", "Docket No. 2031-0099". A docket's entries are numbered too,
# with their attachments ("Docket No. 45", "(Docket No. 112-15)", "Docket
# No. 1045-3, at 4", "(Docket No. 10452)"), so only a case number's shape:
# a year and a space before "CV"; a letter or a colon in it; or two to
# four digits, a hyphen and four digits or more. A date has none of them
# ("Docket No. 03-01-2031").
[[context]]
category = "CASE"
labels = ["docket no", "docket number"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}[\p{Zs}\t]?(?:CV|cv|Cv|CIV|Civ|civ)[\p{Zs}\t]?\d{3,}|(?:\p{Alphabetic}+[-/:]?)+\d[\p{Alphabetic}\p{N}]*(?:[-/:][\p{Alphabetic}\p{N}]+)*|\d\p{N}*(?:[-/]\p{N}+)*(?::|[-/]?\p{Alphabetic})[\p{Alphabetic}\p{N}]*(?:[-/:][\p{Alphabetic}\p{N}]+)*|\d{2,4}-\d{4,}(?:-[\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# New York's "Index No." (issue #364; an earlier index number of the same
# parties too, #506 item 3): "INDEX NO. 31 CV99999" (a year, a space and
# "CV"), "Index No. 652134/2031" (the number and its year), "Index No.
# EF2031-001234", or a bare number of five digits or more. An index of
# prices or statistics has none of these shapes ("Consumer Price Index No.
# 2031-03").
[[context]]
category = "CASE"
labels = ["index no", "index number"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}[\p{Zs}\t]?(?:CV|cv|Cv|CIV|Civ|civ)[\p{Zs}\t]?\d{3,}|\d{3,}/\d{2,4}|\p{Alphabetic}{1,4}-?\d\p{N}*(?:[-/][\p{Alphabetic}\p{N}]+)*|\d{2,4}-\d{4,}|\d{5,}'
min_digits = 4
unless_guessed = ["DATE"]

# A Texas appeal's own caption (issue #364): "No. 02-31-00999-CV" on a line
# of its own at the top. "No." is a common word, so only as a line's first
# word, never right after a line ending in a comma (a wrapped citation,
# "Grant v. Finecy,\nNo. 02-23-00310-CV, 2031 Tex. App. LEXIS 1234"; code),
# and only before the appellate shape: the court, the year, five digits
# and "CV" or "CR". The same number in a precedent's citation is unmarked
# (#506 item 3).
[[context]]
category = "CASE"
labels = ["no"]
between = '\.?[\p{Zs}\t]{1,4}'
value = '\d{2}-\d{2}-\d{5}-C[VR]'
line_start = true

# An agency's charge number after "#" or "No." (#553 item 5): "Charge of
# Discrimination (#460-2031-01234)", "EEOC Charge No. 460-2031-01234".
# These labels name the agency's charge, so any number with a separator,
# never a date.
[[context]]
category = "CASE"
labels = ["charge of discrimination", "eeoc charge"]
between = '[\p{Zs}\t]*\(?[\p{Zs}\t]*(?:#|[Nn]o\.?|NO\.?|[Nn]umber|NUMBER)[\p{Zs}\t:.#]{0,3}'
value = '(?:\p{Alphabetic}+[-/:]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:][\p{Alphabetic}\p{N}]+|\.\d[\p{Alphabetic}\p{N}]*)+'
min_digits = 4
unless_guessed = ["DATE"]

# "charge" alone is a card's, a bill's or a phone line's word too ("billed
# for charge #4532-0151-1283-0366", "this charge No. 555-201-4477", a
# "| Charge |" column of amounts), so after it only the EEOC's own shape:
# the office's two or three digits (a state agency's letter after them),
# the year and five digits ("Charge No. 460-2031-01234").
[[context]]
category = "CASE"
labels = ["charge"]
between = '[\p{Zs}\t]*\(?[\p{Zs}\t]*(?:#|[Nn]o\.?|NO\.?|[Nn]umber|NUMBER)[\p{Zs}\t:.#]{0,3}'
value = '\d{2,3}[A-Z]?-(?:19|20)\d{2}-\d{5}'
min_digits = 4

# A bankruptcy case's own number after its label (guide rule 5, #480):
# "Bankruptcy No. 15-49008-wsd", "Bankr. Case No. 15-49008". The labels
# above (#364) cover the other captions; a bare "No." in running text is a
# cited case's (#506 item 3). A model span in a docket shape becomes CASE
# anyway (the shapes' `case` patterns).
[[context]]
category = "CASE"
labels = ["bankruptcy no", "bankruptcy case no", "bankr. no", "bankr. case no"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}-\d{5}(?:-[a-z]{2,4})?'
min_digits = 4

# A bank account after its label, whatever the model guessed: "**Bank
# account:** 47-29-16/00318572" (sort code and account number, a slash or a
# space between), an IBAN, or a run of 8–20 digits. The label decides, so a
# slash is fine here though the BANK shape refuses it in an unlabelled span.
[[context]]
category = "BANK"
labels = [
    "bank account", "account number", "account no", "sort code", "iban", "acct",
    "a/c",
]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}-\d{2}-\d{2}(?:[/\p{Zs}]\d{6,10})?|[A-Z]{2}\d{2}[A-Z0-9]{11,30}|\d{8,20}'
min_digits = 6

# A passport's number after its label (guide rule 6, #381): "Passport:
# 123456789", "Passport No. C01234567", up to two capitals then six to
# nine digits, or eight to ten digits, OCR letters as above but never
# first: "Passport No1234567" and "Passport: lo123456" are words. "Passport:
# pending" and a date after the label give nothing.
[[context]]
category = "IDENTITY"
labels = ["passport", "passport number", "passport no"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '(?-i:[A-Z]{1,2})\d[0-9OoIlB]{5,8}|\d[0-9OoIlB]{7,9}'
min_digits = 6

# A US Social Security number identifies a person, like СНИЛС, so it is
# IDENTITY after its label, whatever its check (guide rule 6, the
# maintainer's decision on #381): "SSN: 123-45-6789", "SSN # …", "S.S.N.
# …", "Social Security No. …", "Social Security Number: …". Three, two
# and four digits, dashes or spaces between them or none, the last group
# a digit short or long only when the groups are apart (so a bare ten-digit
# phone, "Social Security: 8007721213", is no SSN), nine digits grouped in
# threes ("123 456 789"), OCR letters for digits ("l23-45-67B9"), after a
# bracketed label ("Social Security Number (SSN): …"), also in
# the next cell of a table's row ("| SSN | 123-45-6789 |"). The model's
# TAX guess on the value gives way. An EIN ("12-3456789"), a TIN
# and an ITIN stay TAX, and "Social Security Administration" gives
# nothing.
[[context]]
category = "IDENTITY"
labels = [
    "ssn", "ssn no", "ssn number", "s.s.n", "social security",
    "social security no", "social security number",
]
between = '[\p{Zs}\t:*_№#.|)]{1,8}'
value = '[0-9OoIlB]{3}[\p{Zs}-][0-9OoIlB]{2}[\p{Zs}-][0-9OoIlB]{3,5}|[0-9OoIlB]{3}[\p{Zs}-]?[0-9OoIlB]{2}[\p{Zs}-]?[0-9OoIlB]{4}|[0-9OoIlB]{8,9}|[0-9OoIlB]{3}[\p{Zs}-][0-9OoIlB]{3}[\p{Zs}-][0-9OoIlB]{3}'
min_digits = 7

# A payment card's number after its label is bank details (guide rule 6,
# #381), whatever its Luhn check: "Card number: 4111 1111 1111 1112",
# sixteen digits in fours, a digit fewer or more in the last group, or
# thirteen to nineteen together. "Credit card fees of $1,250" and a card's
# last four digits ("card ending 1234") give nothing.
[[context]]
category = "BANK"
labels = [
    "card number", "card no", "credit card", "credit card number", "credit card no",
    "debit card", "debit card number", "debit card no",
]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '[0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{3,5}|[0-9OoIlB]{13,19}'
min_digits = 12

# "Card" alone names many cards: only a payment card's four groups follow
# it ("card 4111 1111 1111 1111"), never an ID, a SIM, a loyalty, a
# membership, a gift, a green or a health card's number, nor a run of
# digits ("SIM card 8901260123456789012").
[[context]]
category = "BANK"
labels = ["card"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '[0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{4}[\p{Zs}\t-][0-9OoIlB]{3,5}'
min_digits = 12
unless_after = ["id", "sim", "loyalty", "membership", "gift", "green", "health"]

# A staff or member ID after its label, even one of letters only
# ("**Staff ID:** VELK-QUEN", "Employee ID: TERN-WISP"): capitals or digits
# in hyphenated parts, or letters then digits. Never a person.
[[context]]
category = "IDENTITY"
labels = [
    "staff id", "staff number", "employee id", "employee number", "member id",
    "membership number", "badge number",
]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '[A-Z0-9]{2,}(?:-[A-Z0-9]{2,})+|[A-Z]{1,4}\d{3,}'

# A badge after "badge" alone is one person's too ("provided badge 88ZZ",
# #499): digits then capitals, capitals then digits, or a bare number of
# three digits or more. A word after the label ("badge holders") is none.
[[context]]
category = "IDENTITY"
labels = ["badge", "badge no", "badge id"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2,}[A-Z]{1,4}|[A-Z]{1,4}\d{2,}|\d{3,}'
min_digits = 2

# A number assigned to one person is IDENTITY, the value only (guide rule
# 6, the maintainer's decision on #484, item 3; #483): an attorney's bar
# number and a police officer's shield number after their label ("Ohio
# State Bar No. 0099911", "Pa. Bar # 99911", "Bar No.: 12345", "Bar Roll
# No. 4471", "Shield No. 9912"). The whole labels are listed for a table
# column headed by one ("| Bar No |").
[[context]]
category = "IDENTITY"
labels = [
    "bar", "shield", "bar no", "bar number", "state bar no", "state bar number",
    "shield no", "shield number",
]
between = '[\p{Zs}\t]*(?:[Nn]o\.?|NO\.?|[Nn]umber|NUMBER|#|ID|[Rr]oll[\p{Zs}\t]+[Nn]o\.?|ROLL[\p{Zs}\t]+NO\.?)[\p{Zs}\t:*_#.]{0,6}'
value = '[A-Z]{0,3}\d{3,10}(?:-\d{1,4})?'
min_digits = 3

# The same numbers by their own abbreviations: "SBN 299911" (California),
# "ARDC No. 6299911" (Illinois).
[[context]]
category = "IDENTITY"
labels = ["sbn", "ardc", "ardc no"]
between = '[\p{Zs}\t:*_#.]{1,6}(?:[Nn]o\.?[\p{Zs}\t:]*)?'
value = '\d{3,10}'
min_digits = 3

# A bar code in brackets after an attorney's "Esq.": "ROWAN PELL, ESQ.
# (RP9911)" (#483).
[[context]]
category = "IDENTITY"
labels = ["esq"]
between = '\.?,?[\p{Zs}\t]*\('
value = '[A-Z]{2,3}-?\d{3,7}'
min_digits = 3

# Addresses (ADR 0092, issues #361, #498): from the first element, a
# building name included, to the postcode or town: "Flat 3, 41 Larch Road,
# Bristol BS6 9ZY", "123 Main Street, Apt 4, Boston, MA 02110", "27 Wisp
# Lane<br>Norwich NR2 8ZZ". Two elements at least, so a number before "High
# Court" alone is not an address. The first alternative that matches wins,
# so a flat comes before a town, and a whole postcode before a town ("M1
# 1AA" is no town "M1"); two places (a village and its county) come only
# before a postcode. A town may start with "St." or "Ft." ("St. Albans"),
# run to three words ("Salt Lake City", "Bury St Edmunds"), have "upon" in
# it ("Newcastle upon Tyne") and end in "AFB" (an air force base). Within a
# part only spaces and tabs separate words: a town ends at the end of its
# line ("Bristol", not "Bristol\nJohn").
#
# From PDF and text layers (#498): the "City, ST ZIP" or "Town POSTCODE"
# line may sit under the street with no comma ("1800 S RIO VERDE
# AVENUE\nBRANWICK, CO  81999", "Harrow House, 12 Pellin Street\nSlocombe
# SL9 9ZZ"); after a line break, or in capitals, a town needs its
# postcode. A flat, suite, floor, building or room may come before the
# street or, up to three, after it, on its line or the next ("1023 15th
# Street, N.W., 10th Floor", "12 Oak Road\nSuite 210\nLeeds LS1 4AB");
# a building name ("Harrow House", "Ardley Building") before it, on its own
# line or not. Not "Chambers", "Hall" or "Lodge", which are surnames too,
# nor "Center", the end of many an organization's name: the model's name
# across the address's edge would cost the whole address. A street name
# may have a compass part or an initial with its period ("4410 W. Quarry
# Parkway", "1625 L. Street, NW", "2121 Quillon Ave. N.W."), an ordinal
# ("15th Street") and be in capitals. Without a house number a street
# needs a building name before it ("Brindle House, Brindle Road") or its
# postcode after it ("Strand, Slocombe, WC2A 9ZZ", "One Pellin Place,
# Brindlecombe, GA 30999"). A US state may be spelled out or dotted before
# its ZIP, which may wrap to the next line ("Brindlecombe, Georgia 30999",
# "Wexford D.C. 20999"). A country after the postcode is no part of it
# ("Slocombe SL9 7ZZ, UK"). A town with its postcode alone waits for #506.
# Suite separators may be a space or hyphen; a town after only a space
# needs a postcode, or the explicit end "Township". A word-number house
# (One through Ten) still needs a street suffix. A single-word numbered
# street needs a unit after it, so a numbered name alone is not an address.
# A box can replace the street or follow it, never an intervening Attn name.
#
# The model reads a building's name before a house number as a company
# ("Harrow House" of "Harrow House, 12 Pellin Street\nSlocombe SL9
# 9ZZ"): a company span that is just the match's building name, with a
# comma or a line break and a house number (a flat or suite between) after
# it, within the match, is the address's own (`absorbs`): the match stands
# over it, and the review takes the address, or the company where it turns
# the address down. A company named so but with no
# street after it ("Harrow House Ltd agreed", "Harrow House agreed") or
# not ending in a building word ("Tower Records") stays a company.
[[span]]
category = "ADDRESS"
pattern = '(?:(?:(?:{flat}|{building})(?:{sep}|{nl})){1,3}{street}(?:(?:{sep}|{nl}|[\p{Zs}\t]+|[\p{Zs}\t]*-[\p{Zs}\t]*){flat}){0,3}|{street}(?:(?:{sep}|{nl}|[\p{Zs}\t]+|[\p{Zs}\t]*-[\p{Zs}\t]*){flat}){1,3}|\b\d+[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*(?:{sep}|[\p{Zs}\t]*-[\p{Zs}\t]*){flat}|(?:{flat}(?:{sep}|{nl})){0,2}{building}(?:{sep}|{nl}){named}(?:(?:{sep}|{nl}){flat}){0,3})(?:{after})?|{street}(?:(?:{sep}|{nl}|:[\p{Zs}\t]*|[\p{Zs}\t]+){box})?{after}|{box}{after}|{named}(?:(?:{sep}|\s+){postcode}|(?:{sep}|{nl}|[\p{Zs}\t]+)(?:{town}|{caps_town})(?:{sep}(?:{town}|{caps_town}))?(?:{sep}|\s+){postcode})'
parts.after = '(?:{sep}|\s+){postcode}|(?:{sep}|{nl}|[\p{Zs}\t]+)(?:{town}|{caps_town})(?:{sep}(?:{town}|{caps_town}))?(?:{sep}|\s+){postcode}|[\p{Zs}\t]+(?:\p{Uppercase}[\p{Ll}\x27’-]+[\p{Zs}\t]+){1,2}Township\b|{sep}{town}'
parts.box = '\b(?i:P\.?[\p{Zs}\t]*O\.?[\p{Zs}\t]+Box)[\p{Zs}\t]+\d+[A-Za-z]?\b'
parts.flat = '\b(?:(?:Flat|Unit|Apartment|Suite|Room|Floor|Building|FLAT|UNIT|APARTMENT|SUITE|ROOM|FLOOR|BUILDING|Apt\.?|APT\.?|Ste\.?|STE\.?|Rm\.?|RM\.?|Fl\.|FL\.|Bldg\.?|BLDG\.?|Mail[\p{Zs}\t]?Stop|MAIL[\p{Zs}\t]?STOP)(?:[\p{Zs}\t]*#[\p{Zs}\t]*|[\p{Zs}\t]+)(?:\d+[A-Za-z]?(?:[-.][\dA-Za-z]+)?|[A-Z])\b|\d+(?:st|nd|rd|th)[\p{Zs}\t]+(?:Floor|FLOOR)\b|(?:Ground|First|Second|Third|Lower|Upper|GROUND|FIRST|SECOND|THIRD|LOWER|UPPER)[\p{Zs}\t]+(?:Floor|FLOOR)\b)|\#[\p{Zs}\t]*\d+[A-Za-z]?\b'
parts.building = '\b(?:\p{Uppercase}[\p{Alphabetic}\x27’-]*[\p{Zs}\t]+){1,3}(?:House|Building|Buildings|Tower|Towers|Mansions|HOUSE|BUILDING|BUILDINGS|TOWER|TOWERS|MANSIONS)\b'
parts.street = '\b(?:\d+[A-Za-z]?(?:[-–]\d+[A-Za-z]?)?[\p{Zs}\t]+|(?:One|Two|Three|Four|Five|Six|Seven|Eight|Nine|Ten|ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN|EIGHT|NINE|TEN)[\p{Zs}\t]+|\d+(?:[NS]\.[EW]\.|[NSEW]\.|[NS][EW]|[NSEW])[\p{Zs}\t]+)(?:(?:[NSEW]\.?[\p{Zs}\t]+\d+[\p{Zs}\t]+)|(?:(?:[NS]\.[EW]\.|\p{Uppercase}[\p{Alphabetic}\x27’-]*\.?|\d+(?:st|nd|rd|th))[\p{Zs}\t]+){1,4})(?:(?:Road|Street|Lane|Avenue|Mews|Close|Court|Drive|Way|Place|Square|Crescent|Gardens|Terrace|Yard|Row|Hill|Grove|Walk|Parade|Boulevard|Parkway|Highway|Freeway|Expressway|Plaza|Circle|Trail|Quay|Wharf|Vale|Pike|Turnpike|Embankment|ROAD|STREET|LANE|AVENUE|MEWS|CLOSE|COURT|DRIVE|WAY|PLACE|SQUARE|CRESCENT|GARDENS|TERRACE|YARD|ROW|HILL|GROVE|WALK|PARADE|BOULEVARD|PARKWAY|HIGHWAY|FREEWAY|EXPRESSWAY|PLAZA|CIRCLE|TRAIL|QUAY|WHARF|VALE|PIKE|TURNPIKE|EMBANKMENT)\b|\b(?:Rd|St|Ave|Blvd|Ln|Dr|Pkwy|Hwy|Fwy|Expy|Pl|Ct|Cir|Sq|Ter|Trl|RD|ST|AVE|BLVD|LN|DR|PKWY|HWY|FWY|EXPY|PL|CT|CIR|SQ|TER|TRL)\b\.?)(?:,?[\p{Zs}\t]+(?:[NS]\.[EW]\.|[NSEW]\.|(?:[NS][EW]|[NSEW]|North|South|East|West)\b))?'
parts.named = '\b(?:\p{Uppercase}[\p{Alphabetic}\x27’-]*[\p{Zs}\t]+){1,2}(?:Road|Street|Lane|Avenue|Drive|Boulevard|Parkway|Highway|Place|Square|Crescent|Terrace|Gardens|Mews|ROAD|STREET|LANE|AVENUE|DRIVE|BOULEVARD|PARKWAY|HIGHWAY|PLACE|SQUARE|CRESCENT|TERRACE|GARDENS|MEWS)\b|\b(?:The[\p{Zs}\t]+)?(?:Strand|Aldwych|Broadway|Kingsway|Piccadilly|Haymarket)\b'
parts.sep = ',\s*|\s*<br\s*/?>\s*'
parts.nl = '[\p{Zs}\t]*\\?\r?\n[\p{Zs}\t]*'
parts.town = '(?:(?:St|Ft|Mt)\.?[\p{Zs}\t]+)?\p{Uppercase}[\p{Ll}\d][\p{Alphabetic}\d\x27’-]*(?:[\p{Zs}\t]+(?:upon[\p{Zs}\t]+)?\p{Uppercase}\p{Ll}[\p{Alphabetic}\x27’-]*){0,2}(?:[\p{Zs}\t]+AFB)?'
parts.caps_town = '\b\p{Uppercase}{2,}(?:[\p{Zs}\t]+\p{Uppercase}{2,}){0,2}\b'
parts.postcode = '\b(?:[A-Z]{1,2}\d[A-Z\d]?[\p{Zs}\t]?\d[A-Z]{2}|(?:[A-Z]{2}|[A-Z]\.[A-Z]\.|(?i:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|georgia|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maine|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new[\p{Zs}\t]+hampshire|new[\p{Zs}\t]+jersey|new[\p{Zs}\t]+mexico|new[\p{Zs}\t]+york|north[\p{Zs}\t]+carolina|north[\p{Zs}\t]+dakota|ohio|oklahoma|oregon|pennsylvania|rhode[\p{Zs}\t]+island|south[\p{Zs}\t]+carolina|south[\p{Zs}\t]+dakota|tennessee|texas|utah|vermont|virginia|washington|west[\p{Zs}\t]+virginia|wisconsin|wyoming|district[\p{Zs}\t]+of[\p{Zs}\t]+columbia))(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{5}(?:-\d{4})?)\b'
absorbs.ORG = '(?P<span>{building})(?:{sep}|{nl})(?:{flat}(?:{sep}|{nl})){0,3}\d'
# The street/units or box are definite components; the guessed town after
# them is not allowed to absorb a model name or an attention/contact field.
continuation_after = '{street}(?:(?:{sep}|{nl}|[\p{Zs}\t]+|[\p{Zs}\t]*-[\p{Zs}\t]*){flat}){0,3}(?:(?:{sep}|{nl}|:[\p{Zs}\t]*|[\p{Zs}\t]+){box})?|\b\d+[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}\x27’-]*(?:{sep}|[\p{Zs}\t]*-[\p{Zs}\t]*){flat}|{box}|{named}'
continuation_stop = '\b(?i:attn|attention|c/o|contact|email|e-mail|phone|telephone|tel|fax)\b'

# A UK flat's "24, Pellin Court, Harrow Place, Worcester" has two
# street parts before its town (#498). The comma after the number is
# required here; no prefix can take the preceding party's name.
[[span]]
category = "ADDRESS"
pattern = '\b\d+[A-Za-z]?,[\p{Zs}\t]+(?:[A-Z][a-z\x27’-]*[\p{Zs}\t]+){1,3}(?:Court|Place|Road|Street),[\p{Zs}\t]+(?:[A-Z][a-z\x27’-]*[\p{Zs}\t]+){1,3}(?:Court|Place|Road|Street),[\p{Zs}\t]+[A-Z][a-z\x27’-]+(?:[\p{Zs}\t]+[A-Z][a-z\x27’-]+){0,2}(?:[\p{Zs}\t]+[A-Z]{1,2}\d[A-Z\d]?[\p{Zs}\t]?\d[A-Z]{2})?\b'
# The town after the two street components still cannot take a recipient.
continuation_after = '\b\d+[A-Za-z]?,[\p{Zs}\t]+(?:[A-Z][a-z\x27’-]*[\p{Zs}\t]+){1,3}(?:Court|Place|Road|Street),[\p{Zs}\t]+(?:[A-Z][a-z\x27’-]*[\p{Zs}\t]+){1,3}(?:Court|Place|Road|Street)\b'
continuation_stop = '\b(?i:attn|attention|c/o|contact|email|e-mail|phone|telephone|tel|fax)\b'

# A corner needs its city AND ZIP (#553 item 3). A bare pair of street
# names cannot match. Keep the alphabet and suffixes bounded to these
# English street forms rather than guessing arbitrary named properties.
[[span]]
category = "ADDRESS"
pattern = '\b{street}[\p{Zs}\t]+and[\p{Zs}\t]+{street},?[\p{Zs}\t]+(?:(?:[NS]\.[EW]\.|[NSEW]\.|[NS][EW]|[NSEW])[\p{Zs}\t]+)?[A-Z][a-z]+(?:[\p{Zs}\t]+[A-Z][a-z]+){0,2},[\p{Zs}\t]*[A-Z]{2}[\p{Zs}\t]+\d{5}(?:-\d{4})?\b'
parts.street = '(?:(?:[A-Z][a-z\x27’-]*|\d+(?:st|nd|rd|th))[\p{Zs}\t]+){1,3}(?:Street|Avenue|Road|St\.?|Ave\.?|Rd\.?)'

# The Cyrillic box label has the same boundary as P.O. Box (#506 item 7):
# its number through the city or index. Restrict city words to Cyrillic;
# a following field, country or person's name is outside the box.
[[span]]
category = "ADDRESS"
pattern = '(?i:а/я)[\p{Zs}\t]*\d+[\p{Zs}\t]*,[\p{Zs}\t]*(?:\d{6}[\p{Zs}\t]*,[\p{Zs}\t]*)?(?:г\.[\p{Zs}\t]*)?[А-ЯЁ][а-яё]+(?:[- ][А-ЯЁ][а-яё]+){0,2}(?:[\p{Zs}\t]*,[\p{Zs}\t]*\d{6})?\b'
# Cyrillic city words are guesses too: a detected recipient ends the box
# address before the name, even when an index follows it.
continuation_after = '(?i:а/я)[\p{Zs}\t]*\d+\b'
continuation_stop = '\b(?i:attn|attention|c/o|contact|email|e-mail|phone|telephone|tel|fax)\b'

# Bare street names and bare corners are unmarked, including a model's
# ADDRESS guess (#553 item 3). A numeric house number, unit, city or postcode
# prevents this whole-value veto; numbered ordinals can name streets.
# Spelled-out house numbers are house numbers too. An explicit private-home
# naming cue distinguishes a house from a bare street (#553 item 2).
[[shape]]
category = "ADDRESS"
forbid = ['^[\s\p{P}]*(?:(?:(?:\p{Uppercase}[\p{Alphabetic}\x27’-]*|\d+(?:st|nd|rd|th))[\p{Zs}\t]+){1,3}(?i:road|street|avenue|lane|drive|court|place|boulevard|rd\.?|st\.?|ave\.?|ln\.?|dr\.?|ct\.?|pl\.?|blvd\.?)(?:[\p{Zs}\t]+and[\p{Zs}\t]+(?:(?:\p{Uppercase}[\p{Alphabetic}\x27’-]*|\d+(?:st|nd|rd|th))[\p{Zs}\t]+){1,3}(?i:road|street|avenue|lane|drive|court|place|boulevard|rd\.?|st\.?|ave\.?|ln\.?|dr\.?|ct\.?|pl\.?|blvd\.?))?|Strand|Aldwych|Broadway|Kingsway|Piccadilly|Haymarket)[\s\p{P}]*$']
forbid_unless = ['^[\s\p{P}]*(?i:one|two|three|four|five|six|seven|eight|nine|ten)[\p{Zs}\t]+']
forbid_unless_after = ['(?i)\b(?:home|house|residence|cottage|chalet)[\p{Zs}\t]+(?:(?:is|was)[\p{Zs}\t]+)?(?:called|named)[\p{Zs}\t]+["“‘*_]*\z']

# A country or the word "address" at the edge of a model's address is no
# part of it: "… OX2 0EL\nUK" ends at the postcode, "… Street address" at
# the street (guide rule 3, #498). A country of several words goes word by
# word ("United Kingdom", "United States of America"); "United" at an
# address's start is a building's name ("United House"), which the span
# pattern keeps whole.
[[span]]
category = "ADDRESS"
trim = [
    "uk", "u.k", "usa", "u.s.a", "england", "scotland", "united", "kingdom",
    "states", "of", "america", "address",
]

# A building, floor, room or mail-stop part of an address alone is no
# company: "Bldg 499", "10th Floor", "Suite 210, 3rd Floor", "Mail Stop
# K9-24" (#498). A company named with one of the words stays ("Harrow Floor
# Services", "Brindle Building Society").
[[shape]]
category = "ORG"
forbid = ['(?i)^\s*(?:(?:suite|ste\.?|floor|fl\.|building|bldg\.?|room|rm\.?|mail\s*stop|unit|apt\.?|apartment|flat)\s*#?\s*(?:[a-z]?\d[\w.-]*|[a-z])\b|\d+(?:st|nd|rd|th)\s+floor|(?:ground|first|second|third|lower|upper)\s+floor)(?:\s*,\s*(?:(?:suite|ste\.?|floor|fl\.|building|bldg\.?|room|rm\.?|mail\s*stop|unit|apt\.?|apartment|flat)\s*#?\s*(?:[a-z]?\d[\w.-]*|[a-z])\b|\d+(?:st|nd|rd|th)\s+floor|(?:ground|first|second|third|lower|upper)\s+floor))*\s*$']

# Nor is such a part, anywhere in the span, a bank account or an identity
# document: "Room 2.104", "Building 179A", "Mail Stop K9-24".
[[never]]
match = "plural"
words = [
    "suite", "ste", "floor", "bldg", "building", "room", "rm", "mailstop",
    "mail", "stop", "apt", "apartment", "flat",
]
anywhere_in = ["BANK", "IDENTITY"]

# A unit also ends a department's name (#506).
[[never]]
match = "plural"
words = ["unit"]
anywhere_in = ["BANK", "IDENTITY"]
last_word_of = ["ORG"]

# Dates of birth (ADR 0092): a date after born, DOB or date of birth is a
# personal date ("born 14 March 1988", "**DOB:** 23 September 1991"). Every
# other date stays: signing, deadlines, hearings. The value must be one the
# DATE guesses take. The label may be in the cell before or on the line
# before ("| DOB | 14/03/1988 |", "DOB:" then the date on its own line).
# A sanctions list's year may have two digits ("DOB 3 Jun 61", "DOB:
# 03/06/61"; #363), only after a space, and its parts may be joined by
# hyphens ("DOB 03-Jun-61"). A date with a month name may wrap at one line
# break between its words ("March 9,\n1984") when its line ends there or
# punctuation follows ("born March 9,\n1984, in Zenda"), so the next line's
# house number or words are not its year ("4 July\n1600 Pennsylvania
# Avenue"); never over a blank line, which the review keeps as two
# paragraphs.
[[context]]
category = "DATE"
labels = ["born", "dob", "d.o.b", "date of birth", "date-of-birth", "birth date", "birthdate"]
between = '[\p{Zs}\t:*_.,|]{0,10}(?:\r?\n[\p{Zs}\t|]*)?(?:on[\p{Zs}\t]+)?'
value = '\d{1,2}[./]\d{1,2}[./]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}-\p{Alphabetic}+-(?:\d{4}|\d{2})|\d{1,2}(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\p{Alphabetic}+\.?(?:(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}|\p{Zs}+\d{2})|\p{Alphabetic}+(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{1,2},?(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}'
only_guessed = ["DATE"]

# The same dates before a lowercase "birth date" or "date of birth" in a
# sentence (#363): "He gave a March 9, 1984 birth date", "records a
# 12/04/1979 date of birth for his brother", the date wrapped as above.
# - Only spaces sit between the date and the label, so a date that ends a
#   sentence or a cell ("Signed 12 March 2026. Date of birth: …") is no
#   birth date, and a bare "birth" ("birth certificate") is no label.
# - The label is lowercase: a capitalised one opens the next field
#   ("Date of issue 01/02/2020 Date of birth 03/04/1980").
# - An article or a possessive stands just before the date, as before a
#   noun's description ("a", "his", "the claimant's"); after "issued",
#   "On", "By" or "No." the date is another's ("On 12 March 2026 date of
#   birth evidence was filed").
# - The phrase ends with the label: punctuation, the end of the line or a
#   joining word follows, never a value ("date of birth 3 June 1961"), a
#   colon or a cell's bar ("date of birth: …") or a noun the label
#   describes ("birth date correction order", "birth date records").
[[context]]
category = "DATE"
labels = ["date of birth", "date-of-birth", "birth date", "birthdate"]
after = true
between = '[\p{Zs}\t]+'
only_after = ["a", "an", "the", "his", "her", "their", "its", "my", "your", "our", "'s"]
follow = '[\p{Zs}\t]*(?:$|[\r\n.,;)\]»"”’]|(?:and|or|but|for|of|in|on|at|to|as|by|from|with|which|that|is|was|too|also|when|while)\b)'
value = '\d{1,2}[./]\d{1,2}[./]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}-\p{Alphabetic}+-(?:\d{4}|\d{2})|\d{1,2}(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\p{Alphabetic}+\.?(?:(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}|\p{Zs}+\d{2})|\p{Alphabetic}+(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{1,2},?(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}'
only_guessed = ["DATE"]

# English-speaking courts, public bodies, laws and legal databases are never
# web addresses to replace (ADR 0094, guide rule 8): "www.gov.uk/…",
# "https://www.legislation.gov.uk/ukpga/2018/12" (every "*.gov.uk"; US
# courts are "*.gov"). Justia and FindLaw also host lawyers' profiles, so
# only their case-law hosts are listed.
[[url]]
public = [
    "gov.uk", "judiciary.uk", "bailii.org", "supremecourt.uk",
    "parliament.uk", "nhs.uk", "police.uk", "gov.au", "gc.ca", "govt.nz",
    "gov.ie", "courts.ie", "law.justia.com", "caselaw.findlaw.com",
    "westlaw.com", "lexisnexis.com", "casetext.com",
]

# Legal references are never marked (guide rule 8, issues #480 and #499).
# Reporter citations: "424 U.S. at 38", "904 F.2d 275, 277", "33 A.D.3d
# 352", "912 F.3d 455, 460 and 77 N.E.2d 310", with a footnote ("n. 4").
# One-letter reporters (A., P., So.) and F. need their series ("A.2d"), so
# a flat's "12 A." is none.
[[reference]]
pattern = '\b\d{1,4}[\p{Zs}\t]+{reporter}{pages}(?:[\p{Zs}\t]*(?:,|;|and|&)[\p{Zs}\t]*\d{1,4}[\p{Zs}\t]+{reporter}{pages})*'
parts.reporter = '(?:U\.[\p{Zs}\t]?S\.|S\.[\p{Zs}\t]?Ct\.|L\.[\p{Zs}\t]?Ed\.(?:[\p{Zs}\t]?2d)?|F\.[\p{Zs}\t]?(?:2d|3d|4th)|F\.[\p{Zs}\t]?Supp\.(?:[\p{Zs}\t]?(?:2d|3d))?|F\.[\p{Zs}\t]?App[\x27’]x|B\.[\p{Zs}\t]?R\.|(?:N\.[\p{Zs}\t]?[EW]|S\.[\p{Zs}\t]?[EW])\.(?:[\p{Zs}\t]?(?:2d|3d))?|(?:A|P|So)\.[\p{Zs}\t]?(?:2d|3d|4th)|A\.[\p{Zs}\t]?D\.(?:[\p{Zs}\t]?(?:2d|3d))?|N\.[\p{Zs}\t]?Y\.(?:[\p{Zs}\t]?S\.)?[\p{Zs}\t]?(?:2d|3d)|Cal\.[\p{Zs}\t]?Rptr\.(?:[\p{Zs}\t]?(?:2d|3d))?|Cong\.[\p{Zs}\t]?Rec\.|Fed\.[\p{Zs}\t]?Reg\.|Fed\.[\p{Zs}\t]?Cl\.|Stat\.|T\.[\p{Zs}\t]?C\.)'
parts.pages = '[\p{Zs}\t]*(?:at[\p{Zs}\t]+)?[HS]?\d{1,6}(?:[-–]\d{1,6})?(?:,[\p{Zs}\t]*\d{1,6}(?:[-–]\d{1,6})?)*(?:[\p{Zs}\t]*nn?\.[\p{Zs}\t]*\d{1,4})?'

# Westlaw and Lexis citations: "2015 WL 4554844", "2019 U.S. Dist. LEXIS
# 12345", with a star page.
[[reference]]
pattern = '\b(?:19|20)\d{2}[\p{Zs}\t]+(?:WL|U\.S\.[\p{Zs}\t]+(?:Dist\.|App\.)[\p{Zs}\t]+LEXIS|LEXIS)[\p{Zs}\t]+\d{1,9}(?:,[\p{Zs}\t]*at[\p{Zs}\t]*\*\d{1,5})?'

# English and Welsh reports and neutral citations: "[2020] STC 960",
# "[2019] EWCA Civ 1234", "(2004) 1 WLR 12", and the distinctive reports
# without their year ("ICR 801"); "All ER (Comm)" puts its division before
# the page (issue #499).
[[reference]]
pattern = '(?:[\[(](?:19|20)\d{2}[\])][\p{Zs}\t]+(?:\d{1,2}[\p{Zs}\t]+)?(?:UKSC|UKHL|UKPC|UKUT|UKFTT|UKEAT|EWCA[\p{Zs}\t]+(?:Civ|Crim)|EWHC|EWCOP|EWFC|AC|QB|KB|Ch|Fam|WLR|All[\p{Zs}\t]+ER(?:[\p{Zs}\t]+\(Comm\))?|ICR|IRLR|STC|BCLC|BCC|FSR|RPC|EGLR|HLR|SFTD|BTC|TC|Lloyd[\x27’]s[\p{Zs}\t]+Rep|Cr[\p{Zs}\t]+App[\p{Zs}\t]+R)|\b(?:\d{1,2}[\p{Zs}\t]+)?(?:ICR|IRLR|STC|WLR|BCLC|EWCA[\p{Zs}\t]+Civ|EWHC))[\p{Zs}\t]+\d{1,5}(?:[\p{Zs}\t]*\((?:Ch|Comm|QB|KB|Fam|Admin|TCC|IPEC|Pat|TC)\))?'

# Scottish reports have a year, reporter, court and page: "1931 S.C.
# (H.L.) 13"; the initials inside name nobody (guide rule 8, #499).
[[reference]]
pattern = '\b(?:19|20)\d{2}[\p{Zs}\t]+S\.[\p{Zs}\t]?C\.[\p{Zs}\t]+\(H\.[\p{Zs}\t]?L\.\)[\p{Zs}\t]+\d{1,5}\b'

# The Crown's R in a judicial-review title is no person. Only the marker
# is suppressed, leaving the applicant's name to the cited-case rules
# and the case-at-hand safeguards (guide rules 1 and 8, #499).
[[reference]]
pattern = '\bR(?P<tail>[\p{Zs}\t]+\(on[\p{Zs}\t]+the[\p{Zs}\t]+application[\p{Zs}\t]+of\b)'

# Numbered instruments and the cited manual's heading/page are legal
# references (#499). A manual's full title supplies its reference context.
[[reference]]
pattern = '\bNational[\p{Zs}\t]+Instrument[\p{Zs}\t]+\d{2}-\d{3}\b|\b\d{3}[\p{Zs}\t]+DM[\p{Zs}\t]+[-–][\p{Zs}\t]+Aviation[\p{Zs}\t]+Safety\b|\bAHCP/CCAA[\p{Zs}\t]+p\.[\p{Zs}\t]+[A-Z]-\d{1,5}\b'

# Bare PD and DM codes may be personal IDs. Require an affirmative
# reference introducer, including a practice direction beside a numbered
# instrument in the same citation; an isolated code is uncertain (#499).
[[reference]]
pattern = '(?P<lead>\b(?:(?i:under|see|pursuant[\p{Zs}\t]+to|practice[\p{Zs}\t]+direction|departmental[\p{Zs}\t]+manual)[\p{Zs}\t]+|National[\p{Zs}\t]+Instrument[\p{Zs}\t]+\d{2}-\d{3}[\p{Zs}\t]+and[\p{Zs}\t]+))(?:PD[\p{Zs}\t]+\d{1,3}[A-Z]{1,2}|\d{3}[\p{Zs}\t]+DM)\b'

# Pinpoint pages ("at p. 478A", "p. S-19") and numbered exhibits are no
# addresses or names; bare numbers and letters beside them stay (#499).
[[reference]]
pattern = '\bat[\p{Zs}\t]+p\.[\p{Zs}\t]+\d{1,5}[A-Z]?\b|\bp\.[\p{Zs}\t]+[A-Z]-\d{1,5}\b|\bEx\.[\p{Zs}\t]+\d{1,4}\b'

# A Texas appellate court's city and year are citation parts, not an
# address. The court cue is required, never a city/year alone (#499).
[[reference]]
pattern = '\bTex\.[\p{Zs}\t]+App\.[\p{Zs}\t]*[—–-][\p{Zs}\t]*\p{Uppercase}\p{Ll}+(?:[\p{Zs}\t]+\p{Uppercase}\p{Ll}+){0,3}[\p{Zs}\t]+(?:19|20)\d{2}\b'

# US codes and regulations: "26 U.S.C. § 6212", "31 U.S.C. 3903", "48 CFR
# 52.212-1", "735 ILCS 5/2-619", "I.R.C. § 61", and the dotted
# abbreviations alone ("U.S.C.", whose "S.C." is no one's initials). The
# undotted ones need their numbers: "USC" alone may be a university. A
# section word may stand for "§" ("42 USC Section 1981", "42 U.S.C. Sec.
# 1983"), and an undotted code may touch its numbers ("19CFR141.37"; #480).
[[reference]]
pattern = '(?:\b\d{1,3}[\p{Zs}\t]+)?\b(?:U\.[\p{Zs}\t]?S\.[\p{Zs}\t]?C\.(?:[\p{Zs}\t]?A\.)?|I\.[\p{Zs}\t]?R\.[\p{Zs}\t]?C\.|C\.[\p{Zs}\t]?F\.[\p{Zs}\t]?R\.|U\.[\p{Zs}\t]?C\.[\p{Zs}\t]?C\.)(?:[\p{Zs}\t]*{sign}{section})?|\b\d{1,3}[\p{Zs}\t]*(?:CFR|ILCS|USC)[\p{Zs}\t]*{sign}{section}'
parts.section = '\d[\dA-Za-z]*(?:[.\-/–][\dA-Za-z]+)*(?:\([\dA-Za-z]{1,4}\))*'
parts.sign = '(?:(?:§§?|[Ss]ections?|SECTIONS?|[Ss]ecs?\.)[\p{Zs}\t]*)?'

# Federal Register pages, spaced or not ("54 FR 35305", "49FR17754"): a
# volume before the number is required, so "FR" alone (a French VAT
# number's prefix) stays, and so is a citation's end after the page (a
# comma, a semicolon, a bracket, a full stop, "at" or the line's end), so
# an address's "Unit 12 FR 75008 Paris" stays too (#480).
[[reference]]
pattern = '\b\d{1,3}[\p{Zs}\t]*FR[\p{Zs}\t]*\d{3,6}(?P<tail>[\p{Zs}\t]*(?:[,;:)\]]|\.(?:\s|$)|\(|$)|[\p{Zs}\t]+at\b)'

# Nevada's statutes by section ("NRS 41.1395", "N.R.S. § 41.085"): the
# code before the number is required (#480).
[[reference]]
pattern = '\b(?:NRS|N\.[\p{Zs}\t]?R\.[\p{Zs}\t]?S\.|Nev\.[\p{Zs}\t]?Rev\.[\p{Zs}\t]?Stat\.)[\p{Zs}\t]*(?:§[\p{Zs}\t]*)?\d{1,3}[A-Z]?\.\d{2,5}[A-Z]?(?:\([\dA-Za-z]{1,4}\))*'

# Sections (including Roman numerals), chapters, paragraphs and clauses
# (#499): "§ 6212", "§§ 1-3", "¶ 4", "section 12", "Article 6", "clause
# 4.2", "Rule 56(a)", "Fed. R. Civ. P. 12(b)(6)", "Tex. R. Civ. P. 91a",
# "CPR 31.16" (guide rule 5: statute, article, section and clause numbers
# stay unmarked). The Civil Procedure Rules also cite a rule or a part
# ("CPR r71.8", "CPR r.38.4", "CPR r 71.5", "CPR Part 35", "the CPR, Part
# 19.12"; #480).
[[reference]]
pattern = '(?:§§?|¶¶?|\b(?:[Ss]ecs?\.|[Aa]rticles?|[Cc]lauses?|[Rr]ules?|[Pp]aragraphs?|[Ss]chedules?|[Rr]egulations?|[Aa]rt\.|[Pp]aras?\.|(?:Fed|Tex)\.[\p{Zs}\t]?R\.[\p{Zs}\t]?(?:Civ|Crim|App|Evid|Bankr)\.[\p{Zs}\t]?P\.|FRCP|CPR(?:,?[\p{Zs}\t]*(?:rr?\.?|Parts?|PD))?))[\p{Zs}\t]*{section}(?:[\p{Zs}\t]*[-–][\p{Zs}\t]*{section})?'
# Canonical, nonempty Roman numerals only: LLC, IIV and VX are no numbers.
parts.section = '(?:\d[\dA-Za-z]*(?:[.\-/][\dA-Za-z]+)*(?:\([\dA-Za-z]{1,4}\))*|(?:M{1,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})|(?:CM|CD|DC{0,3}|C{1,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})|(?:XC|XL|LX{0,3}|X{1,3})(?:IX|IV|V?I{0,3})|IX|IV|VI{0,3}|I{1,3})\b)'

# Section/chapter wording can be a trading name. A citation introducer
# decides it; without one keep the model's name (guide rule 2, #499).
[[reference]]
pattern = '(?P<lead>\b(?i:under|see|pursuant[\p{Zs}\t]+to|according[\p{Zs}\t]+to)[\p{Zs}\t]+)\b(?i:sections?|chapters?)[\p{Zs}\t]+{section}(?:[\p{Zs}\t]*[-–][\p{Zs}\t]*{section})?'
parts.section = '(?:\d[\dA-Za-z]*(?:[.\-/][\dA-Za-z]+)*(?:\([\dA-Za-z]{1,4}\))*|(?:M{1,3}(?:CM|CD|D?C{0,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})|(?:CM|CD|DC{0,3}|C{1,3})(?:XC|XL|L?X{0,3})(?:IX|IV|V?I{0,3})|(?:XC|XL|LX{0,3}|X{1,3})(?:IX|IV|V?I{0,3})|IX|IV|VI{0,3}|I{1,3})\b)'

# A bankruptcy chapter followed by "Case" is a legal proceeding, with no
# citation introducer needed. A bare Chapter 11 remains ambiguous (#499).
[[reference]]
pattern = '\b[Cc]hapters?[\p{Zs}\t]+\d{1,2}\b(?P<tail>[\p{Zs}\t]+[Cc]ase\b)'

# Only lowercase "s." followed by digits is an abbreviated section cue:
# "S. M." may be a witness's initials, even without the final model dot.
[[reference]]
pattern = '\bs{1,2}\.[\p{Zs}\t]*{section}(?:[\p{Zs}\t]*[-–][\p{Zs}\t]*{section})?'
parts.section = '\d[\dA-Za-z]*(?:[.\-/][\dA-Za-z]+)*(?:\([\dA-Za-z]{1,4}\))*'

# Regulations, orders, laws and releases by number: "FAR 52.212-1", "E.O.
# 13526", "Executive Order No. 14028", "Pub. L. No. 115-97", "Release No.
# 34-98765", "Release Number 34-52926" (#480).
[[reference]]
pattern = '\b(?:(?:FAR|DFARS)[\p{Zs}\t]+(?:§[\p{Zs}\t]*)?\d+(?:\.\d+)+(?:-\d+)*|(?:E\.[\p{Zs}\t]?O\.|Exec\.[\p{Zs}\t]+Order|Executive[\p{Zs}\t]+Order)[\p{Zs}\t]+(?:No\.[\p{Zs}\t]*)?\d{3,6}|Pub\.[\p{Zs}\t]?L\.[\p{Zs}\t]+(?:No\.[\p{Zs}\t]*)?\d{2,3}-\d{1,4}|(?:Release|Rel\.)[\p{Zs}\t]+(?:Nos?\.|[Nn]umbers?)[\p{Zs}\t]*(?:[A-Z]{1,3}-)?\d+(?:-\d+)*)'

# An agency's letters, rulings and filings by number are references, no
# tax or bank values (guide rule 8, #480): "FDIC FIL-111-2006", "OTS No.
# 2006-49", "CEQ # 20060476", "T.D. 84-93", "Rev. Rul. 2031-12", "Rev.
# Proc. 2031-1", "PLR 203112001", "Private Letter Ruling 203112001". Each
# needs its agency's or series' own word: a number after "No." alone stays.
# A letter ruling's number is year-led, so a nine-digit tax number beside
# "PLR" without a year stays. A Treasury Decision's number is "84-93" or
# "9876", a ruling's or procedure's year-led ("55-540", "2031-12"): a
# phone after a person's initials ("Smith, T.D. 555-0164") stays.
[[reference]]
pattern = '\b(?:FDIC[\p{Zs}\t]+)?FIL-\d{1,4}-(?:19|20)\d{2}\b|\bOTS[\p{Zs}\t]+(?:No\.|[Nn]umber)[\p{Zs}\t]*(?:19|20)\d{2}-\d{1,4}\b|\bCEQ[\p{Zs}\t]*(?:#|No\.|[Nn]umber)[\p{Zs}\t]*(?:19|20)\d{6}\b|\bT\.[\p{Zs}\t]?D\.[\p{Zs}\t]+(?:\d{2}-\d{1,3}|\d{4})\b|\b(?:Rev\.[\p{Zs}\t]?Rul\.|Rev\.[\p{Zs}\t]?Proc\.)[\p{Zs}\t]+(?:\d{2}|(?:19|20)\d{2})-\d{1,3}\b|\b(?:PLR|Priv\.[\p{Zs}\t]?Ltr\.[\p{Zs}\t]?Rul\.|Private[\p{Zs}\t]+Letter[\p{Zs}\t]+Ruling)[\p{Zs}\t]+(?:No\.[\p{Zs}\t]*)?(?:19|20)\d{7}\b'

# A wildlife service's consultation number belongs to a project, no one's
# identifier: "In Reply Refer To: AESO/SE 22410-2005-F-0506" (formal or
# informal consultation, the office's code before it or not; #480).
[[reference]]
pattern = '\b(?:[A-Z]{2,6}/[A-Z]{2,4}[\p{Zs}\t]+)?\d{4,6}-(?:19|20)\d{2}-(?:F|I|TA|FC|IC)-\d{3,5}\b'

# A filing's entry number in a court's running header is no identifier:
# "15-49008-wsd Doc 19-1 Filed 06/12/15", "Document 12 Filed in TXSD"
# (#480). The header's cue is required, a case number before it or a
# "Filed" after it: an identity document's number in prose stays. A
# bankruptcy case's number, its judge's initials after it, is the
# header's too: the case at hand's after its label is CASE, and the
# review gives the header the same; a policy's "12-34567" before "Doc 5"
# stays.
[[reference]]
pattern = '(?:\b\d{2}-\d{5}-[a-z]{2,4}[\p{Zs}\t]+|(?P<lead>\b\d{2}-\d{5}[\p{Zs}\t]+))(?:Doc|Document)\.?[\p{Zs}\t]*#?[\p{Zs}\t]*\d{1,5}(?:-\d{1,3})?\b'

# The same entry before the header's "Filed" or "Entered" ("Identity
# Document 12345 Page 2" is no header).
[[reference]]
pattern = '\b(?:Doc|Document)\.?[\p{Zs}\t]*#?[\p{Zs}\t]*\d{1,5}(?:-\d{1,3})?(?P<tail>[\p{Zs}\t]+(?:Filed|Entered)\b)'

# A court filing's running header is no identifier: "TXSD Page 7 of 8", a
# page count with a federal district's code before it ("TXSD", "ILND",
# "CACD") or not (#480). Any other capitalised word before it is no
# court's: "DECLARATION OF HARROW Page 2 of 8" keeps "HARROW".
[[reference]]
pattern = '(?:\b[A-Z]{2}[NSEWMC]?D[\p{Zs}\t]+)?\b(?:Page|PAGE)[\p{Zs}\t]+\d{1,4}[\p{Zs}\t]+(?:of|OF)[\p{Zs}\t]+\d{1,4}\b'

# A docket number cited as authority is part of its citation, no case
# number of the case at hand (guide rule 5, #506 item 3, #480): after a
# citation signal ("see 02 CV 3651", "cf. No. 03-21-00650-CV") or listed
# after a citation's court and year ("(Tex. App. 2030), and
# 1:31-cv-00999-ZZ"). Any other docket the model takes is CASE (the
# shapes above).
[[reference]]
pattern = '(?P<lead>(?:\b(?:[Ss]ee(?:[\p{Zs}\t]+also)?|[Cc]f\.|[Aa]ccord|[Cc]iting|[Qq]uoting)|\([^()\n]{0,40}\b(?:19|20)\d{2}\)[,;]?[\p{Zs}\t]+(?:and|&|or))[\p{Zs}\t]+(?:Nos?\.[\p{Zs}\t]*)?)(?:\d{2}-\d{2}-\d{5}-C[VR]|\d:\d{2}-[a-z]{2,3}-\d{3,6}(?:-[A-Za-z]{1,4})*|\d{2}[\p{Zs}\t-](?:CV|Civ\.|CIV|cv)[\p{Zs}\t-]\d{3,6}|\d{2}-\d{5}-[a-z]{2,4})\b'

# The record: transcript pages ("Tr. 435-36", "Tr. at 12:4-9"), docket
# entries ("ECF Doc. #12-3", "ECF No. 45", "Dkt. 7"), footnotes ("n. 14",
# "nn. 3-4") and supplemental appendix pages ("123sa", "45sa-47sa").
[[reference]]
pattern = '\bTr\.[\p{Zs}\t]*(?:at[\p{Zs}\t]+)?\d+(?:[:–-]\d+)*(?:,[\p{Zs}\t]*\d+(?:[:–-]\d+)*)*|\b(?:ECF|Dkt\.?)[\p{Zs}\t]+(?:(?:Doc|No|Nos)\.[\p{Zs}\t]*)?#?[\p{Zs}\t]*\d+(?:-\d+)?|\bDoc\.[\p{Zs}\t]*#[\p{Zs}\t]*\d+(?:-\d+)?|\bnn?\.[\p{Zs}\t]*\d{1,4}(?:[-–]\d{1,4})?\b|\b\d{1,5}sa(?:[-–]\d{1,5}sa)?\b'

# Short-form citations and the record's pages: "Id. at 38", "supra, at
# 12", "J.A. 123", "ROA.456", "App. 12".
[[reference]]
pattern = '\b(?:[Ii]d\.,?|supra,?)[\p{Zs}\t]+at[\p{Zs}\t]+\d{1,6}(?:[-–]\d{1,6})?(?:,[\p{Zs}\t]*\d{1,6}(?:[-–]\d{1,6})?)*(?:[\p{Zs}\t]*nn?\.[\p{Zs}\t]*\d{1,4})?|\b(?:J\.[\p{Zs}\t]?A\.|ROA\.|App\.)[\p{Zs}\t]*\d{1,6}(?:[-–]\d{1,6})?'

# A cited case is a legal reference, its parties' names included, both
# sides (guide rule 8, #506 item 2, issue #561): "Pellam v. Ostrand, 912
# F.3d 455 (9th Cir. 2031)", "Galvan v. Calhoun Cty., 2031 WL 1234567",
# "News Group Newspapers Ltd v Brindle [2031] EWHC 12 (Ch)", "In re Estate
# of Bramblett, 77 B.R. 310", "Ex parte Quill, 12 So. 3d 4", and a docket
# number with its court and year or its reporter after it ("Grant v.
# Finecy, No. 02-23-00310-CV (Tex. App. 2031)", "Index No." and "Docket
# No." ones, and a spaced "No. 15 C 1538", too, #506 item 3). A docket
# may say "C.A. No." or "Civ. A. No.", keep its judge's initials ("No.
# 21-2873 (ABJ)") and a docket entry's pin ("No. 1:30-cv-00977, ECF No. 45
# at 3") before its court; its reporter may be Westlaw, any LEXIS ("Tex.
# App. LEXIS 1234") or the New York Slip Opinions ("2031 N.Y. Slip Op.
# 31234(U)"). The citation
# must follow the name: a caption ("Ivo Harrow v. Quillon Ltd", its own
# "Case No." after it or not) is the case at hand's and stays.
#
# The `party` groups are the parties. A name in a match stays only where it
# names a party of the case at hand: one the model found outside every cited
# case, or one after a role listed here ("Plaintiff Ivo Harrow"), holds its
# words or is held by them ("Harrow" of "Ivo Harrow"). Names outside
# citations stay. The caption and running text decide which parties are
# the case at hand's.
# A party is capitalised words (with periods, initials, numbers and "&"),
# "of", "the", "ex rel." and the like between them, a legal form after a
# comma ("Murrin Bros. 1885, Ltd") and "et al.", in emphasis or not
# ("*Pellam v. Ostrand*, 912 F.3d 455"). A word's period is an initial's or
# a listed abbreviation's ("Bros.", "Cty."), and a legal form's period
# ("Ltd.") ends the party. Code also clips the leading party after a
# period before a capitalised word: even "Jr." can end a sentence.
# A sentence's first word ("See Pellam") becomes part of it. "and"
# joins no party: in "Ivo Harrow and Pellam v. Ostrand" Ivo Harrow is no
# party. A docket number's court and year follow it at once, "(Tex. App.
# 2031)", so a sentence on after it ("No. 22-1234, counsel was Ivo Harrow
# (admitted 2020)") is none of it.
[[reference]]
pattern = '(?:\b(?:[Ii]n[\p{Zs}\t]+re|[Ee]x[\p{Zs}\t]+parte|(?:[Ii]n[\p{Zs}\t]+the[\p{Zs}\t]+)?[Mm]atter[\p{Zs}\t]+of)[\p{Zs}\t]+(?:the[\p{Zs}\t]+)?(?P<party>{party})|(?P<party2>{party}){v}(?P<party3>{party})),?{s}(?:{reporter}(?:{tex_docket})?|{neutral}|{docket_reporter}|(?P<docket>{docket}))'
parts.party = '(?:(?:Bros|Cty|Cnty|Dist|Dep[\x27’]t|Ass[\x27’]n|Mfg|Nat[\x27’]l|Int[\x27’]l|Sch|Univ|Hosp|Mut|Ins|Bd|Comm[\x27’]n|Sav|Fed|Sys|Servs?|Indus|Assocs?|Grp|Ctr|Twp|Auth|Elec|Tel|Mgmt|Prods?|St|Ft|Mt|Jr|Sr|Admin|Gen|Fin|Transp|Educ|Med|Hldgs|Invs?|Tech)\.|\p{Uppercase}\.(?:[\p{Zs}\t]?\p{Uppercase}\.)*|\p{Uppercase}[\p{Alphabetic}\x27’\-]*)(?:(?:[\p{Zs}\t]+(?:of|the|de|der|du|la|le|van|von|ex[\p{Zs}\t]+rel\.))*[\p{Zs}\t]+(?:(?:(?:Bros|Cty|Cnty|Dist|Dep[\x27’]t|Ass[\x27’]n|Mfg|Nat[\x27’]l|Int[\x27’]l|Sch|Univ|Hosp|Mut|Ins|Bd|Comm[\x27’]n|Sav|Fed|Sys|Servs?|Indus|Assocs?|Grp|Ctr|Twp|Auth|Elec|Tel|Mgmt|Prods?|St|Ft|Mt|Jr|Sr|Admin|Gen|Fin|Transp|Educ|Med|Hldgs|Invs?|Tech)\.|\p{Uppercase}\.(?:[\p{Zs}\t]?\p{Uppercase}\.)*|\p{Uppercase}[\p{Alphabetic}\x27’\-]*)|&|\d{1,4})){0,8}(?:[\p{Zs}\t]+(?:Co|Corp|Inc|Ltd|Cos|Plc|LLC)\.)?(?:,[\p{Zs}\t]*(?:Inc|Ltd|LLC|L\.L\.C|LLP|L\.L\.P|L\.P|Co|Corp|N\.A|P\.C|PLC|plc|S\.A|AG|GmbH)\.?)?(?:,?[\p{Zs}\t]+et[\p{Zs}\t]+al\.)?[*_]{0,3}'
parts.v = '(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)(?:v|vs)\.?(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)'
parts.s = '(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)'
parts.reporter = '\d{1,4}[\p{Zs}\t]+(?:(?:\p{Uppercase}\p{Alphabetic}{0,7}\.|[A-Z]{1,5}|\d(?:d|th)|App[\x27’]x)[\p{Zs}\t]?){1,5}[\p{Zs}\t]*\d{1,9}'
# A trailing docket belongs to the cited Texas appeal, not this case (#499).
parts.tex_docket = '[\p{Zs}\t]*\(Tex\.[\p{Zs}\t]+App\.[^()\n]{0,60}?(?:19|20)\d{2}(?:,[\p{Zs}\t]*pet\.[\p{Zs}\t]+filed)?\),[\p{Zs}\t]+No\.[\p{Zs}\t]+\d{2}-\d{2}-\d{5}-CV\b'
parts.neutral = '[\[(](?:19|20)\d{2}[\])][\p{Zs}\t]+(?:\d{1,3}[\p{Zs}\t]+)?(?:\p{Uppercase}\p{Alphabetic}*\.?[\p{Zs}\t]+){1,4}\d{1,6}'
parts.docket = '(?:(?:Case|Civ\.|Civil|Crim\.|Cr\.)[\p{Zs}\t]+(?:(?:Action|A\.|Docket)[\p{Zs}\t]+)?|(?:C\.[\p{Zs}\t]?A\.|Docket|Index|Cause|Adv\.[\p{Zs}\t]+Proc?\.)[\p{Zs}\t]+)?Nos?\.[\p{Zs}\t]*(?:\d{2}[\p{Zs}\t](?:CV|Civ\.?|C)[\p{Zs}\t]?\d{3,}|[\dA-Z][\w:./\-–]*\d[\w/\-–]*)(?:[\p{Zs}\t]*\([A-Z]{2,4}\))?(?:,[\p{Zs}\t]*(?:ECF|Dkt\.?)[\p{Zs}\t]+No\.[\p{Zs}\t]*\d+(?:[\p{Zs}\t]+at[\p{Zs}\t]+\d+)?)?(?:,[\p{Zs}\t]*slip[\p{Zs}\t]+op\.(?:[\p{Zs}\t]+at[\p{Zs}\t]+\d+)?)?[\p{Zs}\t]*\([\p{Uppercase}\d][^()\n]{0,60}?(?:19|20)\d{2}\)'
parts.docket_reporter = '(?:(?:Case|Civ\.|Civil|Crim\.|Cr\.)[\p{Zs}\t]+(?:(?:Action|A\.|Docket)[\p{Zs}\t]+)?|(?:C\.[\p{Zs}\t]?A\.|Docket|Index|Cause|Adv\.[\p{Zs}\t]+Proc?\.)[\p{Zs}\t]+)?Nos?\.[\p{Zs}\t]*(?:\d{2}[\p{Zs}\t](?:CV|Civ\.?|C)[\p{Zs}\t]?\d{3,}|[\dA-Z][\w:./\-–]*\d[\w/\-–]*)(?:[\p{Zs}\t]*\([A-Z]{2,4}\))?,[\p{Zs}\t]*(?:19|20)\d{2}[\p{Zs}\t]+(?:WL|(?:\p{Uppercase}[\w.]*[\p{Zs}\t]+)*LEXIS|N\.Y\.[\p{Zs}\t]+Slip[\p{Zs}\t]+Op\.)[\p{Zs}\t]+\d+'
roles = [
    "plaintiff", "defendant", "claimant", "respondent", "appellant", "appellee",
    "petitioner", "applicant", "debtor", "creditor", "movant", "intervenor",
    "relator", "complainant",
]
# A decision identified as the subject of this appeal/action is the case
# at hand's: keep its parties when one of these phrases occurs in the 60
# characters before the citation, ignoring case. Uncertain names stay.
own_before = [
    "under appeal", "appealed from", "appeal from", "the decision below",
    "the judgment below", "the order below", "on appeal from", "the court below",
    "this appeal", "the present case", "the instant case", "this case", "this action",
]

# A short citation with a reporter (#561): "Pellam, 912 F.3d at 460"
# or "Pellam, 2031 WL 1234567, at *3". A bare surname or "supra" alone
# does not establish that a name belongs only to a precedent.
[[reference]]
pattern = '(?P<party>{party}),{s}\d{1,4}[\p{Zs}\t]+(?:(?:\p{Uppercase}\p{Alphabetic}{0,7}\.|[A-Z]{1,5}|\d(?:d|th)|App[\x27’]x)[\p{Zs}\t]?){1,5}(?:[\p{Zs}\t]*\d{1,9},?)?[\p{Zs}\t]+at[\p{Zs}\t]+\*?\d'
parts.party = '(?:(?:Bros|Cty|Cnty|Dist|Dep[\x27’]t|Ass[\x27’]n|Mfg|Nat[\x27’]l|Int[\x27’]l|Sch|Univ|Hosp|Mut|Ins|Bd|Comm[\x27’]n|Sav|Fed|Sys|Servs?|Indus|Assocs?|Grp|Ctr|Twp|Auth|Elec|Tel|Mgmt|Prods?|St|Ft|Mt|Jr|Sr|Admin|Gen|Fin|Transp|Educ|Med|Hldgs|Invs?|Tech)\.|\p{Uppercase}\.(?:[\p{Zs}\t]?\p{Uppercase}\.)*|\p{Uppercase}[\p{Alphabetic}\x27’\-]*)(?:(?:[\p{Zs}\t]+(?:of|the|de|der|du|la|le|van|von))*[\p{Zs}\t]+(?:(?:(?:Bros|Cty|Cnty|Dist|Dep[\x27’]t|Ass[\x27’]n|Mfg|Nat[\x27’]l|Int[\x27’]l|Sch|Univ|Hosp|Mut|Ins|Bd|Comm[\x27’]n|Sav|Fed|Sys|Servs?|Indus|Assocs?|Grp|Ctr|Twp|Auth|Elec|Tel|Mgmt|Prods?|St|Ft|Mt|Jr|Sr|Admin|Gen|Fin|Transp|Educ|Med|Hldgs|Invs?|Tech)\.|\p{Uppercase}\.(?:[\p{Zs}\t]?\p{Uppercase}\.)*|\p{Uppercase}[\p{Alphabetic}\x27’\-]*)|&|\d{1,4})){0,8}(?:[\p{Zs}\t]+(?:Co|Corp|Inc|Ltd|Cos|Plc|LLC)\.)?(?:,[\p{Zs}\t]*(?:Inc|Ltd|LLC|LLP|Co|Corp|PLC|plc)\.?)?(?:,?[\p{Zs}\t]+et[\p{Zs}\t]+al\.)?[*_]{0,3}'
parts.s = '(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)'

# "Id." and "Ibid." alone cite the authority before, and name no one: the
# model's "Id" as a person (#561).
[[reference]]
pattern = '\b(?:Id|id|Ibid|ibid)\.'

# Defined English party codes are labels, not names (#546, guide rule 8).
# A name followed by its bracketed code, or a Claimant/Defendant-style
# label followed by a code, establishes only that letter's series. A
# bare code without its own evidence stays. Ranges and lists go when
# every member belongs to an established series; possessive trustees go
# too. A code opening a name protects its short mentions (guide rule 2).
# The bracket/quote syntax in the removal pattern consumes every form
# accepted by the first evidence pattern, including "as appropriate".
# Lowercase plc can end the defining name; a role and code can occupy
# adjacent heading lines, but name continuations stop at a newline.
[[reference]]
pattern = '(?:\([\p{Zs}\t]*[“"‘\x27]?|[“"‘\x27])?\b(?P<series>[CDPR])[0-9]{1,2}\b(?:[\p{Zs}\t]*(?:[-–—]|to)[\p{Zs}\t]*(?P<series2>[CDPR])[0-9]{1,2}\b)?(?:[\x27’]s\b(?:[\p{Zs}\t]+(?:trustees?|representatives?|solicitors?|counsel|estate|agents?)\b)?)?(?:[”"’\x27]?(?:,[\p{Zs}\t]+as[\p{Zs}\t]+appropriate)?[\p{Zs}\t]*\)|[”"’\x27])?'
when = [
    '\b(?:\p{Uppercase}[\p{Alphabetic}\x27’.-]*|plc)[\p{Zs}\t]+\([\p{Zs}\t]*[“"‘\x27]?(?P<series>[CDPR])[0-9]{1,2}\b[”"’\x27]?(?:,[\p{Zs}\t]+as[\p{Zs}\t]+appropriate)?[\p{Zs}\t]*\)',
    '\b(?i:claimants?|defendants?|plaintiffs?|petitioners?|respondents?)[\p{Zs}\t\r\n:*(“"‘\x27]+(?P<series>[CDPR])[0-9]{1,2}\b',
    '\b(?P<series>[CDPR])[0-9]{1,2}\b[\p{Zs}\t]*(?:[-–—:]|\()[\p{Zs}\t]*(?i:claimants?|defendants?|plaintiffs?|petitioners?|respondents?)\b',
]
categories = ["PERSON", "ORG"]

# A form's outline letter before its part's title in title case is no
# initial: "J. Additional Questions" (guide rule 1, issue #499).
[[reference]]
pattern = '(?P<lead>(?m:^)[\p{Zs}\t#>*_|]*(?:(?:Part|Section|Item)[\p{Zs}\t]+)?)\p{Uppercase}\.(?P<tail>[\p{Zs}\t]+\p{Uppercase}\p{Ll}+(?:[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+|of|and|or|the|to|for|in))*[\p{Zs}\t]+\p{Uppercase}\p{Ll}+[\p{Zs}\t*_:|]*(?m:$))'

# A plot's letter is its label, no initial: "Plot B lies east of Plot A",
# "Plots C and D" (guide rule 1, issue #500). Only the letter goes: "Ivo
# Plot" stays, and so does a name after the letter ("Plot 4, K Ashdale").
[[reference]]
pattern = '(?P<lead>\b(?:Plots?|PLOTS?)[\p{Zs}\t]+)\p{Uppercase}\b(?:(?:[\p{Zs}\t]*,[\p{Zs}\t]*|[\p{Zs}\t]+(?:and|or|&)[\p{Zs}\t]+)\p{Uppercase}\b)*'

# A patent or trademark schedule's row is no identifier, address or name
# (guide rule 8, issue #486): an office's code opening the row, then its
# application, patent or registration numbers and their dates, in columns
# ("AU  2009241803  30-Apr-09  2009241803  26-Sep-13", "DE  60 2009 024
# 610.0  30-Apr-09  2 286 018", "| US | 12/432,845 | 30-Apr-09 |"). The
# code is no organization ("AU", "US"). A row needs a column's gap after
# the code, a date, and a number only a patent office gives (a US
# application's "12/432,845", a European one's "9739191.6", a German
# "60 2009 024 610.0", a year-led "2009241803", a US trademark's serial
# "86920111") or a status only a trademark has, in its own column
# ("Published", "Opposed"). So a sentence opening "US" stays, an IBAN
# ("DE89 3704 …") stays, and so does a table of companies by country with
# their amounts, statuses, company numbers and dates ("| UK | Acme Ltd |
# Registered | 01234567 | 01/02/2020 |"). The row ends with its last
# column of dates and numbers, never on the line after it, which a
# citation's wrapping joins ("Contact: Jane Morgan").
[[reference]]
pattern = '(?m:^)[\p{Zs}\t|]*{office}{gap}[^\n]*?(?:{number}[^\n]*?{date}|{date}[^\n]*?{number})(?:{gap}(?:{date}|\d[\p{Zs}]\d{3}[\p{Zs}]\d{3}\b|\d+(?:[,./]\d+)*))*'
parts.office = '(?:US|EP|WO|PCT|DE|GB|UK|FR|JP|CN|KR|AU|CA|BE|NL|LU|IT|ES|PT|CH|AT|SE|DK|FI|NO|IE|PL|CZ|HU|TR|IN|BR|MX|AR|RU|TW|HK|SG|NZ|ZA|IL|EM|EU|WIPO|EUIPO)\b'
parts.gap = '[\p{Zs}\t]*\||[\p{Zs}\t]{2,}|\t'
parts.number = '\b(?:\d{1,2}/\d{3},\d{3}|\d{4}/\d{6}|\d{2}[\p{Zs}]\d{4}[\p{Zs}]\d{3}[\p{Zs}]\d{3}\.\d|\d{7,9}\.\d|(?:19|20)\d{8,10}|[7-9]\d{7})\b|\b(?:Published|Allowed|Abandoned|Opposed|PUBLISHED|ALLOWED|ABANDONED|OPPOSED)(?:[\p{Zs}\t]*\||[\p{Zs}\t]{2,}|\t)'
parts.date = '\b(?:\d{1,2}[-\p{Zs}](?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?[-\p{Zs},]+\d{2,4}|\d{1,2}[./-]\d{1,2}[./-]\d{2,4}|(?:19|20)\d{2}-\d{2}-\d{2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?[\p{Zs}]\d{1,2},[\p{Zs}]\d{4})\b'

# A patent's, a design's or a trademark's number after its word is no
# identifier (guide rule 8, issue #486): "U.S. Patent No. 8,420,710",
# "Patent US 99/123,456 (AU 2099000111)", "trademark Reg. No. 9876543",
# "Trademark Serial No. 86920111", "European Patent EP 2 286 018", a list
# of them too. "Registration No." alone may be a company's or a car's and
# stays.
[[reference]]
pattern = '\b(?:(?:U\.[\p{Zs}\t]?S\.|US|European|EP|PCT|International)[\p{Zs}\t]+)?(?:[Pp]atents?|PATENTS?|[Tt]rade[\p{Zs}\t-]?[Mm]arks?|TRADE[\p{Zs}\t-]?MARKS?|[Dd]esigns?)(?:[\p{Zs}\t]+(?:[Aa]pplication|[Rr]egistration|[Rr]eg\.|[Ss]erial|[Pp]ublication|[Ff]iling))?(?:[\p{Zs}\t]+(?:[Nn]os?\.?|[Nn]umbers?|#))?[\p{Zs}\t]*:?[\p{Zs}\t]*{entry}(?:[\p{Zs}\t]*(?:,|;|and|&|\(|or)[\p{Zs}\t]*{entry}\)?)*'
parts.entry = '(?:(?:US|EP|WO|PCT|DE|GB|UK|FR|JP|CN|KR|AU|CA|EM|EU)[\p{Zs}\t]?)?(?:\d{1,2}/\d{3},\d{3}|\d{1,3}(?:,\d{3}){1,2}|\d{4}/\d{6}|\d{2}[\p{Zs}]\d{4}[\p{Zs}]\d{3}[\p{Zs}]\d{3}\.\d|\d[\p{Zs}]\d{3}[\p{Zs}]\d{3}|\d{5,}(?:\.\d)?)(?:[\p{Zs}\t]?[ABCES]\d?\b)?'

# A form's number is no identifier (guide rule 8, issue #486): "form
# STD009X.UK", "Form 10-K", "OPM Form 1203-FX", "Standard Form 1449", "Form
# W-9", "SF 1449". An industry's code too: "NAICS 541511", "NAICS:" with
# its code on the next line, "SIC code 7372".
[[reference]]
pattern = '\b(?:(?:[A-Z]{2,5}|Standard|STANDARD)[\p{Zs}\t]+)?(?:[Ff]orm|FORM)[\p{Zs}\t]+(?:(?:[Nn]o\.?|#)[\p{Zs}\t]*)?[A-Z]{0,4}-?\d[\dA-Z]*(?:[.\-/][\dA-Z]+)*|\bSF[\p{Zs}\t-]?\d{2,4}[A-Z]?\b|\b(?:NAICS|SIC|PSC|NACE)(?:[\p{Zs}\t]+[Cc]odes?)?[\p{Zs}\t]*(?:[:#]|[Nn]o\.)?[\p{Zs}\t]*\d{2,6}(?:\.\d{1,2})?(?:[\p{Zs}\t]*(?:,|and|or)[\p{Zs}\t]*\d{2,6}(?:\.\d{1,2})?)*'

# A toll-free prefix alone is no phone: 'a toll-free "800" access number',
# 'toll-free “1-800”, “1-888” and “1-877”' (guide rule 6, issue #486). A
# whole toll-free number is an organization's phone and stays a phone
# ("toll-free 1-800-555-0199", "8-800-555-35-35").
[[reference]]
pattern = '\b(?:[Tt]oll[\p{Zs}\t-]*[Ff]ree|[Ff]reephone)[\p{Zs}\t]*{prefix}(?:[\p{Zs}\t]*(?:,|or|and)[\p{Zs}\t]*{prefix})*(?:[\p{Zs}\t]+(?:access[\p{Zs}\t]+)?(?:numbers?|lines?|service))?'
parts.prefix = '[“"‘\x27]?(?:1-[\p{Zs}\t]?)?\d{3}\b[”"’\x27]?'

# A link's query value that mixes lower case, upper case and digits is a
# session or tracking token, no identifier
# ("https://example.invalid/p?srsltid=AbCd_123xYz"; guide rules 6 and 7,
# issue #486). A value of digits alone ("?inn=7701234567"), of one case
# ("?passport=AB1234567") or without digits ("?name=JaneMorgan") stays,
# as visible text would.
[[reference]]
pattern = '(?P<lead>\b(?:https?://|www\.)[^\s?#<>()\[\]]*\?(?:[^\s#&<>()\[\]]*&)*[A-Za-z_][A-Za-z0-9_.-]*=){token}'
parts.token = '[A-Za-z0-9_~-]*(?:[a-z][A-Za-z0-9_~-]*[A-Z][A-Za-z0-9_~-]*\d|[a-z][A-Za-z0-9_~-]*\d[A-Za-z0-9_~-]*[A-Z]|[A-Z][A-Za-z0-9_~-]*[a-z][A-Za-z0-9_~-]*\d|[A-Z][A-Za-z0-9_~-]*\d[A-Za-z0-9_~-]*[a-z]|\d[A-Za-z0-9_~-]*[a-z][A-Za-z0-9_~-]*[A-Z]|\d[A-Za-z0-9_~-]*[A-Z][A-Za-z0-9_~-]*[a-z])[A-Za-z0-9_~-]*'

# A money scale or a written-out number is no tax identifier (#547, and
# #389's rate-as-TAX root). Labels still decide real identifier values.
[[shape]]
category = "TAX"
forbid = ['(?i)[$£€]|\b(?:hundred|thousand|million|billion|trillion)\b']

# A labelled TAX value stays beside money; only contextual amount
# guards are bypassed, never the category's ordinary shape checks.
# UTR is a personal tax identifier too. An SSN is IDENTITY (#381), whose
# shape has no amount guards to lift.
# A tab or two spaces ends the labelled value at the next column.
[[shape]]
category = "TAX"
unless_in = ['(?i:\b(?:tax id|tin|ein|inn|vat|utr)\b)[\p{Zs}\t:*_№.#]{1,8}[A-Z]{0,2}\d[0-9OIl-]*(?:\p{Zs}[0-9OIl-]+)*\b']

# A labelled BANK value stays beside money; only contextual amount
# guards are bypassed, never the category's ordinary shape checks.
# Routing, ABA routing and their optional "number" suffix identify bank values too.
# A tab or two spaces ends the labelled value at the next column.
[[shape]]
category = "BANK"
unless_in = ['(?i:\b(?:bank account|account number|account no|account|sort code|iban|acct|a/c|(?:aba\p{Zs})?routing(?:\p{Zs}number)?|aba)\b)[\p{Zs}\t:*_№.#]{1,8}(?:[A-Z]{2}\d{2}[A-Z0-9]{11,30}|\d[\d/-]*(?:\p{Zs}[\d/-]+)*(?:[,.]\d+)?)\b']

# A labelled PHONE value stays beside money; only contextual amount
# guards are bypassed, never the category's ordinary shape checks.
# Mobile and cell labels identify phone values too, with an optional "number",
# and so do extension labels ("ext. 207"). A value may open with a bracket
# ("Tel. (020) 7946 0958") and hold dots ("Tel. 202.555.0199"); an
# extension written "x207" after the labelled number is part of it.
# A tab or two spaces ends the labelled value at the next column.
[[shape]]
category = "PHONE"
unless_in = ['(?i)\b(?:phone|telephone|tel|fax|mobile|cell|ext|extension)(?:\p{Zs}number)?\b[\p{Zs}\t:*_№.#]{1,8}\+?\(?\d[\d().–-]*(?:\p{Zs}[\d().–-]+)*(?:\p{Zs}?x\d{1,6}\b)?']

# A file number in a Windows document's name is no phone (#375): the code
# in "W:\Penrow\09-F-0999 final.doc". Only one path is read, from its drive
# through its folders (no spaces) to the first document extension, and
# only a code token with both a letter and a digit in its file name goes.
# A phone elsewhere on the line, or a whole phone in a file name
# ("contacts 020 7946 0958.txt"), stays. Labelled phones still win.
[[shape]]
category = "PHONE"
forbid_in = ['(?i)(?P<lead>\b[a-z]:\\(?:[^\\\s<>"|?*;]+\\)*(?:[^\\<>"|?*;\r\n]{0,80}?[\p{Zs}_])?)[\p{L}\d-]*(?:\p{L}[\p{L}\d-]*\d|\d[\p{L}\d-]*\p{L})[\p{L}\d-]*(?P<tail>[^\\<>"|?*;\r\n]{0,80}?\.(?:docx?|pdf|txt|xlsx?)\b)']
