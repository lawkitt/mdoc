# mdoc's rule pack, part 1 of 3: rules for any language (ADR 0092).
# Compiled in with `include_str!`; `rules.rs` checks every entry when it
# loads. The pack is shared.toml, then en.toml, then ru.toml.
#
# Sections:
#   never     words that never name anyone on their own
#   context   a label proposes a category for the value beside it
#   shape     what a span of each category must look like, and what makes
#             a manual selection that category
#   span      whole spans by pattern (an address from its first element
#             to its postcode or city), and boundary fixes for model spans
#   variants  nicknames of given names, for names already in the document
#   role_surnames lowercase occupational surnames kept when capitalized as PERSON
#   reference legal references and markers no model span is inside
#   private   bodies that are never public, whoever owns them
#   label     an identifier field's labels, beside values in one model span
#
# Categories are written as their tokens: PERSON, ORG, EMAIL, PHONE,
# ADDRESS, IDENTITY, TAX, BANK, CASE, DATE, REDACTED.
#
# A `context` entry proposes its `category` for the value after a label:
#   labels  = […]    phrases, case ignored (only here), matched as whole
#                    words; a space matches any run of whitespace
#   between = regex  what may sit between the label and the value
#   value   = regex  the value, never followed by a letter or digit; only it
#                    is proposed, never the label
# and optionally:
#   min_digits     = n           a value with fewer digits is not proposed
#   unless_after   = [word…]     no label just after one of these words
#                                ("in case")
#   unless_guessed = [category…] no value these categories' guesses take
#   only_guessed   = [category…] only a value one of them takes
#   line_start     = true        the label opens its line: only whitespace
#                                and Markdown marks (#, >, *, _, |) before
#                                it (a caption's "No.")
#   unless_slashed = true        no label joined to another by a slash,
#                                just before or after it, spaces aside
#                                ("ИНН/ОГРН"): the list's values are one run
#                                left to the model; not with `after`
#   after          = true        the labels follow the value instead ("a
#                                March 9, 1984 birth date"): `between` is
#                                what sits after the value; the labels are
#                                lowercase and match as written, a space in
#                                one only spaces on its line; the value
#                                starts after a space, a quote or a bracket;
#                                a table column never takes such a label; no
#                                line_start or unless_after. The review
#                                counts a date's repeats before the same
#                                label (mdoc-pii `Cue::After`). With it:
#   only_after     = [word…]     one of these words just before the value
#                                ("a", "his"); "'s" is any possessive
#   follow         = regex       what must follow the label ("." after
#                                "г.р"; punctuation, not a noun)
# A context match wins over a model span on the same text.
#
# A `never` entry lists lowercase `words`, matched `whole`, `plural` (with an
# `s`) or as a `stem` with up to `ending` letters. An entry matched as
# `pattern` lists `patterns` instead, regexes: a model span of its
# `anywhere_in` categories (required) that matches one outside quotes goes
# like a court ("Department of Labor", "Massachusetts" alone). Optionally:
#   last_word_of = [category…]  a model span of these categories ending in
#                               one of the words is dropped (a role phrase)
#   not_endings  = [ending…]    for a stem: endings that never count (a
#                               surname's "-ов" after a role stem)
#   anywhere_in  = [category…]  a model span of these categories with one of
#                               the words anywhere outside quotes is dropped
#                               (a court) after the span fixes, unless it
#                               has a legal form
#   unless_named = true         common words ("He", "Program", "French"):
#                               no name alone, but in a person's span a
#                               name after a title ("Mr He") or where
#                               another person span has the word beside a
#                               name ("Dawn French"); decided after the span
#                               fixes. One initial before one names no one
#                               ("B. General Terms"). Takes no anywhere_in,
#                               and last_word_of only for categories other
#                               than PERSON ("Bright Paths Program")
#   unless_titled = true        with PERSON in anywhere_in: a person's
#                               title before the span keeps it as a person
#                               ("Ms St. Louis"), and for a stem initials
#                               do too where the span is a name alone
#                               ("Суд Н. О."); a pattern entry needs
#                               anywhere_in PERSON alone
#   unless_last_named = true    for a pattern entry with anywhere_in PERSON
#                               alone: the span stays a person where the
#                               document names its last word, another
#                               person span with it beside a name or a
#                               title before it ("Ms Standard")
#   person_role = true          with unless_named: an initial + capitalized
#                               role remains PERSON; plural surnames must
#                               be listed in role_surnames
#   phrase_only = true          with unless_named alone: role modifiers count
#                               only beside a role head, never alone
#   person_endings = [ending…]  for a stem with PERSON in anywhere_in: in
#                               a person's span the stem counts only with
#                               one of these endings ("" for none), the
#                               word's own forms; any other makes a
#                               surname ("Судник", "Приставко")
#   surname_endings = [ending…] with person_endings: those of them that
#                               make a surname of a capitalized word
#                               ("Судов", but "судов общей юрисдикции")
#
# A `span` entry for a `category` is one of two kinds. With a `pattern`
# it proposes each match as a whole span; `{name}` in the pattern stands
# for `parts.name`, a regex; a group named `lead` or `tail` is context the
# span leaves out ("адресу " before a city). A match wins over a model
# span inside it and gives way to a model span of its category that
# reaches past it, a span of another category across its edge and any
# other rule's span in it; a match before a colon (a field's label) goes.
# A pattern entry may also have:
#   split       = regex       the match, `lead` and `tail` left out, is cut
#                             at each of its matches: every piece between
#                             them is a span of its own (a passport's name
#                             fields between their `<` fillers); no
#                             continuation. A model span inside the whole
#                             match, `lead` and `tail` included, is no
#                             evidence against its pieces
#   line_length = [least, most]  each line of the whole match that is not
#                             blank, `lead` and `tail` included, has least
#                             to most characters, without the whitespace
#                             at its ends, its backslashes (Markdown's
#                             escapes and hard breaks) and the text of its
#                             groups named `mark`, `mark2`, … (a
#                             blockquote's marks, a label)
#   skip        = regex       a span in which it matches is not proposed (a
#                             masked name, "XXXXX")
# Without a pattern an entry
# fixes a model span's boundaries, in this order:
#   extend    = [regex…]  a span inside a match grows to the whole match
#                         (the longest, when several hold it), never
#                         into part of another span of its category, and
#                         a person's never over a `never` word (a role),
#                         except to drop a quoted public institution's own
#                         name ("МВД России «…»");
#                         earlier spans grow first; for PERSON only, a
#                         group named `lead` (the only group allowed) is
#                         context the grown span leaves out ("Judge "
#                         before "K Ashdale"), and such a match never grows
#                         over any part of another category's span
#   unless_over = […]     with extend: lowercase words a span never grows
#                         over ("exhibit" in "EXHIBIT A. WELK")
#   trim_start = [regex…] case-sensitive prefixes that come off the start,
#                         with some name left after them; in an entry with
#                         `extend`, only off a span that entry grew; with a
#                         group named `rest` (the only group allowed), only
#                         what comes before it ("Judge " before "K
#                         Ashdale")
#   trim      = […]       lowercase words that come off either edge, a
#                         word's own final period or colon with it, and
#                         a comma before a trailing one; or phrases of them,
#                         single-spaced ("in re"), with a word left beside
#   role_trim = true      for ORG role words/phrases: require comma, dash,
#                         colon or leading for; keep the whole span if
#                         the remainder does not identify an organization
#   strip_end = "…"       punctuation that comes off the end, except an
#                         initial's period
#   person_before = […]   for ORG: lowercase words that, ending a span, make
#                         it a person's document ("Ostrand Decl."): the
#                         words before become a person's span when a person
#                         span holds each of them
#                         An existing PERSON loses the same document word
#                         in a punctuated citation ("Ostrand Decl. ¶ 3").
#   org_before = […]      for PERSON: lowercase words or single-spaced
#                         phrases that, after one capitalized name word,
#                         make a model span a company's: written lowercase
#                         the noun comes off ("Pellam" of "Pellam
#                         airlines"), capitalized the whole span is
#                         ("Pellam Airlines"); never after a title. A
#                         one-word company before one is a short name
#   org_after = […]       for PERSON: lowercase phrases right before a
#                         model span that make it a company's ("team known
#                         as the" before "Brindle Harriers"); a leading
#                         "the" of the span comes off; the name must end
#                         with the span
# After these fixes a model person's span that is a company's short name
# in the same document becomes that company (`company_short_names` in
# rules.rs, #548).
#   list_letter = true    for PERSON or ORG: a lowercase "a. " or "(a) "
#                         at a line start or after list punctuation comes off
# A fixed span left without its category's shape goes. An entry takes one
# kind's keys only.
#
# A `reference` entry is a legal reference or a marker that is no
# identifier, address or name (the fixture guide's rule 8): "424 U.S. at
# 38", "26 U.S.C. § 6212", "127-ФЗ", "статьи 431 ГК РФ". A model span of any
# category inside a match is never proposed; one reaching past it stays (a
# real number beside a citation), and labelled values (`context`) and the
# structured rules are never checked against it. `pattern` and `parts` work
# as in a `span` pattern, `lead` and `tail` groups included; a match stays
# on one line.
# With `when = [regex, ...]` and `categories = ["PERSON", "ORG"]`, a
# reference is checked after boundary fixes, over the decoded document.
# Each `when` regex and `pattern` must capture `series`: only series found
# by document evidence are references. An optional `series2` in `pattern`
# must be established too (a range). This keeps unexplained short names
# and identifiers; the match never discards a name reaching beyond it.
# A bracketed reference at the end of a name comes off ("Penrow (C1)").
#
# A `reference` whose pattern has groups named `party`, `party2`, … is a
# cited case ("Pellam v. Ostrand, 912 F.3d 455"), its parties those groups.
# Its matches are searched over the whole text (a match may wrap), after the
# span fixes. A name inside one goes unless it names a party of the case at
# hand: a name the model found outside every cited case, a word of the
# document's caption, or a name beside a role or after a title. Any other
# model span inside a cited case naming no such party goes, and so does a
# labelled case number (`context`) there. A `docket` group marks a citation
# by docket number, which a caption may carry too. Such an entry may list
# `roles`, lowercase words ("plaintiff") that make the name beside them a
# party of the case at hand, and `own_before`, phrases ("under appeal")
# that make the cited case after them the case at hand's, for every cited
# case in the pack. Short forms ("in Pellam") are not cited cases (#561).
#
# A `private` entry lists `patterns`, regexes: a span that matches one,
# quotes and legal form included, is never a court or public body,
# whatever `never` says ("ФГБОУ ВО «… университет»", "Негосударственный
# пенсионный фонд «…»"), unless it matches one of its optional `unless`
# regexes too ("Electoral College"). Anchor the patterns: a public body
# may have the word inside ("Ministry of Colleges and Universities").
#
# A `label` entry lists lowercase `words` (phrases of them, without their
# dots: "тел" for "тел."), each the label of a field of its `category`
# (TAX, BANK, IDENTITY or PHONE). A model identifier span holding a rule's
# value and the next field ("7701234567, р/с 40702810900000012345") keeps
# that field's value when a label of this, a `context` or a `span` `trim`
# list of these categories sits just before it, as the label's category
# (#739). A `context` or `trim` label need not be repeated here; a value
# after a `context`'s label must be one its `value` takes whole. A word is
# one category's only. Optionally:
#   strict     = true      the words name the category only for a value of
#                          its strict, unlabelled shape ("счёт")
#   only_after = [word…]   the label counts only after one of these words
#                          in its field ("паспорт … серии"); alone it is
#                          `strict`, after other words it names nothing
#
# A `shape` entry has any of:
#   min_code_chars = n  a model value needs n digits and capital letters
#                       together, across all its groups ("24" and "[021]"
#                       have too few; a SWIFT code's capitals count)
#   lowercase_at_most_digits = true  a model value has no more lowercase
#                       letters than digits ("Alternative Segment 3")
#   forbid_unlabelled = [regex…]  like `forbid`, but `unless_in` lifts it
#   require = [regex…]  a model span must match each one somewhere
#   forbid  = [regex…]  a model span must match none
#   case    = [regex…]  a model span matching one (anchor it yourself) is
#                       no value of this category but a court's case
#                       number, proposed as CASE: its group `case` if it
#                       has one, else the whole span. A reference or a
#                       cited case around it still removes it
#   forbid_in = [regex…] a model span inside a match in its surrounding
#                       line is dropped; `lead` and `tail` groups leave
#                       context outside the forbidden range, as for `span`.
#                       Read through the same view as detection; labelled
#                       values and structured rules still win. No empty
#                       match or other named group is allowed. Numeric fields
#                       joined only by whitespace outside the candidate do
#                       not justify rejection; a decimal touching it does.
#   unless_in = [regex…] a span inside one of these matches is exempt only
#                       from `forbid_in`, `forbid_unlabelled` and digit/letter
#                       counts (a labelled value);
#                       the other shape checks still apply. Same syntax.
#   word    = regex     some word of a model span (trimmed of punctuation
#                       other than `-`) must match it and not be a `never`
#                       word; one per category in the whole pack
#   guess   = [regex…]  a manual selection that matches one in full is this
#                       category
#   guess_words = […]   a manual selection with one of these words (ASCII
#                       case ignored) is this category
#   forbid_quotes = ["«»"…]  a model span wrapped exactly in one of these
#                       quote pairs is not this category
#   quotes_after  = […] lowercase stems: then only after a word written in
#                       lowercase that is one with a noun's case ending
#                       ("повести «…»", not "Роман «…»", "рассказал «…»")
#   quotes_after_words = […]  or after one of these words as written ("ПО
#                       «…»", not "по «…»"); a span holding its own quotes
#                       counts as wrapped
# In these regexes `\p{Uppercase}`, `\p{Alphabetic}` and `\p{N}` mean what
# Rust's `char` predicates mean, whose Unicode tables may be newer than the
# regex crate's.
#
# A category with no entry takes any span. Manual selections try each
# category's guesses in the order the categories first appear in the pack.

# Context rules are per language.
context = []

# Span patterns and fixes are per language, but for a machine-readable
# zone's names, which ICAO 9303 writes the same in every language (end
# of this file).

# Nicknames, as [[variants]] with `name` and its `forms`. None yet.
variants = []

# Drawing dimensions are a reference (end of this file); others are per
# language.

# No language-free never words.
never = []

# Dates: 12.03.2026 (optionally "г."), 2026-03-12, and blank forms to fill
# in by hand (`«__» ____ 2026 г.`, underscores possibly escaped as `\_`).
# Surrounding spaces are ignored. A year or a month alone is not a date.
[[shape]]
category = "DATE"
guess = [
    '(?i)\s*\d{1,2}[./]\d{1,2}[./]\d{2,4}(?:\s*г\.?)?\s*',
    '\s*\d{4}-\d{2}-\d{2}\s*',
    '(?i)\s*[«"]?(?:\d{1,2}|(?:\\?_)+)[»"]?\s+(?:\\?_)+\s+(?:\d{4}|(?:\\?_)+)(?:\s*(?:г\.?|года))?\s*',
]

# Amounts are never TAX, BANK or PHONE (guide rule 8, #547): the shared
# `forbid_in` patterns below read decimal parts, currency/scale words and
# arithmetic around a model span, including OCR-joined numeric table cells.
# Numeric groups and their cues use at most one space, never a tab: a
# column gap (two or more spaces or a tab) starts a neighbouring field.
# A space-grouped integer without an amount cue stays: it might identify
# someone. Grouping alone cannot distinguish a neighbouring identifier
# from another amount group: contextual rejection must not cross a numeric
# field outside the candidate through whitespace alone. Comma decimals have
# two digits, except for the explicit OCR-join form ("762,0323 058 712,74"). Currency symbols are
# prefixes; a currency word before a bare integer needs a colon.
# Dot decimals exclude dates: `tail` implements `(?![.,]\d)` without
# look-around, which the regex engine does not support.
# Twenty-digit bank accounts and labelled values are exempt and always win.
# Phones: a model span needs a digit; a manual selection of at least seven
# digits with only spaces, `+`, brackets and dashes between is a phone. No
# phone number has 16 digits in a row (E.164 allows 15), and a bare nine-digit
# number starting 04 is a Russian bank code (БИК), not a phone.
[[shape]]
category = "PHONE"
forbid_in = [
    # Decimal comma and OCR-joined decimal cells, including fragments.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}(?:\p{Zs}(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2})*\b',
    # Dot decimals with a bounded tail, so dates do not qualify.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)\.\d{2}\b(?P<tail>(?:[.,](?:\D|$)|[^.,\d]|$))',
    # Currency before a value needs a colon or decimals, never bare grouping.
    '(?i)\b(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?)\b\.?(?:\p{Zs}?:\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?|\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))\b',
    # A currency symbol prefixes its own numeric field.
    '(?i)[$£€]\p{Zs}?\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?(?:\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?)?',
    # A trailing currency symbol identifies this field without a total label.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?[$£€]',
    # A currency or scale word follows its own numeric field.
    '(?i)\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?',
    # Decimal arithmetic is no identifier.
    '(?i)\b\d+[,.]\d+(?:\p{Zs}?[xх×*]\p{Zs}?\d+(?:[,.]\d+)?)+\b',
]
require = ['\p{N}']
forbid = ['\p{N}{16,}', '^\s*04\d{7}\s*$']
guess = ['[ +()\-\x{a0}]*(?:[0-9][ +()\-\x{a0}]*){7,}']

# Organizations: a capital or digit, and a word that is not a never word
# ("the Employer" is not one). Continental legal forms mark one. A bare site
# domain is no organization ("NALOG.GOV.RU", "example.invalid", "сайт.рф",
# "Grants.gov"; issue #488): two letters or more before a common zone, so
# "E.ON" and "Alfa.Bank" stay.
[[shape]]
category = "ORG"
require = ['[\p{Uppercase}\p{N}]']
forbid = ['(?i)^\s*[«"]?(?:https?://)?(?:[a-z0-9а-яё-]+\.)*[a-z0-9а-яё-]{2,}\.(?:ru|su|рф|рус|com|org|net|info|biz|io|pro|online|site|app|dev|me|eu|uk|us|de|by|kz|ua|gov|edu|mil|int|invalid|example|test)/?[»"]?\s*$']
word = '.'
guess_words = ["GmbH", "AG", "SA", "BV"]

# People: a capitalized word that is not a never word ("Ms Bennett", not
# "Ms" or "husband"). A manual selection of 1–4 capitalized words is a
# person; hyphenated surnames, apostrophes and initials ("М.С.", "J.R.")
# count. A surname glued to its lowercase particle is capitalized after it
# ("d'Estaing", "д'Артаньян", "al-Hadid", "аль-Хадид"; #403).
[[shape]]
category = "PERSON"
word = '^(?:\p{Uppercase}|[dд][\x27’]\p{Uppercase}|(?:al|el|аль|эль)-\p{Uppercase})'
guess = [
    '\s*(?:(?:\p{Uppercase}\.)+|\p{Uppercase}[\p{Alphabetic}\x27’]*(?:-\p{Uppercase}[\p{Alphabetic}\x27’]*)*)(?:\s+(?:(?:\p{Uppercase}\.)+|\p{Uppercase}[\p{Alphabetic}\x27’]*(?:-\p{Uppercase}[\p{Alphabetic}\x27’]*)*)){0,3}\s*',
]

# A name wrapped exactly in «» after a common noun for a work or a product
# is a title ("повести «Кедровый свет»"), not a person. A name quoted
# elsewhere stays a person ("назван «Иван Петров»", "по прозвищу «…»",
# "Роман «Сокол»"), and so does one after a company's legal form, which the
# ORG span holds ("ООО «Вера Снегирь»"): never dropped, at worst the wrong
# category.
[[shape]]
category = "PERSON"
forbid_quotes = ["«»"]
quotes_after = [
    "повест", "роман", "рассказ", "новелл", "книг", "рукопис", "сборник",
    "стих", "поэм", "пьес", "сценари", "журнал", "газет", "издани", "стать",
    "фильм", "сериал", "мультфильм", "песн", "альбом", "спектакл",
    "постановк", "картин", "произведени", "проект", "программ", "сайт",
    "приложени", "бренд", "марк", "знак", "игра", "игры", "игре", "игру",
    "шоу", "передач", "выставк", "фестивал", "конкурс",
]

# Emails need an `@` and a dotted domain; the model also tags the word
# "email", bare domains and "not-a-mail@localhost".
[[shape]]
category = "EMAIL"
require = ['@[^@\s]+\.\p{Alphabetic}{2,}']

# Addresses need a capital or a digit, and a word that is not a never word:
# "addresses" or "Address" alone is not one. They also need a house or
# postcode number, a street word, abbreviated or not ("пер. Кленовый",
# "Cedar Court"), or a comma or line break between parts ("The Old
# Rectory, Nether Compton"): a city alone ("Cardiff", "Москва") is not an address (issue
# #386).
[[shape]]
category = "ADDRESS"
require = [
    '[\p{Uppercase}\p{N}]',
    '\p{N}|,|\n|(?i:\b(?:ул|улица|пр-т|пр|проспект|пер|переулок|наб|набережная|б-р|бульвар|пл|площадь|ш|шоссе|проезд|тупик|аллея|линия|тракт|просека|мкр|микрорайон|квартал|road|street|lane|ln|avenue|boulevard|blvd|mews|close|court|drive|dr|way|place|square|crescent|gardens|terrace|yard|row|hill|grove|walk|parade|rd|st|ave)\b)',
]
word = '.'

# Identity documents need a digit; "passport" alone is not one.
[[shape]]
category = "IDENTITY"
require = ['\p{N}']

# Tax identifiers need a digit; "ИНН" alone is not one. A rate ("20 percent
# tax", "НДС 20%") is no identifier, and neither is a Russian document series
# before its number ("ФС 086731924", a writ).
[[shape]]
category = "TAX"
forbid_in = [
    # Decimal comma and OCR-joined decimal cells, including fragments.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}(?:\p{Zs}(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2})*\b',
    # Dot decimals with a bounded tail, so dates do not qualify.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)\.\d{2}\b(?P<tail>(?:[.,](?:\D|$)|[^.,\d]|$))',
    # Currency before a value needs a colon or decimals, never bare grouping.
    '(?i)\b(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?)\b\.?(?:\p{Zs}?:\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?|\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))\b',
    # A currency symbol prefixes its own numeric field.
    '(?i)[$£€]\p{Zs}?\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?(?:\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?)?',
    # A trailing currency symbol identifies this field without a total label.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?[$£€]',
    # A currency or scale word follows its own numeric field.
    '(?i)\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?',
    # Decimal arithmetic is no identifier.
    '(?i)\b\d+[,.]\d+(?:\p{Zs}?[xх×*]\p{Zs}?\d+(?:[,.]\d+)?)+\b',
]
require = ['\p{N}']
forbid = ['(?i)percent|per cent|%|процент', '[А-ЯЁа-яё]{2,}\s+\d']

# Bank details need a digit and no `/` beside a digit: case and claim
# numbers ("6001842/2026") are not bank details, while an account's label
# ("р/с", "a/c") is trimmed off its span (#486). A bare ten- or
# eleven-digit number is a tax number, a phone or a contract number far
# more often than an account (Russian accounts have 20 digits, UK ones 8
# with a sort code): only a label makes it bank details.
[[shape]]
category = "BANK"
# Twenty digits, with optional spaces, can be a real account even beside
# money. Keep that evidence over the surrounding amount cues.
unless_in = ['\b\d(?:\p{Zs}?\d){19}\b']
forbid_in = [
    # Decimal comma and OCR-joined decimal cells, including fragments.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}(?:\p{Zs}(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2})*\b',
    # Dot decimals with a bounded tail, so dates do not qualify.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)\.\d{2}\b(?P<tail>(?:[.,](?:\D|$)|[^.,\d]|$))',
    # Currency before a value needs a colon or decimals, never bare grouping.
    '(?i)\b(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?)\b\.?(?:\p{Zs}?:\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?|\p{Zs}?(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))\b',
    # A currency symbol prefixes its own numeric field.
    '(?i)[$£€]\p{Zs}?\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?(?:\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?)?',
    # A trailing currency symbol identifies this field without a total label.
    '\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?[$£€]',
    # A currency or scale word follows its own numeric field.
    '(?i)\b(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)(?:(?:(?:,\d+(?:\p{Zs}\d{3})*)?,\d{2}|\.\d+))?\p{Zs}?(?:руб(?:л[а-яё]*)?|коп(?:е[а-яё]*)?|тыс|млн|млрд|dollars?|pounds?|euros?|thousand|million|billion|trillion)\b\.?',
    # Decimal arithmetic is no identifier.
    '(?i)\b\d+[,.]\d+(?:\p{Zs}?[xх×*]\p{Zs}?\d+(?:[,.]\d+)?)+\b',
]
require = ['\p{N}']
forbid = ['\p{N}\s*/|/\s*\p{N}', '^\s*\d{10,11}\s*$']

# Numbers that are no tax, bank, identity or phone value, whatever the
# model guessed (guide rules 6 and 8, issue #486): digits grouped by commas
# ("8,420,710", a US patent or an amount; "12/432,845", a patent
# application), a span across a blank line (a page's footer), and a
# document's code with its country after a dot ("STD001Y2K.UK", a form).
# An account's decimals ("12345.67"), a passport's groups ("4510 123456")
# and an IBAN's ("GB29 NWBK 6016 …") stay.
[[shape]]
category = "TAX"
forbid = [
    '^\s*(?:\d{1,2}/)?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\s*$',
    '\n[\p{Zs}\t]*\r?\n',
    '^\s*[A-Z]{2,}[A-Z0-9]*\d[A-Z0-9]*\.[A-Z]{2,3}\s*$',
]

# The same as bank details.
[[shape]]
category = "BANK"
forbid = [
    '^\s*(?:\d{1,2}/)?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\s*$',
    '\n[\p{Zs}\t]*\r?\n',
    '^\s*[A-Z]{2,}[A-Z0-9]*\d[A-Z0-9]*\.[A-Z]{2,3}\s*$',
]

# The same as an identity document's number.
[[shape]]
category = "IDENTITY"
forbid = [
    '^\s*(?:\d{1,2}/)?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\s*$',
    '\n[\p{Zs}\t]*\r?\n',
    '^\s*[A-Z]{2,}[A-Z0-9]*\d[A-Z0-9]*\.[A-Z]{2,3}\s*$',
]

# A dotted date's day, month or year is no account, and neither is the
# whole date: the model's "03" in «от 30.03.2015 N 52н» (guide rule 4,
# #480). A real day and month only, not inside a longer dotted number
# ("40817.810.12.03.2031" stays). A labelled account keeps its own rule.
# A two-digit year only after «от» («от 30.03.15»): a sort code is dotted
# too ("Sort code: 20.03.12", «Счёт 12.03.31») and stays.
[[shape]]
category = "BANK"
forbid_in = [
    '(?P<lead>(?:^|[^\d.,]))(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.\d{4}(?P<tail>(?:[^.\d]|\.(?:\D|$)|$))',
    '(?P<lead>(?i:\bот)[\p{Zs}\t]+)(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])\.\d{2}(?P<tail>(?:[^.\d]|\.(?:\D|$)|$))',
]

# The same as a phone, and a page number between dashes ("-44-", "– 12 –")
# is no phone either; "555-12-34" keeps its dashes between digits.
[[shape]]
category = "PHONE"
forbid = [
    '^\s*(?:\d{1,2}/)?\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\s*$',
    '\n[\p{Zs}\t]*\r?\n',
    '(?:^|\s)[-–—][\p{Zs}\t]?\p{N}{1,4}[\p{Zs}\t]?[-–—](?:\s|$)',
]

# A GUID is a document's or a record's, no tax, bank or phone value
# ("b539f4a9-4e5f-4abb-bec6-aae430c254f2", a power of attorney's; issue
# #486), and neither is one token mixing lower and upper case letters, a
# link's query value ("AfmBOorJnJ4Ys9vL"). Three lower case letters in a
# row at least: an OCR-damaged number ("77l12345O7") stays.
[[shape]]
category = "TAX"
forbid = [
    '(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b',
    '^\s*[A-Za-z0-9_-]*(?:[a-z]{3}[A-Za-z0-9_-]*[A-Z]|[A-Z][A-Za-z0-9_-]*[a-z]{3})[A-Za-z0-9_-]*\s*$',
]

# The same as bank details.
[[shape]]
category = "BANK"
forbid = [
    '(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b',
    '^\s*[A-Za-z0-9_-]*(?:[a-z]{3}[A-Za-z0-9_-]*[A-Z]|[A-Z][A-Za-z0-9_-]*[a-z]{3})[A-Za-z0-9_-]*\s*$',
]

# The same as a phone.
[[shape]]
category = "PHONE"
forbid = [
    '(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b',
    '^\s*[A-Za-z0-9_-]*(?:[a-z]{3}[A-Za-z0-9_-]*[A-Z]|[A-Z][A-Za-z0-9_-]*[a-z]{3})[A-Za-z0-9_-]*\s*$',
]

# Web addresses (ADR 0094, guide rule 9). Scans propose a URL by its shape:
# a scheme (`http://`, `https://`, `ftp://`), `www.`, or a bare domain
# written as an address (no space, not inside an email) that ends in one of
# the `zones` below. The span runs from the scheme (or `www.`, or the bare
# domain) to the address's end, without trailing punctuation. `mailto:` and
# `tel:` stay EMAIL and PHONE.
#
# A `url` entry has any of:
#   zones  = […]  lowercase top-level domains a bare domain may end with;
#                 a file name's extension is no zone ("readme.md", "run.sh")
#   public = […]  lowercase domains never proposed, with their subdomains:
#                 courts, public bodies, laws and legal databases (guide
#                 rule 8). "gov" holds every "*.gov", so no entry lists a
#                 subdomain of another. A site that also hosts personal
#                 pages is listed by its legal sub-host only
#                 ("law.justia.com", not "justia.com" with its lawyers'
#                 profiles).
# A bare domain's zone is written in lower case, or its whole host in
# capitals ("FORMY.SVOD.INVALID"); before a two-letter zone its name has
# three letters or more ("ГК.РФ" is no address).
# A domain with a scheme or `www.` needs no zone.
[[url]]
zones = [
    "com", "org", "net", "info", "biz", "io", "pro", "online", "site",
    "app", "dev", "me", "co", "eu", "uk", "us", "de", "fr", "it", "es",
    "nl", "pl", "ch", "at", "be", "cz", "ee", "lv", "lt", "fi", "se", "no",
    "dk", "ie", "ca", "au", "nz", "cy", "ge", "am", "az", "by", "kz", "kg",
    "uz", "ua", "ru", "su", "рф", "рус", "invalid", "example", "test",
]
# International and common-law public and legal sites: any `.gov`, `.int`
# and `.mil`, the EU's and the UN's; and the domains reserved for examples
# (RFC 2606), which point to no one ("the reserved example.com domain").
public = [
    "gov", "int", "mil", "example.com", "example.org", "example.net",
    "europa.eu", "un.org", "courtlistener.com", "law.cornell.edu",
]

# Short line, header and route numbers are no bank details (#375): a
# pleading line "24", a plot tick "300", "Eielson Alternative Segment 3".
# A sort code ("20-00-00"), a card's last four ("ending 4242",
# "****1234"), a seven-digit account, a SWIFT/BIC code ("NWBKGB2L") and
# an IBAN's first groups ("GB29 NWBK") have enough. A label lifts both.
[[shape]]
category = "BANK"
min_code_chars = 4
lowercase_at_most_digits = true

# A bracketed page-header code ("[021]") is no phone (#375); a four-digit
# extension stays even without its label ("6121"), a three-digit one
# needs its label ("x207"). A plot's OCR-joined ticks ("1.981.96": one
# digit, a dot, a group, a dot, two digits) are no phone either, while
# dotted phones have more digits or other groups ("8.912.345.67.89",
# "(495) 123.45.67", "01.23.45.67.89", "07700.900.123").
[[shape]]
category = "PHONE"
min_code_chars = 4
forbid_unlabelled = ['^\s*\d\.\d{1,3}\.\d{2}\s*$']

# Drawing dimensions are no identifier, address or name (guide rule 8,
# #375): numbers joined by "×" ("76×6.4×914") and a bend radius written
# "<number> R to inside" ("6.4 R to inside"). Only the expression itself:
# a lone " R " is a street, block or passport letter ("1500 R Street").
[[reference]]
pattern = '\b\d+(?:[.,]\d+)?(?:[\p{Zs}\t]*×[\p{Zs}\t]*\d+(?:[.,]\d+)?)+\b|\b\d+(?:[.,]\d+)?[\p{Zs}\t]+R[\p{Zs}\t]+to[\p{Zs}\t]+inside\b'

# The names in a passport's or an ID card's machine-readable zone (ICAO
# 9303; issue #495). Each surname and given-name part between the «<»
# fillers is its own PERSON span, without them (fixture guide:
# "P<RUS⟦PERSON|KRENC⟧<<⟦PERSON|LIDIIA⟧<⟦PERSON|ARSENEVNA⟧<<<"); a
# surname of several parts gives a span per part. A passport's first line
# (TD3, 44 characters) and a TD2 card's (36) open with the document's
# code («P», or «I», «A», «C» for a card), its type («<» or a capital,
# which OCR may lose) and the issuing state, one of ICAO 9303 Part 3's
# codes (`state`, the same list as `mdoc_pii::mrz::STATES`: «RUS», «D<<»,
# «UNO», «XXA»), then the surname, «<<» and the given names, one or two
# fillers between them, padded with «<» to the line's end: capitals and
# «<» alone. OCR may lose or add some fillers, so 32 to 52 characters do.
# Imported text writes a filler escaped («\<», anydoc) and may end the
# line in a hard break («\»); an entity («&lt;») reads as «<». The line
# may sit in Markdown: a blockquote, a list item, a table cell, bold or
# code marks, or after a label («MRZ: »), which the length leaves out
# (`mark` groups). A masked name («XXXXX») is no name. The zone's other
# lines (number, dates, check digits) stay unmarked, and so do visas
# («V…»), left out for now. A lone «<<» in prose, HTML or code, a row of
# «<», capitals without a state's head («ACTION<<REQUIRED») and a short
# line match nothing.
[[span]]
category = "PERSON"
pattern = '(?m)(?P<lead>^(?P<mark>{opening})[PIAC](?:[A-Z]|\\?<)?(?:{state}))(?:{surname}(?:\\?<){2}(?:{given})?)(?P<tail>(?:\\?<)*(?P<mark2>{closing})$)'
parts.opening = '[\p{Zs}\t]*(?:>[\p{Zs}\t]*)*(?:(?:[-*+]|\d{1,9}[.)])[\p{Zs}\t]+)?(?:\|(?:[^|\n]*\|)*[\p{Zs}\t]*)?(?:[^\n:<|`*]{1,40}:[\p{Zs}\t]+)?(?:\*{1,2}|_{1,2}|`{1,2})?'
parts.closing = '(?:\*{1,2}|_{1,2}|`{1,2})?(?:[\p{Zs}\t]*\|[^\n]*)?[\p{Zs}\t]*\\?[\p{Zs}\t\r]*'
parts.surname = '[A-Z]+(?:\\?<[A-Z]+)*'
parts.given = '[A-Z]+(?:(?:\\?<){1,2}[A-Z]+)*'
parts.state = 'ABW|AFG|AGO|AIA|ALA|ALB|AND|ARE|ARG|ARM|ASM|ATA|ATF|ATG|AUS|AUT|AZE|BDI|BEL|BEN|BES|BFA|BGD|BGR|BHR|BHS|BIH|BLM|BLR|BLZ|BMU|BOL|BRA|BRB|BRN|BTN|BVT|BWA|CAF|CAN|CCK|CHE|CHL|CHN|CIV|CMR|COD|COG|COK|COL|COM|CPV|CRI|CUB|CUW|CXR|CYM|CYP|CZE|DEU|DJI|DMA|DNK|DOM|DZA|ECU|EGY|ERI|ESH|ESP|EST|ETH|FIN|FJI|FLK|FRA|FRO|FSM|GAB|GBR|GEO|GGY|GHA|GIB|GIN|GLP|GMB|GNB|GNQ|GRC|GRD|GRL|GTM|GUF|GUM|GUY|HKG|HMD|HND|HRV|HTI|HUN|IDN|IMN|IND|IOT|IRL|IRN|IRQ|ISL|ISR|ITA|JAM|JEY|JOR|JPN|KAZ|KEN|KGZ|KHM|KIR|KNA|KOR|KWT|LAO|LBN|LBR|LBY|LCA|LIE|LKA|LSO|LTU|LUX|LVA|MAC|MAF|MAR|MCO|MDA|MDG|MDV|MEX|MHL|MKD|MLI|MLT|MMR|MNE|MNG|MNP|MOZ|MRT|MSR|MTQ|MUS|MWI|MYS|MYT|NAM|NCL|NER|NFK|NGA|NIC|NIU|NLD|NOR|NPL|NRU|NZL|OMN|PAK|PAN|PCN|PER|PHL|PLW|PNG|POL|PRI|PRK|PRT|PRY|PSE|PYF|QAT|REU|ROU|RUS|RWA|SAU|SDN|SEN|SGP|SGS|SHN|SJM|SLB|SLE|SLV|SMR|SOM|SPM|SRB|SSD|STP|SUR|SVK|SVN|SWE|SWZ|SXM|SYC|SYR|TCA|TCD|TGO|THA|TJK|TKL|TKM|TLS|TON|TTO|TUN|TUR|TUV|TWN|TZA|UGA|UKR|UMI|URY|USA|UZB|VAT|VCT|VEN|VGB|VIR|VNM|VUT|WLF|WSM|YEM|ZAF|ZMB|ZWE|D\\?<\\?<|GBD|GBN|GBO|GBP|GBS|RKS|EUE|UNO|UNA|UNK|XBA|XIM|XCC|XCE|XCO|XEC|XPO|XES|XMP|XOM|XDC|XXA|XXB|XXC|XXX'
split = '(?:\\?<)+'
skip = '^X+$|XXX'
line_length = [32, 52]

# The names on a TD1 ID card's third line (30 characters), under its first
# line (the code «I», «A» or «C», type, state and document number) and its
# second (birth date, check digit, sex, expiry date, check digit,
# nationality): "ERIKSSON<<ANNA<MARIA<<<<<<<<<<". Each part is a PERSON
# span as on a passport (above), escapes, hard breaks, masks and states
# alike; the first two lines stay unmarked. The lines may stand in a
# blockquote or a paragraph each (a blank line between). Each line has 26
# to 34 characters, for OCR's lost or extra fillers.
[[span]]
category = "PERSON"
pattern = '(?m)(?P<lead>^(?P<mark>{indent})[IAC](?:[A-Z]|\\?<)?(?:{state})(?:[A-Z0-9]|\\?<)+{end}(?P<mark2>{indent})[0-9]{6}(?:[0-9]|\\?<)(?:[MFX]|\\?<)[0-9]{6}(?:[0-9]|\\?<)(?:[A-Z]|\\?<){3}(?:[A-Z0-9]|\\?<)*{end}(?P<mark3>{indent}))(?:{surname}(?:\\?<){2}(?:{given})?)(?P<tail>(?:\\?<)*[\p{Zs}\t]*\\?[\p{Zs}\t\r]*$)'
parts.indent = '[\p{Zs}\t]*(?:>[\p{Zs}\t]*)*'
parts.end = '[\p{Zs}\t]*\\?\r?\n(?:[\p{Zs}\t]*\r?\n)?'
parts.surname = '[A-Z]+(?:\\?<[A-Z]+)*'
parts.given = '[A-Z]+(?:(?:\\?<){1,2}[A-Z]+)*'
parts.state = 'ABW|AFG|AGO|AIA|ALA|ALB|AND|ARE|ARG|ARM|ASM|ATA|ATF|ATG|AUS|AUT|AZE|BDI|BEL|BEN|BES|BFA|BGD|BGR|BHR|BHS|BIH|BLM|BLR|BLZ|BMU|BOL|BRA|BRB|BRN|BTN|BVT|BWA|CAF|CAN|CCK|CHE|CHL|CHN|CIV|CMR|COD|COG|COK|COL|COM|CPV|CRI|CUB|CUW|CXR|CYM|CYP|CZE|DEU|DJI|DMA|DNK|DOM|DZA|ECU|EGY|ERI|ESH|ESP|EST|ETH|FIN|FJI|FLK|FRA|FRO|FSM|GAB|GBR|GEO|GGY|GHA|GIB|GIN|GLP|GMB|GNB|GNQ|GRC|GRD|GRL|GTM|GUF|GUM|GUY|HKG|HMD|HND|HRV|HTI|HUN|IDN|IMN|IND|IOT|IRL|IRN|IRQ|ISL|ISR|ITA|JAM|JEY|JOR|JPN|KAZ|KEN|KGZ|KHM|KIR|KNA|KOR|KWT|LAO|LBN|LBR|LBY|LCA|LIE|LKA|LSO|LTU|LUX|LVA|MAC|MAF|MAR|MCO|MDA|MDG|MDV|MEX|MHL|MKD|MLI|MLT|MMR|MNE|MNG|MNP|MOZ|MRT|MSR|MTQ|MUS|MWI|MYS|MYT|NAM|NCL|NER|NFK|NGA|NIC|NIU|NLD|NOR|NPL|NRU|NZL|OMN|PAK|PAN|PCN|PER|PHL|PLW|PNG|POL|PRI|PRK|PRT|PRY|PSE|PYF|QAT|REU|ROU|RUS|RWA|SAU|SDN|SEN|SGP|SGS|SHN|SJM|SLB|SLE|SLV|SMR|SOM|SPM|SRB|SSD|STP|SUR|SVK|SVN|SWE|SWZ|SXM|SYC|SYR|TCA|TCD|TGO|THA|TJK|TKL|TKM|TLS|TON|TTO|TUN|TUR|TUV|TWN|TZA|UGA|UKR|UMI|URY|USA|UZB|VAT|VCT|VEN|VGB|VIR|VNM|VUT|WLF|WSM|YEM|ZAF|ZMB|ZWE|D\\?<\\?<|GBD|GBN|GBO|GBP|GBS|RKS|EUE|UNO|UNA|UNK|XBA|XIM|XCC|XCE|XCO|XEC|XPO|XES|XMP|XOM|XDC|XXA|XXB|XXC|XXX'
split = '(?:\\?<)+'
skip = '^X+$|XXX'
line_length = [26, 34]
