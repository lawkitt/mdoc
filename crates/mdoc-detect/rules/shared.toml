# mdoc's rule pack, part 1 of 3: rules for any language (ADR 0092).
# Compiled in with `include_str!`; `rules.rs` checks every entry when it
# loads. The pack is shared.toml, then en.toml, then ru.toml.
#
# Sections:
#   never     words that never name anyone on their own
#   context   a label proposes a category for the value beside it
#   shape     what a span of each category must look like, and what makes
#             a manual selection that category
#   span      whole spans by pattern (an address from its first element
#             to its postcode or city), and boundary fixes for model spans
#   variants  nicknames of given names, for names already in the document
#
# Categories are written as their tokens: PERSON, ORG, EMAIL, PHONE,
# ADDRESS, IDENTITY, TAX, BANK, CASE, DATE, REDACTED.
#
# A `context` entry proposes its `category` for the value after a label:
#   labels  = […]    phrases, case ignored (only here), matched as whole
#                    words; a space
#                    matches any run of whitespace
#   between = regex  what may sit between the label and the value
#   value   = regex  the value, which ends at a word boundary; only it is
#                    proposed, never the label
# A context match wins over a model span on the same text.
#
# A `never` entry lists lowercase `words`, matched `whole`, `plural` (with an
# `s`) or as a `stem` with up to `ending` letters. Optionally:
#   last_word_of = [category…]  a model span of these categories ending in
#                               one of the words is dropped (a role phrase)
#   not_endings  = [ending…]    for a stem: endings that never count (a
#                               surname's "-ов" after a role stem)
#   anywhere_in  = [category…]  a model span of these categories with one of
#                               the words anywhere is dropped (a court)
#
# A `span` entry for a `category` is one of two kinds. With a `pattern`
# it proposes each match as a whole span; `{name}` in the pattern stands
# for `parts.name`, a regex. A match wins over a model span inside it and
# gives way to a model span of its category that reaches past it, a span
# of another category across its edge and any other rule's span in it; a
# match before a colon (a field's label) goes. Without a pattern an entry
# fixes a model span's boundaries, in this order:
#   extend    = [regex…]  a span inside a match grows to the whole match
#                         (the longest, when several hold it)
#   trim      = […]       lowercase words that come off either edge, a
#                         word's own final period with it, and a comma
#                         before a trailing one
#   strip_end = "…"       punctuation that comes off the end, except an
#                         initial's period
# A fixed span left without its category's shape goes. An entry takes one
# kind's keys only.
#
# A `shape` entry has any of:
#   require = [regex…]  a model span must match each one somewhere
#   forbid  = [regex…]  a model span must match none
#   word    = regex     some word of a model span (trimmed of punctuation
#                       other than `-`) must match it and not be a `never`
#                       word; one per category in the whole pack
#   guess   = [regex…]  a manual selection that matches one in full is this
#                       category
#   guess_words = […]   a manual selection with one of these words (ASCII
#                       case ignored) is this category
# In these regexes `\p{Uppercase}`, `\p{Alphabetic}` and `\p{N}` mean what
# Rust's `char` predicates mean, whose Unicode tables may be newer than the
# regex crate's.
#
# A category with no entry takes any span. Manual selections try each
# category's guesses in the order the categories first appear in the pack.

# Context rules are per language.
context = []

# Span patterns and fixes are per language.
span = []

# Nicknames, as [[variants]] with `name` and its `forms`. None yet.
variants = []

# No language-free never words.
never = []

# Dates: 12.03.2026 (optionally "г."), 2026-03-12, and blank forms to fill
# in by hand (`«__» ____ 2026 г.`, underscores possibly escaped as `\_`).
# Surrounding spaces are ignored. A year or a month alone is not a date.
[[shape]]
category = "DATE"
guess = [
    '(?i)\s*\d{1,2}[./]\d{1,2}[./]\d{2,4}(?:\s*г\.?)?\s*',
    '\s*\d{4}-\d{2}-\d{2}\s*',
    '(?i)\s*[«"]?(?:\d{1,2}|(?:\\?_)+)[»"]?\s+(?:\\?_)+\s+(?:\d{4}|(?:\\?_)+)(?:\s*(?:г\.?|года))?\s*',
]

# Phones: a model span needs a digit; a manual selection of at least seven
# digits with only spaces, `+`, brackets and dashes between is a phone. No
# phone number has 16 digits in a row (E.164 allows 15), and a bare nine-digit
# number starting 04 is a Russian bank code (БИК), not a phone.
[[shape]]
category = "PHONE"
require = ['\p{N}']
forbid = ['\p{N}{16,}', '^\s*04\d{7}\s*$']
guess = ['[ +()\-\x{a0}]*(?:[0-9][ +()\-\x{a0}]*){7,}']

# Organizations: a capital or digit, and a word that is not a never word
# ("the Employer" is not one). Continental legal forms mark one.
[[shape]]
category = "ORG"
require = ['[\p{Uppercase}\p{N}]']
word = '.'
guess_words = ["GmbH", "AG", "SA", "BV"]

# People: a capitalized word that is not a never word ("Ms Bennett", not
# "Ms" or "husband"). A manual selection of 1–4 capitalized words is a
# person; hyphenated surnames, apostrophes and initials ("М.С.", "J.R.")
# count.
[[shape]]
category = "PERSON"
word = '^\p{Uppercase}'
guess = [
    '\s*(?:(?:\p{Uppercase}\.)+|\p{Uppercase}[\p{Alphabetic}\x27’]*(?:-\p{Uppercase}[\p{Alphabetic}\x27’]*)*)(?:\s+(?:(?:\p{Uppercase}\.)+|\p{Uppercase}[\p{Alphabetic}\x27’]*(?:-\p{Uppercase}[\p{Alphabetic}\x27’]*)*)){0,3}\s*',
]

# Emails need an `@` and a dotted domain; the model also tags the word
# "email", bare domains and "not-a-mail@localhost".
[[shape]]
category = "EMAIL"
require = ['@[^@\s]+\.\p{Alphabetic}{2,}']

# Addresses need a capital or a digit, and a word that is not a never word:
# "addresses" or "Address" alone is not one. They also need a house or
# postcode number, a street word, abbreviated or not ("пер. Кленовый",
# "Cedar Court"), or a comma or line break between parts ("The Old
# Rectory, Nether Compton"): a city alone ("Cardiff", "Москва") is not an address (issue
# #386).
[[shape]]
category = "ADDRESS"
require = [
    '[\p{Uppercase}\p{N}]',
    '\p{N}|,|\n|(?i:\b(?:ул|улица|пр-т|пр|проспект|пер|переулок|наб|набережная|б-р|бульвар|пл|площадь|ш|шоссе|проезд|тупик|аллея|линия|тракт|просека|мкр|микрорайон|квартал|road|street|lane|ln|avenue|boulevard|blvd|mews|close|court|drive|dr|way|place|square|crescent|gardens|terrace|yard|row|hill|grove|walk|parade|rd|st|ave)\b)',
]
word = '.'

# Identity documents need a digit; "passport" alone is not one.
[[shape]]
category = "IDENTITY"
require = ['\p{N}']

# Tax identifiers need a digit; "ИНН" alone is not one. A rate ("20 percent
# tax", "НДС 20%") is no identifier, and neither is a Russian document series
# before its number ("ФС 086731924", a writ).
[[shape]]
category = "TAX"
require = ['\p{N}']
forbid = ['(?i)percent|per cent|%|процент', '[А-ЯЁа-яё]{2,}\s+\d']

# Bank details need a digit and no `/`: case and claim numbers
# ("6001842/2026") are not bank details. A bare ten- or eleven-digit number is
# a tax number, a phone or a contract number far more often than an account
# (Russian accounts have 20 digits, UK ones 8 with a sort code): only a label
# makes it bank details.
[[shape]]
category = "BANK"
require = ['\p{N}']
forbid = ['/', '^\s*\d{10,11}\s*$']
