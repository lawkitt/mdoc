# mdoc's rule pack, part 3 of 3: Russian. Sections and fields are described
# in shared.toml.


# No Russian nicknames yet.
variants = []

# These occupational surnames must stay PERSON if role vocabulary grows.
role_surnames = ["судья", "староста", "голова", "кузнец", "бухгалтер"]

# A depersonalised act names a person by dotless initials alone: «БАВ»,
# «ЛВГ». Right after a role only a person has, lone bare initials (two or
# three capitals that are no abbreviation, mdoc-pii's `lone_initials`, nor
# an `initials_never` word below) are that person, and so is every lone
# repeat of them in the document, unless it also writes them as a
# company's; then only the model's organization on the mention after the
# role becomes the person (guide rule 1, issue #491). Never where the next
# word qualifies them, a capitalised word or other bare initials
# («гражданин РК БАВ», «СПК Колос», «КЛМ Групп»); an identifier's label, a
# date mask or «ИЗЪЯТО» is none («ИП ДРС ИНН …», «БАВ ДД.ММ.ГГГГ»). Each
# entry is one role in its case forms.
initials_after = [
    # «потерпевший КЛМ», «потерпевшей ЛВГ», «Потерпевшему БАВ».
    '(?i:потерпевш(?:ий|ая|его|ей|ему|им|ем|ую|ие|их|ими))',
    # «осуждённый БАВ», «осужденной ЛВГ».
    '(?i:осужд[её]нн(?:ый|ая|ого|ой|ому|ым|ом|ую|ые|ых|ыми))',
    # «обвиняемый БАВ», «обвиняемой ЛВГ».
    '(?i:обвиняем(?:ый|ая|ого|ой|ому|ым|ом|ую|ые|ых|ыми))',
    # «подсудимый БАВ», «подсудимому ЛВГ».
    '(?i:подсудим(?:ый|ая|ого|ой|ому|ым|ом|ую|ые|ых|ыми))',
    # «свидетель БАВ», «свидетеля ЛВГ».
    '(?i:свидетел(?:ь|я|ю|ем|е|и|ей|ям))',
    # «ИП ДРС», as written: «Ип» is a surname (#562).
    'ИП',
    # «индивидуальный предприниматель БАВ», «индивидуального
    # предпринимателя ЛВГ».
    '(?i:индивидуальн(?:ый|ого|ому|ым|ом)[\p{Zs}\t]+предпринимател(?:ь|я|ю|ем|е))',
    # «несовершеннолетний БАВ», «несовершеннолетней ЛВГ».
    '(?i:несовершеннолетн(?:ий|яя|его|ей|ему|им|ем|юю|ие|их))',
    # «умерший БАВ», «умершей ЛВГ».
    '(?i:умерш(?:ий|ая|его|ей|ему|им|ем|ую))',
    # «наследодатель БАВ», «наследодателя ЛВГ».
    '(?i:наследодател(?:ь|я|ю|ем|е))',
    # «супруг БАВ», «супруга ЛВГ», «супругой КЛМ».
    '(?i:супруг(?:|а|у|ом|е|и|ой|ов))',
]

# Words that introduce a citizen, as `initials_after`, but only three
# letters after one are a person's initials: two are almost always a
# country («гражданин РА», «гражданка ЧР», «гр. РМ») (#491).
initials_after_citizen = [
    # «гр. БАВ», «гр-ну ЛВГ».
    '(?i:гр\.|гр-(?:н|на|ну|ном|не|ка|ки|ке|ку|кой))',
    # «гражданин БАВ», «гражданке ЛВГ», «гражданина КЛМ».
    '(?i:граждан(?:ин|ина|ину|ином|ине|ка|ки|ке|ку|кой|кою))',
]

# A party's role, which a company or a public body holds too («Ответчик
# МЧС России», «Представитель ЦЗН», «Ответчик РСА»): lone bare initials
# after one are a person only where the model took exactly them for an
# organization and the document gives the same letters a person's
# evidence elsewhere, a person's own role before them or the model's
# person on them («Истец КЛМ … Потерпевший КЛМ»), and never where it
# writes them as a company's (#491). Their lone repeats follow the same
# way, and nothing is added where the model found none.
initials_after_party = [
    # «истец БАВ», «истца ЛВГ», «истцу КЛМ».
    '(?i:ист(?:ец|ца|цу|цом|це|цы|цов))',
    # «ответчик БАВ», «ответчику ЛВГ».
    '(?i:ответчи(?:к|ка|ку|ком|ке|ки|ков))',
    # «заявитель БАВ», «заявителя ЛВГ».
    '(?i:заявител(?:ь|я|ю|ем|е|и|ей))',
    # «должник БАВ», «должника ЛВГ».
    '(?i:должни(?:к|ка|ку|ком|ке|ки|ков))',
    # «взыскатель БАВ», «взыскателю ЛВГ».
    '(?i:взыскател(?:ь|я|ю|ем|е|и|ей))',
    # «представитель БАВ», «законный представитель ЛВГ».
    '(?i:(?:законн(?:ый|ого|ому|ым|ом)[\p{Zs}\t]+)?представител(?:ь|я|ю|ем|е|и|ей))',
]

# Legal forms, as written, that make bare initials a company's where they
# stand right before them, after them and an opening quote, or after them
# in brackets: «АО БАВ», «ООО «БАВ»», «ОАО КЛМ», «КЛМ (ООО)». A document
# that writes the letters so keeps their other mentions as the model reads
# them, unless a person's own role names one (#491).
initials_companies = [
    "ООО", "ОАО", "ЗАО", "ПАО", "АО", "НАО", "САО", "НКО", "АНО", "НП", "ТСН", "ТСЖ",
    "СНТ", "ДНТ", "КПК", "СПК", "ЧОП", "АКБ", "КБ", "ПКО",
]

# Capitals that are never a person's initials after a role, though not in
# mdoc-pii's abbreviations (#491). The public bodies' words of the `never`
# entries with `anywhere_in` below («МЧС», «ФМС», «УФК») count too.
initials_never = [
    # A code and housing: «по УПК», «ЖКХ».
    "УПК", "ЖКХ",
    # Public bodies, their units and officers no `never` entry lists:
    # «Представитель ЦЗН», «Свидетель ДПС», «Ответчик ЦРБ».
    "ТУ", "МТУ", "ДГИ", "ФТС", "ГСУ", "КДН", "ЗП", "ОП", "ЦЗН", "ДПС", "УУП", "ППС", "ЦРБ",
    "АСВ", "ПДН", "ОУР", "ИВС", "СПИ", "МФЦ", "ГАИ", "УИИ", "ГИТ", "ТИК", "УИК", "ЦИК",
    # Countries and regions a citizen's role names: «гражданин РК».
    "РК", "КНР", "ДНР", "ЛНР", "ФРГ", "ОАЭ", "КР",
    # Farms, partnerships and well-known companies: «глава КФХ», «ответчик
    # РЖД».
    "КФХ", "ДНП", "РЖД", "ВТБ", "МТС",
    # Insurers, funds and housing companies a party's role names:
    # «Ответчик РСА», «Ответчик ВСК», «Должник ЖЭК».
    "РСА", "ВСК", "ФКР", "ЕРЦ", "ДЕЗ", "ЖЭК", "ЖЭУ", "РЭУ", "УК",
    # Short function words written in capitals for emphasis: «Ответчик НЕ
    # явился».
    "НЕ", "НИ", "ДА", "НЕТ", "ОН", "ОНА", "ОНО", "ОНИ", "МЫ", "ВЫ", "ТЫ", "ВСЕ", "ВСЁ",
    "ТАК", "ИЛИ", "ЛИ", "ЖЕ", "БЫ", "НО", "ЕГО", "ЕЁ", "ИХ", "ЕМУ", "ЕЙ", "ИМ", "ВОТ",
    "ГДЕ", "КТО", "ЧТО", "КАК", "ДЛЯ", "ПРИ", "БЕЗ", "ПОД", "НАД", "ОТ", "ДО", "ЗА",
    "НА", "ИЗ", "ВО", "КО", "ОБ", "ТО", "УЖЕ", "ЕЩЁ",
]

# An organization's legal form and quotes belong to its name: the model's
# "Северный Вектор" inside "ООО «Северный Вектор»" grows to the whole of it,
# as does "Елагин и партнёры" in "коллегия адвокатов «Елагин и партнёры»"
# (guide rule 2, #374). Straight quotes count too.
[[span]]
category = "ORG"
extend = [
    '\b(?:ООО|ОАО|ЗАО|ПАО|АО|НКО|АНО|[Кк]оллегия адвокатов|[Аа]двокатское бюро)\s*«[^«»\n]+»',
    '\b(?:ООО|ОАО|ЗАО|ПАО|АО|НКО|АНО|[Кк]оллегия адвокатов|[Аа]двокатское бюро)\s*"[^"\n]+"',
]

# A state or municipal institution's quoted name belongs to the institution,
# so the public-body `never` words below reach it: the model's "Дирекция
# парков" in "ГКУ города Ольховска «Дирекция парков»" grows to the
# whole of it and goes (guide rule 8, issue #378). The institution's city or
# region, of up to two words, may stand between ("ГБУ Северной области «…»",
# "ГКУ города Нижнего Ольховска «…»"), or its region's short name ("ГБУ СО
# «…»"). A person's span there grows the same way (below).
[[span]]
category = "ORG"
extend = [
    # МО establishes a police unit; bare МВД России can instead be an
    # employee's affiliation before a quoted personal name (#378).
    '\bМО[\p{Zs}\t]+(?:МВД|УМВД|ОМВД)[\p{Zs}\t]+России[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
    '\b(?:ГКУ|ГБУ|ГАУ|ФГБУ|ФГКУ|ФГАУ|ФКУ|МКУ|МБУ|ГУП|МУП|ГБОУ|ФГБОУ|МБОУ|ГБУЗ)(?:[\p{Zs}\t]+(?:\p{Uppercase}{2,4}|(?:города|г\.)[\p{Zs}\t]*\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?|\p{Uppercase}[\p{Alphabetic}-]*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+)?(?:области|края|округа|района|[Рр]еспублики)|Республики[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?))?[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
    '\b(?:[Фф]едеральн|[Гг]осударственн|[Мм]униципальн)\p{Alphabetic}*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+){0,2}учреждени\p{Alphabetic}*(?:[\p{Zs}\t]+(?:(?:города|г\.)[\p{Zs}\t]*\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?|\p{Uppercase}[\p{Alphabetic}-]*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+)?(?:области|края|округа|района|[Рр]еспублики)|Республики[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?))?[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
]

# The same for a person: the model's "Кедровый дом-интернат" as a person in
# "ГБУ СО «Кедровый дом-интернат»" grows to the institution and goes
# (issue #378).
[[span]]
category = "PERSON"
extend = [
    # Require the unit head МО here too; an affiliation alone cannot
    # consume a quoted officer or nickname (#378, GUIDE rule 1).
    '\bМО[\p{Zs}\t]+(?:МВД|УМВД|ОМВД)[\p{Zs}\t]+России[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
    '\b(?:ГКУ|ГБУ|ГАУ|ФГБУ|ФГКУ|ФГАУ|ФКУ|МКУ|МБУ|ГУП|МУП|ГБОУ|ФГБОУ|МБОУ|ГБУЗ)(?:[\p{Zs}\t]+(?:\p{Uppercase}{2,4}|(?:города|г\.)[\p{Zs}\t]*\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?|\p{Uppercase}[\p{Alphabetic}-]*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+)?(?:области|края|округа|района|[Рр]еспублики)|Республики[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?))?[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
    '\b(?:[Фф]едеральн|[Гг]осударственн|[Мм]униципальн)\p{Alphabetic}*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+){0,2}учреждени\p{Alphabetic}*(?:[\p{Zs}\t]+(?:(?:города|г\.)[\p{Zs}\t]*\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?|\p{Uppercase}[\p{Alphabetic}-]*[\p{Zs}\t]+(?:\p{Alphabetic}+[\p{Zs}\t]+)?(?:области|края|округа|района|[Рр]еспублики)|Республики[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?))?[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
]

# A public-law company's quoted name belongs to the company, so the
# public-body `never` words below reach it: the model's "Фонд развития
# территорий" in "ППК «Фонд развития территорий»" or "публично-правовой
# компании «Роскадастр»" grows to the whole of it and goes (guide rule 8,
# the maintainer's decision on #484, item 4).
[[span]]
category = "ORG"
extend = [
    '\b(?:ППК|[Пп]ублично-правов\p{Alphabetic}*[\p{Zs}\t]+компани\p{Alphabetic}*)[\p{Zs}\t]*[«"][^«»"\n]+[»"]',
]

# Titles stay outside a person's span: "г-жа Павлова" is "Павлова" (guide
# rule 1, #382). An entrepreneur's «ИП» comes off by its own case-sensitive
# trim_start below (#562), so the surname «Ип» stays. The abbreviated
# «гр.» of «гражданин» comes off the same way: the model's «гр. БАВ» and
# «гр. Иванов» are «БАВ» and «Иванов» (#491); its dot is no word's own, so
# it is a prefix here rather than a trim word.
[[span]]
category = "PERSON"
trim = ["г-н", "г-жа", "господин", "госпожа"]
trim_start = ['(?i:гр\.)[\p{Zs}\t]+']

# Complete roles come off a person's edges (#385), in their case forms.
# Do not trim a single role-like surname ("Иво Должник").
[[span]]
category = "PERSON"
trim = [
    "индивидуальный предприниматель", "индивидуального предпринимателя",
    "индивидуальному предпринимателю", "индивидуальным предпринимателем",
    "индивидуальном предпринимателе",
    "конкурсный управляющий", "конкурсного управляющего",
    "конкурсному управляющему", "конкурсным управляющим", "конкурсном управляющем",
    "финансовый управляющий", "финансового управляющего",
    "финансовому управляющему", "финансовым управляющим", "финансовом управляющем",
    "арбитражный управляющий", "арбитражного управляющего",
    "арбитражному управляющему", "арбитражным управляющим", "арбитражном управляющем",
    "уполномоченный по защите прав предпринимателей",
    "уполномоченного по защите прав предпринимателей",
    "уполномоченному по защите прав предпринимателей",
    "уполномоченным по защите прав предпринимателей",
    "уполномоченном по защите прав предпринимателей",
    "уполномоченная по защите прав предпринимателей",
    "уполномоченной по защите прав предпринимателей",
    "уполномоченную по защите прав предпринимателей",
    "заместитель руководителя", "заместителя руководителя",
    "заместителю руководителя", "заместителем руководителя", "заместителе руководителя",
    "заместитель главного бухгалтера", "заместителя главного бухгалтера",
    "заместителю главного бухгалтера", "заместителем главного бухгалтера",
]

# Role phrases around a named organization lose only the role (#385).
[[span]]
category = "ORG"
role_trim = true
trim = [
    "конкурсный управляющий", "конкурсного управляющего",
    "конкурсному управляющему", "конкурсным управляющим", "конкурсном управляющем",
    "финансовый управляющий", "финансового управляющего",
    "финансовому управляющему", "финансовым управляющим", "финансовом управляющем",
    "арбитражный управляющий", "арбитражного управляющего",
    "арбитражному управляющему", "арбитражным управляющим", "арбитражном управляющем",
    "уполномоченный по защите прав предпринимателей",
    "уполномоченного по защите прав предпринимателей",
    "уполномоченному по защите прав предпринимателей",
    "уполномоченным по защите прав предпринимателей",
    "уполномоченном по защите прав предпринимателей",
    "уполномоченная по защите прав предпринимателей",
    "уполномоченной по защите прав предпринимателей",
    "уполномоченную по защите прав предпринимателей",
]

# An account's label stays outside its span: the model's "р/с
# 40702810900000004711" is the number alone (guide rule 6, issue #486);
# with the label's slash the span would go as no bank details.
[[span]]
category = "BANK"
trim = [
    "р/с", "р/сч", "к/с", "к/сч", "л/с", "счет", "счёт", "сч", "№",
    "расчетный счет", "расчётный счёт", "корреспондентский счет",
    "корреспондентский счёт",
]

# Two initials beside a surname belong to the name: the model's "Ветлин" in
# "Ветлин Н. О." grows to the whole of it, as "Брюн" does in "Л.И. Брюн"
# (guide rule 1, #391). Only spaces between: never across a sentence's
# period ("Ветлин. Н. Иванов"), a comma or a line.
[[span]]
category = "PERSON"
extend = [
    '\b(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*[ \t]+[А-ЯЁ]\.[ \t]?[А-ЯЁ]\.',
    '\b[А-ЯЁ]\.[ \t]?[А-ЯЁ]\.[ \t]+(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*',
]

# A surname's lowercase particle belongs to the name: the model's "Лаваль"
# in "на фамилию де Лаваль" grows to "де Лаваль", and in "Генриетта Яновна
# де Лаваль" to the whole of it, as do "фон дер Пален", "ван Хорн", "ибн
# Рушд" (guide rule 1, the guide's examples, #403). Two particles may chain
# ("де ла Вега"), a surname-first name keeps the names after it ("де Лаваль
# Генриетта Яновна", "де Лаваль Г. Я."), and a glued «д'» or «аль-» is the
# word's own ("д'Артаньян", "аль-Хадид"). Only spaces sit between, never a
# line. Written lowercase a particle is no sentence's first word, so it
# joins anywhere, after a sentence's end too. «да» and «фон» are also words
# ("сказал да Петрову", "Петров да Сидоров", "Иван да Марья", "Шумовой
# фон Петрова", a wrapped line's "фон Петровой") and join only after a
# patronymic, an initial or a name's introducing word on the same line, the
# `lead` that stays outside («на фамилию», «гражданке», «господину», «г-жа»,
# «гр.», «барон»), or before a second particle ("фон дер Пален"); a bare
# capitalised word is no lead for them (#403 review). A given name and
# patronymic or two initials before the particle go with the span ("Г. Я.
# де Лаваль").
[[span]]
category = "PERSON"
extend = [
    '\b(?:(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль)(?:[ \t]+(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон))?|(?:да|фон)[ \t]+(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон))[ \t]+(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*(?:[ \t]+(?:[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*[ \t]+[А-ЯЁ][а-яё]+(?:ович|евич|ьич|овн|евн|ичн)[а-яё]{0,3}|[А-ЯЁ]\.[ \t]?[А-ЯЁ]\.))?',
    '(?P<lead>(?:\b[А-ЯЁ][а-яё]+(?:ович|евич|ьич|овн|евн|ичн)[а-яё]{0,3}|\b[А-ЯЁ]\.|\b(?i:фамили(?:я|и|ю|ей)|граждан(?:ин|ина|ину|ином|ине|ка|ки|ке|ку|кой)|господин(?:а|у|ом|е)?|госпож(?:а|и|е|у|ой)|г-н(?:а|у|ом|е)?|г-ж(?:а|и|е|у|ой)|барон(?:а|у|ом|е|есса|ессы|ессе|ессу|ессой)?)|\bгр\.)[ \t]+)(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон)(?:[ \t]+(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон))?[ \t]+(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*(?:[ \t]+(?:[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*[ \t]+[А-ЯЁ][а-яё]+(?:ович|евич|ьич|овн|евн|ичн)[а-яё]{0,3}|[А-ЯЁ]\.[ \t]?[А-ЯЁ]\.))?',
    '\b(?:[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*[ \t]+[А-ЯЁ][а-яё]+(?:ович|евич|ьич|овн|евн|ичн)[а-яё]{0,3}|[А-ЯЁ]\.[ \t]?[А-ЯЁ]\.)[ \t]+(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон)(?:[ \t]+(?:де|ван|дер|ден|ди|дю|ля|ла|ле|дель|делла|эль|бен|бин|ибн|аль|да|фон))?[ \t]+(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*',
    '\b(?:д[\x27’]|(?:аль|эль)-)(?:[А-ЯЁ][\x27’])?[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)*',
]

# A glued particle makes a capitalised word a name's («аль-Хадид»), but
# «аль-Каида», in any case form, is an organization, never a person (#403
# review).
[[never]]
match = "pattern"
patterns = ['(?i)^[\s\p{P}]*аль-каид(?:а|ы|е|у|ой|ою)[\s\p{P}]*$']
anywhere_in = ["PERSON"]

# Common abbreviations (the never words below) come off an organization's
# edges: "АЗС ООО «Бета-Ойл»" is "ООО «Бета-Ойл»" (guide rule 2, issue #481).
[[span]]
category = "ORG"
trim = [
    "тко", "тн", "ттн", "азс", "соуэ", "апс", "аупс", "аспт", "мчд", "кэп",
    "укэп", "нэп", "пэп", "эп", "эцп", "еио", "эдо", "уц",
]

# Titles and the words for spouses: "г-жа", "муж" name no one on their own.
[[never]]
match = "plural"
words = ["г-н", "г-жа", "господин", "госпожа", "гражданин", "гражданка", "муж", "жена"]

# Role stems take up to three letters of ending, but never a surname's
# (-ов, -ев, -ин and their forms): "Подрядчиков", "Супругов", "Директоров"
# alone are surnames (issue #450).
#
# Contract parties, as stems with up to three letters of ending
# ("Заказчику", "Исполнителя", "Стороны", "Заимодавца"; #385).
# A title or a full name keeps a role-like surname.
[[never]]
match = "stem"
ending = 3
not_endings = ["ов", "ев", "ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
words = [
    "заказчик", "исполнител", "подрядчик", "арендатор", "арендодател",
    "покупател", "продав", "работник", "работодател", "сторон",
    "заимодавец", "заимодавц", "займодавец", "займодавц",
]
unless_named = true
person_role = true

# Parties to a dispute ("Истца", "Ответчику").
[[never]]
match = "stem"
ending = 3
not_endings = ["ов", "ев", "ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
words = [
    "истец", "истц", "ответчик", "заявител", "должник", "кассатор",
    "предпринимател", "правообладател", "заемщик", "заёмщик", "кредитор",
]
unless_named = true
person_role = true

# Representatives and other roles ("Представителя", "Супруга", "Директору").
[[never]]
match = "stem"
ending = 3
not_endings = ["ов", "ев", "ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
words = [
    "представител", "доверител", "поверенн", "супруг", "адвокат", "юрист", "директор",
    "эксперт", "секретар", "свидетел", "собственник", "владел", "поставщик",
    "руководител", "бухгалтер", "уполномоченн", "управляющ",
]
unless_named = true
person_role = true

# A child label is a role, not a name (#385).
[[never]]
match = "stem"
ending = 3
words = ["ребен", "ребён"]
not_endings = ["ов", "ев", "ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
unless_named = true
person_role = true

# Inflected role modifiers count only inside multiword role phrases.
[[never]]
match = "stem"
ending = 3
words = ["несовершеннолетн", "конкурсн", "финансов", "арбитражн", "заместител"]
not_endings = ["ов", "ев", "ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
unless_named = true
phrase_only = true

# Noun forms whose irregular endings are clearer listed whole (#385).
# "Лица" in a procedural sentence and "Собрание кредиторов" name no one.
[[never]]
match = "whole"
words = [
    "лицо", "лица", "лицу", "лицом", "лице", "лиц", "лицам", "лицами", "лицах",
    "собрание", "собрания", "собранию", "собранием", "собрании",
]
unless_named = true
person_role = true

# Complete office and status phrases only: no wildcard after a role may
# swallow a name (#385). Named officers such as "Уполномоченный Брюн" stay.
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:собрани(?:е|я|ю|ем|и)[\p{Zs}\t]+кредиторов|должник[\p{Zs}\t]+холост|уполномоченн(?:ый|ого|ому|ым|ом|ая|ой|ую)[\p{Zs}\t]+по[\p{Zs}\t]+защите[\p{Zs}\t]+прав[\p{Zs}\t]+предпринимателей)[\s\p{P}]*$',
]
anywhere_in = ["PERSON"]
unless_titled = true

# The same role-only phrases labelled as organizations (#385).
[[never]]
match = "pattern"
patterns = [
    '(?i)^[\s\p{P}]*(?:собрани(?:е|я|ю|ем|и)[\p{Zs}\t]+кредиторов|должник[\p{Zs}\t]+холост|уполномоченн(?:ый|ого|ому|ым|ом|ая|ой|ую)[\p{Zs}\t]+по[\p{Zs}\t]+защите[\p{Zs}\t]+прав[\p{Zs}\t]+предпринимателей)[\s\p{P}]*$',
]
anywhere_in = ["ORG"]

# Defined terms: "Общество", "Компания", "Организация" stand for a party
# named elsewhere (issue #390), and so does "Фонд" ("бюджет Фонда", #378).
# Their case forms are listed whole, so surnames such as "Компаниец" stay.
[[never]]
match = "whole"
words = [
    "общество", "общества", "обществу", "обществом", "обществе", "компания",
    "компании", "компанию", "компанией", "организация", "организации",
    "организацию", "организацией", "фонд", "фонда", "фонду", "фондом",
    "фонде",
]

# Generic nouns a document defines as a term after «далее –» or «именуемое
# в дальнейшем»: «(далее – Положение)», «(далее – Учреждение)», «Займодавец»,
# «Заёмщик». Once the document defines one, every mention of it, in any case,
# is a defined term and no organization (guide rule 2, issue #390). Only
# where the document defines it: elsewhere a company may share the word, and
# a term with any coined or real word («Кедровое») defines none. As stems
# with up to three letters of ending, including genitive plurals
# («Кредиторов»). Other surname endings remain excluded. This filter
# applies only to ORG; the separate PERSON surname guards are unchanged.
[[defined]]
match = "stem"
ending = 3
not_endings = ["ёв", "ин", "ын", "ова", "ева", "ёва", "ина", "ына", "ову", "еву", "ину"]
words = [
    "положени", "учреждени", "предприяти", "соглашени", "договор", "контракт",
    "приложени", "регламент", "устав", "программ", "объект", "имуществ",
    "территори", "кредитор", "должник", "заемщик", "заёмщик", "займодав",
    "залогодател", "залогодержател", "принципал", "агент", "учредител",
    "участник", "акционер", "страховщик", "страхователь", "перевозчик",
    "грузоотправител", "грузополучател", "наймодател", "нанимател",
    "лицензиат", "лицензиар", "цедент", "цессионари", "правообладател",
    "пользовател", "оператор", "организатор", "корпораци", "фирм",
]

# Category words and identifier labels: "СНИЛС", "ИНН", "Телефон", "Адрес"
# name no one (issue #379). Case forms are listed whole, so "Банков" and
# "Адресат" stay.
[[never]]
match = "whole"
words = [
    "снилс", "инн", "огрн", "огрнип", "кпп", "бик", "телефон", "телефона",
    "телефону", "телефоном", "телефоне", "адрес", "адреса", "адресу",
    "адресом", "адресе", "паспорт", "паспорта", "паспорту", "паспортом",
    "паспорте", "банк", "банка", "банку", "банком", "банке",
]

# Common abbreviations name no one (guide rule 8, issue #481): waste and
# waybills ("вывоз ТКО", "по ТН № 15", "ТТН"), a petrol station ("на
# АЗС"), fire systems ("СОУЭ", "АПС") and e-signature and e-document terms
# ("МЧД", "КЭП", "ЭП", "ЕИО", "ЭДО"). They do not decline, so they are
# listed whole. A company that shares one keeps it by its other words or
# legal form ("АО «ТТН-Логистик»", "ООО «АЗС»").
[[never]]
match = "whole"
words = [
    "тко", "тн", "ттн", "азс", "соуэ", "апс", "аупс", "аспт", "мчд", "кэп",
    "укэп", "нэп", "пэп", "эп", "эцп", "еио", "эдо", "уц",
]

# The Internet is no organization, in any form, nor is the statutory
# phrase around it: "сети «Интернет»", "информационно-телекоммуникационной
# сети Интернет" (guide rule 2, issue #488). Listed whole and dropped only
# when a span has no other word, so "Интернет Решения" and "Сети «Ромашка»"
# stay.
[[never]]
match = "whole"
words = [
    "интернет", "интернета", "интернету", "интернетом", "интернете", "сеть",
    "сети", "сетью", "сетей", "информационно-телекоммуникационная",
    "информационно-телекоммуникационной", "информационно-телекоммуникационную",
    "всемирная", "всемирной", "всемирную", "глобальная", "глобальной",
    "глобальную",
]

# Software, messengers and legal databases are products, not the company
# that makes them: "переписка в Ватсапе", "система КонсультантПлюс" (guide
# rule 2, issue #488). Their case forms take up to three letters. The
# company keeps its name by its legal form ("ООО «КонсультантПлюс»").
[[never]]
match = "stem"
ending = 3
words = ["ватсап", "вотсап", "вацап", "телеграм", "вайбер", "консультантплюс"]

# The same products in Latin letters.
[[never]]
match = "whole"
words = ["whatsapp", "telegram", "viber"]

# Words that make a job title of a role: "Независимый эксперт", "Главный
# бухгалтер" name no one (guide rule 8). Alone they may be names.
[[never]]
match = "whole"
words = [
    "независимый", "независимого", "независимому", "главный", "главного",
    "главному", "старший", "старшего", "старшему", "генеральный",
    "генерального", "генеральному", "ведущий", "ведущего", "ведущему",
    "независимым", "независимом", "независимая", "независимой", "независимую",
    "главным", "главном", "главная", "главной", "главную",
    "старшим", "старшем", "старшая", "старшей", "старшую",
    "генеральным", "генеральном", "генеральная", "генеральной", "генеральную",
    "ведущим", "ведущем", "ведущая", "ведущей", "ведущую",
    "индивидуальный", "индивидуального", "индивидуальному",
    "индивидуальным", "индивидуальном", "индивидуальная", "индивидуальной",
    "индивидуальную",
]
unless_named = true
phrase_only = true

# Codes of law, short court names and the country: "ГК РФ", "ГПК РФ", "ВС
# РФ", "Российской Федерации" in "Именем Российской Федерации" or after a
# court's name are references or places, not organizations (issues #378,
# #478). Listed whole and dropped only when a span has no other word, so
# "Российский союз автостраховщиков", "Сбербанк России" and "Банк «Россия»"
# stay.
[[never]]
match = "whole"
words = [
    "гк", "рф", "гпк", "апк", "ук", "коап", "нк", "тк", "упк", "жк", "ск",
    "зк", "бк", "кас", "лк", "грк", "фз", "фкз", "вс", "ас", "россии", "россию", "россией",
    "российская", "российской", "российскую", "федерация", "федерации",
    "федерацию", "федерацией", "именем", "коллегия", "коллегии", "коллегию",
    "коллегией",
]

# "Субъект" and its forms: "субъектов Российской Федерации" is no body.
[[never]]
match = "stem"
ending = 3
words = ["субъект"]

# Courts and public bodies are never marked (the fixture guide's rule 8):
# an organization or person span with one of these stems anywhere is
# dropped ("Районный суд", "Верховный Суд Российской Федерации",
# "Министерства юстиции", "Судебная коллегия", "Управлением Росреестра",
# "отдела судебных приставов", "Правительства … области", "Президиума",
# "Регистрационной палатой"; issue #378), unless it has a legal form;
# words in quotes are a name. A state or municipal institution is a public
# body ("Федерального казенного учреждения", "государственного бюджетного
# учреждения"). In a person's span a stem counts only with the body
# words' own case endings ("Министерство", "Правительству", "судов
# общей юрисдикции"), so a surname with it stays ("Судине", "Судник",
# "Приставко", and "Судов" capitalized), and so does one after a title
# ("г-н Суд") or with initials ("Суд Н. О.", "СУД Н. О.").
[[never]]
match = "stem"
ending = 3
words = [
    "суд", "судебн", "министерств", "прокуратур", "департамент", "администраци",
    "инспекци", "правительств", "управлени", "отдел", "отделени", "комитет",
    "пристав", "полици", "пленум", "президиум", "палат", "федеральн",
    "государственн", "муниципальн", "казенн", "казённ", "бюджетн", "минтруд",
    "минфин", "минюст", "минздрав", "минпромторг", "минтранс", "минсельхоз",
    "минспорт", "минстро", "росреестр", "росгварди", "роспотребнадзор",
    "ростехнадзор", "роскомнадзор", "росприроднадзор", "росимуществ",
    "росстат", "роструд", "росатом", "роскосмос",
]
anywhere_in = ["ORG", "PERSON"]
person_endings = [
    "", "а", "я", "у", "ю", "о", "е", "и", "ы", "й", "ом", "ем", "ой", "ою",
    "ей", "ов", "ам", "ям", "ах", "ях", "ами", "ями", "ый", "ий", "ая", "яя",
    "ое", "ее", "ые", "ие", "ого", "его", "ому", "ему", "ую", "юю", "ым", "им",
    "ых", "их", "ыми", "ими",
]
surname_endings = ["ов"]
unless_titled = true

# The same bodies' abbreviations and indeclinable names, matched whole:
# "ГУ МВД России по …", "МИФНС России № 9", "УФССП", "14 ААС", "ГКУ
# города Ольховска", "ГБ МСЭ по … области", the pension and social funds'
# offices ("УПФР", "ОСФР"), statutory enterprises ("ГУП", "МУП"; #484), the Treasury's ("УФК") and the central bank
# ("ЦБ РФ") (issue #378).
[[never]]
match = "whole"
words = [
    "фнс", "ифнс", "мифнс", "уфнс", "мвд", "умвд", "омвд", "овд", "гибдд",
    "мчс", "фссп", "уфссп", "гуфссп", "осп", "росп", "госп", "загс", "гиаз",
    "пфр", "упфр", "опфр", "гупфр", "сфр", "осфр", "фсс", "уфк", "цб",
    "фас", "фсин", "уфсин", "фсб", "фмс", "уфмс", "гку", "гбу", "гау", "фгбу",
    "фгку", "фгау", "фку", "мку", "мбу", "гуп", "муп", "гбоу", "фгбоу", "мбоу", "гбуз",
    "мсэ", "аас", "депнедра", "минэнерго", "минэкономразвития", "минобороны",
    "минприроды", "минцифры", "минкультуры", "минпросвещения", "минобрнауки",
    "мэрия", "мэрии", "мэрию", "мэрией",
]
anywhere_in = ["ORG", "PERSON"]
unless_titled = true

# A bare "ГУ" (a state institution) before a body's name: "ГУ - Управление
# …", "ГУ «…»" (issue #378). An organization only: "Гу" is a surname.
[[never]]
match = "whole"
words = ["гу"]
anywhere_in = ["ORG"]

# Public bodies by their phrases, as an organization or a person (issue
# #378): the pension and social funds ("Пенсионный фонд Российской
# Федерации", "Фонда пенсионного и социального страхования", "Фонда
# социального страхования", "бюджета Фонда"), the President, the central
# bank ("Банк России", "Центрального банка Российской Федерации"), the
# armed forces, the tax authorities, the former Supreme Arbitration Court
# ("Президиума ВАС РФ") and an arbitration court's short name before its
# region ("АС Северной области", "АС Ольховска и Северной обл"). A
# charity's "Благотворительный фонд «…»" and "ООО «Фонд Север»" stay.
[[never]]
match = "pattern"
patterns = [
    # Supported ministry continuations after a wrap need a portfolio
    # and jurisdiction, rather than an arbitrary lowercase name row.
    '(?i)\bминистерств\p{Alphabetic}{0,3}[\p{Zs}\t]+(?:финансов|обороны|юстиции)[\p{Zs}\t]+Российской[\p{Zs}\t]+Федерации\b',
    '(?i)\b(?:пенсионн|социальн)\p{Alphabetic}*[\p{Zs}\t]+фонд',
    '(?i)\bфонд\p{Alphabetic}{0,2}[\p{Zs}\t]+(?:пенсионн|социальн|обязательн)',
    '(?i)\bбюджет\p{Alphabetic}{0,2}[\p{Zs}\t]+фонд',
    '(?i)\bпрезидент\p{Alphabetic}{0,3}[\p{Zs}\t]+(?:российской[\p{Zs}\t]+федерации|рф|россии)\b',
    '(?i)^[\s\p{P}]*(?:центральн\p{Alphabetic}*[\p{Zs}\t]+)?банк\p{Alphabetic}{0,3}[\p{Zs}\t]+(?:россии|рф|российской[\p{Zs}\t]+федерации)[\s\p{P}]*$',
    '(?i)\bвооруж[её]нн\p{Alphabetic}*[\p{Zs}\t]+сил',
    '(?i)\bналогов\p{Alphabetic}{0,3}[\p{Zs}\t]+орган',
    '\bВАС\b',
    '^[\s\p{P}]*(?:\d+[\p{Zs}\t]*)?(?:АС|ФАС|ААС)[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*(?:ой|ого|ей|ы|и|а|я)\b',
]
anywhere_in = ["ORG", "PERSON"]

# Never public bodies, whoever owns them: a span that names a university
# or college itself, after its abbreviations and adjectives, a state one
# too ("ФГБОУ ВО «Северный государственный университет»", "ГБПОУ
# «Ольховский колледж»"; #484), and one that opens with a non-state or
# charitable fund ("Негосударственный пенсионный фонд «Кедр»", "НПФ
# «Кедр»"). "ГБУ «Университетская больница»" and "Министерство науки и
# университетов" name no university, and go.
[[private]]
patterns = [
    '^[\s\p{P}]*(?:\p{Uppercase}{2,7}[\p{Zs}\t]+){0,2}[«"]?(?i:(?:\p{Alphabetic}+(?:ый|ий|ой|ая|яя|ое|ее|ого|его|ому|ему|ым|им|ую|юю|ых|их)[\p{Zs}\t-]+){0,4}(?:университет|колледж)(?:а|у|ом|ем|е|ы|и|ов|ей|ам|ами|ах)?)(?:[^\p{Alphabetic}]|$)',
    '^[\s\p{P}]*(?:АО[\p{Zs}\t]+)?[«"]?(?:(?i:негосударственн|благотворительн)|НПФ\b)',
]

# A public-law company is a public body (guide rule 8, the maintainer's
# decision on #484, item 4): "ППК «Роскадастр»", "публично-правовая
# компания «Фонд развития территорий»", "Роскадастра" alone, as an
# organization or a person. Words in quotes are its name, so the form
# outside them decides.
[[never]]
match = "whole"
words = ["ппк"]
anywhere_in = ["ORG", "PERSON"]

# The model's person in a public-law company's quotes is its name, no
# one's: "Фонд развития территорий" in "ППК «Фонд развития территорий»"
# (#484, item 4).
[[shape]]
category = "PERSON"
forbid_quotes = ["«»"]
quotes_after_words = ["ППК"]

# The same company's form and Роскадастр by their stems
# ("публично-правовой", "Роскадастру").
[[never]]
match = "stem"
ending = 3
words = ["публично-правов", "роскадастр"]
anywhere_in = ["ORG", "PERSON"]

# Codes and laws by their full names: "Гражданского кодекса Российской
# Федерации", "Федерального закона", "Конституции Российской Федерации",
# "законодательством Российской Федерации" (guide rule 8, issue #378), as
# an organization or a person.
[[never]]
match = "stem"
ending = 3
words = ["кодекс", "закон", "законодательств", "конституци"]
anywhere_in = ["ORG", "PERSON"]
person_endings = [
    "", "а", "я", "у", "ю", "о", "е", "и", "ы", "й", "ом", "ем", "ой", "ою",
    "ей", "ов", "ам", "ям", "ах", "ях", "ами", "ями", "ый", "ий", "ая", "яя",
    "ое", "ее", "ые", "ие", "ого", "его", "ому", "ему", "ую", "юю", "ым", "им",
    "ых", "их", "ыми", "ими",
]
surname_endings = ["ов"]
unless_titled = true

# A region, district, city or settlement is a place, not an organization,
# alone or as a public body's tail: "Северной области", "Ольховскому
# краю", "Кедровской Республики", "Ольховскому району", "городу
# Ольховску", "ПГТ Ольховка" (guide rules 2 and 3, issue #478). A company
# keeps a place in its name by its legal form ("ООО «Северная область
# Строй»"), and so does any name in quotes ("Банк «Город»"): public-body
# words count outside quotes only.
[[never]]
match = "stem"
ending = 3
words = ["област", "республик", "район", "округ", "поселк", "посёлк", "станиц"]
anywhere_in = ["ORG"]

# The same places' designators that are matched whole: "края" and "города"
# are common words in other forms; "обл" is "области" cut short.
[[never]]
match = "whole"
words = [
    "край", "края", "краю", "краем", "крае", "город", "города", "городу",
    "городом", "городе", "г", "пгт", "поселок", "посёлок", "обл",
]
anywhere_in = ["ORG"]

# A law's number is a legal reference, never an organization: "ФЗ № 127-ФЗ",
# "Федерального закона … № 418-ФЗ" (guide rule 8, issue #378).
[[shape]]
category = "ORG"
forbid = ['\d[\p{Zs}\t]*-[\p{Zs}\t]*ФК?З\b']

# Russian legal forms mark a manual selection as an organization
# ("ООО «Ромашка»"). Matched as written: ASCII case folding leaves Cyrillic
# as is.
[[shape]]
category = "ORG"
guess_words = ["ООО", "ОАО", "ЗАО", "ПАО", "АО", "НКО", "ИП"]

# A date mask in a blank or depersonalised form is no date, organization or
# person: "ДД.ММ.ГГГГ", "ДД.ММ.ГГ", "ХХ.ХХ.ХХ", "__.__.____", alone or before
# a number sign ("ХХ.ХХ.ХХ №") or a word the model took with it
# ("ДД.ММ.ГГГГ уроженца"). Two letters at least in a group, so initials
# ("М.Г.") stay (guide rules 4 and 8, issue #487).
[[shape]]
category = "ORG"
forbid = ['(?i)^\s*[«"(]?[дмгхx_]{2,4}(?:[./][дмгхx_]{2,4}){1,2}(?:г\.?)?(?:[^\p{Alphabetic}\p{N}_]|$)']

# The same mask as a person.
[[shape]]
category = "PERSON"
forbid = ['(?i)^\s*[«"(]?[дмгхx_]{2,4}(?:[./][дмгхx_]{2,4}){1,2}(?:г\.?)?(?:[^\p{Alphabetic}\p{N}_]|$)']

# The same mask as a date.
[[shape]]
category = "DATE"
forbid = ['(?i)^\s*[«"(]?[дмгхx_]{2,4}(?:[./][дмгхx_]{2,4}){1,2}(?:г\.?)?(?:[^\p{Alphabetic}\p{N}_]|$)']

# A placeholder for a party in a depersonalised act is no one: «ФИО1»,
# «ФИО 2», «ИП ФИО1», «ФИО1 и ФИО2», «ФИО3 – ФИО6», «Потерпевший №1»,
# with a role before it in the span («конкурсного управляющего ФИО1»),
# whatever the model guessed (guide rule 8, the maintainer's decision on
# #484, item 1). Real initials after one go with the span here and come
# back alone as PERSON by the span pattern below: «ИП ФИО3 А-Х.О.» is
# «А-Х.О.». A real name beside one keeps the span.
[[shape]]
category = "ORG"
forbid = ['^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$']

# The same placeholder as a person.
[[shape]]
category = "PERSON"
forbid = ['^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$']

# Real initials after a placeholder are a name part, PERSON alone:
# «А-Х.О.» in «ИП ФИО3 А-Х.О.», «В. С.» in «ФИО2 В. С.» and in
# «Потерпевший №1 В. С.» (guide rules 1 and 8, the maintainer's decision
# on #484, item 1).
[[span]]
category = "PERSON"
pattern = '(?P<lead>\b(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})[\p{Zs}\t]+)\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?(?P<tail>[^\p{Alphabetic}]|$)'

# An individual entrepreneur is not an organization: the name after «ИП»
# or «индивидуальный предприниматель» (any case form) is PERSON, and the
# words for the status stay outside the span (guide rule 1, the
# maintainer's decision on #484 item 5, issue #562). A span of exactly the
# status and a name, surname with initials or a full name in any order and
# case form, goes as an organization; the span pattern below gives the
# name back as PERSON. A trading name in quotes after the name («ИП …
# магазин «Кедрач»») is no part of the span and stays an organization
# (item 8). A placeholder («ИП ФИО1») is dropped above.
[[shape]]
category = "ORG"
forbid = ['^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП|(?i:индивидуальн\p{Alphabetic}*[\p{Zs}\t]+предпринимател\p{Alphabetic}*))[\p{Zs}\t]+(?:(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?|\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)|(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}[\p{Ll}\p{Lu}]*(?i:(?:ич|ыч)(?:а|у|ем|ом|е)?|(?:вн|чн)(?:а|ы|е|у|ой)|оглы|кызы)|(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}[\p{Ll}\p{Lu}]*(?i:(?:ич|ыч)(?:а|у|ем|ом|е)?|(?:вн|чн)(?:а|ы|е|у|ой)|оглы|кызы)[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*))[\s\p{P}]*$']

# The name after the status of an individual entrepreneur is PERSON alone
# («Ветлин Н. О.» in «ИП Ветлин Н. О.», «Брюн Лидия Игоревна» in
# «индивидуальный предприниматель Брюн Лидия Игоревна», «Ветлину Н.О.» in
# «ИП Ветлину Н.О.»), whether the model took the status with the name, as
# an organization (with or without the status), or not at all (issue #562).
# Surname and initials, initials and surname, surname, name and patronymic,
# or name, patronymic and surname, in any case form («Моховым Ильёй
# Ильичом»), each word in title case or capitals («МОХОВ Лев Романович»);
# a missed real name leaks, an extra mark costs one untick. An ORG exactly
# on the name yields to this PERSON.
[[span]]
category = "PERSON"
pattern = '(?P<lead>{lead})(?:{name})(?P<tail>[^\p{Alphabetic}]|$)'
parts.lead = '(?:ИП|(?i:индивидуальн\p{Alphabetic}*[\p{Zs}\t]+предпринимател\p{Alphabetic}*))[\p{Zs}\t]+'
parts.name = '(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?|\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)|(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}[\p{Ll}\p{Lu}]*(?i:(?:ич|ыч)(?:а|у|ем|ом|е)?|(?:вн|чн)(?:а|ы|е|у|ой)|оглы|кызы)|(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)[\p{Zs}\t]+\p{Uppercase}[\p{Ll}\p{Lu}]*(?i:(?:ич|ыч)(?:а|у|ем|ом|е)?|(?:вн|чн)(?:а|ы|е|у|ой)|оглы|кызы)[\p{Zs}\t]+(?:\p{Uppercase}\p{Ll}+(?:-\p{Uppercase}\p{Ll}+)*|\p{Lu}{2,}(?:-\p{Lu}{2,})*)'
absorbs.ORG = '(?P<span>{name})$'


# A short two-part name after a word that introduces a person is PERSON,
# whatever the model made of it: «уполномочиваю гражданина Лю Бо»,
# «гражданке Ким Ир», «господину Ли Вэй», «г-же Пак Сун» (guide rule 1,
# #404). Two short capitalised words, of two to four letters each, and
# no third one after them: a longer word may be a place, a body's name or
# a form's heading («гражданином Советского Союза», «гражданке Канады
# Браун», «Гражданин Петров Подпись»), and a longer name is the model's.
# Only a gap: where a name span (the model's, a name cell's) overlaps the
# match, the match is not proposed (`gaps_only`, #404 review), so a
# wrong word never spreads as a known name. The introducing word stays
# outside. A country after «гражданин» is citizenship, no name («гражданина
# Российской Федерации», «гражданки Республики Казахстан», «гражданина
# Украины Петренко»), and an office after «господин» is a title
# («господину Председателю Суда»): both are skipped. «гр.» is left out, as
# it is also grams.
[[span]]
category = "PERSON"
pattern = '(?P<lead>{lead})(?:{name})(?P<tail>{tail})'
parts.lead = '\b(?:[Гг]раждан(?:ин|ина|ину|ином|ине|ка|ки|ке|ку|кой)|[Гг]осподин(?:а|у|ом|е)?|[Гг]оспож(?:а|и|е|у|ой)|[Гг]-н(?:а|у|ом|е)?|[Гг]-ж(?:а|и|е|у|ой))[\p{Zs}\t]+'
parts.name = '\p{Lu}\p{Ll}{1,3}[\p{Zs}\t]+\p{Lu}\p{Ll}{1,3}'
parts.tail = '[\p{Zs}\t]*(?:[^\p{L}\p{N}\p{Zs}\t]|(?m:$))|[\p{Zs}\t]+[\p{Ll}\p{N}]'
skip = '\b(?:(?:Российск|Республик|Федераци|Королевств|Государств|Соединённ|Соединенн|Объединённ|Объединенн|Китайск|Корейск|Японск|Турецк|Индийск|Вьетнамск|Монгольск|Узбекск|Казахск|Киргизск|Кыргызск|Таджикск|Туркменск|Армянск|Азербайджанск|Грузинск|Молдавск|Белорусск|Украинск|Латвийск|Литовск|Эстонск|Израильск|Иностранн|Европейск|Председател|Директор|Начальник|Министр|Президент|Губернатор|Прокурор|Судь|Генеральн|Главн|Управляющ)\p{Ll}*|России|Украины|Беларуси|Белоруссии|Казахстана|Узбекистана|Кыргызстана|Киргизии|Таджикистана|Туркменистана|Армении|Азербайджана|Грузии|Молдовы|Молдавии|Китая|Кореи|Японии|Вьетнама|Монголии|Турции|Израиля|Германии|Франции|Италии|Испании|Польши|Индии|Латвии|Литвы|Эстонии|Сербии)\b'
gaps_only = true

# The status of an individual entrepreneur stays outside a person's span:
# the model's «ИП Мохов Л. Р.» as a person is «Мохов Л. Р.», and so is
# «индивидуального предпринимателя Мохова Л. Р.» (issue #562), with up to
# three lowercase words before it («об индивидуальном предпринимателе …»).
# Only the uppercase abbreviation is status: «Ип Ман» keeps its surname.
[[span]]
category = "PERSON"
trim_start = ['(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП|(?i:индивидуальн(?:ый|ого|ому|ым|ом)[\p{Zs}\t]+предпринимател(?:ь|я|ю|ем|е)))[\p{Zs}\t]+']

# The same placeholder as an identity document: its digit is no number.
[[shape]]
category = "IDENTITY"
forbid = ['^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$']

# A cadastral number is no tax number, phone or account (the maintainer's
# decision on #484, item 2): a model span that starts with one, is its
# first three or last two parts, goes, and the IDENTITY span below takes
# the number. Nor is a placeholder ("ФИО1") one (item 1).
[[shape]]
category = "TAX"
forbid = [
    '^\s*(?:\d{2}:)?\d{2}:\d{6,7}(?::\d|\s*$)|^\s*\d{6,7}:\d{1,7}\s*$',
    '^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$',
]

# The same as a phone.
[[shape]]
category = "PHONE"
forbid = [
    '^\s*(?:\d{2}:)?\d{2}:\d{6,7}(?::\d|\s*$)|^\s*\d{6,7}:\d{1,7}\s*$',
    '^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$',
]

# The same as bank details.
[[shape]]
category = "BANK"
forbid = [
    '^\s*(?:\d{2}:)?\d{2}:\d{6,7}(?::\d|\s*$)|^\s*\d{6,7}:\d{1,7}\s*$',
    '^[\s\p{P}]*(?:\p{Ll}[\p{Alphabetic}-]*[\p{Zs}\t]+){0,3}(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3})(?:[\p{Zs}\t]*(?:,|и|[–—-])[\p{Zs}\t]*(?:ИП[\p{Zs}\t]+)?(?:ФИО[\p{Zs}\t]?\d{1,3}|(?:[Пп]отерпевш|[Сс]видетел|[Оо]бвиняем|[Пп]одсудим|[Оо]сужд[её]нн)\p{Alphabetic}*[\p{Zs}\t]*№[\p{Zs}\t]*\d{1,3}))*(?:[\p{Zs}\t]+\p{Uppercase}(?:-\p{Uppercase})?\.(?:[\p{Zs}\t]?\p{Uppercase}(?:-\p{Uppercase})?\.)?)?[\s\p{P}]*$',
]

# A product's name in quotes after the word for it is no organization: "ПО
# «Контур»", "АСУ «Экспресс»", "программы «Сетка»", "мессенджера «Ватсап»",
# "Система «Гарант»" at a sentence's start (guide rule 2, issue #488), and
# neither is the whole phrase. A company keeps it by its legal form ("ООО
# «Контур»"). An app's name ("приложение «…»") waits for the guide (#484).
[[shape]]
category = "ORG"
forbid = [
    '^\s*(?:ПО|АСУ)\s*(?:«[^«»]*»|"[^"]*")\s*$',
    '(?i)^\s*(?:программ|мессенджер|систем)\p{Alphabetic}{0,3}\s*(?:«[^«»]*»|"[^"]*")\s*$',
]
forbid_quotes = ["«»", '""']
quotes_after = ["программ", "мессенджер", "систем"]
quotes_after_words = ["ПО", "АСУ", "Программа", "Мессенджер", "Система"]

# Dates with a Russian month name: "12 марта 2026 г.", "«12» марта 2026".
[[shape]]
category = "DATE"
guess = [
    '(?i)\s*[«"]?(?:\d{1,2}|(?:\\?_)+)[»"]?\s+(?:января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)\s+(?:\d{4}|(?:\\?_)+)(?:\s*(?:г\.?|года))?\s*',
]

# Case numbers after "номер дела" or "дело №" (ADR 0092): "**Номер дела:**
# 2-1842/2026", "**Дело №** 1234", "дело № А40-123456/2026". The value is the
# whole identifier and needs four digits: the review proposes a wording
# everywhere it appears, and a short one would mark "статья 12" too. A date
# is not one.
[[context]]
category = "CASE"
labels = ["номер дела"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# "дело №", "дела №", "делу №": the number sign makes the word a label. A
# court case only: an archive, personnel or registry file ("архивное дело
# 58239", "личное дело") is not one (issue #451).
[[context]]
category = "CASE"
labels = ["дело", "дела", "делу"]
between = '[\p{Zs}\t*_]{0,3}№[\p{Zs}\t:*_.]{0,6}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]
unless_after = [
    "архивное", "архивного", "архивному", "архивным", "личное", "личного",
    "личному", "кадровое", "кадрового", "учётное", "учетное", "номенклатурное",
]

# "дело", "дела", "делу" without "№" are also common words: only a number
# with a separator, or of five digits or more, follows them as a case number
# ("дело А40-987654/2026", "по делу 2-1842/2026"), never a date.
[[context]]
category = "CASE"
labels = ["дело", "дела", "делу"]
between = '[\p{Zs}\t:#]{1,4}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)+|\d{5,}'
min_digits = 4
unless_guessed = ["DATE"]
unless_after = [
    "архивное", "архивного", "архивному", "архивным", "личное", "личного",
    "личному", "кадровое", "кадрового", "учётное", "учетное", "номенклатурное",
]

# A case's unique identifier is CASE (guide rule 5, the maintainer's decision
# on #484, item 7): "УИД 77RS0001-02-2031-009999-99", "УИД: 25RS0010-…". A
# document's GUID has no such label and stays unmarked.
[[context]]
category = "CASE"
labels = ["уид", "уникальный идентификатор дела"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# An appellate proceeding's number (#484 item 7): "апелляционное производство
# № 05АП-1234/2031", in each case form.
[[context]]
category = "CASE"
labels = [
    "апелляционное производство", "апелляционного производства",
    "апелляционному производству", "апелляционным производством",
    "апелляционном производстве",
]
between = '[\p{Zs}\t*_]{0,3}№[\p{Zs}\t:*_.]{0,6}'
value = '(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# An administrative-offence protocol's number is CASE, not a phone (#484
# item 7, #375): "протокол об административном правонарушении № 99 АБ
# 123456", "протоколом об административном правонарушении от 01.03.2031 №
# 18810099310001234567" (a date between, in figures or with its month in
# words, «от 01 марта 2031 г.», which stays unmarked). The series and
# number keep their spaces.
[[context]]
category = "CASE"
labels = [
    "протокол об административном правонарушении",
    "протокола об административном правонарушении",
    "протоколу об административном правонарушении",
    "протоколом об административном правонарушении",
    "протоколе об административном правонарушении",
]
between = '(?:[\p{Zs}\t]+от[\p{Zs}\t]+\d{1,2}(?:\.\d{1,2}\.|[\p{Zs}\t]+\p{Lowercase}{3,8}[\p{Zs}\t]+)\d{2,4}(?:[\p{Zs}\t]*г\.?)?)?[\p{Zs}\t*_]{0,3}№[\p{Zs}\t:*_.]{0,6}'
value = '\d{2}[\p{Zs}\t]?\p{Uppercase}{2}[\p{Zs}\t]?\d{6,7}|(?:\p{Alphabetic}+[-/:.]?)*\d[\p{Alphabetic}\p{N}]*(?:[-/:.][\p{Alphabetic}\p{N}]+)*'
min_digits = 4
unless_guessed = ["DATE"]

# The same protocol by "протокол №" alone, before its series and number
# ("протоколом № 99 АБ 123456 об административном правонарушении"). A
# meeting's minutes are a "протокол №" too ("протокол № 3 общего
# собрания"), so only the form's shape: two digits, two capitals, six or
# seven digits.
[[context]]
category = "CASE"
labels = ["протокол", "протокола", "протоколу", "протоколом", "протоколе"]
between = '[\p{Zs}\t*_]{0,3}№[\p{Zs}\t:*_.]{0,6}'
value = '\d{2}[\p{Zs}\t]?\p{Uppercase}{2}[\p{Zs}\t]?\d{6,7}'
min_digits = 8

# Russian identifiers after their label (ADR 0092), whatever their checksum:
# the guide marks invalid and damaged ones too. The structured rules propose
# only valid ones; these give the label's category over the model's guess.
# A table column headed by the label takes its cells' values too.
#
# Field labels beside values in one model span (#739): "ИНН 7701234567,
# КПП 770101001, р/с …, тел. …" keeps each field's value, of its label's
# category (guide rule 6: ОГРН, ОГРНИП, ОКПО and КПП are TAX, a БИК is
# BANK). ОКТМО and КБК are budget codes (#553 item 1), an amount's, an
# address's or an invoice's word no label: they give nothing.
[[label]]
category = "TAX"
words = ["кпп", "огрн", "огрнип", "огрн ип", "окпо", "код окпо"]

# Bank details' labels besides the trimmed ones above.
[[label]]
category = "BANK"
words = ["бик", "лицевой счет", "лицевой счёт", "корр счет", "корр счёт", "номер счета", "номер счёта"]

# "Счёт" and "сч." alone are an invoice's as often as an account's ("счёт
# № 12345678 от 01.02.2026"): only an account's twenty digits after them.
[[label]]
category = "BANK"
words = ["счет", "счёт", "сч"]
strict = true

# An identity document's labels.
[[label]]
category = "IDENTITY"
words = ["паспорт", "паспорта"]

# A series is a passport's after "паспорт" ("паспорт гражданина РФ серии
# 45 12 № 345678"); alone, only before a passport's series and number; a
# certificate's or a form's ("свидетельство серии 77 № 012345678", "бланк
# серии 7701 № 123456") is none.
[[label]]
category = "IDENTITY"
words = ["серия", "серии", "серия и номер"]
only_after = ["паспорт", "паспорта"]

# A phone's labels.
[[label]]
category = "PHONE"
words = ["тел", "телефон", "телефона", "тел/факс", "факс", "моб"]

# ИНН: ten or twelve digits; OCR may read a digit as O, О, I, l or І.
[[context]]
category = "TAX"
labels = ["инн"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '[0-9OОoIlІ]{10}(?:[0-9OОoIlІ]{2})?'
min_digits = 8

# ОГРН and ОГРНИП are TAX like ИНН, a public body's own too (guide rule 6,
# the maintainer's decisions on #484 item 6 and #553 item 1; #563): "ОГРН
# 1027700132195", "(ОГРНИП: 322213000038573)", "ОГРН ИП № …", "OGRN …",
# "PSRN …", "основной государственный регистрационный номер (ОГРН) …", "за
# основным государственным регистрационным номером …". The model's
# IDENTITY or BANK guess on the value gives way. Thirteen or fifteen
# digits, and one fewer or more: the guide marks an invalid or damaged
# value too, and OCR may read a digit as a letter. A label joined to
# another by a slash ("ИНН/ОГРН 7701234567/1027700132195") leaves the run
# to the model, as its value there may be the other label's.
[[context]]
category = "TAX"
labels = [
    "огрн", "огрнип", "огрн ип", "ogrn", "ogrnip", "psrn",
    "основной государственный регистрационный номер",
    "основным государственным регистрационным номером",
]
between = '(?:[\p{Zs}\t]+индивидуального[\p{Zs}\t]+предпринимателя)?(?:[\p{Zs}\t]*\((?:ОГРН|ОГРНИП)\))?[\p{Zs}\t:*_№#.(]{1,8}'
value = '[0-9OОoIlІ]{12,16}'
min_digits = 11
unless_slashed = true

# ОКПО is TAX too (#484 item 6, #563): "ОКПО 99887766", "код ОКПО: …",
# eight digits for a company, ten for an entrepreneur, and one fewer or
# more for a damaged value. A classifier's code (ОКТМО, ОКВЭД, КБК) is a
# reference, not this (guide rule 6, #553 item 1), and a slash-joined
# label ("ОКТМО/ОКПО 45382000/99887766") leaves the run to the model.
[[context]]
category = "TAX"
labels = ["окпо", "код окпо", "код по окпо"]
between = '[\p{Zs}\t:*_№#.(]{1,8}'
value = '[0-9OОoIlІ]{7,11}'
min_digits = 6
unless_slashed = true

# СНИЛС: "123-456-789 00" or eleven digits.
[[context]]
category = "IDENTITY"
labels = ["снилс"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{3}-\d{3}-\d{3}[\p{Zs}-]\d{2}|\d{11}'
min_digits = 11

# A card or membership code after its label: "Код карточки: CARD-918264".
[[context]]
category = "IDENTITY"
labels = ["код карточки", "номер карточки"]
between = '[\p{Zs}\t:*_№#.]{1,8}'
value = '\p{Alphabetic}{2,}-?\d{4,}'
min_digits = 4

# A cadastral number pins down one property, so it identifies its owner
# like an address (the maintainer's decision on #484, item 2):
# "кадастровый номер 99:07:0012345:678", "с кадастровым номером …", "КН
# …", "кадастровый номер земельного участка: …". A cadastral quarter
# ("99:07:0012345") is an area, not one property, and stays.
[[context]]
category = "IDENTITY"
labels = [
    "кадастровый", "кадастрового", "кадастровому", "кадастровым", "кадастровом",
    "кадастровые", "кадастровыми", "кадастровых", "кадастровый номер", "кн", "к.н",
]
between = '(?:[\p{Zs}\t]+(?:номер\p{Alphabetic}{0,3}|№))?(?:[\p{Zs}\t]+(?:земельного|участка|объекта|недвижимости|помещения|здания|квартиры|сооружения|жилого|нежилого|дома)){0,3}[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}:\d{2}:\d{6,7}:\d{1,7}'
min_digits = 10

# A right's registration number in the state register pins down one
# property too (#484, item 2): "номер регистрации права
# 99:07:0012345:678-99/011/2031-4", "номер государственной регистрации от
# 12.03.2031 № 99-99/011-99/011/001/2031-123/2".
[[context]]
category = "IDENTITY"
labels = [
    "номер регистрации", "номер государственной регистрации", "номером регистрации",
    "номером государственной регистрации", "регистрационная запись",
    "регистрационной записи", "запись регистрации", "записи регистрации",
    "запись о регистрации", "записи о регистрации",
]
between = '(?:[\p{Zs}\t]+(?:права|прав|собственности|ипотеки|аренды|сделки|договора|в|ЕГРН|ЕГРП|от|\d{1,2}\.\d{1,2}\.\d{4}|г\.)){0,6}[\p{Zs}\t:*_№#.]{1,8}'
value = '\d{2}:\d{2}:\d{6,7}:\d{1,7}-\d{2,3}/\d{3}/\d{4}-\d{1,7}|\d{2}-\d{2}(?:-\d{2})?/\d{3}(?:-\d{2}/\d{3}/\d{3})?/\d{4}-\d{1,7}(?:/\d{1,3})?'
min_digits = 10

# Cadastral and registration numbers by their shape, with no label: "участок
# 99:07:0012345:678", "запись 99:07:0012345:678-99/011/2031-4" (#484,
# item 2).
[[span]]
category = "IDENTITY"
pattern = '\b\d{2}:\d{2}:\d{6,7}:\d{1,7}(?:-\d{2,3}/\d{3}/\d{4}-\d{1,7})?\b'

# A number assigned to one person is IDENTITY (guide rule 6, the
# maintainer's decision on #484, item 3; #483): an attorney's, a notary's
# or an arbitration manager's register number after the register's name
# ("регистрационный номер в реестре адвокатов Ольховской области 77/1234",
# "в сводном реестре 99887", "в сводном государственном реестре
# арбитражных управляющих за номером 12345"). A notarial act's own entry
# ("зарегистрировано в реестре № …", "реестровый номер …" alone) is no
# person's and stays. The whole labels are listed for a table column
# headed by one, and name the person's number in text too ("реестровый
# номер адвоката 77/1234").
[[context]]
category = "IDENTITY"
labels = [
    "реестре адвокатов", "реестре нотариусов", "реестре арбитражных управляющих",
    "сводном реестре", "сводном государственном реестре",
    "регистрационный номер в реестре адвокатов",
    "регистрационный номер в реестре нотариусов",
    "регистрационный номер в сводном реестре",
    "регистрационный номер в сводном государственном реестре арбитражных управляющих",
    "регистрационный номер адвоката", "регистрационный номер нотариуса",
    "регистрационный номер арбитражного управляющего", "реестровый номер адвоката",
    "реестровый номер нотариуса", "реестровый номер арбитражного управляющего",
]
between = '(?:[\p{Zs}\t]+(?:арбитражных[\p{Zs}\t]+управляющих|г\.|города|\p{Uppercase}[\p{Alphabetic}-]*|област\p{Alphabetic}*|кра\p{Alphabetic}*|республик\p{Alphabetic}*|за[\p{Zs}\t]+номером|под[\p{Zs}\t]+номером|номер\p{Alphabetic}{0,2})){0,5}[\p{Zs}\t:*_№#.—–-]{1,8}'
value = '\d{1,3}/\d{1,6}(?:-н)?|\d{3,8}'
min_digits = 3

# A personal certificate's number (#484, item 3): "удостоверение адвоката №
# 9917", "удостоверение № 1234", "удостоверением арбитражного управляющего
# № АУ-5512".
[[context]]
category = "IDENTITY"
labels = ["удостоверение", "удостоверения", "удостоверению", "удостоверением", "удостоверении"]
between = '(?:[\p{Zs}\t]+(?:адвоката|нотариуса|арбитражного[\p{Zs}\t]+управляющего|инвалида|ветерана|сотрудника|личности)){0,2}[\p{Zs}\t:*_]*№[\p{Zs}\t:*_.]{0,6}'
value = '(?:\p{Uppercase}{1,4}[\p{Zs}-]?)?\d{3,10}(?:/\d{1,6})?'
min_digits = 3

# Addresses (ADR 0092, issue #362) in reverse, the flat first and the city
# last, where a city without "г." ends its field: "кв. 9, д. 32, переулок
# Бумажных лодок, Тверь", then an index. A city of several words needs its
# "г." ("г. Нижний Новгород"): without one it reads as a name. A
# depersonalised address masked before its house starts at the house, when
# a building or flat follows, or at a plot: "(<...> д 31 к 2, кв 69б, ИНН
# …)" is "д 31 к 2, кв 69б", "…, <...> уч. 109" is "уч. 109", "<...> …
# д. 5, стр. 1, оф. 2" is "д. 5, стр. 1, оф. 2"; "<...> д. 5 мая" and
# "<...> уч. 2023 года" are none (#362, probe round 2). No span holds a "<"
# (the review's syntax rule), so the places before such a mask are an
# address of their own (the third entry below). The parts are the forward
# entry's (below), the tail aside; this entry comes first, so a reverse
# address keeps its place before a forward one in the list of matches.
# Place names are Cyrillic or Latin letters of any language ("г. Київ",
# "г. Өскемен"), a narrower class than every letter, which keeps the
# forward pattern within the regex size limit.
[[span]]
category = "ADDRESS"
pattern = '(?:{flat}{sep})?(?:{building}{sep})*{house}{sep}(?:{building}{sep})*{street}(?:{sep}{city}(?:{sep}{index}\b)?|{sep}{bare_city}(?:{sep}{index}\b|(?P<tail>{tail})))?|(?P<lead>{mask}[\p{Zs}\t]*,?[\p{Zs}\t]*(?:{street_mask}[\p{Zs}\t]*,?[\p{Zs}\t]*)?)(?:{house}(?:(?:{sep}|[\p{Zs}\t]+)(?:{building}|{flat}))+|{plot})'
parts.tail = '[\p{Zs}\t]*(?:(?m:$)|[\r|<.;,()—–])'
# A blank element between commas ("д. 5, , ком. 1-А") is no break (#362).
parts.sep = ',(?:[\p{Zs}\t]*,)*\s*'
parts.index = '\b\d{6}'
parts.bare_city = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
parts.city = '\b[гГ]\.[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t][\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,2}|\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:город|ГОРОД)\b|\b(?:город|ГОРОД)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
# Only a mask that is no ordinary punctuation: "<...>", "<***>", "<данные
# изъяты>", "***".
parts.mask = '<(?:\.{3}|…|\*{1,5}|данные[\p{Zs}\t]+изъяты|ДАННЫЕ[\p{Zs}\t]+ИЗЪЯТЫ|адрес)>|\*{3,}|[\[(](?:данные[\p{Zs}\t]+изъяты|изъято)[\])]'
# A plot after a mask: up to three digits, or four that are no year
# ("уч. 109", "уч. 1234", but not "уч. 2023 года").
parts.plot = '\b(?:уч|УЧ)\.[\p{Zs}\t]*(?:\d{1,3}|(?:[03-9]\d|1[0-8]|2[1-9])\d{2})(?:-?\p{Alphabetic})?\b'
parts.street = '{street_type}[\p{Zs}\t]*(?:{street_name}|{street_mask})|\b\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?[\p{Zs}\t]+(?:\([^()\n]{1,20}\)[\p{Zs}\t]+)?{street_after}'
parts.street_type = '\b(?:ул|УЛ)\b\.?|\b(?:пр|пер|наб|пл|ш|ПР|ПЕР|НАБ|ПЛ)\.|\b(?:пр-т|пр-кт|пр-д|б-р|ПР-Т|ПР-КТ|ПР-Д|Б-Р)\b|\b(?:улица|проспект|переулок|бульвар|шоссе|набережная|площадь|проезд|тупик|аллея|линия|тракт|УЛИЦА|ПРОСПЕКТ|ПЕРЕУЛОК|БУЛЬВАР|ШОССЕ|НАБЕРЕЖНАЯ|ПЛОЩАДЬ|ПРОЕЗД|ТУПИК|АЛЛЕЯ|ЛИНИЯ|ТРАКТ)\b'
parts.street_name = '(?:(?:им|ИМ)\.[\p{Zs}\t]*|имени[\p{Zs}\t]+)?(?:\p{Uppercase}\.[\p{Zs}\t]*){0,2}(?:\d{1,3}(?:-?\p{Ll}{1,2})?[\p{Zs}\t]+)?\p{Uppercase}[\p{Alphabetic}\d-]*(?:[\p{Zs}\t][\p{Alphabetic}\d-]+)?'
parts.street_mask = '…|\.{3}|\*{3,}'
parts.street_after = '(?:улица|проспект|переулок|бульвар|шоссе|набережная|площадь|проезд|тупик|аллея|линия|тракт|УЛИЦА|ПРОСПЕКТ|ПЕРЕУЛОК|БУЛЬВАР|ШОССЕ|ПРОЕЗД)\b|(?:ул|пр|пер|наб|пл|ш|УЛ|ПР|ПЕР)\.|(?:пр-т|пр-кт|пр-д|б-р)\b'
parts.house = '\bд[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}(?:[\p{Zs}\t]+к[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?\b)?|(?:\b(?:д|Д|дом|ДОМ|вл|влд|ВЛД)\b\.?|\b(?:уч|УЧ)\.|\bучасток\b)[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}'
parts.number = '\d+(?:-\d{1,3}\b)?(?:-?\p{Alphabetic})?(?:/\d+(?:-?\p{Alphabetic})?)?(?:[\p{Zs}\t][А-ЙЛ-РТ-ЯЁ]\b)?'
parts.building = '\b(?:корп|КОРП|стр|СТР|К)\b\.?[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\bк\.[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:корпус|КОРПУС|строение|СТРОЕНИЕ)\b[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:лит|ЛИТ)(?:\.|ера|ЕРА|ер|ЕР|\b)[\p{Zs}\t]*\p{Uppercase}\b|\b(?:эт|ЭТ)\.[\p{Zs}\t]*\d+|\bэтаж[\p{Zs}\t]*\d+'
parts.flat = '\b(?:кв|КВ|оф|ОФ|пом|ПОМ|помещ|ПОМЕЩ|ком|КОМ|комн|КОМН)\b\.?[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)|\b(?:квартира|КВАРТИРА|офис|ОФИС|помещение|ПОМЕЩЕНИЕ|комната|КОМНАТА)\b[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)'

# Addresses (ADR 0092, issue #362) forward: a street and a house ("д. 7",
# "д 31", "Д. 14", or a bare number after the street's comma: "ул.
# Еловая,16"), after an optional index and the places above the street,
# then buildings, flats and offices in any order: "191187, Санкт-Петербург,
# Литейный проспект, д. 7, офис 12", "Тверская область, г. Ржев, ул. Тихих
# арок, д. 47, корп. 2, стр. 1, лит. Б, пом. 9", "РОССИЯ 999999, ЭНСК, УЛ
# ЦЕНТРАЛЬНАЯ, Д. 14, К. 4, ОФ. 1". An address that opens with its region,
# country or «ГСП» keeps it (guide rule 3). A city without "г." leads only
# after an index, where a field or line starts, or after a lowercase word
# ("адресу Псков, ул. Тихих залов, д. 29"), and only right before the
# street: a bare word before a "г.", a region, a district or a settlement
# is a name ("Истец: Иванов, г. Энск, …", "ответчику Иванову, Кедровский
# район, …"), never a city. With no index, the places hold one city at
# most, so a public body's name stays out ("Администрация г. Энска, г.
# Энск, ул. Ленина, д. 1" is "г. Энск, …"; #553 item 1). A flat list or a
# second house number goes on ("кв. 1, 2, 4", "ул. Луговая, 6, 9") only up
# to its field's end, so a phone or a date after it ("кв. 7, 8–916–…",
# "кв. 7, 12.03.1985 г.р.") stays out. With places before it, a blank or
# elided street (", ,", "…") still leaves one address of the elements
# around it; and after an index and a place, a street with no house, or a
# box, ends one: "999999, Энская область, Энск город, Московское (18 км)
# шоссе", "999999, г. Энск, а/ 1" (#362, probe rounds 1 and 2). An index
# alone, or an index and a city with no street, is no match here.
[[span]]
category = "ADDRESS"
pattern = '(?:(?:(?:{country}|{gsp})[\p{Zs}\t]*,?[\p{Zs}\t]*)?{index}{sep}(?:{area}{sep})*(?:{bare_city}{sep}(?:{area}{sep})*)?|{areas}|(?P<lead>{lead})(?:{area}{sep})*{bare_city}{sep})?{street}{sep}(?:{house}|{bare_house})(?:(?:{sep}|[\p{Zs}\t]+)(?:{building}|{flat}))*(?:{item}+(?:(?:{sep}|[\p{Zs}\t]+)(?:{building}|{flat}){item}*)*(?P<tail>{tail}))?|(?:(?:(?:{country}|{gsp})[\p{Zs}\t]*,?[\p{Zs}\t]*)?{index}{sep}(?:(?:{area}|{bare_city}){sep})*|{areas})(?:{street_mask}[\p{Zs}\t]*,?[\p{Zs}\t]*|,[\p{Zs}\t]*)(?:{street}{sep})?(?:{house}|{flat})(?:(?:{sep}|[\p{Zs}\t]+)(?:{building}|{flat}))*|(?:(?:{country}|{gsp})[\p{Zs}\t]*,?[\p{Zs}\t]*)?{index}{sep}(?:(?:{area}|{bare_city}){sep})+(?:{street}|{box})'
parts.lead = '(?m:^)[\p{Zs}\t]*|[:|>(«"—–;,][\p{Zs}\t]*|\b\p{Ll}[\p{Ll}-]*[\p{Zs}\t]+'
# A list ends its field: a line's end, "|", "<", ";", a closing bracket or
# quote, a full stop or a dash before no digit ("кв. 1, 2." but not "кв.
# 7, 12.03.1985", "кв. 7, 8–916" or "кв. 7, 8 – 916"), or a comma before a
# word (a next field).
parts.tail = '[\p{Zs}\t]*(?:(?m:$)|[\r|<;)\]»"]|\.(?:\D|\z)|[—–][\p{Zs}\t]*(?:[^\d\p{Zs}\t]|\z))|,[\p{Zs}\t]*\p{Alphabetic}'
parts.item = ',[\p{Zs}\t]*\d{1,3}(?:-?\p{Alphabetic})?\b'
parts.sep = ',(?:[\p{Zs}\t]*,)*\s*'
parts.index = '\b\d{6}'
parts.country = '\b(?:Россия|РОССИЯ|Российская[\p{Zs}\t]+Федерация|РОССИЙСКАЯ[\p{Zs}\t]+ФЕДЕРАЦИЯ)\b'
parts.gsp = '\bГСП(?:-\d{1,3})?\b'
# The places above a street: a region, a district, a city with its "г." or
# "город", a settlement by its type («ч.», «г.о.», «ст.», «пгт», «с.»,
# «п.», «х.», «а.», «вн.тер.г.»; #482), a country or «ГСП».
parts.area = '{region}|{district}|{city}|{settlement}|{country}|{gsp}'
# One place or more, with one city at most.
parts.areas = '(?:(?:{region}|{district}|{settlement}|{country}|{gsp}){sep})+(?:{city}{sep}(?:(?:{region}|{district}|{settlement}|{country}|{gsp}){sep})*)?|{city}{sep}(?:(?:{region}|{district}|{settlement}|{country}|{gsp}){sep})*'
parts.region = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:область|обл\.|край|ОБЛАСТЬ|ОБЛ\.|КРАЙ)|\b(?:Республика|РЕСПУБЛИКА)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*(?:[\p{Zs}\t]+\([\p{Cyrillic}\p{Latin}-]+\))?'
parts.district = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:р-н|район|Р-Н|РАЙОН|(?:муниципальный|городской)[\p{Zs}\t]+(?:район|округ))\b'
parts.city = '\b[гГ]\.[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t][\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,2}|\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:город|ГОРОД)\b|\b(?:город|ГОРОД)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
# A settlement's type is lowercase before its name ("с. Кедровка", "г.о.
# Кедровск"); in capitals it goes only before a name in capitals, as a
# register extract writes it ("Г.О. КЕДРОВСК"), so a person's initials
# ("А.С. Петров", "И.П. Петров", "Д. Петров") are no settlement. A
# workers' settlement is «р. п.» or «р.п.» as well as «рп», so the address
# keeps its index and region before it ("431999, Энская область, р. п.
# Кедровка, улица Садовая, дом 8"), not only "п. Кедровка, …" (#482).
# Here a name's words are all capitalised: a lowercase second word after
# an adjective ("п. Кедровый ключ") is the other entries' only, as this
# pattern is at the regex size limit.
parts.settlement = '(?:\b(?:ч|п|с|х|д|а|ст|пос|дер|тер)\.|\b(?:пгт|рп)\b\.?|\b(?:ст-ца|аул|село|деревня|станица|хутор|посёлок|поселок|микрорайон|мкр)\b\.?|\b(?:г\.[\p{Zs}\t]?[оп]|с\.[\p{Zs}\t]?п|р\.[\p{Zs}\t]?п|м\.[\p{Zs}\t]?р-н|вн\.[\p{Zs}\t]?тер\.[\p{Zs}\t]?г)\.?)[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,3}|(?:\b(?:Ч|П|С|Х|Д|СТ|ПОС|ДЕР|ТЕР)\.|\b(?:ПГТ|РП|МКР)\b\.?|\b(?:Г\.[\p{Zs}\t]?[ОП]|С\.[\p{Zs}\t]?П|Р\.[\p{Zs}\t]?П|М\.[\p{Zs}\t]?Р-Н|ВН\.[\p{Zs}\t]?ТЕР\.[\p{Zs}\t]?Г)\.?)[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][[\p{Lu}&&[\p{Cyrillic}\p{Latin}]]\d-]+(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][[\p{Lu}&&[\p{Cyrillic}\p{Latin}]]\d-]+){0,3}'
parts.bare_city = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
parts.street = '{street_type}[\p{Zs}\t]*(?:{street_name}|{street_mask})|\b\p{Uppercase}[\p{Alphabetic}-]*(?:[\p{Zs}\t]+\p{Uppercase}[\p{Alphabetic}-]*)?[\p{Zs}\t]+(?:\([^()\n]{1,20}\)[\p{Zs}\t]+)?{street_after}'
# Dotless «ул» and the capitals of a register extract («УЛ», «ПР-Т»).
parts.street_type = '\b(?:ул|УЛ)\b\.?|\b(?:пр|пер|наб|пл|ш|ПР|ПЕР|НАБ|ПЛ)\.|\b(?:пр-т|пр-кт|пр-д|б-р|ПР-Т|ПР-КТ|ПР-Д|Б-Р)\b|\b(?:улица|проспект|переулок|бульвар|шоссе|набережная|площадь|проезд|тупик|аллея|линия|тракт|УЛИЦА|ПРОСПЕКТ|ПЕРЕУЛОК|БУЛЬВАР|ШОССЕ|НАБЕРЕЖНАЯ|ПЛОЩАДЬ|ПРОЕЗД|ТУПИК|АЛЛЕЯ|ЛИНИЯ|ТРАКТ)\b'
# "им." and initials inside a street's name ("ул. им. Пахомова", "ул. Б.
# Тульская"), a number before it ("ул. 8 Марта").
parts.street_name = '(?:(?:им|ИМ)\.[\p{Zs}\t]*|имени[\p{Zs}\t]+)?(?:\p{Uppercase}\.[\p{Zs}\t]*){0,2}(?:\d{1,3}(?:-?\p{Ll}{1,2})?[\p{Zs}\t]+)?\p{Uppercase}[\p{Alphabetic}\d-]*(?:[\p{Zs}\t][\p{Alphabetic}\d-]+)?'
parts.street_mask = '…|\.{3}|\*{3,}'
# The type after the name, abbreviated too ("Смольнинская ул.",
# "Большая Тульская улица").
parts.street_after = '(?:улица|проспект|переулок|бульвар|шоссе|набережная|площадь|проезд|тупик|аллея|линия|тракт|УЛИЦА|ПРОСПЕКТ|ПЕРЕУЛОК|БУЛЬВАР|ШОССЕ|ПРОЕЗД)\b|(?:ул|пр|пер|наб|пл|ш|УЛ|ПР|ПЕР)\.|(?:пр-т|пр-кт|пр-д|б-р)\b'
# A house and its number; «уч.» is a plot. A dotless «д» takes a dotless
# «к» building ("д 31 к 2"); elsewhere a lowercase «к» needs its dot, so
# "д. 5 к 10 часам" ends at "д. 5".
parts.house = '\bд[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}(?:[\p{Zs}\t]+к[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?\b)?|(?:\b(?:д|Д|дом|ДОМ|вл|влд|ВЛД)\b\.?|\b(?:уч|УЧ)\.|\bучасток\b)[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}'
# A house number ("5-7", "42-А", "68/70") and a house letter after a space,
# a capital other than «К» and «С», which open a building ("д. 43 Г", but
# "Д. 14 К. 4"). A part after a hyphen has three digits at most, so a case
# number ("д. № 2-1234/2020") is none.
parts.number = '\d+(?:-\d{1,3}\b)?(?:-?\p{Alphabetic})?(?:/\d+(?:-?\p{Alphabetic})?)?(?:[\p{Zs}\t][А-ЙЛ-РТ-ЯЁ]\b)?'
parts.bare_house = '\b\d{1,3}(?:-?\p{Alphabetic})?(?:/\d{1,3}(?:-?\p{Alphabetic})?)?\b(?:[\p{Zs}\t][А-ЙЛ-РТ-ЯЁ]\b)?'
parts.building = '\b(?:корп|КОРП|стр|СТР|К)\b\.?[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\bк\.[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:корпус|КОРПУС|строение|СТРОЕНИЕ)\b[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:лит|ЛИТ)(?:\.|ера|ЕРА|ер|ЕР|\b)[\p{Zs}\t]*\p{Uppercase}\b|\b(?:эт|ЭТ)\.[\p{Zs}\t]*\d+|\bэтаж[\p{Zs}\t]*\d+'
parts.flat = '\b(?:кв|КВ|оф|ОФ|пом|ПОМ|помещ|ПОМЕЩ|ком|КОМ|комн|КОМН)\b\.?[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)|\b(?:квартира|КВАРТИРА|офис|ОФИС|помещение|ПОМЕЩЕНИЕ|комната|КОМНАТА)\b[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)'
parts.box = '\b(?:а/я|А/Я|а/)[\p{Zs}\t]*\d+\b'

# Addresses (ADR 0092, guide rule 3, #506 item 6): an index and the places
# after it are an address with no street where a mask follows them, which
# no span holds: "999999, Энская область, г.о. Кедровск, <...> … д. 5"
# has "999999, Энская область, г.о. Кедровск" (and the house after the
# mask, in the reverse entry). The last place has its type (a region, a
# district, a city, a settlement), so an index and a bare word ("999999,
# Энск, <...>") are none (#362, probe round 2).
[[span]]
category = "ADDRESS"
pattern = '(?:(?:{country}|{gsp})[\p{Zs}\t]*,?[\p{Zs}\t]*)?{index}{sep}(?:(?:{area}|{bare_city}){sep})*(?:{area})(?P<tail>[\p{Zs}\t]*,?[\p{Zs}\t]*{mask})'
parts.sep = ',(?:[\p{Zs}\t]*,)*\s*'
parts.index = '\b\d{6}'
parts.country = '\b(?:Россия|РОССИЯ|Российская[\p{Zs}\t]+Федерация|РОССИЙСКАЯ[\p{Zs}\t]+ФЕДЕРАЦИЯ)\b'
parts.gsp = '\bГСП(?:-\d{1,3})?\b'
parts.mask = '<(?:\.{3}|…|\*{1,5}|данные[\p{Zs}\t]+изъяты|ДАННЫЕ[\p{Zs}\t]+ИЗЪЯТЫ|адрес)>|\*{3,}|[\[(](?:данные[\p{Zs}\t]+изъяты|изъято)[\])]'
# The places are the forward entry's, «р. п.» too, and a settlement's
# name may have a lowercase second word after an adjective ("п. Кедровый
# ключ"; #482).
parts.area = '{region}|{district}|{city}|{settlement}|{country}|{gsp}'
parts.region = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:область|обл\.|край|ОБЛАСТЬ|ОБЛ\.|КРАЙ)|\b(?:Республика|РЕСПУБЛИКА)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*(?:[\p{Zs}\t]+\([\p{Cyrillic}\p{Latin}-]+\))?'
parts.district = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:р-н|район|Р-Н|РАЙОН|(?:муниципальный|городской)[\p{Zs}\t]+(?:район|округ))\b'
parts.city = '\b[гГ]\.[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t][\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,2}|\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:город|ГОРОД)\b|\b(?:город|ГОРОД)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
parts.settlement = '(?:\b(?:ч|п|с|х|д|а|ст|пос|дер|тер)\.|\b(?:пгт|рп)\b\.?|\b(?:ст-ца|аул|село|деревня|станица|хутор|посёлок|поселок|микрорайон|мкр)\b\.?|\b(?:г\.[\p{Zs}\t]?[оп]|с\.[\p{Zs}\t]?п|р\.[\p{Zs}\t]?п|м\.[\p{Zs}\t]?р-н|вн\.[\p{Zs}\t]?тер\.[\p{Zs}\t]?г)\.?)[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]](?:[\p{Cyrillic}\p{Latin}\d-]*(?:ый|ий|ой|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}{3,}[\p{Ll}-]*|[\p{Cyrillic}\p{Latin}\d-]*)(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,3}|(?:\b(?:Ч|П|С|Х|Д|СТ|ПОС|ДЕР|ТЕР)\.|\b(?:ПГТ|РП|МКР)\b\.?|\b(?:Г\.[\p{Zs}\t]?[ОП]|С\.[\p{Zs}\t]?П|Р\.[\p{Zs}\t]?П|М\.[\p{Zs}\t]?Р-Н|ВН\.[\p{Zs}\t]?ТЕР\.[\p{Zs}\t]?Г)\.?)[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][[\p{Lu}&&[\p{Cyrillic}\p{Latin}]]\d-]+(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][[\p{Lu}&&[\p{Cyrillic}\p{Latin}]]\d-]+){0,3}'
parts.bare_city = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'

# Addresses (ADR 0092, guide rule 3, #482): a settlement by its type, then
# a house right after it with no street, then buildings and flats, as a
# village or a garrison writes it: "с. Кедровка, д. 5, кв. 2", "п.
# Кедровый ключ ДОС № 1, кв. 2" (a «ДОС» is an officers' house), with the
# index and places before the settlement when there are any ("431999,
# Энская область, с. Кедровка, д. 5"). Only typed places lead, so a bare
# word before them is a name ("Истец: Иванов, с. Кедровка, д. 5" is "с.
# Кедровка, д. 5"). A settlement alone, with no house, is no match (guide
# rule 3); a street between the settlement and the house is the forward
# entry's. An index has no digit or dash right before it: "8-999-123456,
# с. Кедровка, д. 5" ends a phone, so the address is "с. Кедровка, д. 5"
# (#482 review).
[[span]]
category = "ADDRESS"
pattern = '(?:(?P<lead>(?m:^)|[^\d\-–—])(?:(?:{country}|{gsp})[\p{Zs}\t]*,?[\p{Zs}\t]*)?{index}{sep})?(?:{area}{sep})*{settlement}(?:{sep}|[\p{Zs}\t]+){house}(?:(?:{sep}|[\p{Zs}\t]+)(?:{building}|{flat}))*'
parts.sep = ',(?:[\p{Zs}\t]*,)*\s*'
parts.index = '\b\d{6}'
parts.country = '\b(?:Россия|РОССИЯ|Российская[\p{Zs}\t]+Федерация|РОССИЙСКАЯ[\p{Zs}\t]+ФЕДЕРАЦИЯ)\b'
parts.gsp = '\bГСП(?:-\d{1,3})?\b'
parts.area = '{region}|{district}|{city}|{settlement}|{country}|{gsp}'
parts.region = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:область|обл\.|край|ОБЛАСТЬ|ОБЛ\.|КРАЙ)|\b(?:Республика|РЕСПУБЛИКА)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*(?:[\p{Zs}\t]+\([\p{Cyrillic}\p{Latin}-]+\))?'
parts.district = '\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:р-н|район|Р-Н|РАЙОН|(?:муниципальный|городской)[\p{Zs}\t]+(?:район|округ))\b'
parts.city = '\b[гГ]\.[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t][\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*){0,2}|\b[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}-]*[\p{Zs}\t]+(?:город|ГОРОД)\b|\b(?:город|ГОРОД)[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d]*(?:-[\p{Cyrillic}\p{Latin}\d]+)*'
# The forward entry's settlement, lowercase types only: a capital one
# here is an initial ("С. Петров, д. 5"). A lowercase second word follows
# an adjective only, and then no other word ("п. Кедровый ключ"); else one
# more capitalised word at most, so a name after the place is no part of it
# ("с. Кедровка Ковальчук Иван, д. 5", "п. Кедровый ключ Ковальчук ДОС № 1"
# are no address). After «с.» and «д.» (a case file, «дело», too) no word
# ends as a surname's case form does (-ым, -им, -ом, -ем, -ой, -ей, -ого,
# -его, -ому, -ему, -ука, -юка, -ова, -ева, -ина, -ына): "с. Петровым, д.
# 5", "д. Ковальчука, д. 3" are no address (#482 review).
parts.settlement = '(?:\b(?:ч|п|х|а|ст|пос|дер|тер)\.|\b(?:пгт|рп)\b\.?|\b(?:ст-ца|аул|село|деревня|станица|хутор|посёлок|поселок|микрорайон|мкр)\b\.?|\b(?:г\.[\p{Zs}\t]?[оп]|с\.[\p{Zs}\t]?п|р\.[\p{Zs}\t]?п|м\.[\p{Zs}\t]?р-н|вн\.[\p{Zs}\t]?тер\.[\p{Zs}\t]?г)\.?)[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]](?:[\p{Cyrillic}\p{Latin}\d-]*(?:ый|ий|ой|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}{3,}[\p{Ll}-]*|[\p{Cyrillic}\p{Latin}\d-]*(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Cyrillic}\p{Latin}\d-]*)?)|\b[сд]\.[\p{Zs}\t]*[\p{Lu}&&[\p{Cyrillic}\p{Latin}]](?:[\p{Ll}-]*(?:ый|ий|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}{3,}[\p{Ll}-]*|[\p{Ll}-]*(?:[\p{Ll}--[мйоуа]]|[\p{Ll}--[ыиое]]м|[\p{Ll}--[ое]]й|[\p{Ll}--[г]]о|[\p{Ll}--[ое]]го|[\p{Ll}--[м]]у|[\p{Ll}--[ое]]му|[\p{Ll}--[квн]]а|[\p{Ll}--[ую]]ка|[\p{Ll}--[ое]]ва|[\p{Ll}--[иы]]на)\b(?:[\p{Zs}\t]+[\p{Lu}&&[\p{Cyrillic}\p{Latin}]][\p{Ll}-]*(?:[\p{Ll}--[мйоуа]]|[\p{Ll}--[ыиое]]м|[\p{Ll}--[ое]]й|[\p{Ll}--[г]]о|[\p{Ll}--[ое]]го|[\p{Ll}--[м]]у|[\p{Ll}--[ое]]му|[\p{Ll}--[квн]]а|[\p{Ll}--[ую]]ка|[\p{Ll}--[ое]]ва|[\p{Ll}--[иы]]на)\b)?)'
# A house, the forward entry's, or an officers' house («ДОС № 1», «ДОС-12»).
parts.house = '\bд[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}(?:[\p{Zs}\t]+к[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?\b)?|(?:\b(?:д|Д|дом|ДОМ|вл|влд|ВЛД)\b\.?|\bДОС\b-?)[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?{number}'
parts.number = '\d+(?:-\d{1,3}\b)?(?:-?\p{Alphabetic})?(?:/\d+(?:-?\p{Alphabetic})?)?(?:[\p{Zs}\t][А-ЙЛ-РТ-ЯЁ]\b)?'
parts.building = '\b(?:корп|КОРП|стр|СТР|К)\b\.?[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\bк\.[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:корпус|КОРПУС|строение|СТРОЕНИЕ)\b[\p{Zs}\t]*\d+(?:-?\p{Alphabetic})?|\b(?:лит|ЛИТ)(?:\.|ера|ЕРА|ер|ЕР|\b)[\p{Zs}\t]*\p{Uppercase}\b|\b(?:эт|ЭТ)\.[\p{Zs}\t]*\d+|\bэтаж[\p{Zs}\t]*\d+'
parts.flat = '\b(?:кв|КВ|оф|ОФ|пом|ПОМ|помещ|ПОМЕЩ|ком|КОМ|комн|КОМН)\b\.?[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)|\b(?:квартира|КВАРТИРА|офис|ОФИС|помещение|ПОМЕЩЕНИЕ|комната|КОМНАТА)\b[\p{Zs}\t]*(?:№[\p{Zs}\t]*)?(?:\d+(?:-?\p{Alphabetic})?(?:/\d+)?|[IVX]{1,5}\b)'

# A settlement's type before a place is no person's initial (guide rule 1,
# #482): a model person "а. Новый Хутор" in "уроженец а. Новый Хутор", "г.
# Северск" in "районного суда г. Северск" or "проведено в г. Северск",
# "п. Кедровый ключ" in a housing list. The type is lowercase («а.», «г.»,
# «п.», «пос.», «ст.», «х.», «с.»), before one capitalised word, or two
# when the first is an adjective; a name after the place stays ("в г.
# Северск Иванов"). Initials are capitals and stay ("Иванов А. Б.", "А.
# Петров"), and so does a title's name ("г-н Петров").
#
# 1. After «уроженец» and its forms any such place, the adjective's second
#    word capitalised too ("уроженец а. Новый Хутор").
# 2. After «в», «во», «из» and «суд» in its forms the adjective's second
#    word is lowercase ("в пос. Кедровый ключ"), so "в г. Нижний
#    Ковальчук" keeps the name, and after «с.» no word ends -ым, -ом or
#    -ой, a surname in the instrumental ("Суд с. Ковальчуком согласился").
# 3. With no such word only a place's ending («-ск», «-овка», «-евка»,
#    «-инка», «-ово», «-ино», «-ое», «-град», «-бург», «-поль»), never
#    a surname's genitive («г. Ковальчука», «г. Новака», «г. Бойка»), and
#    only after a word or a mark on the same line: at a line's start «г.»
#    may close a year on the line before ("2020\nг. Ковальская"), and
#    after a digit or a year's ending («2026 г.», «1990-х г.», «2020-м г.»)
#    it is one.
# 4. An adjective and a lowercase word before an address's next part
#    («ДОС», «д.», «дом», «ул.», «улица»): "п. Кедровый ключ ДОС № 1". A
#    lowercase «г.» before an adjective and a verb is a title («г.
#    Ковальская пояснила») and stays (#482 review).
[[shape]]
category = "PERSON"
forbid_in = [
    '(?P<lead>(?i:\b(?:уроженец|уроженц(?:а|у|ем|е|ы|ев|ам|ами|ах)|уроженк(?:а|и|е|у|ой|ою|ам|ами|ах)?)\b)[\p{Zs}\t]+)\b(?:а|г|п|пос|ст|х|с)\.[\p{Zs}\t]*\p{Lu}(?:[\p{Ll}-]*(?:ый|ий|ой|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{L}[\p{Ll}-]{2,}|[\p{Ll}-]{2,})',
    '(?P<lead>(?i:\b(?:в|во|из|суд(?:а|у|ом|е)?)\b)[\p{Zs}\t]+)\b(?:(?:а|г|п|пос|ст|х)\.[\p{Zs}\t]*\p{Lu}(?:[\p{Ll}-]*(?:ый|ий|ой|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}[\p{Ll}-]{2,}|[\p{Ll}-]{2,})|с\.[\p{Zs}\t]*\p{Lu}(?:[\p{Ll}-]*(?:ый|ий|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}[\p{Ll}-]{2,}|[\p{Ll}-]+(?:[\p{Ll}--[мй]]|[\p{Ll}--[ыо]]м|[\p{Ll}--[о]]й)\b))',
    '(?P<lead>(?:[^\d\p{Zs}\t\p{L}\-–—]|(?:^|[^\p{L}\d\-–—])\p{L}+)[\p{Zs}\t]*)\b(?:а|г|п|пос|ст|х|с)\.[\p{Zs}\t]*\p{Lu}[\p{Ll}-]*(?:ск|(?:ов|ев|ёв|ин|ан|ен|ян)ка|ово|ево|ино|ое|ее|ье|град|бург|поль)\b',
    '(?P<lead>(?:^|[^\d\p{Zs}\t])[\p{Zs}\t]*)\b(?:а|г|п|пос|ст|х|с)\.[\p{Zs}\t]*\p{Lu}[\p{Ll}-]*(?:ый|ий|ая|яя|ое|ее|ые|ие)[\p{Zs}\t]+\p{Ll}{3,}[\p{Ll}-]*[\p{Zs}\t]*,?[\p{Zs}\t]*(?:ДОС\b|д\.|дом\b|ул\.|улица\b)',
]

# The model's address that runs on into the next field ends before its
# label: "…, лит. Б, кадастровый №" ends at "лит. Б", and a residue that is
# only a letter and the label goes (#362, probe round 1).
[[span]]
category = "ADDRESS"
trim = [
    "кадастровый", "кадастровым", "кадастровый номер", "кадастровым номером",
    "№", "инн", "огрн", "огрнип", "тел", "телефон",
]

# Dates of birth (ADR 0092): a date after "дата рождения", "д.р.", "род.",
# "родился" is a personal date ("дата рождения 14 марта 1988 г.",
# "Дата рождения: 19 февраля 1987 года"). Every other date stays. The value
# must be one the DATE guesses take, a quoted day too ("«14» марта 1988 г."),
# and the label may be in the cell before or on the line before.
[[context]]
category = "DATE"
labels = ["дата рождения", "даты рождения", "д.р", "род", "родился", "родилась"]
between = '[\p{Zs}\t:*_.,|]{0,10}(?:\r?\n[\p{Zs}\t|]*)?'
value = '\d{1,2}[./]\d{1,2}[./]\d{2,4}(?:\p{Zs}?г\.)?|\d{4}-\d{2}-\d{2}|[«"]?\d{1,2}[»"]?\p{Zs}+\p{Alphabetic}+\p{Zs}+\d{4}(?:\p{Zs}*(?:г\.|года))?'
only_guessed = ["DATE"]

# A date before "года рождения" or "г.р." is a date of birth too, as
# arbitration acts give a party's (#363): "Иванов И. И., 01.01.1980 года
# рождения", "14 марта 1988 г.р.", "01.01.1980 г. р.". The "года" or "г."
# belongs to the label, outside the span. A year alone ("1980 г.р.") is no
# date, as the DATE guesses say, and stays. Only spaces on the date's line
# sit between it and the label (unspaced, "01.01.1980г.р." is one word to
# the review, which finds no date inside a word); a date may wrap at one
# line break between its words. The label is lowercase, so "г." then an
# initial is a date and a name ("от 12.03.2026 г. Р.А. Иванову",
# "01.02.2020 Г.Р. Петровой").
[[context]]
category = "DATE"
labels = ["года рождения", "г. рождения", "г.рождения"]
after = true
between = '[\p{Zs}\t]+'
value = '\d{1,2}[./]\d{1,2}[./]\d{2,4}|\d{4}-\d{2}-\d{2}|[«"]?\d{1,2}[»"]?(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\p{Alphabetic}+(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}'
only_guessed = ["DATE"]

# The same dates before "г.р." or "г. р." (#363), as above, the closing dot
# written and a space, a comma, a bracket or the line's end after it: "р/с"
# after "г." is an account ("оплачено 01.02.2020 г. р/с 4070…"), and an
# initial's dot runs on into the name ("г. р.А. Иванову").
[[context]]
category = "DATE"
labels = ["г.р", "г. р"]
after = true
between = '[\p{Zs}\t]+'
follow = '\.(?:$|[\p{Zs}\t\r\n,;)\]»"])'
value = '\d{1,2}[./]\d{1,2}[./]\d{2,4}|\d{4}-\d{2}-\d{2}|[«"]?\d{1,2}[»"]?(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\p{Alphabetic}+(?:[\p{Zs}\t]+|[\p{Zs}\t]*\r?\n[\p{Zs}\t]*)\d{4}'
only_guessed = ["DATE"]

# Russian courts, public bodies, laws and legal databases are never web
# addresses to replace (ADR 0094, guide rule 8): "kad.arbitr.ru/Card/…",
# "http://pravo.gov.ru/proxy/ips/?docbody=…", "www.consultant.ru/document/…",
# every "*.gov.ru" and every court's "*.sudrf.ru". Fedresurs is not listed:
# its "/persons/…" pages are people's.
[[url]]
public = [
    "gov.ru", "sudrf.ru", "arbitr.ru", "ksrf.ru", "vsrf.ru",
    "consultant.ru", "garant.ru", "sudact.ru", "kodeks.ru", "cntd.ru",
    "pravo.ru", "nalog.ru", "gosuslugi.ru", "mos.ru", "mos-sud.ru",
    "mos-gorsud.ru", "rosreestr.ru", "kremlin.ru", "government.ru",
    "sledcom.ru", "cbr.ru", "notariat.ru", "reestr-zalogov.ru",
]

# Legal references are never marked (guide rule 8, issue #480): a law's
# number ("№ 127-ФЗ", "1-ФКЗ", "45-ОЗ"), an article of a code ("ст. 428 ГК
# РФ", "статьи 431 ГК РФ", "п. 2 ст. 450", "428 ГК РФ"). Close variants
# too (#480): a law's number spaced, lower case or reversed ("999 - ФЗ",
# "127-фз", "ФЗ-127"), a code by its full name ("428 Гражданского кодекса
# РФ", "12.8 Кодекса Российской Федерации об административных
# правонарушениях", "333.19 НК Российской Федерации").
[[reference]]
pattern = '\b\d{1,4}[\p{Zs}\t]*[-–][\p{Zs}\t]*(?:ФЗ|ФКЗ|КЗ|ОЗ|РЗ|фз|фкз)\b|\bФК?З[\p{Zs}\t]*[-–][\p{Zs}\t]*\d{1,4}\b|(?:\b(?:ст\.|стать(?:я|и|е|ю|ёй|ей|ям|ями|ях)|ч\.|част(?:ь|и|ью)|пп?\.|пункт(?:а|у|ом|е|ы|ов|ам)?)[\p{Zs}\t]*)?\b\d{1,4}(?:\.\d{1,3})*(?:[\p{Zs}\t]*(?:,|и)[\p{Zs}\t]*\d{1,4}(?:\.\d{1,3})*)*[\p{Zs}\t]+(?:(?:ГК|ГПК|АПК|УК|УПК|КоАП|НК|ТК|ЖК|СК|БК|ЗК|ВК|КАС|ЛК|ГрК)(?:[\p{Zs}\t]+{country})?\b|{code})|\b(?:ст\.|стать(?:я|и|е|ю|ёй|ей|ям|ями|ях))[\p{Zs}\t]*\d{1,4}(?:\.\d{1,3})*(?:[\p{Zs}\t]*(?:,|и)[\p{Zs}\t]*\d{1,4}(?:\.\d{1,3})*)*'
parts.country = '(?:РФ|Российской[\p{Zs}\t]+Федерации)'
parts.code = '(?:\p{Uppercase}\p{Ll}+(?:-\p{Ll}+)?(?:[\p{Zs}\t]+\p{Ll}+)?[\p{Zs}\t]+кодекса|[Кк]одекса)(?:[\p{Zs}\t]+(?:РФ|Российской[\p{Zs}\t]+Федерации))?(?:[\p{Zs}\t]+об[\p{Zs}\t]+административных[\p{Zs}\t]+правонарушениях)?'

# The number of a court act, an order or a transfer document is a
# reference, no tax or other identifier: "Определение Верховного Суда РФ
# от 12.03.2031 № 305-ЭС31-1234", "Определение судебной коллегии по
# экономическим спорам Верховного Суда РФ … №", "Приказ Минфина России от
# 01.02.2031 № 12н", "Постановление № 17", "УПД № 412" (guide rule 8, issue
# #480). Between the act and its "№" only its author (capitalized words and
# a court's own words) and its date: "Постановление направлено владельцу
# паспорта № 4512345678" holds a passport number, and "ИНН 7701234567"
# before a "№" stays. A case number keeps its label's rule ("по делу №
# А40-…").
# Close variants (#480): a letter's, a law's or a regulation's number
# ("Письмо Минфина России от 30.03.2031 № 02-09-11/05-03-99999", "Закон
# РФ … № 2300-1", "Положение Банка России … N 762-П"), "N" for "№", a
# quoted name and a municipality's own words in the author ("Постановление
# Администрации Энского района «Кедровый» от 01.03.2031 № 999-ПА"), and a
# letter's outgoing mark ("исх. №"). A lower court's words ("районного",
# "апелляционного") stay out: its act's number is mostly a case number.
# A law is "Закон", "Закона", "Закону", "Законом" or "Законе", no
# surname ("Законов Иван Петрович N 4512345678"). The number is short or
# has letters, dashes or a slash: nine or more bare digits after "№" are
# an account, a БИК, a card, a passport or an ИНН beside the author's
# words ("Письмо … Счёт N 40702810900000012345", "БИК № 044525225"), and
# an arbitration court's case number ("№ А28-3207/2031") is the case's
# (guide rule 5); both stay.
[[reference]]
pattern = '(?P<lead>\b(?:(?:[Оо]пределени|[Пп]остановлени|[Пп]риказ|[Рр]аспоряжени|[Уу]каз|УПД|[Пп]ередаточн\p{Alphabetic}{0,4}[\p{Zs}\t]+документ|[Пп]исьм|[Пп]оложени)\p{Alphabetic}{0,4}|[Зз]акон(?:а|у|ом|е)?\b)(?:[\p{Zs}\t]+(?:\p{Uppercase}[\p{Alphabetic}.-]*|«[^«»\n]{1,80}»|"[^"\n]{1,80}"|от|г\.|исх\.|вх\.|\d{1,2}\.\d{1,2}\.\d{2,4}|суда|судебной|коллегии|по|экономическим|гражданским|административным|уголовным|делам|спорам|арбитражного|округа|пленума|президиума|района|области|края|города|муниципального|образования|поселения|сельского|России)){0,16}[\p{Zs}\t]*(?:№|N)[\p{Zs}\t]*)(?:\p{Alphabetic}{2,4}|[\p{Alphabetic}&&[^АA]])?\d{1,8}(?:[\p{Alphabetic}/-][\p{Alphabetic}\d/-]*)?\b'

# A form's number and a classifier's code are no identifiers (guide rules 6
# and 8, issue #486): "Форма № Р11001", "Форма по КНД 1111501", "Форма по
# ОКУД 0401060", "код по ОКУД 0401060", "ОКВЭД 47.11, 47.19", "ОКТМО
# 45382000", "КБК 18210102010011000110", "код ТН ВЭД 8471300000", a table
# cell or a dash between the code and its value too ("ОКФС - 12"). These codes classify a form, an
# activity, a place or a payment; an organization's own numbers (ОКПО,
# ОГРН, ИНН, КПП) are no classifier's codes and stay.
[[reference]]
pattern = '\b[Фф]орм\p{Alphabetic}{0,2}[\p{Zs}\t]*(?:№|N|No\.?)[\p{Zs}\t]*\p{Alphabetic}{0,3}-?\d[\p{Alphabetic}\d.\-/]*|\b(?:[Фф]орм\p{Alphabetic}{0,2}[\p{Zs}\t]+)?(?:[Кк]од\p{Alphabetic}{0,2}[\p{Zs}\t]+)?(?:формы[\p{Zs}\t]+)?(?:по[\p{Zs}\t]+)?(?:ОКУД|КНД|ОКВЭД2?|ОКПД2?|ОКОПФ|ОКФС|ОКОГУ|ОКАТО|ОКТМО|ОКВ|ОКЕИ|ОКСМ|ОКИН|ОКОФ|ОКПДТР|ОКЗ|ОКСО|КБК|ТН[\p{Zs}\t]+ВЭД(?:[\p{Zs}\t]+ЕАЭС)?)\b[\p{Zs}\t:|*_№\-–—]*\d[\d.\-]*(?:[\p{Zs}\t]*[,;][\p{Zs}\t]*\d{2}(?:\.\d{1,2}){1,3})*'

# A standard's or a building code's number is a reference, no identifier
# (guide rule 8, issue #486): "ГОСТ Р 7.0.97-2016", "ГОСТ Р ИСО 9001-2015",
# "ГОСТ 9238", "СП 2.13130.2020", "СНиП 2.01.07-85*", "СанПиН 2.1.3684-21",
# "ТУ 1234-001-12345678-2020". Besides ГОСТ the number needs a dot or a
# dash, so "СП «Восход»", a joint venture, stays.
[[reference]]
pattern = '\bГОСТ(?:[\p{Zs}\t]+(?:Р|ISO|ИСО|IEC|МЭК|EN|ЕН))*[\p{Zs}\t]+\d+(?:[.\-–/:]\d+)*\*?|\b(?:СП|СНиП|СанПиН|ТУ|ОСТ)(?:[\p{Zs}\t]+(?:ISO|ИСО))?[\p{Zs}\t]+\d+(?:[.\-–/]\d+)+\*?'

# The page code under a tax or registration form's barcode, two groups of
# four digits a column's gap apart alone on their line, or before the
# form's ИНН, КПП or page boxes ("7000  2010", "2990  2026  КПП  Стр."), is
# no tax or bank value (guide rule 8, issue #486). An account typed with
# one space ("Account number:" then "1234 5678") stays, and so does a
# passport's "4510 123456", with six digits after its series.
[[reference]]
pattern = '(?m:^)[\p{Zs}\t]*\d{4}[\p{Zs}\t]{2,}\d{4}(?:[\p{Zs}\t]*(?m:$)|(?P<tail>[\p{Zs}\t]+(?:ИНН|КПП|Стр\.)))'

# A waybill's or an invoice's number is a document's, no bank or other
# identifier (guide rule 8, issue #486): "ТН № 47", "ТТН № 112",
# "товарной накладной № 15", "счёта-фактуры № 123/4". A bank account
# after "счёт №" is no invoice's and stays. A transfer document's number
# goes with its word too, as the model takes them together ("по УПД № 137
# от 06.06.2022", "передаточному документу N 5"; #480). Nine or more bare
# digits after the "№" are an account or a tax number, no document's
# ("передаточному документу N 40702810900000012345"), and stay.
[[reference]]
pattern = '\b(?:ТН|ТТН|ТрН|УПД|[Тт]оварно-транспортн\p{Alphabetic}*[\p{Zs}\t]+накладн\p{Alphabetic}*|[Тт]овар\p{Alphabetic}*[\p{Zs}\t]+накладн\p{Alphabetic}*|[Тт]ранспортн\p{Alphabetic}*[\p{Zs}\t]+накладн\p{Alphabetic}*|[Нн]акладн\p{Alphabetic}*|[Сс]ч[её]т\p{Alphabetic}{0,2}-фактур\p{Alphabetic}*|(?:[Уу]ниверсальн\p{Alphabetic}*[\p{Zs}\t]+)?[Пп]ередаточн\p{Alphabetic}*[\p{Zs}\t]+документ\p{Alphabetic}*)[\p{Zs}\t]*(?:№|N)[\p{Zs}\t]*\p{Alphabetic}{0,4}-?\d{1,8}(?:[\p{Alphabetic}/-][\p{Alphabetic}\d/-]*)?\b'

# A public body's letter number is no bank or tax value, whole or in
# pieces (#480): "№ 02-09-11/05-03-31116", "N 03-18/27628", two-digit
# groups before the slash. A court case's "№ 2-1842/2026" (a longer group,
# a year after the slash) is no such number and keeps its label's rule.
[[reference]]
pattern = '(?:№|\bN)[\p{Zs}\t]*(?:\d{2}-){1,3}\d{2}/(?:\d{2}(?:-\d{2}){0,3}-\d{3,6}|\d{5,6})\b'

# A trading protocol's number is the platform's, no one's identifier
# ("протоколу об определении участников торгов 144355-МЭТС/1", "протокол №
# 99999-ЭТП/2"; guide rule 8, #480). An administrative-offence protocol's
# number is a case number (#484 item 7) and has no platform's letters.
[[reference]]
pattern = '(?P<lead>\b[Пп]ротокол\p{Alphabetic}{0,3}(?:[\p{Zs}\t]+(?:об?|о|по|на|определении|участников|торгов|торгах|проведения|подведения|итогах|итогов|результатах|рассмотрения|заявок|аукциона|конкурса)){0,8}[\p{Zs}\t]*(?:(?:№|N)[\p{Zs}\t]*)?)\d{2,8}-\p{Lu}{2,8}(?:/\d{1,4})?\b'

# An amount repeated in words after its digits is no TAX value (#547).
# Groups contain three digits; only a short group plus six digits allows
# the misplaced OCR space ("1 199999"). The bracket must start with a number word and end beside a currency word;
# arbitrary parentheses beside a real identifier do not qualify. The
# contextual guard preserves digit groups in a neighbouring numeric field.
[[shape]]
category = "TAX"
# A value after its identifier label (including passport) wins over amount
# cues. INN/KPP may share slash-joined labels and values, with spaces
# around either slash; the slash spacing cannot cross a column gap.
# A tab or two spaces ends the labelled value at the next column.
unless_in = ['(?i)\b(?:инн(?:\p{Zs}?/\p{Zs}?кпп)?|огрнип|огрн|кпп|окпо|паспорт)\b[\p{Zs}\t:*_№.]{1,8}[0-9OОoIlІ]+(?:\p{Zs}[0-9OОoIlІ]+)*(?:\p{Zs}?/\p{Zs}?[0-9OОoIlІ]+)?']
forbid_in = [
    '(?i)\b(?:(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)|\d{1,3}\p{Zs}\d{6})\p{Zs}?\((?:один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|сто|двести|триста|четыреста|пятьсот|шестьсот|семьсот|восемьсот|девятьсот|тысяча|миллион)\b[^()\n]{0,240}\)\p{Zs}?руб(?:л[а-яё]*)?\b\.?',
]

# An amount repeated in words after its digits is no BANK value (#547).
# Groups contain three digits; only a short group plus six digits allows
# the misplaced OCR space ("1 199999"). The bracket must start with a number word and end beside a currency word;
# arbitrary parentheses beside a real identifier do not qualify. The
# contextual guard preserves digit groups in a neighbouring numeric field.
[[shape]]
category = "BANK"
# A value after its identifier label (including passport) wins over amount
# cues.
# A tab or two spaces ends the labelled value at the next column.
unless_in = ['(?i)(?:\bбик\b|\b[ркл]/с(?:ч)?\b|\b(?:расч[её]тный|корреспондентский|лицевой)[\p{Zs}\t]+сч[её]т\b|\b(?:сч[её]т|паспорт)\b)[\p{Zs}\t:*_№.]{1,8}\d+(?:\p{Zs}\d+)*(?:[,.]\d+)?']
forbid_in = [
    '(?i)\b(?:(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)|\d{1,3}\p{Zs}\d{6})\p{Zs}?\((?:один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|сто|двести|триста|четыреста|пятьсот|шестьсот|семьсот|восемьсот|девятьсот|тысяча|миллион)\b[^()\n]{0,240}\)\p{Zs}?руб(?:л[а-яё]*)?\b\.?',
]

# An amount repeated in words after its digits is no PHONE value (#547).
# Groups contain three digits; only a short group plus six digits allows
# the misplaced OCR space ("1 199999"). The bracket must start with a number word and end beside a currency word;
# arbitrary parentheses beside a real identifier do not qualify. The
# contextual guard preserves digit groups in a neighbouring numeric field.
[[shape]]
category = "PHONE"
# A value after its identifier label (including passport) wins over amount
# cues. Mobile labels count too, and so do extension labels («доб. 207»).
# A value may open with a bracket («тел./факс (495) 123.45.67») and hold
# dots (#375).
# A tab or two spaces ends the labelled value at the next column.
unless_in = ['(?i)\b(?:телефон|тел|факс|моб|сот|мобильный|паспорт|доб|добавочный)\b[\p{Zs}\t:*_№.]{1,8}\+?\(?\d[\d().–-]*(?:\p{Zs}[\d().–-]+)*']
forbid_in = [
    '(?i)\b(?:(?:\d{1,3}(?:\p{Zs}\d{3})+|\d+)|\d{1,3}\p{Zs}\d{6})\p{Zs}?\((?:один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|сто|двести|триста|четыреста|пятьсот|шестьсот|семьсот|восемьсот|девятьсот|тысяча|миллион)\b[^()\n]{0,240}\)\p{Zs}?руб(?:л[а-яё]*)?\b\.?',
]

# The uppercase status alone is no one, as a person or an organization (#385,
# #562); the surname «Ип» is written otherwise and stays.
[[shape]]
category = "PERSON"
forbid = ['^[\s\p{P}]*ИП[\s\p{P}]*$']

# The same as an organization.
[[shape]]
category = "ORG"
forbid = ['^[\s\p{P}]*ИП[\s\p{P}]*$']

# A court case's number is no tax value but a case number, with a page
# number before it or not: a running header's «3 А28-3207/2026»,
# «А40-123456/2026», «2-1842/2026», and under any label or none
# («Апелляционное производство № 33-1234/2026», «Материал № 13-123/2026»,
# a judgment's heading «№ 2-1842/2026»; guide rule 5, #553 item 7, #480).
# The model's span stays hidden as CASE without the page number; a cited
# act's reference still removes it. An ИНН/КПП pair's slash has nine
# digits after it and stays. An appellate «05АП-…» number, CASE by #484
# item 7 with no rule of its own yet, keeps the model's span.
[[shape]]
category = "TAX"
case = ['^\s*(?:\d{1,4}[\p{Zs}\t]+)?(?P<case>(?:[А-ЯA-Z]\d{2}|\d{1,2}[а-яa-z]?)-\d{1,7}(?:-\d{1,4})?/(?:19|20)\d{2})\s*$']

# A contract, project, notice, protocol or order number is a record's, no
# bank, phone or tax value (#375, guide rules 6 and 8): «договором об
# ипотеке № ДИ-999999/2031/00009», «по проектам №№ 1199999, 119999Е»,
# «сообщение № 9999999», «по ордеру № 009999». Only the listed words may
# stand between the record word and its number sign, so a later ИНН, phone
# or account label is never swallowed. A list goes on only while its
# values keep the first one's form: short numbers (at most nine digits,
# perhaps with one letter) or codes with a letter prefix, a slash or a
# dash. A 10- to 12-digit value ends it («№№ 15, 16, 89123456789», «№
# 15,7701234567»): it may be a phone or an ИНН. These are no IDENTITY,
# CASE or PERSON rule: an administrative-offence protocol number is CASE
# (#484 item 7, #364).
# A deposit certificate's number is a record too («свидетельство о
# депонировании произведения № 023-014748»). A licence's number is left
# out: a notary's is IDENTITY.
[[shape]]
category = "BANK"
forbid_in = [
    '(?i)(?P<lead>\b(?:договор(?:а|у|ом|е|ы|ов|ам|ами|ах)?|проект(?:а|у|ом|е|ы|ов|ам|ами|ах)?|сообщени[еяюи]|объявлени[еяюи]|протокол(?:а|у|ом|е|ы|ов|ам|ами|ах)?|ордер(?:а|у|ом|е|ы|ов|ам|ами|ах)?)(?:[\p{Zs}\t]+(?:об|о|ипотеке|залоге|административном|правонарушении|от|\d{1,2}\.\d{1,2}\.\d{2,4})){0,6}[\p{Zs}\t]*№{1,2}[\p{Zs}\t]*)(?:(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*(?:[\p{Zs}\t]*,[\p{Zs}\t]*(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*)*|\d{1,9}\p{Alphabetic}?\b(?:[\p{Zs}\t]*,[\p{Zs}\t]*\d{1,9}\p{Alphabetic}?\b)*)',
    '(?i)(?P<lead>\bсвидетельств(?:о|а|у|ом|е)[\p{Zs}\t]+о[\p{Zs}\t]+депонировании[\p{Zs}\t]+произведения[\p{Zs}\t]*№[\p{Zs}\t]*)\p{Alphabetic}{0,4}-?\d[\p{Alphabetic}\d/-]*',
]

# The same as a phone.
[[shape]]
category = "PHONE"
forbid_in = [
    '(?i)(?P<lead>\b(?:договор(?:а|у|ом|е|ы|ов|ам|ами|ах)?|проект(?:а|у|ом|е|ы|ов|ам|ами|ах)?|сообщени[еяюи]|объявлени[еяюи]|протокол(?:а|у|ом|е|ы|ов|ам|ами|ах)?|ордер(?:а|у|ом|е|ы|ов|ам|ами|ах)?)(?:[\p{Zs}\t]+(?:об|о|ипотеке|залоге|административном|правонарушении|от|\d{1,2}\.\d{1,2}\.\d{2,4})){0,6}[\p{Zs}\t]*№{1,2}[\p{Zs}\t]*)(?:(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*(?:[\p{Zs}\t]*,[\p{Zs}\t]*(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*)*|\d{1,9}\p{Alphabetic}?\b(?:[\p{Zs}\t]*,[\p{Zs}\t]*\d{1,9}\p{Alphabetic}?\b)*)',
    '(?i)(?P<lead>\bсвидетельств(?:о|а|у|ом|е)[\p{Zs}\t]+о[\p{Zs}\t]+депонировании[\p{Zs}\t]+произведения[\p{Zs}\t]*№[\p{Zs}\t]*)\p{Alphabetic}{0,4}-?\d[\p{Alphabetic}\d/-]*',
]

# The same as a tax number.
[[shape]]
category = "TAX"
forbid_in = [
    '(?i)(?P<lead>\b(?:договор(?:а|у|ом|е|ы|ов|ам|ами|ах)?|проект(?:а|у|ом|е|ы|ов|ам|ами|ах)?|сообщени[еяюи]|объявлени[еяюи]|протокол(?:а|у|ом|е|ы|ов|ам|ами|ах)?|ордер(?:а|у|ом|е|ы|ов|ам|ами|ах)?)(?:[\p{Zs}\t]+(?:об|о|ипотеке|залоге|административном|правонарушении|от|\d{1,2}\.\d{1,2}\.\d{2,4})){0,6}[\p{Zs}\t]*№{1,2}[\p{Zs}\t]*)(?:(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*(?:[\p{Zs}\t]*,[\p{Zs}\t]*(?:\p{Alphabetic}{1,4}-?\d|\d+[/-])[\p{Alphabetic}\d/-]*)*|\d{1,9}\p{Alphabetic}?\b(?:[\p{Zs}\t]*,[\p{Zs}\t]*\d{1,9}\p{Alphabetic}?\b)*)',
    '(?i)(?P<lead>\bсвидетельств(?:о|а|у|ом|е)[\p{Zs}\t]+о[\p{Zs}\t]+депонировании[\p{Zs}\t]+произведения[\p{Zs}\t]*№[\p{Zs}\t]*)\p{Alphabetic}{0,4}-?\d[\p{Alphabetic}\d/-]*',
]

# Six digits right before a redacted address («<...>») or a city after
# «г.» are a postcode, no PHONE (#375): «адрес регистрации: 999999, <...>»,
# «999999, г. Энск». The postcode stands at the line's start, after a
# colon, comma, semicolon, bracket or quote, or after a word («Россия
# 999999»), never after an abbreviation such as «т.»: «т. 234567, г.
# Энск» is a local phone. A bare city name after the number is no proof.
# The #547 phone-label exceptions still win.
[[shape]]
category = "PHONE"
forbid_in = ['(?P<lead>(?:^|[:,;(«"]|\p{Alphabetic}{2})[\p{Zs}\t]*)\d{6}\b(?P<tail>,?[\p{Zs}\t]+(?:<\.\.\.|<…|г\.[\p{Zs}\t]*\p{Uppercase}))']

# An inspection's number in the ЕРКНМ register is the register's record,
# no one's value in any category (#375): «учетный номер в ЕРКНМ <20
# digits>». It is a reference, not a forbid_in: twenty digits are kept as
# an account beside any context cue (shared.toml). The register's name is
# required; a bare «учетный номер» stays.
[[reference]]
pattern = '(?i)(?P<lead>\bуч[её]тный[\p{Zs}\t]+номер[\p{Zs}\t]+в[\p{Zs}\t]+ЕРКНМ[\p{Zs}\t:№]*)\d+'
