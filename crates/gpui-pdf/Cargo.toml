[package]
name = "gpui-pdf"
version = "0.6.0"
edition = "2024"
description = "The PDF preview for mdoc: a virtualized GPUI viewer rendered in pure Rust with hayro, with text search and form-appearance normalization."
license = "MIT"
publish = false
repository = "https://github.com/lawkitt/mdoc"

[dependencies]
# Shared workspace spec (the root pins the rev) so Cargo unifies to one gpui.
gpui = { workspace = true }

# Pure-Rust PDF rasterizer (no native library, no system-font dependency).
hayro = "0.7"

# Build `image::Frame`/`RgbaImage` for `gpui::RenderImage`. Pin to gpui's `image`
# minor (0.25) so the `Frame` type unifies with what `RenderImage::new` expects.
image = "0.25"

log = "0.4"

# Geometry for the text-extraction layer. Pin to the kurbo version hayro uses
# so `Affine`/`BezPath` unify with hayro's `Device` trait.
kurbo = "0.13"

# PDF *writing* to normalize form-field appearance streams before hayro renders
# (hayro reads; lopdf rewrites). Pure Rust, MIT.
lopdf = { version = "0.45", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
