[package]
name = "mdoc-import"
version = "0.1.0"
edition = "2024"
description = "GUI-free document import: conversion, OCR and its verified setup, recognition languages, model downloads and the DOCX preview worker."
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/lawkitt/mdoc"

[dependencies]
mdoc-store = { path = "../mdoc-store" }
anydoc = { git = "https://github.com/lawkitt/anydoc.git", rev = "a0ee8dbf1c894ef8ede0b64e9cd5a3eb1d204119", default-features = false }
pdf-inspector = { git = "https://github.com/lawkitt/pdf-inspector.git", rev = "7e35e4daaafee464727a5bab952e9d3859f3cc7f", features = ["ocr"] }
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
tar = "0.4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
# Unlocks password-protected DOCX, XLSX and PPTX in memory; pinned in the
# workspace manifest.
craft-offcrypto = { workspace = true }
# Unlocks password-protected DOC in memory; pinned in the workspace manifest.
craft-doc-binary = { workspace = true }
# The unlocked DOC's compound file, and the RC4 CryptoAPI key derivation.
craft-cfb = { workspace = true }
sha1 = "0.11"
# The password and an unlocked document's bytes are wiped when dropped.
zeroize = "1"
# The image builder (image_pdf): decoding within limits, EXIF orientation,
# and photos re-encoded as JPEG. Already in the tree through pdf-inspector.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Exact: pre-release API. Without an `api-*` feature it asks ONNX Runtime for
# C API 17, which 1.17 and later serve: 1.32.0 downloaded on desktop
# (src/ocr.rs) and packaged on Android, 1.27.0 linked into the app on iOS,
# where ort finds it in the app's own executable.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# Probe the ONNX Runtime before ort sees it (ocr::load_onnx_runtime); ort's own version.
libloading = "0.9"

# The DOCX preview: a supervised worker process on desktop, in process on
# iOS; Android has no Original pane for DOCX yet.
[target.'cfg(not(target_os = "android"))'.dependencies]
# Exact: DOCX preview rendering changes between releases; bump by hand.
docxide-pdf = { version = "=0.21.4", default-features = false }
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
# Recognition defaults read the keyboard layouts.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints]
workspace = true
