[package]
name = "mdoc-mcp"
version = "0.1.0"
edition = "2024"
description = "The mdoc-mcp shim: MCP over stdio, forwarded to the running mdoc over an owner-only local pipe or socket (ADR 0126). Holds no key and reads no Vault file."
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/lawkitt/mdoc"

[[bin]]
name = "mdoc-mcp"
path = "src/main.rs"

# No Vault, store, PII or key crate: the shim only forwards (ADR 0126).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# The socket folder's owner check (`geteuid`).
libc = "0.2"
# The profile's data folder, as mdoc-store's `app_paths` finds it.
dirs = "7"
# Names the short socket folder of a data folder whose usual socket path
# is too long (#1311): stable, and a script can work it out.
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
# The owner-only named pipe (`ipc/windows.rs`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

# The shim's tests serve a real connector over a temp Vault as the fake app;
# the binary never links them.
[dev-dependencies]
mdoc-connector = { path = "../mdoc-connector" }
mdoc-pii = { path = "../mdoc-pii" }
mdoc-store = { path = "../mdoc-store" }
mdoc-vault = { path = "../mdoc-vault" }
tempfile = "3"

[lints]
workspace = true
