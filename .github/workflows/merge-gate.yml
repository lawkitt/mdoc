name: Merge gate

# Posts the `merge-gate` status (ADR 0095) on PR heads (the fast tier) and on
# merge-queue commits (every job their areas need, each named with where it
# ran), and dispatches the hosted Windows and Android fallbacks when the PC
# is silent. The rules are in scripts/merge-gate.sh. Runs main's copy of the
# script with this workflow's token and never checks out or runs PR code;
# pull_request_target runs this file as it is on main.
#
# Re-check the gate with `gh workflow run merge-gate.yml`, never by re-running
# a PR's pull_request_target run (ADR 0100). A pass that hit an error or left
# something pending dispatches merge-gate-recheck.yml, which runs this again
# 3 minutes later; the schedule stays, but nothing relies on it.
on:
  schedule:
    # GitHub may start a scheduled run late; the PC's 10-minute limits allow
    # for it.
    - cron: "*/5 * * * *"
  # The PC posts ci/windows and ci/android with the maintainer's token, which
  # starts this; this workflow's own statuses (GITHUB_TOKEN) do not.
  status:
  workflow_run:
    workflows: [CI, Queue]
    types: [requested, completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # By hand, and by merge-gate-recheck.yml.
  workflow_dispatch:

permissions: {}

# One pass at a time; a pass started while another runs waits for it.
concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  merge-gate:
    # Not "merge-gate": that is the status this job posts.
    name: merge-gate pass
    runs-on: ubuntu-latest
    # A pass takes seconds; retried GitHub calls (3 tries of up to 30 s each)
    # can stretch one while GitHub is failing.
    timeout-minutes: 10
    permissions:
      # Dispatch the hosted fallbacks and the recheck, re-run jobs that never
      # ran; read runs, jobs and check runs.
      actions: write
      checks: read
      # A queue commit's own scripts/ci-areas.txt.
      contents: read
      pull-requests: read
      # Post merge-gate.
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts

      - run: bash scripts/merge-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GATE_REPO: ${{ github.repository }}
