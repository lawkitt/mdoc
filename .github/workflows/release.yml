name: Release

# Shipped targets only: Apple Silicon macOS and Windows x64 (ADR 0037).
# A `v*` tag made by `just release` checks the tag against the repository
# version, runs CI and the OCR smoke test on both targets, packages with
# `just package`, and creates a DRAFT GitHub Release with SHA256SUMS and build
# provenance. Publish the draft by hand after checking it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases (v0.1.0-beta.1, v1.0.0-rc.2) are marked pre-release.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Unpublished test builds from any branch: the version is patched into the
  # build only, and artifacts stay on the run page for 90 days.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version for the test build, without "v" (e.g. "0.1.0-dev.1"). A
          hyphen marks a pre-release, which skips the .msi.
        required: true
        default: "0.0.0-dev"

# Each job declares its own permissions; only `release` can write.
permissions: {}

env:
  EFFECTIVE_VERSION: ${{ inputs.version || github.ref_name }}
  # System git fetches the large gpui git dependency more reliably than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Queue, don't cancel: never interrupt a half-uploaded release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml, Cargo.lock and Info.plist
        if: github.event_name == 'push'
        run: scripts/verify-version.sh "$GITHUB_REF_NAME"

  ci:
    needs: [version]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Release gate: real OCR runtime/model download and EN/RU recognition on
  # each shipped target.
  smoke-ocr:
    needs: [version]
    name: smoke-ocr (${{ matrix.runner }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just smoke-ocr

  package:
    needs: [ci, smoke-ocr]
    name: package (${{ matrix.runner }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            tools: just cargo-packager
          - runner: windows-latest
            tools: just cargo-packager cargo-wix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.tools }}
          cache-key: release

      # cargo-wix uses the system WiX 3.14; Chocolatey's package version is
      # the first three components of the winget version in tools.env.
      - name: Install WiX Toolset
        if: runner.os == 'Windows' && !contains(env.EFFECTIVE_VERSION, '-')
        shell: pwsh
        run: |
          $version = ($env:WIX_VERSION -split '\.')[0..2] -join '.'
          choco install wixtoolset --version $version -y --no-progress
          $wixDir = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset *' | Select-Object -First 1).FullName
          if (-not $wixDir) { Write-Error "WiX install directory not found"; exit 1 }
          "$wixDir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "WIX=$wixDir\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Test builds only; tag builds already carry their version (verified).
      - name: Set test-build version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: scripts/set-version.sh "$EFFECTIVE_VERSION"

      - run: just package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [package]
    # Test builds stop at the run page; only tags produce a release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance
      attestations: write
    steps:
      # Full history + tags for the commit list in the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      # Verifiable with `gh attestation verify <file> -R lawkitt/mdoc`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Highlights: this version's `## [x.y.z]` CHANGELOG section, if any
      # (pre-releases usually have none). What's Changed: commits since the
      # previous tag — any tag for a pre-release, the previous stable for a
      # stable release.
      - name: Build release notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          if [[ "${CURRENT_TAG}" == *-* ]]; then
            IS_PRERELEASE=1
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          else
            IS_PRERELEASE=0
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' "${CURRENT_TAG}^" 2>/dev/null || true)
          fi

          HIGHLIGHTS=$(awk -v ver="${CURRENT_TAG#v}" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          {
            if [ "$IS_PRERELEASE" = "1" ]; then
              echo "> ⚠️ **Pre-release.** Published for testing. Behaviour and artifacts are not final."
              echo
            fi
            echo "> Builds are not yet signed. macOS: right-click mdoc → **Open** on first launch."
            echo "> Windows: SmartScreen → **More info** → **Run anyway**. Verify downloads with \`SHA256SUMS\`"
            echo "> or \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."
            echo
            if [ -n "$HIGHLIGHTS" ]; then
              echo "## Highlights"
              echo
              echo "$HIGHLIGHTS"
              echo
            fi
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --format='* %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log --no-merges --format='* %s (%h)' "${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/commits/${CURRENT_TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
            SHA256SUMS
          body_path: release-notes.md
          # Draft first (ADR 0037): check the artifacts, then publish by hand.
          draft: true
          prerelease: ${{ contains(env.EFFECTIVE_VERSION, '-') }}
