name: Release

# Shipped targets only: Apple Silicon macOS and Windows x64 (ADR 0037).
# A `v*` tag made by `just release` checks the tag against the repository
# version, runs CI with the OCR smoke test on both targets, packages with
# `just package` (Developer ID signed and notarized on macOS, ADR 0039), and
# creates a DRAFT GitHub Release with SHA256SUMS and build
# provenance. Publish the draft by hand after checking it.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases (v0.1.0-beta.1, v1.0.0-rc.2) are marked pre-release.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Unpublished test builds from any branch: the version is patched into the
  # build only, and artifacts stay on the run page for 90 days.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version for the test build, without "v" (e.g. "0.1.0-dev.1"). A
          hyphen marks a pre-release, which skips the .msi.
        required: true
        default: "0.0.0-dev"
      sign:
        description: >-
          Developer ID sign and notarize the macOS build, as a tag build does
          (uses the `release` environment's secrets).
        type: boolean
        default: false
      checks:
        description: >-
          Run CI and the OCR smoke test first, as a tag build does. Off by
          default: the pushed branch already ran CI, and packaging still
          runs the OCR self-test on the built app.
        type: boolean
        default: false

# Each job declares its own permissions; only `release` can write.
permissions: {}

env:
  EFFECTIVE_VERSION: ${{ inputs.version || github.ref_name }}
  # Tag builds always sign; test builds only when asked.
  SIGN: ${{ github.event_name == 'push' || inputs.sign }}
  # System git fetches the large gpui git dependency more reliably than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Queue, don't cancel: never interrupt a half-uploaded release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml, Cargo.lock and Info.plist
        if: github.event_name == 'push'
        run: scripts/verify-version.sh "$GITHUB_REF_NAME"

  # CI plus the release gate's OCR smoke test (real runtime/model download,
  # EN/RU recognition) on each shipped target. Always for tags.
  ci:
    needs: [version]
    if: github.event_name == 'push' || inputs.checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      # Called CI inherits our event/ref: explicitly isolate its concurrency
      # group so branch CI cannot cancel a release's checks (or vice versa).
      release-call: true
      smoke-ocr: true

  package:
    needs: [version, ci]
    # Runs after a passing CI, or straight away when a test build skips it.
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    name: package (${{ matrix.runner }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            tools: just cargo-packager
          - runner: windows-latest
            tools: just cargo-packager cargo-wix
    runs-on: ${{ matrix.runner }}
    # Signed builds read the Apple secrets from the protected `release`
    # environment (ADR 0039); other test builds get none and stay ad-hoc signed.
    environment: ${{ (github.event_name == 'push' || inputs.sign) && 'release' || '' }}
    env:
      # A signed build must produce a Developer ID signed, notarized macOS app.
      MDOC_REQUIRE_SIGNING: ${{ (github.event_name == 'push' || inputs.sign) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.tools }}
          cache-key: release

      # cargo-wix uses the system WiX 3.14; Chocolatey's package version is
      # the first three components of the winget version in tools.env. Runner
      # images may already carry a later package build of the same release
      # (e.g. 3.14.1.20250415); keep it rather than fail on a downgrade.
      - name: Install WiX Toolset
        if: runner.os == 'Windows' && !contains(env.EFFECTIVE_VERSION, '-')
        shell: pwsh
        run: |
          $version = ($env:WIX_VERSION -split '\.')[0..2] -join '.'
          $installed = (choco list wixtoolset --exact --limit-output) -replace '^wixtoolset\|', ''
          if ($installed -and (($installed -split '\.')[0..2] -join '.') -eq $version) {
            Write-Host "WiX Toolset $installed already installed"
          } else {
            choco install wixtoolset --version $version -y --no-progress --allow-downgrade
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $wixDir = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset *' | Select-Object -First 1).FullName
          if (-not $wixDir) { Write-Error "WiX install directory not found"; exit 1 }
          "$wixDir\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "WIX=$wixDir\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Test builds only; tag builds already carry their version (verified).
      - name: Set test-build version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: scripts/set-version.sh "$EFFECTIVE_VERSION"

      - name: Load Apple signing credentials
        if: runner.os == 'macOS' && env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Optional until created (ADR 0045): without it the case key stays
          # in the login keychain.
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: scripts/ci-apple-credentials.sh setup

      - run: just package
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      # Gate on the artifact itself: the signed app (macOS) or release binary
      # (Windows) must load the downloaded runtimes and recognize the fixture.
      # Test builds are unsigned, which is how v0.1.0-beta.1 shipped broken.
      - run: just smoke-package

      - name: Remove Apple signing credentials
        if: always() && runner.os == 'macOS' && env.SIGN == 'true'
        run: scripts/ci-apple-credentials.sh cleanup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  installed-windows:
    name: installed Windows desktop smoke (${{ matrix.scenario }})
    needs: [package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scenario: [startup, wrong-title]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-Windows
          path: dist
      - name: Install, launch, inspect, capture, quit and verify uninstall keeps the case key
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if ($env:SCENARIO -eq 'startup') {
            ./scripts/ci-installed-windows.ps1
          } else {
            # An impossible title must fail, retain UIA diagnostics, and uninstall.
            pwsh -NoProfile -File scripts/ci-installed-windows.ps1 -ExpectedWindowTitle 'mdoc-intentionally-wrong-title' -StartupTimeoutSeconds 10
            if ($LASTEXITCODE -eq 0) { throw 'Wrong-title startup unexpectedly passed.' }
            $failure = Get-Content installed-windows-evidence/failure.txt -Raw
            if ($failure -notmatch 'did not expose a visible UI Automation main window') {
              throw "Negative case failed for an unexpected reason: $failure"
            }
            $uia = Get-Content installed-windows-evidence/uia.txt -Raw
            if ($uia -notmatch 'Window: Name=mdoc PID=') { throw "Missing failure UIA window: $uia" }
            if (Get-Process mdoc -ErrorAction SilentlyContinue) { throw 'Negative case left mdoc running.' }
            if (Test-Path (Join-Path $env:RUNNER_TEMP 'mdoc-installed-smoke/mdoc.exe')) { throw 'Negative case did not uninstall.' }
            $global:LASTEXITCODE = 0
          }
          # Both scenarios must prove key preservation. The expected wrong-title
          # failure must not hide an uninstall/key failure in the child's finally.
          if (Test-Path installed-windows-evidence/cleanup-error.txt) {
            throw (Get-Content installed-windows-evidence/cleanup-error.txt -Raw)
          }
          if (-not (Test-Path installed-windows-evidence/case-key.txt)) { throw 'Missing uninstall case-key preservation proof.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-windows-desktop-${{ matrix.scenario }}
          path: installed-windows-evidence/*
          if-no-files-found: error

  release:
    needs: [package, installed-windows]
    # Test builds stop at the run page; only tags produce a release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance
      attestations: write
    steps:
      # Full history + tags for the commit list in the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      # Verifiable with `gh attestation verify <file> -R lawkitt/mdoc`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # Highlights: this version's `## [x.y.z]` CHANGELOG section, if any
      # (pre-releases usually have none). What's Changed: commits since the
      # previous tag — any tag for a pre-release, the previous stable for a
      # stable release.
      - name: Build release notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          if [[ "${CURRENT_TAG}" == *-* ]]; then
            IS_PRERELEASE=1
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          else
            IS_PRERELEASE=0
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' "${CURRENT_TAG}^" 2>/dev/null || true)
          fi

          HIGHLIGHTS=$(awk -v ver="${CURRENT_TAG#v}" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          {
            if [ "$IS_PRERELEASE" = "1" ]; then
              echo "> ⚠️ **Pre-release.** Published for testing. Behaviour and artifacts are not final."
              echo
            fi
            echo "> The macOS app is signed and notarized by Apple. The Windows installer is not yet signed:"
            echo "> SmartScreen → **More info** → **Run anyway**. Verify downloads with \`SHA256SUMS\`"
            echo "> or \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."
            echo
            if [ -n "$HIGHLIGHTS" ]; then
              echo "## Highlights"
              echo
              echo "$HIGHLIGHTS"
              echo
            fi
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --format='* %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log --no-merges --format='* %s (%h)' "${CURRENT_TAG}"
              echo
              echo "**Full Changelog**: ${REPO_URL}/commits/${CURRENT_TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
            SHA256SUMS
          body_path: release-notes.md
          # Draft first (ADR 0037): check the artifacts, then publish by hand.
          draft: true
          prerelease: ${{ contains(env.EFFECTIVE_VERSION, '-') }}
