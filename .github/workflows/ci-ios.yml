name: CI iOS

# The iOS job on hosted runners (ADR 0095, ADR 0091, ADR 0100, ADR 0112):
# three jobs in parallel, and `ci/ios`, which merge-gate reads, green only
# when all three ran and passed.
#   ci/ios (unit)   the core, the app, the unit and parity tests (mdocTests)
#                   on the pinned Xcode and Simulator (scripts/tools.env),
#                   then the core and the app in the Release configuration,
#                   as an archive builds them, unsigned and without tests.
#   ci/ios (ui 1)   the core, the app and half of the UI test classes
#   ci/ios (ui 2)   (mdocUITests) each, by time, as scripts/ios-ui-shards.sh
#                   packs them (ADR 0113); the timing tests run only with
#                   `timing` (the nightly). A failed UI test retries once
#                   (ADR 0113): a pass on the retry keeps the part green and
#                   is named.
# The merge queue calls it for a queue commit that touches the ios or core
# area. Every step is a recipe or a script, so `scripts/ios-toolchain.sh`,
# `just ios-test "iPhone 17" mdocTests` (or `$(scripts/ios-ui-shards.sh 1)`)
# and `just ios-release` reproduce it on a Mac.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty for the triggering ref.
        type: string
        default: ""
      build-only:
        description: Build the iOS core only, which saves it and its cargo cache on main (main-caches.yml).
        type: boolean
        default: false
      timing:
        description: Run the timing tests too (LivePreviewUITests' typing and Return times, CoreWiringTests' review tap), as the nightly does.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to test; empty for the triggering ref.
        type: string
        default: ""
      build-only:
        description: Build the iOS core only.
        type: boolean
        default: false
      timing:
        description: Run the timing tests too.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The tests' switch for parallel testing: the number of Simulator clones
  # `just ios-test` runs them on; empty runs them on the one device. Off:
  # on 2 clones (PR #617's trial, 3 runs) testing took 16-17 minutes, not
  # 6.6, and the review-flow UI tests failed on every run.
  MDOC_IOS_TEST_WORKERS: ""

jobs:
  # The job id stays `ios`: main-caches.yml's build-only call saves the
  # cargo cache under it, and every part restores it (`cache-key: ios`).
  # That call, which runs the unit part alone, also saves the built core,
  # which every part restores too. The UI tests are two parts, sharded by
  # test class, as one took about 26 minutes after the sweep (#829), over
  # ADR 0112's 20; each builds the app itself.
  ios:
    name: ci/ios (${{ matrix.part }})
    runs-on: macos-26
    # Job limits (ADR 0095, ADR 0112): the one job took 29 to 46 minutes
    # with every test (2026-11-11); the unit part took 10 minutes and the
    # one UI part 26 on #829, so a UI shard should take about 17.
    timeout-minutes: 35
    strategy:
      # A cancelled part would read as a capacity cancel to merge-gate.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.build-only && '["unit"]' || '["unit", "ui 1", "ui 2"]') }}
    # Each part's own result (`unit`, `ui1`, `ui2`), failing tests
    # (`unit_tests`, ...) and tests that passed on their retry
    # (`ui1_retried`, `ui2_retried`), which `ci/ios` names: a matrix job's
    # outputs combine every part's.
    outputs:
      unit: ${{ steps.result.outputs.unit }}
      ui1: ${{ steps.result.outputs.ui1 }}
      ui2: ${{ steps.result.outputs.ui2 }}
      unit_tests: ${{ steps.failed.outputs.unit_tests }}
      ui1_tests: ${{ steps.failed.outputs.ui1_tests }}
      ui2_tests: ${{ steps.failed.outputs.ui2_tests }}
      ui1_retried: ${{ steps.failed.outputs.ui1_retried }}
      ui2_retried: ${{ steps.failed.outputs.ui2_retried }}
    env:
      PART: ${{ matrix.part }}
      # The timing tests (LivePreviewUITests' typing and Return times, in
      # ui 1, and CoreWiringTests' review tap, in unit) skip unless set:
      # they only measure speed, about 4 minutes, so only the nightly runs
      # them. xcodebuild passes TEST_RUNNER_<name> to the tests as <name>.
      TEST_RUNNER_MDOC_TIMING_TESTS: ${{ inputs.timing && '1' || '' }}
      # A failed UI test retries once (ADR 0113): the Simulator's timing
      # noise. Unit, Rust, Android and script tests never retry.
      MDOC_IOS_TEST_RETRY: ${{ startsWith(matrix.part, 'ui ') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # What `just ios-test` runs: the unit and parity tests, or a UI
      # shard's classes. Before anything is built, so a UI test class in no
      # shard or in two fails in seconds (as it fails `lint (ubuntu)`).
      - name: What to test
        id: part
        run: |
          echo "key=${PART// /}" >>"$GITHUB_OUTPUT"
          case "$PART" in
            unit) only=mdocTests ;;
            "ui "*) only=$(scripts/ios-ui-shards.sh "${PART#ui }") ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
          echo "ONLY=$only" >>"$GITHUB_ENV"

      - uses: ./.github/actions/setup
        with:
          cache-key: ios

      # The pinned Xcode for every later step. The pinned Simulator runtime,
      # when the image lacks it, downloads in the background while the core
      # builds. Xcode finds no Simulator destination, generic or not, without
      # it, so even the Release build needs it.
      - run: scripts/ios-toolchain.sh ${{ inputs.build-only && '--no-simulator' || '--start' }} >>"$GITHUB_ENV"

      # The built core from main (#631): an exact hit on the hash of its
      # inputs (scripts/ios-core-cache.sh) skips its build, and the app
      # links the restored xcframeworks; Build.xcconfig names this commit.
      # A miss builds it and checks that the key hashes every file the build
      # read.
      - id: core-key
        run: scripts/ios-core-cache.sh key >>"$GITHUB_OUTPUT"
      - id: core
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.core-key.outputs.paths }}
          key: ${{ steps.core-key.outputs.key }}
      - if: steps.core.outputs.cache-hit != 'true'
        run: just ios-core && scripts/ios-core-cache.sh check
      - if: steps.core.outputs.cache-hit == 'true'
        run: scripts/ios-build-info.sh

      # Only main's unit part saves (main-caches.yml's build-only run), as
      # for the cargo cache: a branch restores only its own caches and
      # main's, so a queue commit's or a PR's copy would only fill the 10 GB.
      - if: steps.core.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.part == 'unit'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.core-key.outputs.paths }}
          key: ${{ steps.core-key.outputs.key }}

      - if: ${{ !inputs.build-only }}
        run: scripts/ios-toolchain.sh --finish >/dev/null

      # `just mobile --ios` for one test target or shard, without its area
      # check (the caller decided) and its Simulator shutdown (the runner is
      # thrown away); --no-deps, as the core is built.
      - name: Tests
        if: ${{ !inputs.build-only }}
        run: |
          # shellcheck disable=SC2086 # ONLY: identifiers, split on purpose
          just --no-deps ios-app ios-test "iPhone 17" $ONLY

      # A green UI part's class times (ADR 0113), without the timing tests:
      # a few hundred bytes, from which the nightly refreshes
      # apps/ios/ui-class-times.tsv, the shards' times. A failure here only
      # loses one measurement, never the part.
      - name: Class times
        id: times
        if: ${{ !inputs.build-only && !inputs.timing && startsWith(matrix.part, 'ui ') }}
        continue-on-error: true
        run: python3 scripts/ios-ui-class-times.py collect target/ios/DerivedData/Logs/Test >ui-class-times.tsv
      - if: steps.times.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-times-${{ steps.part.outputs.key }}-${{ github.run_attempt }}
          path: ui-class-times.tsv
          retention-days: 15

      # What an archive compiles, after the unit tests: it fits under the
      # UI parts, so it takes no runner of its own (ADR 0112).
      - if: ${{ !inputs.build-only && matrix.part == 'unit' }}
        run: just --no-deps ios-release

      # The failing tests by name (ADR 0113), from the xcresult while Xcode
      # is here: in this part's error and summary, and for ci/ios; and a
      # green UI part's tests that passed on their retry, as warnings.
      - name: Failing tests
        id: failed
        if: steps.part.outputs.key != '' && (failure() || (success() && !inputs.build-only && startsWith(matrix.part, 'ui ')))
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ios-failed-tests.py part "$PART" "$STATUS" target/ios/DerivedData/Logs/Test

      # On a failure, or a pass on a retry, to see what went wrong.
      - name: Test results
        if: failure() || (steps.failed.outputs.retried || '0') != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult-${{ steps.part.outputs.key }}-${{ github.run_attempt }}
          path: target/ios/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # This part's result, for `ci/ios` to name; missing when the job
      # never ran or was stopped before this step.
      - name: Part result
        id: result
        if: always()
        env:
          KEY: ${{ steps.part.outputs.key }}
          STATUS: ${{ job.status }}
        run: '[ -z "$KEY" ] || echo "$KEY=$STATUS" >>"$GITHUB_OUTPUT"'

  # Green only when every part ran and passed, so a cancelled or skipped one
  # never looks green (as ci/detection, ADR 0095). A failure annotates each
  # part that did not pass with its failing tests (ADR 0113), which
  # merge-gate's link to this job shows; green or not, it warns of each UI
  # test that passed on its retry. scripts/ci-stats.sh reads these
  # annotations for ADR 0112's unrelated failures.
  summary:
    name: ci/ios
    needs: [ios]
    if: ${{ always() && !inputs.build-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts/ios-failed-tests.py
          sparse-checkout-cone-mode: false
      - env:
          RESULT: ${{ needs.ios.result }}
          IOS_OUTPUTS: ${{ toJSON(needs.ios.outputs) }}
        run: python3 scripts/ios-failed-tests.py summary "$RESULT" unit "ui 1" "ui 2"
