name: CI iOS

# The iOS job on hosted runners (ADR 0095, ADR 0091, ADR 0100, ADR 0112):
# the core, then four parts in parallel on it, and `ci/ios`, which
# merge-gate reads, green only when all five ran and passed.
#   ci/ios (core)   the iOS core, restored from main's cache or built, handed
#                   to the parts as the `ios-core` artifact.
#   ci/ios (unit)   the app, the unit and parity tests (mdocTests) on the
#                   pinned Xcode and Simulator (scripts/tools.env), then the
#                   app in the Release configuration, as an archive builds
#                   it, unsigned and without tests.
#   ci/ios (ui 1)   the app and a third of the UI test classes
#   ci/ios (ui 2)   (mdocUITests) each, by time, as scripts/ios/ios-ui-shards.sh
#   ci/ios (ui 3)   packs them (ADR 0113); the timing tests run only with
#                   `timing` (the nightly). A failed UI test retries once
#                   (ADR 0113): a pass on the retry keeps the part green and
#                   is named.
# The merge queue calls it for a queue commit that touches the ios or core
# area. Every step is a recipe or a script, so `scripts/ios/ios-toolchain.sh`,
# `just ios-test "iPhone 17" mdocTests` (or `$(scripts/ios/ios-ui-shards.sh 1)`)
# and `just ios-release` reproduce it on a Mac.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty for the triggering ref.
        type: string
        default: ""
      build-only:
        description: The core job only, which saves the built core and its cargo cache on main (main-caches.yml).
        type: boolean
        default: false
      timing:
        description: Run the timing tests too (LivePreviewUITests' typing and Return times, CoreWiringTests' review tap), as the nightly does.
        type: boolean
        default: false
      xcode:
        description: "The Xcode pin (scripts/tools.env, ADR 0124): tests, Xcode 26 on macos-26 (the queue, branches, main's caches); builds, Xcode 27 on xcode-27 (the nightly)."
        type: string
        default: tests
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to test; empty for the triggering ref.
        type: string
        default: ""
      build-only:
        description: The core job only.
        type: boolean
        default: false
      timing:
        description: Run the timing tests too.
        type: boolean
        default: false
      xcode:
        description: The Xcode pin.
        type: choice
        options: [tests, builds]
        default: tests

permissions:
  contents: read

env:
  # The Xcode pin every iOS script reads (load_tools, scripts/lib.sh).
  MDOC_XCODE: ${{ inputs.xcode }}
  # The tests' switch for parallel testing: the number of Simulator clones
  # `just ios-test` runs them on; empty runs them on the one device. Off:
  # on 2 clones (PR #617's trial, 3 runs) testing took 16-17 minutes, not
  # 6.6, and the review-flow UI tests failed on every run.
  MDOC_IOS_TEST_WORKERS: ""

jobs:
  # Once per run, so a change to the core builds it in one job, not in each
  # part. Main's build-only run (main-caches.yml) saves the built core and
  # the cargo cache (`cache-key: ios`) that a miss restores.
  core:
    name: ci/ios (core)
    # Xcode 26.2 on macos-26 (ADR 0124); Xcode 27 is only on the xcode-27
    # preview image (actions/runner-images#14404), whose tests ran two to
    # three times slower (#1041).
    runs-on: ${{ inputs.xcode == 'builds' && 'xcode-27' || 'macos-26' }}
    # A change to crates/ or Cargo.lock misses the built-core cache, and with
    # a new Cargo.lock the cargo cache too: the core then took 17-20 minutes
    # cold (#879, #1041).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The pinned Xcode, which builds the core and so is in its key.
      - run: scripts/ios/ios-toolchain.sh --no-simulator >>"$GITHUB_ENV"

      # The built core from main (#631): an exact hit on the hash of its
      # inputs (scripts/ios/ios-core-cache.sh) skips its build, and the
      # cargo toolchain and cache it needs. A miss builds it and checks that
      # the key hashes every file the build read.
      - id: core-key
        run: scripts/ios/ios-core-cache.sh key >>"$GITHUB_OUTPUT"
      - id: core
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.core-key.outputs.paths }}
          key: ${{ steps.core-key.outputs.key }}
      - if: steps.core.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
        with:
          cache-key: ios
          # Main's cargo cache is the tests pin's (main-caches.yml): another
          # image's would evict it (scripts/ci/ci-cache-cleanup.sh).
          cache-save: ${{ inputs.xcode == 'tests' }}
      - if: steps.core.outputs.cache-hit != 'true'
        run: just ios-core && scripts/ios/ios-core-cache.sh check

      # Only main saves (main-caches.yml's build-only run), as for the cargo
      # cache: a branch restores only its own caches and main's, so a queue
      # commit's or a PR's copy would only fill the 10 GB.
      - if: steps.core.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.core-key.outputs.paths }}
          key: ${{ steps.core-key.outputs.key }}

      # One tar, as an artifact keeps no file modes and PDFium's framework
      # binary is executable. Build.xcconfig names the commit, so each part
      # writes its own.
      - if: ${{ !inputs.build-only }}
        env:
          PATHS: ${{ steps.core-key.outputs.paths }}
        run: |
          # shellcheck disable=SC2086 # PATHS: one path a line, no spaces
          tar -cf ios-core.tar $PATHS
      - if: ${{ !inputs.build-only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-core
          path: ios-core.tar
          # A re-run of this job replaces it.
          overwrite: true
          retention-days: 3

  # The UI tests are sharded by test class, as one part took about 26
  # minutes after the sweep (#829), over ADR 0112's 20; three parts since
  # each of two took 31 minutes on the xcode-27 image (#997).
  ios:
    name: ci/ios (${{ matrix.part }})
    needs: core
    if: ${{ !inputs.build-only }}
    # The core job's image.
    runs-on: ${{ inputs.xcode == 'builds' && 'xcode-27' || 'macos-26' }}
    # Job limits (ADR 0095, ADR 0112): the unit part took 10 minutes and the
    # one UI part 26 on #829; a UI shard's tests took 21-34 minutes on the
    # xcode-27 image (#997), after the app's build.
    timeout-minutes: 45
    strategy:
      # A cancelled part would read as a capacity cancel to merge-gate.
      fail-fast: false
      matrix:
        part: ["unit", "ui 1", "ui 2", "ui 3"]
    # Each part's own result (`unit`, `ui1`, `ui2`, `ui3`), failing tests
    # (`unit_tests`, ...) and tests that passed on their retry
    # (`ui1_retried`, ...), which `ci/ios` names: a matrix job's
    # outputs combine every part's.
    outputs:
      unit: ${{ steps.result.outputs.unit }}
      ui1: ${{ steps.result.outputs.ui1 }}
      ui2: ${{ steps.result.outputs.ui2 }}
      ui3: ${{ steps.result.outputs.ui3 }}
      unit_tests: ${{ steps.failed.outputs.unit_tests }}
      ui1_tests: ${{ steps.failed.outputs.ui1_tests }}
      ui2_tests: ${{ steps.failed.outputs.ui2_tests }}
      ui3_tests: ${{ steps.failed.outputs.ui3_tests }}
      ui1_retried: ${{ steps.failed.outputs.ui1_retried }}
      ui2_retried: ${{ steps.failed.outputs.ui2_retried }}
      ui3_retried: ${{ steps.failed.outputs.ui3_retried }}
    env:
      PART: ${{ matrix.part }}
      # The timing tests (LivePreviewUITests' typing and Return times, in
      # ui 1, and CoreWiringTests' review tap, in unit) skip unless set:
      # they only measure speed, about 4 minutes, so only the nightly runs
      # them. xcodebuild passes TEST_RUNNER_<name> to the tests as <name>.
      TEST_RUNNER_MDOC_TIMING_TESTS: ${{ inputs.timing && '1' || '' }}
      # A failed UI test retries once (ADR 0113): the Simulator's timing
      # noise. Unit, Rust, Android and script tests never retry.
      MDOC_IOS_TEST_RETRY: ${{ startsWith(matrix.part, 'ui ') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # What `just ios-test` runs: the unit and parity tests, or a UI
      # shard's classes. Before the app is built, so a UI test class in no
      # shard or in two fails in seconds (as it fails `lint (ubuntu)`).
      - name: What to test
        id: part
        run: |
          echo "key=${PART// /}" >>"$GITHUB_OUTPUT"
          case "$PART" in
            unit) only=mdocTests ;;
            "ui "*) only=$(scripts/ios/ios-ui-shards.sh "${PART#ui }") ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
          echo "ONLY=$only" >>"$GITHUB_ENV"

      # just; no Rust, as the core job built it.
      - uses: ./.github/actions/setup
        with:
          rust: false

      # The pinned Xcode for every later step. The pinned Simulator runtime,
      # when the image lacks it, downloads in the background while the core
      # downloads. Xcode finds no Simulator destination, generic or not,
      # without it, so even the Release build needs it.
      - run: scripts/ios/ios-toolchain.sh --start >>"$GITHUB_ENV"

      # The core job's build; the app links its xcframeworks, and
      # Build.xcconfig names this commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-core
      - run: tar -xf ios-core.tar && rm ios-core.tar && scripts/ios/ios-build-info.sh

      - run: scripts/ios/ios-toolchain.sh --finish >/dev/null

      # `just mobile --ios` for one test target or shard, without its area
      # check (the caller decided) and its Simulator shutdown (the runner is
      # thrown away); --no-deps, as the core is built.
      - name: Tests
        run: |
          # shellcheck disable=SC2086 # ONLY: identifiers, split on purpose
          just --no-deps ios-app ios-test "iPhone 17" $ONLY

      # A green UI part's class times (ADR 0113), without the timing tests:
      # a few hundred bytes, from which the nightly refreshes
      # apps/ios/ui-class-times.tsv, the shards' times. A failure here only
      # loses one measurement, never the part.
      - name: Class times
        id: times
        if: ${{ !inputs.timing && startsWith(matrix.part, 'ui ') }}
        continue-on-error: true
        run: python3 scripts/ios/ios-ui-class-times.py collect target/ios/DerivedData/Logs/Test >ui-class-times.tsv
      - if: steps.times.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-times-${{ steps.part.outputs.key }}-${{ github.run_attempt }}
          path: ui-class-times.tsv
          retention-days: 15

      # What an archive compiles, after the unit tests: it fits under the
      # UI parts, so it takes no runner of its own (ADR 0112).
      - if: matrix.part == 'unit'
        run: just --no-deps ios-release

      # The failing tests by name (ADR 0113), from the xcresult while Xcode
      # is here: in this part's error and summary, and for ci/ios; and a
      # green UI part's tests that passed on their retry, as warnings.
      - name: Failing tests
        id: failed
        if: steps.part.outputs.key != '' && (failure() || (success() && startsWith(matrix.part, 'ui ')))
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ios/ios-failed-tests.py part "$PART" "$STATUS" target/ios/DerivedData/Logs/Test

      # On a failure, or a pass on a retry, to see what went wrong.
      - name: Test results
        if: failure() || (steps.failed.outputs.retried || '0') != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult-${{ steps.part.outputs.key }}-${{ github.run_attempt }}
          path: target/ios/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      # This part's result, for `ci/ios` to name; missing when the job
      # never ran or was stopped before this step.
      - name: Part result
        id: result
        if: always()
        env:
          KEY: ${{ steps.part.outputs.key }}
          STATUS: ${{ job.status }}
        run: '[ -z "$KEY" ] || echo "$KEY=$STATUS" >>"$GITHUB_OUTPUT"'

  # Green only when the core and every part ran and passed, so a cancelled
  # or skipped one never looks green (as ci/detection, ADR 0095). A failure
  # annotates the core job, or each part that did not pass with its failing
  # tests (ADR 0113), which merge-gate's link to this job shows; green or
  # not, it warns of each UI test that passed on its retry.
  # scripts/ci/ci-stats.sh reads these annotations for ADR 0112's unrelated
  # failures.
  summary:
    name: ci/ios
    needs: [core, ios]
    if: ${{ always() && !inputs.build-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts/ios/ios-failed-tests.py
          sparse-checkout-cone-mode: false
      - env:
          RESULT: ${{ needs.ios.result }}
          CORE_RESULT: ${{ needs.core.result }}
          IOS_OUTPUTS: ${{ toJSON(needs.ios.outputs) }}
        run: python3 scripts/ios/ios-failed-tests.py summary "$RESULT" unit "ui 1" "ui 2" "ui 3"
