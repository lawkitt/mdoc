name: CI

# Same commands as local development: every step runs a `just` recipe
# (ADR 0037). Heavy and machine-dependent tests (performance, installed
# models, the OCR download) stay out of everyday CI; release.yml adds the OCR
# smoke test to the test jobs through the `smoke-ocr` input.
#
# Local CI is the pre-merge test gate (ADR 0082): a PR from a branch in this
# repository, opened by a user, runs only `lint (ubuntu)` here, and the
# maintainer's machines post `local/windows` and `local/macos`. Fork and bot
# (Dependabot) PRs, which local CI never runs, get the full matrix, as do
# `main`, manual runs and release.yml's call.
on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "build/appicon.svg"
      - "docs/**"
      - ".github/workflows/actionlint.yml"
      - ".github/dependabot.yml"
  # Any base branch, so a stacked PR gets CI too (fleet ADR 0016).
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore: *ignored
  # The full matrix on any branch; with the PC off, a green
  # `test (windows-latest)` stands in for `local/windows` (ADR 0082).
  workflow_dispatch:
  # release.yml runs this same job set before building release artifacts.
  workflow_call:
    inputs:
      release-call:
        description: Isolate release CI from cancellable standalone CI runs.
        type: boolean
        default: false
      smoke-ocr:
        description: Also run the OCR smoke test, reusing the test job's build.
        type: boolean
        default: false

# CI only reads the repo; release.yml's call inherits this ceiling.
permissions:
  contents: read

# Replace superseded pushes and PR runs, including on PR close/merge (all jobs
# skip on closed). A called workflow inherits the caller's event_name/ref, not
# "workflow_call", so release.yml explicitly selects a separate per-run group
# and disables cancellation. These groups cannot cancel one another.
concurrency:
  group: ci-${{ inputs.release-call && format('release-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release-call }}

jobs:
  # Linux isn't shipped, but its cfg code must keep compiling. Formatting and
  # cargo-deny are platform-independent, so they live here too, as does the
  # script lint (ADR 0070).
  lint-linux:
    name: lint (ubuntu)
    # The release commit that `just release` pushes with its tag is tested by
    # the tag's Release run; don't test the same commit twice. (In a call
    # from release.yml the event is the tag push, so ref_type is "tag".)
    if: >-
      ${{ github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release: v')) }}
    runs-on: ubuntu-latest
    # Job limits (ADR 0082): a hang fails in minutes, not after six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-deny shfmt

      # gpui's compile-time pkg-config deps (xkbcommon, wayland, x11/xcb) and
      # font-kit's fontconfig/freetype.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libfontconfig1-dev libfreetype-dev pkg-config

      - run: just fmt-check
      - run: just deny
      - run: just lint-scripts
      - run: just lint

  # The shipped targets: clippy and the full test suite, as parallel jobs so
  # the slow Windows test build doesn't wait for clippy (ADR 0070). On
  # pull_request only for the PRs local CI skips: from a fork (a deleted
  # fork's head repo is null, so it counts) or opened by anything but a user.
  # The complement of scripts/local-ci.sh's poll() filter, drafts aside. The
  # first two clauses repeat lint (ubuntu)'s release-commit and closed skip.
  clippy:
    name: clippy (${{ matrix.runner }})
    if: &full-matrix >-
      ${{ github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release: v')) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.type != 'User') }}
    strategy:
      fail-fast: false
      matrix:
        runner: &shipped [macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: just lint

  test:
    name: test (${{ matrix.runner }})
    if: *full-matrix
    strategy:
      fail-fast: false
      matrix:
        runner: *shipped
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner CPU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors

      - name: Runner CPU (macOS)
        if: runner.os == 'macOS'
        run: sysctl machdep.cpu.brand_string hw.logicalcpu

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest

      - run: just test
        env:
          MDOC_HEADLESS_ARTIFACTS: ${{ runner.temp }}/mdoc-headless-renders-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Headless screens and keyboard walks
        if: ${{ !cancelled() && !inputs.release-call }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-renders-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdoc-headless-renders-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
      # Release gate: real OCR runtime/model download and EN/RU recognition,
      # on the test build just compiled.
      - if: inputs.smoke-ocr
        run: just smoke-ocr

  # Each main run saves new cache generations; delete the older generations of
  # the same keys so the cache stays under the 10 GB repository limit
  # (ADR 0082). Runs after every saving job, failed ones too
  # (cache-on-failure), and never in a PR or a release call.
  cache-cleanup:
    name: cache cleanup
    needs: [lint-linux, clippy, test]
    if: >-
      ${{ !cancelled() && !inputs.release-call &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only write permission in this workflow.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/ci-cache-cleanup.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
