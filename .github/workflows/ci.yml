name: CI

# Same commands as local development: every step runs a `just` recipe
# (ADR 0037). Heavy and machine-dependent tests (performance, installed
# models, the OCR download) stay out of everyday CI; release.yml adds the OCR
# smoke test to the test jobs through the `smoke-ocr` input.
#
# On PRs (ADR 0095): `lint (ubuntu)` and the fast tier, `fast (ubuntu)`,
# and on a recognition-area PR the detection gate (`detection-head`, ADR
# 0100); `merge-gate` (merge-gate.yml) reads them, and the merge queue runs the
# full suite (queue.yml and the PC). Fork and bot (Dependabot) PRs also get
# the full hosted matrix here, as do manual runs and release.yml's call; the
# areas job skips clippy and test for a change outside the desktop and core
# areas (scripts/ci-areas.txt). On a queue commit only `lint (ubuntu)` runs,
# a required check. On `main` (ADR 0100) clippy runs as everywhere, with the
# mdoc-ffi check on macOS, and test only builds the tests: these jobs save
# the caches ci-desktop.yml's jobs of the same ids (`checks`, `test`)
# restore.
on:
  push:
    branches: [main]
    # The `none` lines of scripts/ci-areas.txt, word for word: files no job
    # reads (scripts/test-local-ci.sh fails when the two disagree).
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "build/appicon.svg"
      - "docs/**"
      - ".github/workflows/actionlint.yml"
      - ".github/dependabot.yml"
  # Any base branch, so a stacked PR gets CI too (fleet ADR 0016). No path
  # filter: `lint (ubuntu)` is required (ADR 0095), and a required check
  # that never runs blocks a docs-only PR.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # The full matrix on any branch, by hand.
  workflow_dispatch:
  # A merge-queue commit needs `lint (ubuntu)`, a required check; the full
  # suite there is queue.yml's (ADR 0095).
  merge_group:
  # release.yml runs this same job set before building release artifacts.
  workflow_call:
    inputs:
      release-call:
        description: Isolate release CI from cancellable standalone CI runs.
        type: boolean
        default: false
      smoke-ocr:
        description: Also run the OCR smoke test, reusing the test job's build.
        type: boolean
        default: false

# CI only reads the repo; release.yml's call inherits this ceiling.
permissions:
  contents: read

# Replace superseded pushes and PR runs, including on PR close/merge (all jobs
# skip on closed). A called workflow inherits the caller's event_name/ref, not
# "workflow_call", so release.yml explicitly selects a separate per-run group
# and disables cancellation. These groups cannot cancel one another.
concurrency:
  group: ci-${{ inputs.release-call && format('release-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release-call }}

jobs:
  # Linux isn't shipped, but its cfg code must keep compiling. Formatting and
  # cargo-deny are platform-independent, so they live here too, as does the
  # script lint (ADR 0070).
  lint-linux:
    name: lint (ubuntu)
    # The release commit that `just release` pushes with its tag is tested by
    # the tag's Release run; don't test the same commit twice. (In a call
    # from release.yml the event is the tag push, so ref_type is "tag".)
    if: >-
      ${{ github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release: v')) }}
    runs-on: ubuntu-latest
    # Job limits (ADR 0082): a hang fails in minutes, not after six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-deny shfmt

      # gpui's compile-time pkg-config deps (xkbcommon, wayland, x11/xcb) and
      # font-kit's fontconfig/freetype. It takes about 15 s; a stalled mirror
      # fails in minutes, after one retry (ADR 0100).
      - &linux-deps
        name: Install Linux build deps
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if sudo timeout 60 apt-get update &&
              sudo timeout 80 apt-get install -y -o DPkg::Lock::Timeout=20 \
                libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
                libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev \
                libxcb-cursor-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                libxcb-render0-dev libfontconfig1-dev libfreetype-dev pkg-config; then
              exit 0
            fi
            echo "::warning::Linux build deps: attempt $attempt failed"
          done
          exit 1

      - run: just fmt-check
      # Advisories only when the dependencies change (scripts/deny-ci.sh);
      # nightly.yml runs them every day.
      - run: scripts/deny-ci.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          RELEASE_CALL: ${{ inputs.release-call }}
      - run: just lint-scripts
      - run: just lint

  # The fast tier (ADR 0095, ADR 0100): the crates' tests and the script
  # suites on every PR head, as two parallel jobs on hosted Linux, `fast
  # (unit)` and `fast (scripts)`, summed up by `fast (ubuntu)`, the check
  # merge-gate reads. Shown, not required; the full suite runs on the queue
  # commit. The mdoc-ffi check needs macOS (iOS targets, the NDK's darwin
  # toolchain), so it runs in ci/macos.
  #
  # The job id stays `fast-linux`: rust-cache keys its cache by job id, so
  # the unit job keeps the cache main's runs have saved under it. On `main`
  # it only builds the tests, for that cache (ADR 0100).
  fast-linux:
    name: fast (unit)
    # lint (ubuntu)'s condition, and never on a queue commit.
    if: >-
      ${{ github.event_name != 'merge_group' && github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release: v')) }}
    runs-on: ubuntu-latest
    # Job limits (ADR 0095).
    timeout-minutes: 15
    env:
      BUILD_ONLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest

      - *linux-deps

      # The test job's build step (below), for the unit tier's cache.
      - name: Build the tests
        if: env.BUILD_ONLY == 'true'
        run: cargo nextest run --locked --workspace --features headless-renders --no-run
      - if: env.BUILD_ONLY != 'true'
        run: just test-tier unit

  # The script suites build nothing and fake cargo: just `just`, at its pin
  # in scripts/tools.env, without the toolchain, cache or Linux packages.
  fast-scripts:
    name: fast (scripts)
    # Not on a push to main, which runs no tests (ADR 0100).
    if: >-
      ${{ github.event_name != 'merge_group' && github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the pinned just version
        run: grep '^JUST_VERSION=' scripts/tools.env >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just@${{ env.JUST_VERSION }}

      - run: just test-tier scripts

  # Green only when both fast jobs ran and passed, so a missing, cancelled or
  # skipped part never looks green (as ci/detection). Skipped where the tests
  # are, on a queue commit and on main.
  fast:
    name: fast (ubuntu)
    needs: [fast-linux, fast-scripts]
    if: >-
      ${{ always() && github.event_name != 'merge_group' && github.event.action != 'closed' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          UNIT: ${{ needs.fast-linux.result }}
          SCRIPTS: ${{ needs.fast-scripts.result }}
        run: |
          [ "$UNIT" = success ] || echo "::error::fast (unit): $UNIT"
          [ "$SCRIPTS" = success ] || echo "::error::fast (scripts): $SCRIPTS"
          [ "$UNIT" = success ] && [ "$SCRIPTS" = success ]

  # Which areas the change touches (scripts/ci-areas.txt, ADR 0091). Clippy
  # and test run only for the desktop and core areas: a change to only the
  # iOS or Android app or their scripts skips them (lint (ubuntu) still runs).
  # A PR's merge commit is diffed against its base, a push against the commit
  # before it; a manual run or a release call runs every area. On
  # pull_request clippy and test run only for third-party PRs: from a fork (a
  # deleted fork's head repo is null, so it counts) or opened by anything but
  # a user; `desktop` is false for the others. Every PR gets `detection-head`
  # (below). The first two clauses repeat lint (ubuntu)'s release-commit and
  # closed skip.
  areas:
    name: areas
    if: >-
      ${{ github.event.action != 'closed' && github.event_name != 'merge_group' &&
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'release: v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
      desktop: >-
        ${{ (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.user.type != 'User') && steps.areas.outputs.desktop || 'false' }}
      detection-head: ${{ steps.areas.outputs.detection-head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit and its first parent.
          fetch-depth: 2

      - id: areas
        run: scripts/ci-areas.sh --github >>"$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RELEASE_CALL: ${{ inputs.release-call }}

  # The detection gate on a recognition-area PR head (ADR 0100): when a file
  # the PR changes takes the recognition area from its own line of the table
  # (the fixtures, mdoc-detect, mdoc-pii), not from core, which lists every
  # area (head_detection in scripts/lib.sh). Its checks are
  # `detection-head / ci/detection` (the summary merge-gate's head gate waits
  # for) and its shards; a stale snapshot is red here, not in the queue, and
  # `just snapshots-fetch <PR>` fetches the regenerated ones. Skipped, the
  # job is one check, `detection-head`, which merge-gate takes as not needed.
  # The queue still runs ci/detection on the queue commit. Four shards, as
  # queue.yml: three take 84% of the 5-minute model budget.
  detection-head:
    needs: areas
    if: needs.areas.outputs.detection-head == 'true'
    uses: ./.github/workflows/ci-detection.yml
    with:
      shards: 4

  # The shipped targets: clippy and the full test suite, as parallel jobs so
  # the slow Windows test build doesn't wait for clippy (ADR 0070), when the
  # areas job says the desktop area changed. On `main` they fill the caches
  # of ci-desktop.yml's `checks` and `test` jobs (ADR 0100).
  #
  # The id is `checks`, not `clippy`, since the job also runs mdoc-ffi: a
  # cache that matches its key exactly is never saved again, so new builds
  # in a job reach main's cache only under a new key (ADR 0100).
  checks:
    name: clippy (${{ matrix.runner }})
    needs: areas
    if: &desktop ${{ needs.areas.outputs.desktop == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: &shipped [macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: just lint
      # ci/macos (checks) runs it on the queue commit; here it also puts the
      # iOS and Android targets' dependencies in main's `checks` cache.
      - if: runner.os == 'macOS'
        run: just mobile --ffi

  test:
    name: test (${{ matrix.runner }})
    needs: areas
    if: *desktop
    strategy:
      fail-fast: false
      matrix:
        runner: *shipped
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # A push to main builds the tests without running them (ADR 0100): it
      # saves the cache, and the nightly runs the full hosted suite.
      BUILD_ONLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner CPU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Format-List Name, NumberOfLogicalProcessors

      - name: Runner CPU (macOS)
        if: runner.os == 'macOS'
        run: sysctl machdep.cpu.brand_string hw.logicalcpu

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest

      # The build `just test`'s nextest runs make (scripts/test.sh), flag for
      # flag, so its dependencies are the ones the test tiers restore.
      - name: Build the tests
        if: env.BUILD_ONLY == 'true'
        run: cargo nextest run --locked --workspace --features headless-renders --no-run
      - if: env.BUILD_ONLY != 'true'
        run: just test
        env:
          MDOC_HEADLESS_ARTIFACTS: ${{ runner.temp }}/mdoc-headless-renders-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Headless screens and keyboard walks
        if: ${{ !cancelled() && !inputs.release-call && env.BUILD_ONLY != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-renders-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdoc-headless-renders-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
      # Release gate: real OCR runtime/model download and EN/RU recognition,
      # on the test build just compiled.
      - if: inputs.smoke-ocr
        run: just smoke-ocr

  # Each main run saves new cache generations; delete the older generations of
  # the same keys so the cache stays under the 10 GB repository limit
  # (ADR 0082). Runs after every saving job, failed ones too
  # (cache-on-failure), and never in a PR or a release call.
  cache-cleanup:
    name: cache cleanup
    needs: [lint-linux, fast-linux, checks, test]
    if: >-
      ${{ !cancelled() && !inputs.release-call &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only write permission in this workflow.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/ci-cache-cleanup.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
