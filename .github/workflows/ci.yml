name: CI

# Same commands as local development: every step runs a `just` recipe
# (ADR 0037). Heavy and machine-dependent tests (performance, installed
# models, the OCR download) stay out of everyday CI; the OCR smoke test gates
# releases in release.yml.
on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - "build/appicon.png"
      - "scripts/make-icon.sh"
      - "docs/**"
      - ".github/workflows/actionlint.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore: *ignored
  # release.yml runs this same job set before building release artifacts.
  workflow_call:

# CI only reads the repo; release.yml's call inherits this ceiling.
permissions:
  contents: read

# Cancel superseded PR runs; pushes to main and release calls run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Linux isn't shipped, but its cfg code must keep compiling. Formatting and
  # cargo-deny are platform-independent, so they live here too.
  lint-linux:
    name: lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-deny

      # gpui's compile-time pkg-config deps (xkbcommon, wayland, x11/xcb) and
      # font-kit's fontconfig/freetype.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libfontconfig1-dev libfreetype-dev pkg-config

      - run: just fmt-check
      - run: just deny
      - run: just lint

  # The shipped targets: clippy and the full test suite.
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: just lint
      - run: just test
