name: CI desktop

# The desktop full tier on a hosted runner (ADR 0095): lint, then the unit,
# recognition, app and renders test tiers, and on macOS the script suites
# under Apple's bash 3.2 (#468) and the mdoc-ffi check. The merge queue calls
# it on the queue commit, once per OS: macOS always runs here, Windows when
# the PC falls back. Every step is a `just` recipe or a script, so a failure
# reproduces locally (ADR 0037).
on:
  workflow_call:
    inputs:
      os:
        description: macos (macos-26, job ci/macos) or windows (windows-latest, job ci/windows (hosted)).
        type: string
        required: true
      ref:
        description: The commit to test; empty tests the triggering ref.
        type: string
        default: ""
      screens:
        description: Comma-separated globs of render PNGs for a small second artifact, such as "light/home.png,*settings*".
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      os:
        description: macos or windows.
        type: choice
        options: [macos, windows]
        default: macos
      ref:
        description: The commit to test; empty tests the chosen branch.
        type: string
        default: ""
      screens:
        description: Comma-separated globs of render PNGs for a small second artifact, such as "light/home.png,*settings*".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The job id stays `test`: rust-cache keys its cache by job id, so this job
  # restores the cache main's `test (…)` jobs in ci.yml save (ADR 0070).
  test:
    name: ${{ fromJSON('{"macos":"ci/macos","windows":"ci/windows (hosted)"}')[inputs.os] }}
    # An unknown os has no runner, so the run fails instead of guessing.
    runs-on: ${{ fromJSON('{"macos":"macos-26","windows":"windows-latest"}')[inputs.os] }}
    # Job limits (ADR 0095).
    timeout-minutes: 30
    env:
      SCREENS: ${{ inputs.screens }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just cargo-nextest

      - run: just lint
      - run: just test-tier unit
      - run: just test-tier recognition
      - run: just test-tier app
      - id: renders
        run: just test-tier renders
        env:
          MDOC_HEADLESS_ARTIFACTS: ${{ runner.temp }}/renders

      # The runner's `bash` is Apple's 3.2 too; named here so the suites run
      # under it wherever PATH points.
      - name: Script suites under /bin/bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test.sh --tier scripts
      - if: runner.os == 'macOS'
        run: just mobile --ffi

      - name: Headless screens and keyboard walks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders-${{ inputs.os }}
          path: ${{ runner.temp }}/renders
          # A step before the render test failed; its own failure says why.
          if-no-files-found: warn
          retention-days: 7
          # A rerun replaces the earlier attempt's set.
          overwrite: true

      - name: Pick the requested screens
        id: screens
        if: ${{ !cancelled() && env.SCREENS != '' && steps.renders.outcome != 'skipped' }}
        shell: bash
        run: bash scripts/ci-screens.sh "$RUNNER_TEMP/renders" "$RUNNER_TEMP/screens" "$SCREENS"
      - name: Requested screens
        if: ${{ !cancelled() && steps.screens.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders-${{ inputs.os }}-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: error
          retention-days: 7
          overwrite: true
