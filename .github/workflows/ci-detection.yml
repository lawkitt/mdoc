name: Detection gate

# The detection gate on hosted macos-26 (ADR 0095): the pinned FP16 model,
# downloaded from its pinned Hugging Face revision and cached, reruns over
# the recognition fixtures (`just recognize --check`). The fixtures split
# over `shards` parallel jobs, `ci/detection (<k>)`: the 3-core M1 runs about
# 30 fixtures in 2 minutes, so raise `shards` once a shard's model run passes
# 3 minutes. `ci/detection` sums the shards up and is the context merge-gate
# reads. A failing shard uploads its stale snapshots, regenerated, as
# `detection-snapshots-<k>`; `just snapshots-fetch <pr|run>` writes them into
# the tree for review. No workflow writes to PR branches.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; empty tests the triggering ref.
        type: string
        default: ""
      shards:
        description: Parallel jobs the fixtures split over.
        type: number
        default: 6
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to test; empty tests the triggering ref.
        type: string
        default: ""
      shards:
        description: Parallel jobs the fixtures split over.
        type: number
        default: 6

permissions:
  contents: read

jobs:
  # The matrix needs the shard numbers as a list; expressions cannot count.
  shards:
    name: detection shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      count: ${{ steps.list.outputs.count }}
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards || 6 }}
        run: printf 'count=%s\nlist=[%s]\n' "$SHARDS" "$(seq -s, 1 "$SHARDS")" >> "$GITHUB_OUTPUT"

  detection:
    name: ci/detection (${{ matrix.shard }})
    needs: shards
    runs-on: macos-26
    # Job limits (ADR 0095): each shard 10 minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    env:
      SHARD: ${{ matrix.shard }}/${{ needs.shards.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          tools: just

      # The app-data folders `just recognize` reads, keyed by the model pins.
      # Setup re-verifies every file, so a runtime pin change refetches only
      # the runtime.
      - name: Restore the model
        id: model
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Application Support/mdoc/pseudonymization
            ~/Library/Application Support/mdoc/ocr/v1
          key: detection-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('resources/pseudonymization-model.json') }}

      # mdoc's own verified, pinned download; retried once (ADR 0095).
      - name: Set up the model
        run: just recognize --setup || { echo "::warning::model setup failed; retrying once"; just recognize --setup; }

      # Saved right away, so a failing gate still keeps the download.
      - name: Save the model
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Application Support/mdoc/pseudonymization
            ~/Library/Application Support/mdoc/ocr/v1
          key: ${{ steps.model.outputs.cache-primary-key }}

      - name: Detection gate
        run: just recognize --check --shard "$SHARD" --out target/detection-snapshots

      - name: Regenerated snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection-snapshots-${{ matrix.shard }}
          path: target/detection-snapshots
          retention-days: 7

  # Green only when every shard ran and passed, so a missing, cancelled or
  # skipped shard never looks green (ADR 0095).
  summary:
    name: ci/detection
    needs: [shards, detection]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.detection.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::detection shards: $RESULT"; exit 1; }'
