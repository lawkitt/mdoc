name: Main caches

# Builds on each push to main that save the caches the merge queue's hosted
# jobs restore (ADR 0095, ROADMAP CI redesign item 7): GitHub lets a branch
# restore only its own caches and main's, so a cache saved on a queue
# commit helps nothing. ci.yml's main run saves the desktop jobs' (`checks`
# and `test`, ADR 0100); this saves the iOS core's (`ios`), the detection
# build's (`detection`) and the detection model, and the built iOS core
# itself (target/ios, scripts/ios-core-cache.sh), which ci/ios restores to
# skip that build. Same job ids as the queue's jobs, so the keys match.
on:
  push:
    branches: [main]
    # ci.yml's push filter: files no job reads.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "build/appicon.svg"
      - "docs/**"
      - ".github/workflows/actionlint.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, never cancelled: a newer main waits, and replaces an
# older one that is still waiting. Cancelling a run while it saves leaves its
# cache key reserved and never written, and no later run can save that key:
# on 2026-11-13 five merges in 30 minutes cancelled four runs, one partway
# through saving the iOS core, so every iOS job rebuilt it (+3 to 5 min).
concurrency:
  group: main-caches
  cancel-in-progress: false

jobs:
  ios:
    uses: ./.github/workflows/ci-ios.yml
    with:
      build-only: true

  detection:
    uses: ./.github/workflows/ci-detection.yml
    with:
      shards: 1
      build-only: true
