name: Setup
description: >-
  Pinned Rust toolchain (rust-toolchain.toml), cargo cache and the tools named
  in `tools`, at the versions in scripts/tools.env — the same pins `just setup`
  installs locally (ADR 0037).

inputs:
  tools:
    description: Space-separated tools from scripts/tools.env (just, cargo-deny, cargo-nextest, shfmt, cargo-packager).
    default: just
  cache-key:
    description: Swatinem/rust-cache shared key; release builds share one.
    default: ""
  rust:
    description: Install the Rust toolchain and restore the cargo cache; false for a job that builds no Rust (the iOS parts link a built core).
    default: "true"
  cache-save:
    description: Save the cargo cache on main; false for a job on another image than the one main's cache is for (ci-ios.yml's builds pin).
    default: "true"

runs:
  using: composite
  steps:
    # rustup reads rust-toolchain.toml; the runner images ship rustup.
    - name: Install the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: rustup toolchain install && rustc --version

    - name: Cache cargo registry + target
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        # Only main saves (ADR 0070): every other ref restores main's cache, so
        # a stack of PRs can't evict it from the 10 GB repository limit.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.cache-save == 'true' }}
        # Keep the cache when a later step fails so a rerun isn't a cold build.
        cache-on-failure: true

    # After the cache step: rust-cache hashes every CARGO* variable into its
    # key, so loading the pins earlier would make each tool bump (such as
    # CARGO_NEXTEST_VERSION) a cold build for every job.
    - name: Load pinned tool versions
      shell: bash
      run: grep -E '^[A-Z_]+=' scripts/tools.env >> "$GITHUB_ENV"

    - name: Resolve tool versions
      id: tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        spec=()
        for tool in $TOOLS; do
          var=$(echo "${tool}_VERSION" | tr 'a-z-' 'A-Z_')
          [ -n "${!var:-}" ] || { echo "::error::no $var in scripts/tools.env"; exit 1; }
          spec+=("$tool@${!var}")
        done
        echo "spec=$(IFS=,; echo "${spec[*]}")" >> "$GITHUB_OUTPUT"

    - name: Install tools
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: ${{ steps.tools.outputs.spec }}
