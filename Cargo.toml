[workspace]
# Upstream code with one Linux glyph-offset correction; not a workspace crate.
exclude = ["vendor"]
members = ["apps/desktop", "crates/gpui-bidi", "crates/mdoc-editor", "crates/mdoc-editor-core", "crates/mdoc-history", "crates/mdoc-markdown", "crates/mdoc-pii", "crates/gpui-pdf", "crates/mdoc-spell", "crates/mdoc-store", "crates/mdoc-vault", "crates/mdoc-connector", "crates/mdoc-mcp", "crates/mdoc-import", "crates/mdoc-detect", "crates/mdoc-ffi"]
# `cargo run` and `cargo build` from the root start or build the app.
default-members = ["apps/desktop"]
resolver = "2"

# The app's version (apps/desktop), which the release scripts read here.
[workspace.package]
version = "0.4.0-rc.3"

# Module dependencies stay visible (ADR 0069): every workspace crate denies
# glob imports; `use super::*` in test modules stays allowed.
[workspace.lints.clippy]
wildcard_imports = "deny"
undocumented_unsafe_blocks = "deny"

# `unsafe` stays fenced (#897): every crate denies it, crates without any
# forbid it in lib.rs, and only modules that call the OS allow it, each block
# under a `// SAFETY:` comment. Miri, sanitizers and Valgrind were declined;
# #897 says when to revisit.
[workspace.lints.rust]
unsafe_code = "deny"

# Remove when an adopted GPUI release includes the combining-mark correction.
# Preserve the current GPUI family; see vendor/gpui-pre-wgpu/ZORITE-PATCH.md.
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
# Save dialog reasons, on macOS the quit question, and on Windows the
# test-only WARP adapter; see each MDOC-PATCH.md.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.12", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
# Exact: unlocks password-protected DOCX, XLSX and PPTX in memory (#1007);
# storytold's craft-libs is not on crates.io and churns (ADR 0001). The app's
# tests lock fixtures with it.
craft-offcrypto = { git = "https://github.com/storytold/craft-libs.git", rev = "712b35379b17e442921c03855d4a5c2a2699968e" }
# Exact, the same revision as craft-offcrypto: unlocks password-protected DOC
# (RC4 and RC4 CryptoAPI) in memory (#1007, ADR 0001).
craft-doc-binary = { git = "https://github.com/storytold/craft-libs.git", rev = "712b35379b17e442921c03855d4a5c2a2699968e" }
# Exact, the same revision: rewrites an unlocked DOC's compound file in memory.
craft-cfb = { git = "https://github.com/storytold/craft-libs.git", rev = "712b35379b17e442921c03855d4a5c2a2699968e" }

# Lean debug information (ADR 0050): workspace crates keep line tables, so
# backtraces still show file and line; dependencies keep none. The test profile
# inherits this. For a debugger, build with `--profile debugging`.
# split-debuginfo stays at the platform default: on macOS, "packed" stops object
# files accumulating but costs ~2.6 s per warm rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# GPUI's element tree, layout and paint (taffy): half of the Windows render
# test's time and most of the other GUI tests' (ADR 0082, #240).
[profile.dev.package.gpui-pre]
opt-level = 2
[profile.dev.package.taffy]
opt-level = 2
# Headless evidence spends most of its time in BGRA readback conversion and
# PNG encoding. Level 2 keeps these loops from reusing unoptimized generic
# helpers. Keep app/editor code at 0.
[profile.dev.package.gpui-pre-windows]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.simd-adler32]
opt-level = 2
# The macOS path: Metal texture readback, the image crate's buffer copies and
# channel swaps, and fdeflate's PNG compression (ADR 0082).
[profile.dev.package.gpui-pre-apple]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
# The detection rule pack compiles and matches hundreds of patterns: the
# recognition fixture test ran past nextest's 2-minute kill on the PC queue
# runner (#655). Optimized, it takes 3.1 s instead of 13.6 on the M4, and
# the Russian demo test 0.6 s instead of 2.9.
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
# The Vault's originals (#1091 item 3): its 256 MiB round-trip test ran into
# nextest's 2-minute kill with these three at level 0, took 32 s with only
# mdoc-vault at 2, and takes 3 s with all three (the Windows PC). The cold
# test build of mdoc-vault alone grows 3-4 s.
# AES-GCM's generic encrypt and decrypt compile into mdoc-vault: 4.6 MiB/s
# at level 0, 476 at 2.
[profile.dev.package.mdoc-vault]
opt-level = 2
# SHA-256's block function (the source hash of every import).
[profile.dev.package.sha2]
opt-level = 2
# GHASH's block function (GCM's authentication of every chunk).
[profile.dev.package.polyval]
opt-level = 2

# Full debug information for lldb/CodeLLDB, in its own target/debugging/.
[profile.debugging]
inherits = "dev"
debug = "full"
split-debuginfo = "packed"

[profile.debugging.package."*"]
debug = "full"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# The iOS core (scripts/ios/build-ios-core.sh): release, but unwinding so UniFFI
# turns a panic into an error instead of ending the app, and unstripped so
# Xcode's own strip keeps the symbols the app exports (ADR 0085).
[profile.mobile]
inherits = "release"
panic = "unwind"
strip = false

# PDF rasterization is CPU-heavy. Keep application/editor code debuggable while
# avoiding unoptimized pixel/vector loops during `cargo run` and tests.
[profile.dev.package.gpui-pdf]
opt-level = 2
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2
