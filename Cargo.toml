[package]
name = "mdoc"
version = "0.1.0"
edition = "2024"
description = "A lightweight Markdown WYSIWYG editor with PDF and DOCX preview."
license = "GPL-3.0-or-later"
authors = ["lawkitt", "packetThrower"]
repository = "https://github.com/lawkitt/mdoc"
publish = false

[workspace]
members = ["crates/gpui-bidi", "crates/mdoc-editor", "crates/mdoc-markdown", "crates/gpui-pdf", "crates/os-spellcheck"]
resolver = "2"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "0.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }

[dependencies]
anydoc = { git = "https://github.com/lawkitt/anydoc.git", rev = "391b6b109b21c051a0edd726755352d78df3853f" }
pdf-inspector = { git = "https://github.com/lawkitt/pdf-inspector.git", rev = "620afae42eac4b92fffa2437b89e10a912bb93ee", features = ["ocr"] }
dirs = "6"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
tar = "0.4"
flate2 = "1"
docxide-pdf = { version = "=0.17.1", default-features = false }
zip = { version = "8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { workspace = true }
gpui_platform = { workspace = true }
mdoc-editor = { path = "crates/mdoc-editor" }
gpui-pdf = { path = "crates/gpui-pdf", features = ["search", "forms"] }
tempfile = "3"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
unicode-segmentation = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

[package.metadata.packager]
product-name = "mdoc"
identifier = "io.github.lawkitt.mdoc"
category = "Productivity"
copyright = "© 2026 packetThrower / Zorite contributors; © 2026 lawkitt / mdoc contributors"
homepage = "https://github.com/lawkitt/mdoc"
authors = ["lawkitt", "packetThrower"]
publisher = "lawkitt"
description = "A lightweight Markdown WYSIWYG editor with PDF and DOCX preview."
long-description = "Edit local Markdown files with live formatting and view PDFs or DOCX files alongside your writing."
before-packaging-command = "cargo build --release"
icons = ["resources/icons/icon.icns", "resources/icons/icon.png", "resources/icons/icon.ico"]

[package.metadata.packager.deb]
# Runtime libs for gpui's Wayland + X11 surface + font-kit. Without an explicit
# `depends`, a fresh install fails to launch with a missing-.so error. Keep in
# lockstep with the fpm --depends list in release.yml's .rpm step.
depends = [
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libwayland-cursor0",
  "libx11-6",
  "libxcb1",
  "libxcb-cursor0",
  "libxcb-randr0",
  "libxcb-render0",
  "libxcb-shape0",
  "libxcb-xfixes0",
  "libxcb-xkb1",
  "libfontconfig1",
  "libfreetype6",
]
# Desktop entry (launcher discovery) + hicolor icon.
files = { "packaging/linux/mdoc.desktop" = "/usr/share/applications/mdoc.desktop", "resources/icons/icon.png" = "/usr/share/icons/hicolor/512x512/apps/mdoc.png" }

[package.metadata.packager.macos]
# Hand-curated Info.plist (single-instance launch, high-DPI, stable bundle id).
info-plist-path = "resources/Info.plist"
minimum-system-version = "11.0"
# Ad-hoc codesign (`-`) so Gatekeeper doesn't flag the bundle as "damaged".
# Not notarized — first launch is still the right-click -> Open path until an
# Apple Developer account lands.
signing-identity = "-"

# cargo-wix config for the per-arch .msi (built by `cargo wix` in release.yml, on
# stable tags only — MSI ProductVersion rejects alphanumeric prereleases).
[package.metadata.wix]
# Stable per-app GUID. MUST match the UpgradeCode in packaging/windows/wix/main.wxs.
# Distinct from every other lawkitt app. Never change once an installer ships.
upgrade-guid = "3D50EAE8-D339-41B6-82BC-126389601487"
include = ["packaging/windows/wix/main.wxs"]


[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# PDF rasterization is CPU-heavy. Keep application/editor code debuggable while
# avoiding unoptimized pixel/vector loops during `cargo run` and tests.
[profile.dev.package.gpui-pdf]
opt-level = 2
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2
