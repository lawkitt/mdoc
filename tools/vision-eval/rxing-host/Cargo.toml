[package]
name = "rxing-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs rxing over page images for the vision evaluation (lawkitt/mdoc#911); not shipped."

# Its own workspace: this crate is not part of mdoc's.
[workspace]

[dependencies]
rxing = "=0.9.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[profile.release]
opt-level = 3
