[package]
name = "mdoc-pseudonymization-qualification"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Evaluation tooling is intentionally outside the application's build graph.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
